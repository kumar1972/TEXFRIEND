<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Report - TEXFRIEND</title>
<script src="translator.js"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    html, body { 
        width: 100%;
        min-height: 100vh;
        background: #081E12; 
        color: #E8ECE7; 
    }

    body { 
        padding: 12px; 
        display: flex;
        flex-direction: column;
    }

    .main-card {
        width: 100%;
        max-width: 100%;
        margin: 0;
        background: #0C2B1B;
        border: 1px solid #1A5A3D;
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .top-nav { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 4px; 
    }

    .back-btn {
        display: inline-block;
        color: #4CAF50;
        text-decoration: none;
        font-weight: 600;
        font-size: 11px;
        background: rgba(76, 175, 80, 0.1);
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid rgba(76, 175, 80, 0.3);
    }

    h2 {
        font-size: 16px;
        color: #FFFFFF;
        font-weight: 700;
        text-align: center;
        margin-bottom: 8px;
    }

    .filter-box {
        background: #103626;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #1A5A3D;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .filter-box label {
        font-size: 11px;
        font-weight: 700;
        color: #4CAF50;
        white-space: nowrap;
    }

    select {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #1A5A3D;
        background: #081E12;
        color: #FFFFFF;
        font-size: 12px;
        font-weight: 600;
        outline: none;
    }

    .report-tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 6px;
    }

    .tab-btn {
        background: #103626;
        color: #A7C9B8;
        border: 1px solid #1A5A3D;
        padding: 10px 4px;
        border-radius: 8px;
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
        transition: all 0.2s;
    }

    .tab-btn.active {
        background: #10B981;
        color: #FFFFFF;
        border-color: #10B981;
        box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
    }

    .invoice-tab-btn {
        grid-column: span 3;
        background: #2563EB;
        color: #FFFFFF;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
    }

    .report-header-bar {
        background: #103626;
        padding: 8px 12px;
        border-radius: 8px 8px 0 0;
        border: 1px solid #1A5A3D;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        flex-wrap: wrap;
        gap: 8px;
    }

    .report-header-bar span {
        font-size: 12px;
        font-weight: 700;
        color: #FFFFFF;
    }

    .header-btns {
        display: flex;
        gap: 6px;
    }

    .preview-btn { background: #3B82F6; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
    .print-btn { background: #10B981; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
    .excel-btn { background: #D97706; color: white; border: none; padding: 6px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }

    .table-container {
        background: #081E12;
        border: 1px solid #1A5A3D;
        border-top: none;
        border-radius: 0 0 8px 8px;
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
        text-align: center;
    }

    th {
        background: #103626;
        color: #4CAF50;
        padding: 10px 6px;
        border-bottom: 1px solid #1A5A3D;
        font-weight: 600;
        white-space: nowrap;
    }

    td {
        padding: 10px 6px;
        border-bottom: 1px solid rgba(26, 90, 61, 0.4);
        color: #E8ECE7;
        white-space: nowrap;
    }

    .no-data {
        padding: 25px;
        color: #A7C9B8;
        font-size: 11px;
        text-align: center;
        font-style: italic;
    }

    #previewModal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #FFFFFF; color: #000000; z-index: 99999; overflow-y: auto; padding: 20px;
    }
    
    @media print {
        body * { visibility: hidden; }
        #previewModal, #previewModal * { visibility: visible; }
        #previewModal { position: absolute; left: 0; top: 0; width: 100%; padding: 0; z-index: 99999; background: #FFFFFF; }
        .no-print { display: none !important; }
    }
</style>
</head>
<body>

<div class="main-card">
    <div class="top-nav">
        <a href="dashboard.html" class="back-btn">← Back to Menu</a>
    </div>

    <h2 id="pageMainHeader">Reports & Analytics</h2>

    <div class="filter-box">
        <label>🔍 Design Filter:</label>
        <select id="designFilter" onchange="switchTab(currentTab)">
            <option value="All">All Designs (மொத்தம்)</option>
        </select>
    </div>

    <div class="report-tabs">
        <button class="tab-btn active" id="tab-PartyOrders" onclick="switchTab('PartyOrders')">📦 Orders</button>
        <button class="tab-btn" id="tab-KoraStock" onclick="switchTab('KoraStock')">🧵 Yarn Stock</button>
        <button class="tab-btn" id="tab-Dyeing" onclick="switchTab('Dyeing')">🎨 Dyeing</button>
        <button class="tab-btn" id="tab-Warping" onclick="switchTab('Warping')">📐 Warping</button>
        <button class="tab-btn" id="tab-Weaving" onclick="switchTab('Weaving')">🏭 Weaving</button>
        <button class="tab-btn" id="tab-Washing" onclick="switchTab('Washing')">🌊 Washing</button>
        <button class="invoice-tab-btn" id="tab-Invoice" onclick="switchTab('Invoice')">📄 Invoice / Billing Report</button>
    </div>

    <div class="report-header-bar">
        <span id="reportTitle">📊 Report Data</span>
        <div class="header-btns">
            <button class="preview-btn" onclick="previewReport()">👁️ Preview</button>
            <button class="print-btn" onclick="printReport()">🖨️ Print</button>
            <button class="excel-btn" onclick="exportToExcel()">📥 Excel</button>
        </div>
    </div>

    <div class="table-container">
        <table id="reportTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="previewModal">
    <div class="no-print" style="margin-bottom: 20px; display: flex; justify-content: flex-end; gap: 10px;">
        <button onclick="exportToExcel()" style="background:#D97706; color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;">Excel 📥</button>
        <button onclick="window.print()" style="background:#10B981; color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;">Print 🖨️</button>
        <button onclick="document.getElementById('previewModal').style.display='none'" style="background:#EF4444; color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;">Close ❌</button>
    </div>
    <div id="previewContent" style="color: #000;"></div>
</div>

<script>
var currentTab = 'PartyOrders';

function cleanDesignName(str) {
    return str ? str.toString().replace('#', '').trim().toLowerCase() : '';
}

function loadDesignFilter() {
    let allDesigns = new Set();
    
    let preDesigns = JSON.parse(localStorage.getItem('pre_design_numbers')) || [];
    preDesigns.forEach(d => allDesigns.add(d));

    let orders = JSON.parse(localStorage.getItem('party_orders_data')) || [];
    orders.forEach(o => { if(o.designNumber || o.designNo) allDesigns.add(o.designNumber || o.designNo); });

    let select = document.getElementById('designFilter');
    let html = '<option value="All">All Designs (மொத்தம்)</option>';
    
    [...allDesigns].forEach(function(d) {
        html += `<option value="${d}">${d}</option>`;
    });
    select.innerHTML = html;
}

function switchTab(tabName) {
    currentTab = tabName;
    document.querySelectorAll('.tab-btn, .invoice-tab-btn').forEach(btn => btn.classList.remove('active'));
    
    let activeBtn = document.getElementById('tab-' + tabName);
    if(activeBtn) activeBtn.classList.add('active');

    let filterVal = document.getElementById('designFilter').value;
    
    let titleElem = document.getElementById('reportTitle');
    let head = document.getElementById('tableHead');
    let body = document.getElementById('tableBody');

    head.innerHTML = '';
    body.innerHTML = '';

    if (tabName === 'PartyOrders') {
        titleElem.innerText = "📦 PARTY ORDERS Report";
        head.innerHTML = `<tr><th>Date</th><th>Party Name</th><th>Design No</th><th>Meters</th><th>PO No</th></tr>`;
        
        let rawData = JSON.parse(localStorage.getItem('party_orders_data')) || [];
        let mappedData = rawData.map(item => ({
            date: item.date || '-',
            partyName: item.partyName || '-',
            designNo: item.designNumber || item.designNo || '-',
            meters: item.orderMtr || item.meters || '-',
            poles: item.poNo || '-'
        }));
        
        renderGenericTable(mappedData, filterVal, ['date', 'partyName', 'designNo', 'meters', 'poles']);
    } 
    else if (tabName === 'KoraStock') {
        titleElem.innerText = "🧵 KORA / YARN STOCK Report";
        head.innerHTML = `<tr><th>Date</th><th>Supplier</th><th>Count</th><th>Weight (Kg)</th></tr>`;
        
        let rawData = JSON.parse(localStorage.getItem('kora_stock_records')) || [];
        let mappedData = rawData.map(item => ({
            date: item.date || '-',
            supplier: item.supplier || '-',
            count: item.count || '-',
            weight: item.weight || '-'
        }));
        
        renderGenericTable(mappedData, 'All', ['date', 'supplier', 'count', 'weight']);
    } 
    else if (tabName === 'Dyeing') {
        titleElem.innerText = "🎨 DYEING Report";
        head.innerHTML = `<tr><th>Date</th><th>Dyeing Unit</th><th>Design No</th><th>Type</th><th>Count</th><th>Colour</th><th>Issued Wt</th><th>Rcvd Wt</th></tr>`;
        
        let issues = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
        let receives = JSON.parse(localStorage.getItem('dyeing_receive_records')) || [];
        
        let merged = issues.map(iss => {
            let rec = receives.find(r => r.issueId == iss.id) || {};
            return {
                date: iss.date || rec.date || '-',
                unit: iss.unit || '-',
                designNo: iss.designNo || '-',
                yarnType: iss.yarnType || 'Warp',
                count: iss.count || '-',
                color: iss.color || '-',
                issuedWt: iss.issueWt || '-',
                receivedWt: rec.receivedWt || 'Pending'
            };
        });
        renderGenericTable(merged, filterVal, ['date', 'unit', 'designNo', 'yarnType', 'count', 'color', 'issuedWt', 'receivedWt']);
    }
    else if (tabName === 'Warping') {
        titleElem.innerText = "📐 WARPING Report";
        head.innerHTML = `<tr><th>Date</th><th>Unit</th><th>Design No</th><th>Count</th><th>Colour</th><th>Issued Wt</th><th>Rcvd Wt</th><th>Excess</th></tr>`;
        
        let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
        let receives = JSON.parse(localStorage.getItem('warping_receive_records')) || [];
        
        let merged = issues.map(iss => {
            let rec = receives.find(r => r.issueId == iss.id) || {};
            return {
                date: iss.date || rec.botDate || '-',
                unit: iss.unit || '-',
                designNo: iss.designNo || '-',
                count: iss.count || '-',
                color: iss.color || '-',
                issuedWt: iss.issueWt || '-',
                receivedWt: rec.receivedWt || 'Pending',
                excessWt: rec.excessWt && rec.excessWt !== '-' ? rec.excessWt : '0.000'
            };
        });
        renderGenericTable(merged, filterVal, ['date', 'unit', 'designNo', 'count', 'color', 'issuedWt', 'receivedWt', 'excessWt']);
    } 
    else if (tabName === 'Weaving') {
        titleElem.innerText = "🏭 WEAVING PRODUCTION Report";
        head.innerHTML = `<tr><th>Date</th><th>Weaver</th><th>Design No</th><th>Order Mtrs</th><th>Items Count</th></tr>`;
        
        let rawData = JSON.parse(localStorage.getItem('weaving_master_data')) || [];
        let mappedData = rawData.map(item => {
            let totalItems = (item.warpRows ? item.warpRows.length : 0) + (item.weftRows ? item.weftRows.length : 0);
            return {
                date: item.date || '-',
                weaver: item.weaverName || '-',
                designNo: item.designNo || '-',
                mtrs: item.weavingMts || '-',
                items: totalItems + " Yarns"
            };
        });
        
        renderGenericTable(mappedData, filterVal, ['date', 'weaver', 'designNo', 'mtrs', 'items']);
    } 
    else if (tabName === 'Washing') {
        titleElem.innerText = "🌊 WASHING Report";
        head.innerHTML = `<tr><th>Date</th><th>Unit</th><th>Design No</th><th>Slip</th><th>Piece</th><th>Sent Mtr</th><th>Rcvd Mtr</th><th>Shrink %</th></tr>`;
        
        let issues = JSON.parse(localStorage.getItem('washing_issue_records')) || [];
        let receives = JSON.parse(localStorage.getItem('washing_receive_records')) || [];
        
        let merged = issues.map(iss => {
            let rec = receives.find(r => r.issueId == iss.id) || {};
            return {
                date: iss.date || rec.botDate || '-',
                unit: iss.unit || '-',
                designNo: iss.designNo || '-',
                slip: iss.slip || '-',
                piece: iss.piece || '-',
                sentMtr: iss.mtr || '-',
                rcvdMtr: rec.receivedMtr || 'Pending',
                shrink: rec.shrinkagePerc || '-'
            };
        });
        
        renderGenericTable(merged, filterVal, ['date', 'unit', 'designNo', 'slip', 'piece', 'sentMtr', 'rcvdMtr', 'shrink']);
    }
    else if (tabName === 'Invoice') {
        titleElem.innerText = "📄 INVOICE / BILLING Report";
        head.innerHTML = `<tr><th>Inv No</th><th>Date</th><th>Party Name</th><th>Design No</th><th>Total Qty</th><th>Grand Total (₹)</th></tr>`;
        
        let rawData = JSON.parse(localStorage.getItem('saved_invoices_data')) || [];
        let mappedData = rawData.map(item => ({
            invNo: item.invNo || '-',
            date: item.invDate || '-',
            partyName: item.partyAddress ? item.partyAddress.split('\n')[0] : '-',
            designNo: item.design || '-',
            meters: item.totalQty ? item.totalQty.toFixed(2) : '0.00',
            amount: item.grandTotal ? item.grandTotal.toFixed(2) : '0.00'
        }));

        renderGenericTable(mappedData, filterVal, ['invNo', 'date', 'partyName', 'designNo', 'meters', 'amount']);
    }
}

function renderGenericTable(dataList, filterVal, keys) {
    let body = document.getElementById('tableBody');
    body.innerHTML = '';

    if (!dataList || dataList.length === 0) {
        body.innerHTML = `<tr><td colspan="${keys.length}" class="no-data">No records found for this module.</td></tr>`;
        return;
    }

    let filtered = dataList;
    if (filterVal !== 'All') {
        let cleanFilter = cleanDesignName(filterVal);
        filtered = dataList.filter(item => cleanDesignName(item.designNo) === cleanFilter);
    }

    if (filtered.length === 0) {
        body.innerHTML = `<tr><td colspan="${keys.length}" class="no-data">No records found for design: ${filterVal}</td></tr>`;
        return;
    }

    filtered.slice().reverse().forEach(item => {
        let rowHtml = '<tr>';
        keys.forEach(k => {
            let val = item[k] !== undefined && item[k] !== '' ? item[k] : '-';
            if (val === 'Pending') val = `<span style="color:#D97706; font-weight:bold; font-size:9px;">Pending</span>`;
            rowHtml += `<td>${val}</td>`;
        });
        rowHtml += '</tr>';
        body.innerHTML += rowHtml;
    });
}

function previewReport() {
    let title = document.getElementById('reportTitle').innerText;
    let filterVal = document.getElementById('designFilter').value;
    let tableHtml = document.getElementById('reportTable').outerHTML;
    
    let html = `<div style="text-align: center; margin-bottom: 20px;">`;
    html += `<h2 style='color: #000; font-family: sans-serif; margin-bottom: 5px; font-size:18px;'>${title}</h2>`;
    html += `<p style='font-family: sans-serif; font-size: 13px; margin-top: 0;'><b>Filter:</b> ${filterVal}</p>`;
    html += `</div>`;
    
    html += `<div id="printTableWrapper" style="color: #000;">${tableHtml}</div>`;
    
    document.getElementById('previewContent').innerHTML = html;
    
    let previewTable = document.getElementById('previewContent').querySelector('table');
    if(previewTable) {
        previewTable.style.width = '100%';
        previewTable.style.borderCollapse = 'collapse';
        previewTable.style.color = '#000';
        previewTable.style.fontFamily = 'sans-serif';
        previewTable.style.fontSize = '12px';
        
        let ths = previewTable.querySelectorAll('th');
        ths.forEach(th => {
            th.style.border = '1px solid #000';
            th.style.padding = '8px';
            th.style.background = '#f2f2f2';
            th.style.color = '#000';
            th.style.fontWeight = 'bold';
        });
        
        let tds = previewTable.querySelectorAll('td');
        tds.forEach(td => {
            td.style.border = '1px solid #000';
            td.style.padding = '8px';
            td.style.color = '#000';
        });
    }

    document.getElementById('previewModal').style.display = 'block';
}

function printReport() {
    if(document.getElementById('previewModal').style.display !== 'block') {
        previewReport();
    }
    setTimeout(() => {
        window.print();
    }, 300);
}

function exportToExcel() {
    let table = document.getElementById('reportTable');
    let html = table.outerHTML;
    let url = 'data:application/vnd.ms-excel,' + encodeURIComponent(html);
    let link = document.createElement('a');
    link.href = url;
    link.download = currentTab + '_Report.xls';
    link.click();
}
</script>

<!-- 📌 Firebase App SDK (CDN) & Core Logic -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDYPLOPZnOlPvCzNeZXuS7yHTf2sUe-SFM",
        authDomain: "texfriend.firebaseapp.com",
        projectId: "texfriend",
        storageBucket: "texfriend.appspot.com",
        messagingSenderId: "331673079578",
        appId: "1:331673079578:web:e8c2ea6c41e6359d3f66a3",
        measurementId: "G-2NP13ZTKCN"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.firebaseLoad = async function(key) {
        try {
            const docSnap = await getDoc(doc(db, "texfriend_erp", key));
            if (docSnap.exists()) {
                return JSON.parse(docSnap.data().content);
            }
        } catch (e) {
            console.error("Firebase Load Error: ", e);
        }
        return null;
    }

    // Sync Data on Load
    window.addEventListener('load', async function() {
        let mainHeader = document.getElementById('pageMainHeader');
        let origText = mainHeader.innerText;
        mainHeader.innerText = "Syncing Cloud Data ☁️...";

        let collections = [
            'party_orders_data', 'kora_stock_records', 'dyeing_issue_records', 'dyeing_receive_records',
            'warping_issue_records', 'warping_receive_records', 'weaving_master_data', 
            'washing_issue_records', 'washing_receive_records', 'saved_invoices_data', 'pre_design_numbers'
        ];
        
        for(let col of collections) {
            let data = await window.firebaseLoad(col);
            if (data) localStorage.setItem(col, JSON.stringify(data));
        }

        mainHeader.innerText = origText;
        
        loadDesignFilter();
        switchTab('PartyOrders');
    });
</script>
</body>
</html>
