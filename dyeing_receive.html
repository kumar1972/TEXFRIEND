<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dyeing Receive - TEXFRIEND</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    html, body { 
        width: 100%;
        min-height: 100vh;
        background: #DCE0DB; 
        color: #1E2B23; 
    }

    body { 
        padding: 12px; 
        display: flex;
        flex-direction: column;
    }

    .main-card {
        width: 100%;
        max-width: 100%;
        margin: 0;
        background: #E8ECE7;
        border: 1px solid rgba(130, 59, 78, 0.2);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .top-nav { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 4px; 
    }

    .back-btn {
        display: inline-block;
        color: #823B4E;
        text-decoration: none;
        font-weight: 600;
        font-size: 10px;
        background: rgba(130, 59, 78, 0.1);
        padding: 6px 10px;
        border-radius: 5px;
        border: 1px solid rgba(130, 59, 78, 0.3);
    }

    h3 {
        font-size: 14px;
        color: #823B4E;
        font-weight: 700;
        margin-bottom: 6px;
        padding-bottom: 8px;
        border-bottom: 2px solid rgba(130, 59, 78, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
    }

    .form-group label {
        font-size: 10px;
        font-weight: 600;
        color: #823B4E;
    }

    input, select {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid rgba(130, 59, 78, 0.3);
        background: #FFFFFF;
        color: #1E2B23;
        font-size: 12px;
        font-weight: 500;
    }

    input:focus, select:focus {
        border-color: #823B4E;
        outline: none;
    }

    input[readonly] {
        background: #F0EAEB;
        color: #823B4E;
        border: 1px solid rgba(130, 59, 78, 0.2);
    }

    .receive-grid-header {
        display: grid;
        grid-template-columns: 0.8fr 1.2fr 1fr 1fr 1fr 1fr 1fr;
        gap: 4px;
        padding: 0 4px;
        margin-bottom: 6px;
    }

    .receive-grid-header div {
        font-size: 9px;
        font-weight: 700;
        color: #823B4E;
        text-align: center;
    }

    .line-row {
        display: grid;
        grid-template-columns: 0.8fr 1.2fr 1fr 1fr 1fr 1fr 1fr;
        gap: 4px;
        align-items: center;
        margin-bottom: 8px;
    }
    
    .line-row input {
        padding: 8px 4px;
        font-size: 10px;
        text-align: center;
    }

    .save-main-btn {
        background: #823B4E; 
        color: white; 
        width: 100%; 
        padding: 12px; 
        border: none;
        border-radius: 8px; 
        font-size: 13px; 
        font-weight: bold; 
        cursor: pointer;
        margin-top: 10px; 
        box-shadow: 0 4px 12px rgba(130, 59, 78, 0.2);
    }
    .save-main-btn:hover { background: #6A2F3E; }

    .list-header {
        font-size: 12px;
        font-weight: 700;
        color: #823B4E;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 2px solid rgba(130, 59, 78, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .table-container {
        margin-top: 10px;
        overflow-x: auto;
        border-radius: 8px;
        border: 1px solid rgba(130, 59, 78, 0.2);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
        text-align: center;
        background: #EBE5E6;
    }

    th {
        background: #DBCBCD;
        color: #823B4E;
        padding: 8px 4px;
        border-bottom: 1px solid rgba(130, 59, 78, 0.3);
        font-weight: 700;
    }

    td {
        padding: 8px 4px;
        border-bottom: 1px solid rgba(130, 59, 78, 0.15);
        color: #1E2B23;
        font-weight: 500;
    }
    
    .excess-text { color: #D32F2F; font-weight: 700; }
    
    .action-btns {
        display: flex;
        gap: 4px;
        justify-content: center;
    }

    .edit-action-btn {
        background: #3F5A3E; color: white; border: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 10px;
    }
    
    .del-action-btn {
        background: #D97706; color: white; border: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 10px;
    }
</style>
</head>
<body>

<div class="main-card">
    <div class="top-nav">
        <a href="index.html" class="back-btn">← Back to Menu</a>
    </div>

    <h3>📥 Dyeing Colour Received & Loss</h3>

    <div class="form-group">
        <label>Date</label>
        <input type="date" id="receiveDate">
    </div>

    <!-- Filtered Pending Designs -->
    <div class="form-group">
        <label>Select Design Number</label>
        <select id="designNumber" onchange="loadPendingItems()">
            <option value="">Select Design No</option>
        </select>
    </div>

    <!-- Auto-filled Dyeing Name -->
    <div class="form-group">
        <label>Dyeing Name</label>
        <input type="text" id="dyeingName" placeholder="Dyeing Unit Name" readonly>
    </div>

    <!-- Container for dynamic receive rows -->
    <div style="margin-top: 10px;">
        <div class="receive-grid-header">
            <div>Count</div>
            <div>Colour</div>
            <div>Issued Wt</div>
            <div>Rcvd Wt</div>
            <div>Loss Wt</div>
            <div>Loss %</div>
            <div>Excess Wt (>5%)</div>
        </div>
        <div id="receiveLinesContainer"></div>
    </div>

    <button class="save-main-btn" onclick="saveReceiveEntry()">Save Received Entry</button>

    <div class="list-header">📊 Received & Loss Records</div>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Design</th>
                    <th>Count</th>
                    <th>Colour</th>
                    <th>Issued Wt</th>
                    <th>Rcvd Wt</th>
                    <th>Loss Wt</th>
                    <th>Loss %</th>
                    <th>Excess Wt</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="receivedListBody">
                <!-- Records go here -->
            </tbody>
        </table>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('receiveDate').valueAsDate = new Date();
    loadPendingDesigns();
    renderReceivedList();
});

// Load only designs that have "Pending" status in Issue Records
function loadPendingDesigns() {
    let issueRecords = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    let pendingRecords = issueRecords.filter(r => r.status === 'Pending');
    
    // Get unique design numbers from pending records
    let uniqueDesigns = [...new Set(pendingRecords.map(r => r.designNo))];

    let select = document.getElementById('designNumber');
    let html = '<option value="">Select Design No</option>';
    
    uniqueDesigns.forEach(function(d) {
        html += '<option value="' + d + '">' + d + '</option>';
    });
    select.innerHTML = html;
}

// Auto-fill details when Design is selected
function loadPendingItems() {
    let dNo = document.getElementById('designNumber').value;
    let container = document.getElementById('receiveLinesContainer');
    container.innerHTML = '';
    document.getElementById('dyeingName').value = '';

    if(!dNo) return;

    let issueRecords = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    let pendingItems = issueRecords.filter(r => r.status === 'Pending' && r.designNo === dNo);

    if(pendingItems.length > 0) {
        // Auto-fill the Dyeing Unit Name from the first record
        document.getElementById('dyeingName').value = pendingItems[0].unit;

        pendingItems.forEach(item => {
            let row = document.createElement('div');
            row.className = 'line-row';
            row.setAttribute('data-id', item.id);
            
            row.innerHTML = `
                <input type="text" class="inp-count" value="${item.count}" readonly>
                <input type="text" class="inp-color" value="${item.color}" readonly>
                <input type="text" class="inp-issued" value="${parseFloat(item.issueWt).toFixed(3)}" readonly>
                <input type="number" class="inp-received" placeholder="Wt" oninput="calculateLoss(this)">
                <input type="text" class="inp-loss-wt" placeholder="0.000" readonly>
                <input type="text" class="inp-loss-perc" placeholder="0%" readonly>
                <input type="text" class="inp-excess-wt" placeholder="-" readonly>
            `;
            container.appendChild(row);
        });
    } else {
        container.innerHTML = '<div style="font-size:11px; text-align:center; padding:10px; color:#823B4E;">No pending issues found for this Design.</div>';
    }
}

// Calculate Loss dynamically (with 5% Allowance logic)
function calculateLoss(inp) {
    let row = inp.parentElement;
    let issuedWt = parseFloat(row.querySelector('.inp-issued').value) || 0;
    let receivedWt = parseFloat(inp.value) || 0;

    let lossWtInp = row.querySelector('.inp-loss-wt');
    let lossPercInp = row.querySelector('.inp-loss-perc');
    let excessWtInp = row.querySelector('.inp-excess-wt');

    if(receivedWt > 0 && receivedWt <= issuedWt) {
        let lossWt = issuedWt - receivedWt;
        let lossPerc = (lossWt / issuedWt) * 100;
        
        lossWtInp.value = lossWt.toFixed(3);
        lossPercInp.value = lossPerc.toFixed(2) + '%';
        
        // 5% Excess Loss Calculation
        if(lossPerc > 5) {
            let allowedLossWt = issuedWt * 0.05; // 5% Allowed
            let excessWt = lossWt - allowedLossWt;
            
            excessWtInp.value = excessWt.toFixed(3);
            excessWtInp.style.color = "#D32F2F"; // Red colour for excess
            excessWtInp.style.fontWeight = "bold";
        } else {
            excessWtInp.value = "-";
            excessWtInp.style.color = "#823B4E";
            excessWtInp.style.fontWeight = "500";
        }
    } else if (receivedWt > issuedWt) {
        lossWtInp.value = "0.000";
        lossPercInp.value = "0.00%";
        excessWtInp.value = "-";
    } else {
        lossWtInp.value = "";
        lossPercInp.value = "";
        excessWtInp.value = "";
        excessWtInp.style.color = "#823B4E";
    }
}

// Save Received Data and update Issue status
function saveReceiveEntry() {
    let dateVal = document.getElementById('receiveDate').value;
    let dNo = document.getElementById('designNumber').value;
    let dName = document.getElementById('dyeingName').value;

    if(!dNo) {
        alert("Please select a Design Number!");
        return;
    }

    let rows = document.querySelectorAll('#receiveLinesContainer .line-row');
    if(rows.length === 0) return;

    let issues = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    let receives = JSON.parse(localStorage.getItem('dyeing_receive_records')) || [];
    let savedCount = 0;

    rows.forEach(row => {
        let rcvWt = parseFloat(row.querySelector('.inp-received').value);
        
        if(rcvWt > 0) {
            let recId = row.getAttribute('data-id');
            let issueIndex = issues.findIndex(r => r.id == recId);

            if(issueIndex !== -1) {
                let issueItem = issues[issueIndex];
                let lossWt = parseFloat(row.querySelector('.inp-loss-wt').value) || 0;
                let lossPerc = row.querySelector('.inp-loss-perc').value || '0%';
                
                // Get excess weight if it exists, otherwise store "-"
                let excessVal = row.querySelector('.inp-excess-wt').value;
                let finalExcess = (excessVal && excessVal !== "-") ? parseFloat(excessVal).toFixed(3) : "-";

                receives.push({
                    id: Date.now() + Math.random(),
                    issueId: recId,
                    date: dateVal,
                    unit: dName,
                    designNo: dNo,
                    count: issueItem.count,
                    color: issueItem.color,
                    issuedWt: parseFloat(issueItem.issueWt).toFixed(3),
                    receivedWt: rcvWt.toFixed(3),
                    lossWt: lossWt.toFixed(3),
                    lossPerc: lossPerc,
                    excessWt: finalExcess
                });

                // Update original issue status to Received
                issues[issueIndex].status = "Received";
                savedCount++;
            }
        }
    });

    if(savedCount > 0) {
        localStorage.setItem('dyeing_issue_records', JSON.stringify(issues));
        localStorage.setItem('dyeing_receive_records', JSON.stringify(receives));
        
        alert("Received Entry Saved Successfully! ✅");
        
        // Reset and reload UI
        document.getElementById('dyeingName').value = '';
        document.getElementById('receiveLinesContainer').innerHTML = '';
        loadPendingDesigns(); 
        renderReceivedList();
    } else {
        alert("Please enter Received Weight for at least one item.");
    }
}

// Edit Record
function editReceiveRecord(recId) {
    let receives = JSON.parse(localStorage.getItem('dyeing_receive_records')) || [];
    let issues = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    
    let index = receives.findIndex(r => r.id == recId);
    if(index !== -1) {
        let record = receives[index];
        let issueId = record.issueId;
        
        // Change status back to Pending in original issue record
        let issueIndex = issues.findIndex(iss => iss.id == issueId);
        if(issueIndex !== -1) {
            issues[issueIndex].status = "Pending";
        }
        
        // Remove from received table
        receives.splice(index, 1);
        
        localStorage.setItem('dyeing_receive_records', JSON.stringify(receives));
        localStorage.setItem('dyeing_issue_records', JSON.stringify(issues));
        
        // Populate top form for editing
        document.getElementById('receiveDate').value = record.date;
        
        // Reload designs so the "Pending" one shows up
        loadPendingDesigns();
        document.getElementById('designNumber').value = record.designNo;
        
        // Auto trigger the item loading
        loadPendingItems();
        
        // Fill the received weight for this specific row back in
        setTimeout(() => {
            let rows = document.querySelectorAll('#receiveLinesContainer .line-row');
            rows.forEach(row => {
                if(row.getAttribute('data-id') == issueId) {
                    let rcvInp = row.querySelector('.inp-received');
                    rcvInp.value = record.receivedWt;
                    calculateLoss(rcvInp);
                }
            });
        }, 100);
        
        renderReceivedList();
    }
}

// Delete Record
function deleteReceiveRecord(recId) {
    if(!confirm("Are you sure you want to delete this record? It will revert to Pending status.")) return;
    
    let receives = JSON.parse(localStorage.getItem('dyeing_receive_records')) || [];
    let issues = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    
    let index = receives.findIndex(r => r.id == recId);
    if(index !== -1) {
        let issueId = receives[index].issueId;
        
        // Revert issue status to "Pending"
        let issueIndex = issues.findIndex(iss => iss.id == issueId);
        if(issueIndex !== -1) {
            issues[issueIndex].status = "Pending";
        }
        
        // Remove receive record entirely
        receives.splice(index, 1);
        
        localStorage.setItem('dyeing_receive_records', JSON.stringify(receives));
        localStorage.setItem('dyeing_issue_records', JSON.stringify(issues));
        
        loadPendingDesigns(); // Update dropdown
        renderReceivedList();
        
        // Clear top form to avoid confusion
        document.getElementById('receiveLinesContainer').innerHTML = '';
        document.getElementById('dyeingName').value = '';
        document.getElementById('designNumber').value = '';
    }
}

// Display Saved Received Data
function renderReceivedList() {
    let receiveRecords = JSON.parse(localStorage.getItem('dyeing_receive_records')) || [];
    let tbody = document.getElementById('receivedListBody');
    tbody.innerHTML = '';

    if(receiveRecords.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" style="padding:15px;">No Dyeing Orders Received yet.</td></tr>`;
        return;
    }

    // Reverse to show latest entries on top
    receiveRecords.reverse().forEach(record => {
        let dObj = new Date(record.date);
        let dateStr = ("0" + dObj.getDate()).slice(-2) + "/" + ("0" + (dObj.getMonth() + 1)).slice(-2) + "/" + dObj.getFullYear();
        
        // Format Excess Wt properly
        let excessDisplay = record.excessWt && record.excessWt !== "-" 
            ? `<span class="excess-text">${record.excessWt}</span>` 
            : "-";

        tbody.innerHTML += `
            <tr>
                <td>${dateStr}</td>
                <td>${record.designNo}</td>
                <td>${record.count}</td>
                <td>${record.color}</td>
                <td>${record.issuedWt}</td>
                <td>${record.receivedWt}</td>
                <td>${record.lossWt}</td>
                <td>${record.lossPerc}</td>
                <td>${excessDisplay}</td>
                <td class="action-btns">
                    <button class="edit-action-btn" onclick="editReceiveRecord(${record.id})">✏️</button>
                    <button class="del-action-btn" onclick="deleteReceiveRecord(${record.id})">🗑️</button>
                </td>
            </tr>
        `;
    });
}
</script>
</body>
</html>
