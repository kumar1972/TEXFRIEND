<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEXFRIEND - Premium Portal</title>
    <script src="translator.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            width: 100%; 
            min-height: 100vh; 
            background: #0B130F;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(74, 124, 89, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(30, 43, 35, 0.6) 0%, transparent 50%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
        }

        /* 🔥 Perfect sizing for both Mobile & Desktop View */
        .login-card { 
            width: 100%; 
            max-width: 600px; 
            min-width: 320px;
            background: rgba(18, 28, 22, 0.9); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 36px; 
            padding: 45px 36px; 
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2); 
            border: 1.5px solid rgba(82, 110, 81, 0.5); 
            display: flex; 
            flex-direction: column; 
            gap: 26px; 
            animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .logo-area { text-align: center; }
        .logo-badge {
            width: 90px; height: 90px; 
            background: linear-gradient(135deg, #4A7C59, #2C4A35); 
            border-radius: 28px;
            display: inline-flex; align-items: center; justify-content: center; font-size: 42px;
            box-shadow: 0 16px 35px rgba(74, 124, 89, 0.55); 
            margin-bottom: 18px;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
        }
        .logo-area h2 { font-size: 32px; color: #FFFFFF; font-weight: 800; letter-spacing: 1.5px; }
        .logo-area p { font-size: 15px; color: #A3C1B2; font-weight: 600; margin-top: 6px; text-transform: uppercase; letter-spacing: 1.2px; }

        /* 📌 Floating Role Tabs */
        .role-tabs { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            background: rgba(255, 255, 255, 0.08); 
            border-radius: 20px; 
            padding: 6px; 
            gap: 8px; 
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .role-btn { 
            background: transparent; 
            border: none; 
            padding: 16px; 
            font-size: 16px; 
            font-weight: 700; 
            color: #A3C1B2; 
            border-radius: 16px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
        }
        .role-btn.active { 
            background: #4A7C59; 
            color: #FFFFFF; 
            box-shadow: 0 6px 25px rgba(74, 124, 89, 0.6); 
        }

        .form-group { display: flex; flex-direction: column; gap: 9px; }
        .form-group label { font-size: 15px; font-weight: 700; color: #C2D6CC; letter-spacing: 0.4px; }
        
        .input-box { 
            width: 100%; 
            padding: 18px 22px; 
            border-radius: 20px; 
            border: 1.5px solid rgba(82, 110, 81, 0.55); 
            background: rgba(11, 19, 15, 0.85); 
            color: #FFFFFF; 
            font-size: 17px; 
            font-weight: 600; 
            outline: none; 
            transition: all 0.3s ease;
        }
        .input-box::placeholder { color: #5C7A6D; }
        .input-box:focus {
            border-color: #4A7C59;
            background: rgba(11, 19, 15, 0.98);
            box-shadow: 0 0 0 5px rgba(74, 124, 89, 0.3);
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            color: #A3C1B2;
            font-weight: 600;
            margin-top: 2px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .remember-me input {
            width: 22px; height: 22px; accent-color: #4A7C59; cursor: pointer; border-radius: 6px;
        }

        .login-submit-btn { 
            width: 100%; 
            background: linear-gradient(135deg, #4A7C59, #33593D); 
            color: white; 
            border: none; 
            padding: 20px; 
            border-radius: 20px; 
            font-size: 17px; 
            font-weight: 800; 
            cursor: pointer; 
            box-shadow: 0 12px 35px rgba(74, 124, 89, 0.55); 
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 8px; 
        }
        .login-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 42px rgba(74, 124, 89, 0.75);
            background: linear-gradient(135deg, #528963, #3B6645);
        }

        .error-msg { 
            color: #FF6B6B; 
            background: rgba(255, 107, 107, 0.12); 
            padding: 15px; 
            border-radius: 15px; 
            font-size: 15px; 
            text-align: center; 
            font-weight: 700; 
            display: none; 
            border: 1px solid rgba(255, 107, 107, 0.35);
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="logo-area">
        <div class="logo-badge">⚡</div>
        <h2>TEXFRIEND</h2>
        <p id="subtitleText">Secure Access Portal</p>
    </div>

    <div class="role-tabs">
        <button type="button" class="role-btn active" id="adminTab" onclick="switchRole('admin')">👑 Admin</button>
        <button type="button" class="role-btn" id="userTab" onclick="switchRole('user')">👤 User</button>
    </div>

    <div class="form-group">
        <label id="usernameLabel">Admin User Name</label>
        <input type="text" id="loginUser" class="input-box" placeholder="Enter username" autocomplete="username">
    </div>

    <div class="form-group">
        <label>Password / கடவுச்சொல்</label>
        <input type="password" id="loginPass" class="input-box" placeholder="Enter password" autocomplete="current-password">
    </div>

    <div class="options-row">
        <label class="remember-me">
            <input type="checkbox" id="rememberMe"> Remember Me
        </label>
    </div>

    <div class="error-msg" id="errorMsg">⚠️ தவறான Username அல்லது Password!</div>
    <button type="button" class="login-submit-btn" onclick="validateLogin()">Login / உள்நுழை</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    let savedUser = localStorage.getItem('erp_remembered_user');
    if(savedUser) {
        document.getElementById('loginUser').value = savedUser;
        document.getElementById('rememberMe').checked = true;
    }
});

let currentRole = 'admin';
function switchRole(role) {
    currentRole = role;
    let adminBtn = document.getElementById('adminTab');
    let userBtn = document.getElementById('userTab');
    let userLabel = document.getElementById('usernameLabel');
    let subText = document.getElementById('subtitleText');
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('loginPass').value = '';
    
    if(role === 'admin') {
        adminBtn.classList.add('active'); userBtn.classList.remove('active');
        userLabel.innerText = "Admin User Name"; subText.innerText = "Administrator Access Portal";
    } else {
        userBtn.classList.add('active'); adminBtn.classList.remove('active');
        userLabel.innerText = "Staff / User Name"; subText.innerText = "Standard Operator Portal";
    }
}

function validateLogin() {
    let u = document.getElementById('loginUser').value.trim();
    let p = document.getElementById('loginPass').value.trim();
    let err = document.getElementById('errorMsg');
    let remember = document.getElementById('rememberMe').checked;
    
    if(!u || !p) { 
        err.innerText = "⚠️ அனைத்து விவரங்களையும் நிரப்பவும்!"; 
        err.style.display = 'block'; 
        return; 
    }

    if(remember) {
        localStorage.setItem('erp_remembered_user', u);
    } else {
        localStorage.removeItem('erp_remembered_user');
    }

    // 🔍 Fetch Saved Dynamic Users from settings.html
    let systemUsers = JSON.parse(localStorage.getItem('erp_system_users')) || [];
    let cleanU = u.toLowerCase();
    
    if(currentRole === 'admin') {
        // Master Admin Check (kumar / 1972) OR Dynamic Admin Check
        let dynamicAdmin = systemUsers.find(usr => 
            usr.username.toLowerCase() === cleanU && 
            usr.password === p && 
            (usr.role === 'Administrator' || usr.role === 'Admin')
        );

        if((cleanU === 'kumar' && p === '1972') || dynamicAdmin) {
            localStorage.setItem('erp_logged_role', 'Administrator');
            localStorage.setItem('user_role', 'Administrator');
            localStorage.setItem('erp_logged_user', u);
            localStorage.setItem('username', u);
            window.location.href = "dashboard.html";
        } else { 
            err.innerText = "⚠️ தவறான அட்மின் விவரங்கள்!"; 
            err.style.display = 'block'; 
        }
    } else {
        // Dynamic Standard User Check OR Master Admin Fallback
        let validUser = systemUsers.find(usr => 
            usr.username.toLowerCase() === cleanU && 
            usr.password === p
        );

        if(validUser || (cleanU === 'kumar' && p === '1972')) { 
            let assignedRole = validUser ? validUser.role : 'Standard User';
            localStorage.setItem('erp_logged_role', assignedRole);
            localStorage.setItem('user_role', assignedRole);
            localStorage.setItem('erp_logged_user', u);
            localStorage.setItem('username', u);
            window.location.href = "dashboard.html";
        } else { 
            err.innerText = "⚠️ தவறான யூசர் விவரங்கள்!"; 
            err.style.display = 'block'; 
        }
    }
}
</script>
<script src="config.js"></script>
</body>
</html>
