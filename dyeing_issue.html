<div class="main-card">

            <div>Issued Wt</div>
            <div></div>
        </div>

    </div>

    <button class="save-main-btn" onclick="saveDyeingIssue()">Save Dyeing Order Issue</button>

        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Dyeing Unit</th>
                    <th>Design No</th>
                    <th>Type</th>
                    <th>Count</th>
                    <th>Colour</th>
                    <th>Order Wt</th>
                    <th>Issued Wt</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="issuedListBody">
                <!-- Records go here -->
            </tbody>
        </table>

<script>
let editingIssueId = null;

function cleanDesignName(str) {
    return str ? str.toString().replace('#', '').trim().toLowerCase() : '';
}

document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('issueDate').valueAsDate = new Date();
    loadDesignDropdown();
    renderIssuedList();
});

function loadDesignDropdown() {
    var preDesignList = JSON.parse(localStorage.getItem('pre_design_numbers')) || [];
    var select = document.getElementById('designNumber');
    var html = '<option value="">Select</option>';
    preDesignList.forEach(function(d) {
        html += '<option value="' + d + '">' + d + '</option>';
    });
    select.innerHTML = html;
}

function getResultantCount(countStr) {
    if (!countStr) return 0;
    let str = String(countStr).trim().toLowerCase().replace(/s/g, ''); 
    if (str.includes('/')) {
        let parts = str.split('/');
        if (parts.length === 2) {
            let ply = parseFloat(parts[0]) || 1;
            let singleCount = parseFloat(parts[1]) || 1;
            return singleCount / ply; 
        }
    }
    return parseFloat(str) || 0;
}

function resolvePattern(lines, ranges, type, defaultCount) {
    if(!lines || lines.length === 0) return { sequence: [], summary: [], totalPatternVal: 0 };
    let covered = new Array(lines.length).fill(false);
    let orderedPattern = [];

    if(ranges && ranges.length > 0) {
        ranges.forEach(r => {
            for(let s=0; s<r.set; s++) {
                for(let j = r.start; j <= r.end; j++) {
                    if(lines[j-1]) orderedPattern.push({...lines[j-1]});
                }
            }
            for(let j = r.start; j <= r.end; j++) covered[j-1] = true;
        });
    }
    lines.forEach((l, idx) => {
        if(!covered[idx]) orderedPattern.push({...l});
    });

    let exactSequence = [];
    orderedPattern.forEach(item => {
        let val = parseFloat(type === 'warp' ? item.ends : item.picks) || 0;
        let cDisplay = (item.count !== undefined && item.count !== '') ? String(item.count).trim() : String(defaultCount);
        let clr = item.color ? String(item.color).trim() : '-';
        let bm = item.beam || 'Ground'; 
        
        for(let k=0; k<val; k++) {
            exactSequence.push({ count: cDisplay, color: clr, beam: bm });
        }
    });

    let summaryMap = new Map();
    let order = [];
    exactSequence.forEach(item => {
        let key = item.count + "||" + item.color.trim() + "||" + item.beam;
        if(!summaryMap.has(key)) {
            summaryMap.set(key, { count: item.count, color: item.color.trim(), beam: item.beam, patternVal: 0, totalVal: 0 });
            order.push(key);
        }
        summaryMap.get(key).patternVal++;
    });

    return { sequence: exactSequence, summary: order.map(k => summaryMap.get(k)), totalPatternVal: exactSequence.length };
}

function loadYarnRequirements() {
    editingIssueId = null;
    document.querySelector('.save-main-btn').innerText = "Save Dyeing Order Issue";

    let dName = document.getElementById('designNumber').value;
    let warpContainer = document.getElementById('warpIssueLinesContainer');
    let weftContainer = document.getElementById('weftIssueLinesContainer');

    if(!dName) {
        warpContainer.innerHTML = '';
        weftContainer.innerHTML = '';
        document.getElementById('dyeingName').value = '';
        return;
    }

    let cleanDNo = cleanDesignName(dName);

    // Auto-fill Dyeing Unit Name if previously saved for this design
    let issueRecords = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    let existingRecord = issueRecords.slice().reverse().find(r => cleanDesignName(r.designNo) === cleanDNo);
    if(existingRecord) {
        document.getElementById('dyeingName').value = existingRecord.unit;
    } else {
        document.getElementById('dyeingName').value = '';
    }

    let designMastersList = JSON.parse(localStorage.getItem('design_masters_data')) || [];
    let specs = JSON.parse(localStorage.getItem('design_specs')) || {};
    let foundMaster = designMastersList.find(d => cleanDesignName(d.name) === cleanDNo) || {};
    let specKey = Object.keys(specs).find(k => cleanDesignName(k) === cleanDNo);
    let sp = specKey ? specs[specKey] : {};

    let uiReed = parseFloat(foundMaster.reed || sp.reed || sp.baseReed) || 52;
    let uiPick = parseFloat(foundMaster.pick || sp.pick || sp.basePick) || 56;
    let baseWidth = parseFloat(foundMaster.width || sp.width || sp.baseWidth) || 66.92;
    let weftWidth = parseFloat(foundMaster.weftWidth || sp.weftWidth) || (baseWidth + 3);
    
    // Load Orders Length & Crimp Percentage from yarn_calc logic
    let warpOrderMtrs = parseFloat(foundMaster.orderMtr) || 100;
    let topBeamMtrs = warpOrderMtrs;

    if (foundMaster.topBeam) {
        let rawTop = String(foundMaster.topBeam);
        if (rawTop.includes('%')) {
            let pct = parseFloat(rawTop.replace('%', '').replace('+', '')) || 0;
            topBeamMtrs = warpOrderMtrs + (warpOrderMtrs * pct / 100);
        } else {
            topBeamMtrs = parseFloat(rawTop) || warpOrderMtrs;
        }
    }

    // Default 6% crimp for Weft Mtrs calculation
    let crimpPct = 6; 
    let weftOrderMtrs = warpOrderMtrs - (warpOrderMtrs * (crimpPct / 100));

    let defaultCountText = foundMaster.count1 || sp.warp || '20';
    let defaultCountNum = getResultantCount(defaultCountText) || 20;

    // 📌 1. WARP YARN CALCULATION (Auto-fill from Yarn Calc Specs)
    let totalWarpEnds = Math.round(uiReed * baseWidth);
    let warpData = resolvePattern(foundMaster.warpLines || [], foundMaster.warpRanges || [], 'warp', defaultCountText);
    
    let warpMap = new Map();
    if (warpData.totalPatternVal > 0) {
        let repeats = Math.floor(totalWarpEnds / warpData.totalPatternVal);
        let rem = totalWarpEnds % warpData.totalPatternVal;
        
        warpData.summary.forEach(obj => obj.totalVal = obj.patternVal * repeats);
        for(let i=0; i<rem; i++) {
            let item = warpData.sequence[i];
            let obj = warpData.summary.find(o => o.count === item.count && o.color === item.color && o.beam === item.beam);
            if(obj) obj.totalVal++;
        }

        warpData.summary.forEach(obj => {
            let calcCount = getResultantCount(obj.count);
            if (calcCount <= 0) calcCount = defaultCountNum;
            let currentLen = (obj.beam === 'Top Beam') ? topBeamMtrs : warpOrderMtrs;
            let wgt = (obj.totalVal * currentLen) / (1693.33 * calcCount);
            
            let key = obj.count + '_' + obj.color.toLowerCase();
            if(!warpMap.has(key)) warpMap.set(key, { count: obj.count, color: obj.color, weight: 0 });
            warpMap.get(key).weight += wgt;
        });
    }

    // 📌 2. WEFT YARN CALCULATION (Auto-fill from Yarn Calc Specs with Weft Mtrs)
    let totalFabricPick = weftWidth * uiPick;
    let weftCountFallbackText = foundMaster.weftCount || sp.weft || '40';
    let weftCountNumFallback = getResultantCount(weftCountFallbackText) || defaultCountNum;
    
    let weftData = resolvePattern(foundMaster.weftLines || [], foundMaster.weftRanges || [], 'weft', weftCountFallbackText);
    let weftMap = new Map();

    if (weftData.totalPatternVal > 0) {
        weftData.summary.forEach(obj => {
            let calcCount = getResultantCount(obj.count);
            if (calcCount <= 0) calcCount = weftCountNumFallback;
            let tPick = (obj.patternVal / weftData.totalPatternVal) * totalFabricPick;
            let wgt = (tPick * weftOrderMtrs) / (1693.33 * calcCount);

            let key = obj.count + '_' + obj.color.toLowerCase();
            if(!weftMap.has(key)) weftMap.set(key, { count: obj.count, color: obj.color, weight: 0 });
            weftMap.get(key).weight += wgt;
        });
    }

    // Render Warp UI Lines
    warpContainer.innerHTML = '';
    let warpArray = Array.from(warpMap.values());
    if(warpArray.length === 0) {
        warpContainer.innerHTML = '<div style="font-size:10px; text-align:center; padding:6px; color:#D97706;">No Warp Yarn Data</div>';
    } else {
        warpArray.forEach(item => {
            let row = document.createElement('div');
            row.className = 'line-row warp-row';
            row.innerHTML = `
                <input type="text" class="inp-count" value="${item.count}" readonly>
                <input type="text" class="inp-color" value="${item.color}" readonly>
                <input type="text" class="inp-order" value="${item.weight.toFixed(3)}" readonly>
                <input type="number" class="inp-issue" placeholder="Wt">
                <button class="del-btn" onclick="this.parentElement.remove()">×</button>
            `;
            warpContainer.appendChild(row);
        });
    }

    // Render Weft UI Lines
    weftContainer.innerHTML = '';
    let weftArray = Array.from(weftMap.values());
    if(weftArray.length === 0) {
        weftContainer.innerHTML = '<div style="font-size:10px; text-align:center; padding:6px; color:#D97706;">No Weft Yarn Data</div>';
    } else {
        weftArray.forEach(item => {
            let row = document.createElement('div');
            row.className = 'line-row weft-row';
            row.innerHTML = `
                <input type="text" class="inp-count" value="${item.count}" readonly>
                <input type="text" class="inp-color" value="${item.color}" readonly>
                <input type="text" class="inp-order" value="${item.weight.toFixed(3)}" readonly>
                <input type="number" class="inp-issue" placeholder="Wt">
                <button class="del-btn" onclick="this.parentElement.remove()">×</button>
            `;
            weftContainer.appendChild(row);
        });
    }
}

function saveDyeingIssue() {
    let dateVal = document.getElementById('issueDate').value;
    let dName = document.getElementById('dyeingName').value.trim();
    let dNumber = document.getElementById('designNumber').value;

    if(!dateVal || !dName || !dNumber) {
        alert("Please fill Date, Dyeing Name, and Design Number!");
        return;
    }

    let warpRows = document.querySelectorAll('#warpIssueLinesContainer .line-row');
    let weftRows = document.querySelectorAll('#weftIssueLinesContainer .line-row');

    if(warpRows.length === 0 && weftRows.length === 0) {
        alert("No yarn lines to save!");
        return;
    }

    let issueRecords = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];

    if (editingIssueId) {
        let idx = issueRecords.findIndex(r => r.id == editingIssueId);
        if(idx !== -1) {
            let row = document.querySelector('.line-row');
            if(row) {
                issueRecords[idx].date = dateVal;
                issueRecords[idx].unit = dName;
                issueRecords[idx].designNo = dNumber;
                issueRecords[idx].issueWt = parseFloat(row.querySelector('.inp-issue').value || 0).toFixed(3);
            }
        }
        editingIssueId = null;
        document.querySelector('.save-main-btn').innerText = "Save Dyeing Order Issue";
        alert("Dyeing Order Updated Successfully! ✅");
    } else {
        // Process Warp Entries
        warpRows.forEach(row => {
            let count = row.querySelector('.inp-count').value;
            let color = row.querySelector('.inp-color').value;
            let orderWt = row.querySelector('.inp-order').value;
            let issueWt = row.querySelector('.inp-issue').value.trim();

            if(issueWt) {
                issueRecords.push({
                    id: Date.now() + Math.random(),
                    date: dateVal,
                    unit: dName,
                    designNo: dNumber,
                    yarnType: "Warp",
                    count: count,
                    color: color,
                    orderWt: parseFloat(orderWt).toFixed(3),
                    issueWt: parseFloat(issueWt).toFixed(3),
                    status: "Pending"
                });
            }
        });

        // Process Weft Entries
        weftRows.forEach(row => {
            let count = row.querySelector('.inp-count').value;
            let color = row.querySelector('.inp-color').value;
            let orderWt = row.querySelector('.inp-order').value;
            let issueWt = row.querySelector('.inp-issue').value.trim();

            if(issueWt) {
                issueRecords.push({
                    id: Date.now() + Math.random(),
                    date: dateVal,
                    unit: dName,
                    designNo: dNumber,
                    yarnType: "Weft",
                    count: count,
                    color: color,
                    orderWt: parseFloat(orderWt).toFixed(3),
                    issueWt: parseFloat(issueWt).toFixed(3),
                    status: "Pending"
                });
            }
        });

        alert("Dyeing Order Issued Successfully! ✅");
    }

    localStorage.setItem('dyeing_issue_records', JSON.stringify(issueRecords));
    
    document.getElementById('designNumber').value = '';
    document.getElementById('warpIssueLinesContainer').innerHTML = '';
    document.getElementById('weftIssueLinesContainer').innerHTML = '';
    renderIssuedList();
}

function editIssueRecord(id) {
    let records = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    let rec = records.find(r => r.id == id);
    if(rec) {
        editingIssueId = id;
        document.getElementById('issueDate').value = rec.date;
        document.getElementById('designNumber').value = rec.designNo;
        document.getElementById('dyeingName').value = rec.unit;
        
        let container = rec.yarnType === 'Weft' ? document.getElementById('weftIssueLinesContainer') : document.getElementById('warpIssueLinesContainer');
        document.getElementById('warpIssueLinesContainer').innerHTML = '';
        document.getElementById('weftIssueLinesContainer').innerHTML = '';

        container.innerHTML = `
            <div class="line-row">
                <input type="text" class="inp-count" value="${rec.count}" readonly>
                <input type="text" class="inp-color" value="${rec.color}" readonly>
                <input type="text" class="inp-order" value="${rec.orderWt}" readonly>
                <input type="number" class="inp-issue" value="${rec.issueWt}">
                <button class="del-btn" onclick="this.parentElement.remove()">×</button>
            </div>
        `;
        
        document.querySelector('.save-main-btn').innerText = "Update Dyeing Order Issue";
        window.scrollTo(0, 0);
    }
}

function deleteIssueRecord(id) {
    if(!confirm("Are you sure you want to delete this issue record?")) return;
    let records = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    records = records.filter(r => r.id != id);
    localStorage.setItem('dyeing_issue_records', JSON.stringify(records));
    renderIssuedList();
}

function renderIssuedList() {
    let issueRecords = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    let tbody = document.getElementById('issuedListBody');
    tbody.innerHTML = '';

    if(issueRecords.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="padding:15px;">No Dyeing Orders Issued yet.</td></tr>`;
        return;
    }

    issueRecords.slice().reverse().forEach(record => {
        let dObj = new Date(record.date);
        let dateStr = ("0" + dObj.getDate()).slice(-2) + "/" + ("0" + (dObj.getMonth() + 1)).slice(-2) + "/" + dObj.getFullYear();
        
        let orderWtFormatted = parseFloat(record.orderWt || 0).toFixed(3);
        let issueWtFormatted = parseFloat(record.issueWt || 0).toFixed(3);
        let yType = record.yarnType || "Warp";

        let actionHtml = '';
        if(record.status === 'Received') {
            actionHtml = `<span style="color:#526E51; font-size:10px; font-weight:bold;">Received</span>`;
        } else {
            actionHtml = `
                <div class="action-btns">
                    <button class="edit-action-btn" onclick="editIssueRecord(${record.id})">✏️</button>
                    <button class="del-action-btn" onclick="deleteIssueRecord(${record.id})">🗑️</button>
                </div>
            `;
        }

        tbody.innerHTML += `
            <tr>
                <td>${dateStr}</td>
                <td>${record.unit}</td>
                <td>${record.designNo}</td>
                <td><b>${yType}</b></td>
                <td>${record.count}</td>
                <td>${record.color}</td>
                <td>${orderWtFormatted}</td>
                <td>${issueWtFormatted}</td>
                <td>${actionHtml}</td>
            </tr>
        `;
    });
}

window.firebaseLoad = async function(key) {
    try {
        const docSnap = await getDoc(doc(db, "texfriend_erp", key));
        if (docSnap.exists()) {
            return JSON.parse(docSnap.data().content);
        }
    } catch (e) {
        console.error("Firebase Load Error: ", e);
    }
    return null;
};
</script>
