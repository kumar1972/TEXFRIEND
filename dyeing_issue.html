<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dyeing Issue - TEXFRIEND</title>
    <script src="translator.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        html, body { 
            width: 100%; 
            min-height: 100vh; 
            background: #030712; 
            color: #1E2B23; 
        }

        body { 
            padding: 12px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-card {
            width: 100%;
            max-width: 900px;
            margin: 0;
            background: #FFFFFF;
            border: 1px solid rgba(82, 110, 81, 0.15);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 35px rgba(30, 43, 35, 0.06);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .top-nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 5px; 
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            font-size: 11px;
            background: #1A2421; 
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }
        .back-btn:hover { background: #000000; transform: translateY(-2px); }

        .completed-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #D8DFD6;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid rgba(82, 110, 81, 0.4);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .completed-checkbox input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #526E51;
            margin: 0;
            padding: 0;
            border: none;
        }
        
        .completed-checkbox label {
            margin: 0;
            color: #3F5A3E;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        #bitmapDisplayContainer { text-align: right; }
        #bitmapDisplayContainer img {
            max-height: 40px; border-radius: 4px; border: 1px solid rgba(82, 110, 81, 0.4);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: zoom-in; transition: transform 0.2s;
        }
        #bitmapDisplayContainer img:hover { transform: scale(1.1); }

        .card-header {
            font-size: 16px; margin-bottom: 5px; font-weight: 700; color: #2F4F38;
            text-align: left; position: relative; padding-left: 12px;
        }
        .card-header::before {
            content: ''; position: absolute; left: 0; top: 10%; height: 80%; width: 4px;
            background: #4A7C59; border-radius: 4px;
        }

        .form-section {
            background: #F8FAF8; border: 1px solid #E2E8E2; border-radius: 14px;
            padding: 20px 15px 15px 15px; margin-bottom: 5px; position: relative;
        }
        
        .section-badge {
            position: absolute; top: -12px; left: 15px; background: #4A7C59; color: #FFF;
            font-size: 10px; font-weight: 700; padding: 4px 12px; border-radius: 12px;
            letter-spacing: 0.5px; text-transform: uppercase; box-shadow: 0 4px 8px rgba(74, 124, 89, 0.25);
        }

        .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
        .form-group label { font-size: 10px; font-weight: 600; color: #4A554A; white-space: nowrap; }

        input, select {
            width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #D1DED1;
            background: #FFFFFF; color: #1E2B23; font-size: 11px; font-weight: 600;
            transition: all 0.3s ease; box-shadow: inset 0 2px 4px rgba(30, 43, 35, 0.02);
        }
        input:focus, select:focus { border-color: #4A7C59; outline: none; background: #FFFFFF; box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.15); }

        .btn-add-inline {
            background: #10B981; color: white; border: none; padding: 6px 10px; border-radius: 8px;
            font-weight: 700; font-size: 10px; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 5px rgba(16, 185, 129, 0.2); white-space: nowrap;
        }
        .btn-add-inline:hover { background: #059669; }
        
        .btn-del-inline {
            background: #FEE2E2; color: #DC2626; border: none; padding: 6px 10px;
            border-radius: 8px; font-size: 12px; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(220, 38, 38, 0.2); display: flex; align-items: center; justify-content: center;
        }
        .btn-del-inline:hover { background: #FECACA; }

        /* 📌 Advanced Issue Grid */
        .issue-grid-header { display: grid; grid-template-columns: 0.8fr 1.2fr 1fr 0.8fr 0.8fr 1.2fr 70px; gap: 6px; padding: 0 4px; margin-bottom: 8px; }
        .issue-grid-header div { font-size: 10px; font-weight: 700; color: #4A7C59; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; }

        .line-row { display: grid; grid-template-columns: 0.8fr 1.2fr 1fr 0.8fr 0.8fr 1.2fr 70px; gap: 6px; align-items: center; margin-bottom: 10px; }
        .line-row input, .line-row select { padding: 10px 6px; font-size: 11px; text-align: center; width: 100%; }

        .btn-split-row {
            background: #D1FAE5; color: #059669; border: none; width: 32px; height: 32px;
            border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
        }
        .btn-split-row:hover { background: #A7F3D0; transform: scale(1.05); }

        .del-row-btn {
            background: #FEE2E2; color: #DC2626; border: none; width: 32px; height: 32px;
            border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
        }
        .del-row-btn:hover { background: #FECACA; transform: scale(1.05); }

        .totals-box {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; background: linear-gradient(135deg, #F4F7F4, #EAF0EA);
            border: 1px dashed #4A7C59; padding: 12px 15px; border-radius: 12px; margin-top: 10px; margin-bottom: 5px;
        }
        .total-item { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: #2F4F38; }
        .total-item span:last-child { background: #FFFFFF; padding: 6px 12px; border-radius: 6px; border: 1px solid #D1DED1; min-width: 80px; text-align: center; color: #10B981; }

        .btn-main {
            width: 100%; padding: 14px; margin: 10px 0 0 0; border: none; border-radius: 10px; color: white;
            font-weight: 700; font-size: 13px; cursor: pointer; background: linear-gradient(135deg, #4A7C59, #33593D);
            box-shadow: 0 6px 15px rgba(74, 124, 89, 0.25); transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(74, 124, 89, 0.35); }
        .btn-main:active { transform: translateY(1px); }

        .popup-trigger-btn {
            background: linear-gradient(135deg, #3B82F6, #1D4ED8); color: white; border: none; padding: 14px;
            border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; width: 100%;
            box-shadow: 0 6px 15px rgba(59, 130, 246, 0.25); transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 5px;
        }
        .popup-trigger-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35); }

        .overlay-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 25, 20, 0.85); backdrop-filter: blur(4px); z-index: 99999; flex-direction: column; padding: 15px; opacity: 0; transition: opacity 0.3s ease;
        }
        .overlay-modal.show { opacity: 1; }
        
        .modal-content {
            background: #FFFFFF; width: 100%; height: 100%; border-radius: 16px;
            display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.3); overflow: hidden; transform: scale(0.95); transition: transform 0.3s ease;
        }
        .overlay-modal.show .modal-content { transform: scale(1); }

        .modal-header { padding: 15px 20px; background: #F4F7F4; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #E2E8E2; }
        .modal-header h3 { margin: 0; font-size: 15px; color: #1E2B23; font-weight: 700; }
        .close-btn { background: #FEE2E2; color: #DC2626; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px; transition: all 0.2s ease; }
        .close-btn:hover { background: #FECACA; transform: scale(1.05); }
        .modal-body { padding: 15px; overflow-y: auto; flex: 1; background: #FAFCFA; }

        .fullscreen-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 999999; justify-content: center; align-items: center; padding: 20px; flex-direction: column;
        }
        .fullscreen-modal img { max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 10px; box-shadow: 0 10px 30px rgba(255,255,255,0.2); }
        .close-fullscreen { position: absolute; top: 20px; right: 20px; background: #EF4444; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        .table-container { width: 100%; border-radius: 10px; overflow-x: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid #E2E8E2; background: #FFFFFF; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; text-align: center; white-space: nowrap; }
        th, td { padding: 10px 12px; text-align: center; border-bottom: 1px solid #E2E8E2; color: #1E2B23; }
        th { background: #EAF0EA; color: #2F4F38; font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; position: sticky; top: 0; z-index: 10; }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #F8FAF8; }
        tfoot td { background: #F4F7F4; color: #2F4F38; font-weight: 700; border-top: 2px solid #D1DED1; position: sticky; bottom: 0; z-index: 10; }
        
        .edit-action-btn { background: #64748B; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 10px; transition: all 0.2s; }
        .del-action-btn { background: #EF4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 10px; transition: all 0.2s ease; }
        .action-complete { background: #526E51; color: white; border: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 9px; font-weight: bold; }
        .action-running { background: #D97706; color: white; border: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 9px; font-weight: bold; }

        .checkbox-container { background: #F8FAF8; padding: 12px 15px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px dashed #A0AFA0; }
    </style>
</head>
<body>

<div class="main-card">
    <div class="top-nav">
        <a href="dashboard.html" class="back-btn">← Back to Menu</a>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="completed-checkbox">
                <input type="checkbox" id="top_completed_status" onchange="quickCompleteToggle()">
                <label for="top_completed_status">Completed</label>
            </div>
            <div id="bitmapDisplayContainer"></div>
        </div>
    </div>

    <h2 class="card-header">Dyeing Issue (Warp + Weft)</h2>

    <!-- 📌 Section: Issue Details -->
    <div class="form-section" style="margin-top: 10px;">
        <div class="section-badge">Issue Info</div>
        <div class="form-group">
            <label>Issue Date</label>
            <input type="date" id="issueDate">
        </div>
        <div class="form-group">
            <label>Select Design Number</label>
            <select id="designNumber" onchange="loadDesignItems()">
                <option value="">Select Design No</option>
            </select>
        </div>
    </div>

    <!-- 📌 Section: Yarn Issue Entry -->
    <div class="form-section" style="padding-bottom: 10px;">
        <div class="section-badge">Yarn Details</div>
        
        <!-- Dropdown Controls for the Table -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px; gap: 10px; flex-wrap: wrap;">
            <div class="checkbox-container" style="flex: 1; min-width: 250px;">
                <label for="combineToggle" style="font-size: 11px; font-weight: 700; color: #4A7C59; cursor: pointer; margin:0;">🔗 Combine Warp & Weft</label>
                <input type="checkbox" id="combineToggle" checked onchange="loadDesignItems()" style="width: 18px; height: 18px; accent-color: #4A7C59; cursor: pointer;">
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;">
                <button type="button" class="btn-add-inline" onclick="addMasterMill()">+ Add Mill</button>
                <button type="button" class="btn-del-inline" onclick="deleteMasterItem('mill')" title="Delete Mill">🗑️</button>
                <button type="button" class="btn-add-inline" onclick="addMasterUnit()">+ Add Unit</button>
                <button type="button" class="btn-del-inline" onclick="deleteMasterItem('unit')" title="Delete Unit">🗑️</button>
            </div>
        </div>

        <div style="margin-top: 5px; overflow-x: auto;">
            <div style="min-width: 650px;">
                <div class="issue-grid-header">
                    <div>Count</div>
                    <div>Mill Name</div>
                    <div>Colour</div>
                    <div>Ord Wt</div>
                    <div>Iss Wt</div>
                    <div>Dyeing Unit</div>
                    <div>Action</div>
                </div>
                <div id="issueLinesContainer"></div>
            </div>
        </div>

        <div class="totals-box">
            <div class="total-item">
                <span>Total Balance Ord Wt:</span>
                <span id="sumOrdWt">0.000</span>
            </div>
            <div class="total-item">
                <span>Total Iss Wt:</span>
                <span id="sumIssWt">0.000</span>
            </div>
        </div>
    </div>

    <button class="btn-main" id="saveIssueBtnTxt" onclick="saveIssueEntries()">✅ Save Dyeing Order Issue</button>

    <!-- 📌 Popup Button for Issued Orders List -->
    <button class="popup-trigger-btn" onclick="openModal('issuedListModal')">📊 View Issued Orders List</button>
</div>

<!-- Full-Screen Pop-up Modal for Issued Orders List -->
<div id="issuedListModal" class="overlay-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📊 Issued Orders Registry</h3>
            <button class="close-btn" onclick="closeModal('issuedListModal')">Close ✕</button>
        </div>
        <div class="modal-body">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Dyeing Unit</th>
                            <th>Design No</th>
                            <th>Type</th>
                            <th>Count</th>
                            <th>Mill Name</th>
                            <th>Colour</th>
                            <th>Ord Wt</th>
                            <th>Iss Wt</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="issuedListBody">
                        <!-- Records go here -->
                    </tbody>
                    <tfoot id="issuedListFoot">
                        <!-- Grand Total goes here -->
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 📌 Fullscreen Image Popup Modal -->
<div id="fullscreenModal" class="fullscreen-modal" onclick="closeFullscreenImage()">
    <button class="close-fullscreen">Close ✕</button>
    <img id="fullscreenImg" src="" alt="Fullscreen Preview">
</div>

<script>
let editingIssueId = null;

function checkUserPermission() {
    let userRole = localStorage.getItem('erp_logged_role') || localStorage.getItem('user_role');
    if (userRole !== 'Administrator' && userRole !== 'Admin') {
        let permissions = JSON.parse(localStorage.getItem('user_permissions') || '{}');
        if (permissions['dyeing_issue.html'] === false || permissions['dyeing_issue'] === false) return false;
    }
    return true;
}

document.addEventListener('DOMContentLoaded', function() {
    if (!checkUserPermission()) {
        alert("Access Denied! You do not have permission to access this page. ❌");
        window.location.href = "dashboard.html";
        return;
    }
    document.getElementById('issueDate').valueAsDate = new Date();
    loadDesignDropdowns();
});

// 🚀 Cloud Sync Helper Function
async function syncMasterToCloud(key, data) {
    localStorage.setItem(key, JSON.stringify(data));
    if (window.firebaseSave) {
        await window.firebaseSave(key, data);
    }
    if (window.firebaseSaveIndividual) {
        await window.firebaseSaveIndividual(key, data);
    }
}

// 📌 Split Row / Duplicate Row Function
window.duplicateRow = function(btn) {
    let currentRow = btn.closest('.line-row');
    let newRow = document.createElement('div');
    newRow.className = 'line-row';
    
    let count = currentRow.querySelector('.inp-count').value;
    let mill = currentRow.querySelector('.inp-mill').value;
    let color = currentRow.querySelector('.inp-color').value;
    let ordWt = currentRow.querySelector('.inp-ordwt').value;
    let type = currentRow.querySelector('.inp-type').value;

    newRow.innerHTML = `
        <input type="text" class="inp-count" value="${count}" readonly>
        <select class="inp-mill">${getMillOptions(mill)}</select>
        <input type="text" class="inp-color" value="${color}" readonly>
        <input type="number" class="inp-ordwt" value="${ordWt}" step="0.001" readonly>
        <input type="number" class="inp-isswt" placeholder="Wt" step="0.001" oninput="updateTotals()">
        <select class="inp-unit">${getUnitOptions('')}</select>
        <input type="hidden" class="inp-type" value="${type}">
        <div style="display:flex; gap:4px; align-items:center;">
            <button type="button" class="btn-split-row" onclick="duplicateRow(this)" title="Split / Duplicate Row">➕</button>
            <button type="button" class="del-row-btn" onclick="this.closest('.line-row').remove(); updateTotals();" title="Delete Row">✕</button>
        </div>
    `;
    currentRow.parentNode.insertBefore(newRow, currentRow.nextSibling);
    updateTotals();
}

async function addMasterMill() {
    let val = prompt("புதிய மில் பெயரை உள்ளிடவும் (Enter new Mill Name):");
    if(val) {
        val = val.trim();
        if(!val) return;
        let masterMills = JSON.parse(localStorage.getItem('tex_master_mills')) || [];
        if(!masterMills.includes(val)) {
            masterMills.push(val);
            await syncMasterToCloud('tex_master_mills', masterMills);
            refreshAllSelects();
            alert(`Mill '${val}' added & saved to Cloud successfully! ✅☁️`);
        } else {
            alert("This Mill Name is already in the Master List!");
        }
    }
}

async function addMasterUnit() {
    let val = prompt("புதிய யூனிட் பெயரை உள்ளிடவும் (Enter new Dyeing/Unit Name):");
    if(val) {
        val = val.trim();
        if(!val) return;
        let masterUnits = JSON.parse(localStorage.getItem('tex_master_units')) || [];
        if(!masterUnits.includes(val)) {
            masterUnits.push(val);
            await syncMasterToCloud('tex_master_units', masterUnits);
            refreshAllSelects();
            alert(`Unit '${val}' added & saved to Cloud successfully! ✅☁️`);
        } else {
            alert("This Unit Name is already in the Master List!");
        }
    }
}

async function deleteMasterItem(type) {
    let storageKey = ''; let title = '';
    if(type === 'mill') { storageKey = 'tex_master_mills'; title = "Mill"; }
    else if(type === 'unit') { storageKey = 'tex_master_units'; title = "Unit"; }

    let masterList = JSON.parse(localStorage.getItem(storageKey)) || [];
    if(masterList.length === 0) { alert(`No manually added ${title}s found to delete.`); return; }

    let listStr = masterList.map((m, i) => `${i + 1}. ${m}`).join('\n');
    let idxStr = prompt(`எந்த ${title} பெயரை நீக்க வேண்டும்? அதற்கான எண்ணை டைப் செய்யவும்:\n\n${listStr}`);

    if(idxStr) {
        let idx = parseInt(idxStr) - 1;
        if(idx >= 0 && idx < masterList.length) {
            let deleted = masterList.splice(idx, 1);
            await syncMasterToCloud(storageKey, masterList);
            refreshAllSelects();
            alert(`'${deleted[0]}' நீக்கப்பட்டது (Deleted successfully)! ✅☁️`);
        } else {
            alert("தவறான எண் (Invalid Number)!");
        }
    }
}

function getMillOptions(selectedVal) {
    let masterMills = JSON.parse(localStorage.getItem('tex_master_mills')) || [];
    let inwards = JSON.parse(localStorage.getItem('kora_stock_records')) || [];
    let issues = JSON.parse(localStorage.getItem('kora_issue_records')) || [];
    
    let millsSet = new Set([...masterMills]);
    inwards.forEach(item => { if(item.supplier) millsSet.add(item.supplier.trim()); if(item.millName) millsSet.add(item.millName.trim()); });
    issues.forEach(item => { if(item.millName) millsSet.add(item.millName.trim()); });

    let html = '<option value="">Select Mill</option>';
    Array.from(millsSet).sort().forEach(mill => { 
        let sel = (selectedVal && mill.toLowerCase() === selectedVal.toLowerCase()) ? 'selected' : '';
        html += `<option value="${mill}" ${sel}>${mill}</option>`; 
    });
    return html;
}

function getUnitOptions(selectedVal) {
    let masterUnits = JSON.parse(localStorage.getItem('tex_master_units')) || [];
    let issues = JSON.parse(localStorage.getItem('kora_issue_records')) || [];
    let dyeIssues = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    
    let unitSet = new Set([...masterUnits]);
    issues.forEach(item => { if(item.dyeingName) unitSet.add(item.dyeingName.trim()); });
    dyeIssues.forEach(item => { if(item.unit) unitSet.add(item.unit.trim()); });

    let html = '<option value="">Select Unit</option>';
    Array.from(unitSet).sort().forEach(u => { 
        let sel = (selectedVal && u.toLowerCase() === selectedVal.toLowerCase()) ? 'selected' : '';
        html += `<option value="${u}" ${sel}>${u}</option>`; 
    });
    return html;
}

function refreshAllSelects() {
    document.querySelectorAll('.inp-mill').forEach(select => {
        let currentVal = select.value;
        select.innerHTML = getMillOptions(currentVal);
    });
    document.querySelectorAll('.inp-unit').forEach(select => {
        let currentVal = select.value;

function resolvePattern(lines, ranges, type, defaultCount) {
    if(!lines || lines.length === 0) return [];
    let covered = new Array(lines.length).fill(false);
    let orderedPattern = [];

    if(ranges && ranges.length > 0) {
        ranges.forEach(r => {
            for(let s=0; s<r.set; s++) {
                for(let j = r.start; j <= r.end; j++) {
                    if(lines[j-1]) orderedPattern.push({...lines[j-1]});
                }
            }
            for(let j = r.start; j <= r.end; j++) covered[j-1] = true;
        });
    }
    lines.forEach((l, idx) => { if(!covered[idx]) orderedPattern.push({...l}); });

    let exactSequence = [];
    orderedPattern.forEach(item => {
        let val = parseFloat(type === 'warp' ? item.ends : item.picks) || 0;
        let cDisplay = (item.count !== undefined && item.count !== '') ? String(item.count).trim() : String(defaultCount);
        let clr = item.color ? String(item.color).trim() : '-';
        for(let k=0; k<val; k++) exactSequence.push({ count: cDisplay, color: clr });
    });

    let summaryMap = new Map();
    let order = [];
    exactSequence.forEach(item => {
        let key = item.count.toLowerCase() + "||" + item.color.toLowerCase().trim();
        if(!summaryMap.has(key)) {
            summaryMap.set(key, { count: item.count, color: item.color.trim(), patternVal: 0 });
            order.push(key);
        }
        summaryMap.get(key).patternVal++;
    });

    return order.map(k => summaryMap.get(k));
}

function parseYarnCount(countStr) {
    if (!countStr) return 0;
    let str = String(countStr).trim().toLowerCase().replace(/s/g, ''); 
    if (str.includes('/')) {
        let parts = str.split('/');
        if (parts.length === 2) {
            let ply = parseFloat(parts[0]) || 1;
            let singleCount = parseFloat(parts[1]) || 1;
            return singleCount / ply; 
        }
    }
    return parseFloat(str) || 0;
}

function getMillNameFromKora(designNo, countStr) {
    let koraRecords = JSON.parse(localStorage.getItem('kora_stock_records')) || JSON.parse(localStorage.getItem('kora_issue_records')) || [];
    if(koraRecords.length === 0) return "";
    let cleanDNo = String(designNo).trim().toLowerCase();
    let cleanCount = String(countStr).trim().toLowerCase();
    let match = koraRecords.find(r => (String(r.designNo || r.designNumber || "").trim().toLowerCase() === cleanDNo) && (String(r.count || "").trim().toLowerCase() === cleanCount));
    if (match && (match.millName || match.supplier)) return match.millName || match.supplier;
    return "";
}

function loadDesignItems() {
    loadBitmapImage();
    renderIssuedList(); 
    let dNo = document.getElementById('designNumber').value;
    let container = document.getElementById('issueLinesContainer');
    container.innerHTML = '';

    if(!dNo) { updateTotals(); return; }

    localStorage.setItem('selected_design_number', dNo);
    let cleanDNo = cleanDesignName(dNo);
    
    let designMastersList = JSON.parse(localStorage.getItem('design_masters_data')) || [];
    let foundMaster = designMastersList.find(d => cleanDesignName(d.name || d.designNo) === cleanDNo) || {};
    
    let designSpecs = JSON.parse(localStorage.getItem('design_specs')) || {};
    let specKey = Object.keys(designSpecs).find(k => cleanDesignName(k) === cleanDNo) || dNo;
    let foundSpec = designSpecs[specKey] || {};

    let specStatus = (foundSpec && foundSpec.status) ? foundSpec.status.toLowerCase() : '';
    let existingIssues = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    let rec = existingIssues.find(r => cleanDesignName(r.designNo || r.designNumber) === cleanDNo);

    if(specStatus === 'completed' || (rec && rec.status && rec.status.toLowerCase() === 'completed')) {
        document.getElementById('top_completed_status').checked = true;
    } else {
        document.getElementById('top_completed_status').checked = false;
    }

    let defaultWarpCount = foundMaster.count1 || foundSpec.warp || '20';
    let defaultWeftCount = foundMaster.weftCount || foundSpec.weft || '40';

    let uiReed = parseFloat(foundMaster.reed || foundSpec.reed || foundSpec.baseReed) || 52;
    let baseWidth = parseFloat(foundMaster.width || foundSpec.width || foundSpec.baseWidth) || 66.92;
    let totalWarpEnds = Math.round(uiReed * baseWidth);
    let baseOrderMtr = parseFloat(foundMaster.orderMtr) || 100;
    let warpingMts = baseOrderMtr - (baseOrderMtr * 0.05);

    let uiPick = parseFloat(foundMaster.pick || foundSpec.pick || foundSpec.basePick) || 56;
    let weftWidth = parseFloat(foundMaster.weftWidth || foundSpec.weftWidth) || (baseWidth + 3);
    let totalFabricPick = weftWidth * uiPick;
    let weftMtrs = warpingMts * (0.94 / 0.95);

    let warpList = resolvePattern(foundMaster.warpLines || [], foundMaster.warpRanges || [], 'warp', defaultWarpCount);
    let weftList = resolvePattern(foundMaster.weftLines || [], foundMaster.weftRanges || [], 'weft', defaultWeftCount);

    let combinedMap = new Map();
    let isCombineChecked = document.getElementById('combineToggle').checked;

    warpList.forEach(item => {
        let calcCount = parseYarnCount(item.count) || parseYarnCount(defaultWarpCount) || 20;
        let totalEndsForColor = item.patternVal * Math.floor(totalWarpEnds / (warpList.reduce((a,b)=>a+b.patternVal,0) || 1));
        let weightKg = (totalEndsForColor * warpingMts) / (1693.33 * calcCount);
        
        let key = isCombineChecked ? (item.count.toLowerCase() + '_' + item.color.toLowerCase()) : ('warp_' + item.count.toLowerCase() + '_' + item.color.toLowerCase());
        combinedMap.set(key, { type: "Warp", count: item.count, color: item.color, orderWt: weightKg });
    });

    weftList.forEach(item => {
        let calcCount = parseYarnCount(item.count) || parseYarnCount(defaultWeftCount) || 40;
        let totalWeftPicks = (item.patternVal / (weftList.reduce((a,b)=>a+b.patternVal,0) || 1)) * totalFabricPick;
        let weightKg = (totalWeftPicks * weftMtrs) / (1693.33 * calcCount);

        let key = isCombineChecked ? (item.count.toLowerCase() + '_' + item.color.toLowerCase()) : ('weft_' + item.count.toLowerCase() + '_' + item.color.toLowerCase());
        
        if(combinedMap.has(key)) {
            combinedMap.get(key).orderWt += weightKg;
            if(isCombineChecked) combinedMap.get(key).type = "Combined";
        } else {
            combinedMap.set(key, { type: "Weft", count: item.count, color: item.color, orderWt: weightKg });
        }
    });

    let displayList = Array.from(combinedMap.values());
    let cleanSelectedDNoForFilter = (dNo || "").trim().toLowerCase();
    
    displayList.forEach(item => {
        let alreadyIssuedWt = 0;
        existingIssues.forEach(rec => {
            let rDno = (rec.designNo || rec.designNumber || rec.design || "").trim().toLowerCase();
            let rCount = (rec.count || "").trim().toLowerCase();
            let rColor = (rec.color || "").trim().toLowerCase();
            if(cleanDesignName(rDno) === cleanSelectedDNoForFilter && rCount === item.count.toLowerCase().trim() && rColor === item.color.toLowerCase().trim()) {
                alreadyIssuedWt += (parseFloat(rec.issueWt) || 0);
            }
        });
        item.orderWt = item.orderWt - alreadyIssuedWt;
    });

    displayList = displayList.filter(item => item.orderWt > 0.005);

    if(displayList.length > 0) {
        displayList.forEach(item => {
            let autofillMill = getMillNameFromKora(dNo, item.count);
            let row = document.createElement('div');
            row.className = 'line-row';
            row.innerHTML = `
                <input type="text" class="inp-count" value="${item.count}" readonly>
                <select class="inp-mill">${getMillOptions(autofillMill)}</select>
                <input type="text" class="inp-color" value="${item.color}" readonly>
                <input type="number" class="inp-ordwt" value="${item.orderWt.toFixed(3)}" step="0.001" readonly>
                <input type="number" class="inp-isswt" placeholder="Wt" step="0.001" oninput="updateTotals()">
                <select class="inp-unit">${getUnitOptions('')}</select>
                <input type="hidden" class="inp-type" value="${item.type}">
                <div style="display:flex; gap:4px; align-items:center;">
                    <button type="button" class="btn-split-row" onclick="duplicateRow(this)" title="Split / Duplicate Row">➕</button>
                    <button type="button" class="del-row-btn" onclick="this.closest('.line-row').remove(); updateTotals();" title="Delete Row">✕</button>
                </div>
            `;
            container.appendChild(row);
        });
        updateTotals();
    } else {
        let autofillMill = getMillNameFromKora(dNo, '20/s');
        let row = document.createElement('div');
        row.className = 'line-row';
        row.innerHTML = `
            <input type="text" class="inp-count" value="20/s" placeholder="Count">
            <select class="inp-mill">${getMillOptions(autofillMill)}</select>
            <input type="text" class="inp-color" value="White" placeholder="Colour">
            <input type="number" class="inp-ordwt" value="0.000" step="0.001">
            <input type="number" class="inp-isswt" placeholder="Wt" step="0.001" oninput="updateTotals()">
            <select class="inp-unit">${getUnitOptions('')}</select>
            <input type="hidden" class="inp-type" value="Combined">
            <div style="display:flex; gap:4px; align-items:center;">
                <button type="button" class="btn-split-row" onclick="duplicateRow(this)" title="Split / Duplicate Row">➕</button>
                <button type="button" class="del-row-btn" onclick="this.closest('.line-row').remove(); updateTotals();" title="Delete Row">✕</button>
            </div>
        `;
        container.appendChild(row);
        updateTotals();
    }
}

async function saveIssueEntries() {
    if (!checkUserPermission()) { alert("Access Denied! You do not have permission to save entries on this page. ❌"); return; }

    let dateVal = document.getElementById('issueDate').value;
    let dNo = document.getElementById('designNumber').value;
    let isCompleted = document.getElementById('top_completed_status').checked;

    if(!dNo) { alert("Please select a Design Number!"); return; }

    let records = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    let cleanDNo = cleanDesignName(dNo);

    let container = document.getElementById('issueLinesContainer');
    let rows = container.querySelectorAll('.line-row');
    if(rows.length === 0) { alert("Please add at least one yarn item row."); return; }

    let btn = document.getElementById('saveIssueBtnTxt'); let origText = btn.innerText; btn.innerText = "⏳ Saving to Cloud...";
    let savedCount = 0;
    
    if(editingIssueId) {
       let rowIndex = records.findIndex(r => r.id == editingIssueId);
       if(rowIndex > -1) {
           let row = rows[0]; 
           records[rowIndex].date = dateVal; records[rowIndex].designNo = dNo;
           records[rowIndex].millName = row.querySelector('.inp-mill').value.trim();
           records[rowIndex].issueWt = parseFloat(row.querySelector('.inp-isswt').value).toFixed(3) || "0.000";
           records[rowIndex].unit = row.querySelector('.inp-unit').value.trim();
           records[rowIndex].status = isCompleted ? "completed" : "running";
           savedCount++;
       }
       editingIssueId = null; 
    } else {
        rows.forEach(row => {
            let count = row.querySelector('.inp-count').value.trim();
            let mill = row.querySelector('.inp-mill').value.trim();
            let color = row.querySelector('.inp-color').value.trim();
            let ordWt = parseFloat(row.querySelector('.inp-ordwt').value) || 0;
            let issWt = parseFloat(row.querySelector('.inp-isswt').value) || 0;
            let unit = row.querySelector('.inp-unit').value.trim();
            let type = row.querySelector('.inp-type').value.trim();

            if(!unit) unit = "Default Unit";

            records.push({
                id: Date.now() + Math.random(), date: dateVal, designNo: dNo, yarnType: type, count: count || '20/s',
                millName: mill || '', color: color || '-', orderWt: ordWt.toFixed(3), issueWt: (issWt > 0 ? issWt : ordWt).toFixed(3),
                unit: unit, status: isCompleted ? "completed" : "running"
            });
            savedCount++;
        });
    }

    if(savedCount > 0) {
        let designSpecs = JSON.parse(localStorage.getItem('design_specs')) || {};
        let specKey = Object.keys(designSpecs).find(k => cleanDesignName(k) === cleanDNo) || dNo;

        if(!designSpecs[specKey]) designSpecs[specKey] = {};
        designSpecs[specKey].status = isCompleted ? 'completed' : 'running';
        localStorage.setItem('design_specs', JSON.stringify(designSpecs));
        localStorage.setItem('dyeing_issue_records', JSON.stringify(records));
        
        if (window.firebaseSave) { await window.firebaseSave('dyeing_issue_records', records); await window.firebaseSave('design_specs', designSpecs); }
        if (window.firebaseSaveIndividual) await window.firebaseSaveIndividual(specKey, designSpecs[specKey]);

        alert("Dyeing Order Issues Saved to Cloud Successfully! ✅☁️");
        document.getElementById('issueLinesContainer').innerHTML = ''; document.getElementById('designNumber').value = '';
        document.getElementById('top_completed_status').checked = false; 
        updateTotals(); renderIssuedList();
    } else { alert("Please check your entry fields."); }
    btn.innerText = origText;
}

                if(!designSpecs[specKey]) designSpecs[specKey] = {};
                designSpecs[specKey].status = newStatus; localStorage.setItem('design_specs', JSON.stringify(designSpecs));
                if(window.firebaseSave) await window.firebaseSave('design_specs', designSpecs);

            }

function renderIssuedList() {

    }

    let tfoot = document.getElementById('issuedListFoot');
    tbody.innerHTML = ''; tfoot.innerHTML = '';

    if(records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="11" style="padding:15px; color:#A0AFA0;">No Dyeing Orders Issued for this design yet.</td></tr>`;
        return;
    }

    let grandOrdWt = 0; let grandIssWt = 0;

    records.slice().reverse().forEach(record => {
        let dObj = new Date(record.date);
        let dateStr = ("0" + dObj.getDate()).slice(-2) + "/" + ("0" + (dObj.getMonth() + 1)).slice(-2) + "/" + dObj.getFullYear();
        let oWt = parseFloat(record.orderWt) || 0; let iWt = parseFloat(record.issueWt) || 0;
        grandOrdWt += oWt; grandIssWt += iWt;
        
        if(!record.status) record.status = "running";
        let statusColor = record.status === 'running' ? '#D97706' : '#526E51';
        let statusBtn = record.status === 'running' 
            ? `<button class="action-complete" onclick="toggleStatus('${record.id}', 'completed')">Complete</button>` 
            : `<button class="action-running" onclick="toggleStatus('${record.id}', 'running')">Running</button>`;

        tbody.innerHTML += `
            <tr>
                <td>${dateStr}</td><td><b>${record.unit || '-'}</b></td><td><b>${record.designNo}</b></td>
                <td>${record.yarnType || 'Combined'}</td><td>${record.count}</td><td>${record.millName || '-'}</td>
                <td>${record.color}</td><td>${oWt.toFixed(3)}</td><td style="color:#10B981; font-weight:bold;">${iWt.toFixed(3)}</td>
                <td style="color:${statusColor}; font-weight:bold; text-transform:uppercase;">${record.status}</td>
                <td style="white-space:nowrap;">
                    <div style="display: flex; gap: 4px; justify-content: center;">
                        ${statusBtn}
                        <button class="edit-action-btn" onclick="editIssuedRecord('${record.id}')" title="Edit">✏️</button>
                        <button class="del-action-btn" onclick="deleteIssuedRecord('${record.id}')" title="Delete">🗑️</button>
                    </div>
                </td>
            </tr>
        `;
    });

    tfoot.innerHTML = `
        <tr><td colspan="7" style="text-align: right; padding: 12px;">Grand Total:</td><td><b>${grandOrdWt.toFixed(3)}</b></td><td><b style="color:#10B981;">${grandIssWt.toFixed(3)}</b></td><td colspan="2"></td></tr>
    `;
}
</script>
<script src="config.js"></script>
</body>
</html>
