<script>
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('issueDate').valueAsDate = new Date();
    loadDesignDropdowns();
    renderIssuedList();
});

function openModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.style.display = 'flex';
    setTimeout(() => modal.classList.add('show'), 10);
}

function closeModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.classList.remove('show');
    setTimeout(() => modal.style.display = 'none', 300);
}

function loadDesignDropdowns() {
    let preDesignList = JSON.parse(localStorage.getItem('pre_design_numbers')) || [];
    let designMasters = JSON.parse(localStorage.getItem('design_masters_data')) || [];
    let designSpecs = JSON.parse(localStorage.getItem('design_specs')) || {};

    let allDesigns = new Set();
    preDesignList.forEach(d => allDesigns.add(d));
    designMasters.forEach(d => allDesigns.add(d.name));
    Object.keys(designSpecs).forEach(d => allDesigns.add(d));

    let select = document.getElementById('designNumber');
    let html = '<option value="">Select Design No</option>';
    
    [...allDesigns].forEach(function(d) {
        if(d) html += '<option value="' + d + '">' + d + '</option>';
    });
    select.innerHTML = html;
}

function resolvePattern(lines, ranges, type, defaultCount) {
    if(!lines || lines.length === 0) return [];
    let covered = new Array(lines.length).fill(false);
    let orderedPattern = [];

    if(ranges && ranges.length > 0) {
        ranges.forEach(r => {
            for(let s=0; s<r.set; s++) {
                for(let j = r.start; j <= r.end; j++) {
                    if(lines[j-1]) orderedPattern.push({...lines[j-1]});
                }
            }
            for(let j = r.start; j <= r.end; j++) covered[j-1] = true;
        });
    }
    lines.forEach((l, idx) => {
        if(!covered[idx]) orderedPattern.push({...l});
    });

    let exactSequence = [];
    orderedPattern.forEach(item => {
        let val = parseFloat(type === 'warp' ? item.ends : item.picks) || 0;
        let cDisplay = (item.count !== undefined && item.count !== '') ? String(item.count).trim() : String(defaultCount);
        let clr = item.color ? String(item.color).trim() : '-';
        for(let k=0; k<val; k++) exactSequence.push({ count: cDisplay, color: clr });
    });

    let summaryMap = new Map();
    let order = [];
    exactSequence.forEach(item => {
        let key = item.count.toLowerCase() + "||" + item.color.toLowerCase().trim();
        if(!summaryMap.has(key)) {
            summaryMap.set(key, { count: item.count, color: item.color.trim(), patternVal: 0 });
            order.push(key);
        }
        summaryMap.get(key).patternVal++;
    });

    return order.map(k => summaryMap.get(k));
}

function parseYarnCount(countStr) {
    if (!countStr) return 0;
    let str = String(countStr).trim().toLowerCase().replace(/s/g, ''); 
    if (str.includes('/')) {
        let parts = str.split('/');
        if (parts.length === 2) {
            let ply = parseFloat(parts[0]) || 1;
            let singleCount = parseFloat(parts[1]) || 1;
            return singleCount / ply; 
        }
    }
    return parseFloat(str) || 0;
}

function loadDesignItems() {
    let dNo = document.getElementById('designNumber').value;
    let container = document.getElementById('issueLinesContainer');
    container.innerHTML = '';

    if(!dNo) {
        updateTotals();
        return;
    }

    let cleanDNo = dNo.replace('#', '').trim().toLowerCase();
    let designMastersList = JSON.parse(localStorage.getItem('design_masters_data')) || [];
    let foundMaster = designMastersList.find(d => d.name && d.name.replace('#', '').trim().toLowerCase() === cleanDNo) || {};
    
    let designSpecs = JSON.parse(localStorage.getItem('design_specs')) || {};
    let specKey = Object.keys(designSpecs).find(k => k.replace('#', '').trim().toLowerCase() === cleanDNo);
    let foundSpec = specKey ? designSpecs[specKey] : {};

    let defaultWarpCount = foundMaster.count1 || foundSpec.warp || '20';
    let defaultWeftCount = foundMaster.weftCount || foundSpec.weft || '40';

    let uiReed = parseFloat(foundMaster.reed || foundSpec.reed || foundSpec.baseReed) || 52;
    let baseWidth = parseFloat(foundMaster.width || foundSpec.width || foundSpec.baseWidth) || 66.92;
    let totalWarpEnds = Math.round(uiReed * baseWidth);
    let baseOrderMtr = parseFloat(foundMaster.orderMtr) || 100;
    let warpingMts = baseOrderMtr - (baseOrderMtr * 0.05);

    let uiPick = parseFloat(foundMaster.pick || foundSpec.pick || foundSpec.basePick) || 56;
    let weftWidth = parseFloat(foundMaster.weftWidth || foundSpec.weftWidth) || (baseWidth + 3);
    let totalFabricPick = weftWidth * uiPick;
    let weftMtrs = warpingMts * (0.94 / 0.95);

    let warpList = resolvePattern(foundMaster.warpLines || [], foundMaster.warpRanges || [], 'warp', defaultWarpCount);
    let weftList = resolvePattern(foundMaster.weftLines || [], foundMaster.weftRanges || [], 'weft', defaultWeftCount);

    let combinedMap = new Map();
    let isCombineChecked = document.getElementById('combineToggle').checked;

    warpList.forEach(item => {
        let calcCount = parseYarnCount(item.count) || parseYarnCount(defaultWarpCount) || 20;
        let totalEndsForColor = item.patternVal * Math.floor(totalWarpEnds / (warpList.reduce((a,b)=>a+b.patternVal,0) || 1));
        let weightKg = (totalEndsForColor * warpingMts) / (1693.33 * calcCount);
        
        let key = isCombineChecked ? (item.count.toLowerCase() + '_' + item.color.toLowerCase()) : ('warp_' + item.count.toLowerCase() + '_' + item.color.toLowerCase());
        combinedMap.set(key, {
            type: "Warp",
            count: item.count,
            color: item.color,
            orderWt: weightKg
        });
    });

    weftList.forEach(item => {
        let calcCount = parseYarnCount(item.count) || parseYarnCount(defaultWeftCount) || 40;
        let totalWeftPicks = (item.patternVal / (weftList.reduce((a,b)=>a+b.patternVal,0) || 1)) * totalFabricPick;
        let weightKg = (totalWeftPicks * weftMtrs) / (1693.33 * calcCount);

        let key = isCombineChecked ? (item.count.toLowerCase() + '_' + item.color.toLowerCase()) : ('weft_' + item.count.toLowerCase() + '_' + item.color.toLowerCase());
        
        if(combinedMap.has(key)) {
            combinedMap.get(key).orderWt += weightKg;
            if(isCombineChecked) combinedMap.get(key).type = "Combined";
        } else {
            combinedMap.set(key, {
                type: "Weft",
                count: item.count,
                color: item.color,
                orderWt: weightKg
            });
        }
    });

    let displayList = Array.from(combinedMap.values());

    if(displayList.length > 0) {
        displayList.forEach(item => {
            let row = document.createElement('div');
            row.className = 'line-row';
            row.innerHTML = `
                <input type="text" class="inp-count" value="${item.count}" readonly>
                <input type="text" class="inp-color" value="${item.color}" readonly>
                <input type="number" class="inp-ordwt" value="${item.orderWt.toFixed(3)}" step="0.001" oninput="updateTotals()">
                <input type="number" class="inp-isswt" placeholder="Wt" step="0.001" oninput="updateTotals()">
                <input type="text" class="inp-unit" placeholder="Dyeing Unit">
                <input type="hidden" class="inp-type" value="${item.type}">
                <button type="button" class="del-row-btn" onclick="this.closest('.line-row').remove(); updateTotals();">✕</button>
            `;
            container.appendChild(row);
        });
        updateTotals();
    } else {
        container.innerHTML = '<div style="font-size:11px; text-align:center; padding:10px; color:#4A7C59;">No yarn pattern found for this Design. Add items manually if needed.</div>';
        updateTotals();
    }
}

function updateTotals() {
    let ordWtInputs = document.querySelectorAll('.inp-ordwt');
    let issWtInputs = document.querySelectorAll('.inp-isswt');

    let totalOrd = 0;
    let totalIss = 0;

    ordWtInputs.forEach(inp => { totalOrd += parseFloat(inp.value) || 0; });
    issWtInputs.forEach(inp => { totalIss += parseFloat(inp.value) || 0; });

    document.getElementById('sumOrdWt').innerText = totalOrd.toFixed(3);
    document.getElementById('sumIssWt').innerText = totalIss.toFixed(3);
}

// 📌 FIREBASE SYNC: saveIssueEntries
async function saveIssueEntries() {
    let dateVal = document.getElementById('issueDate').value;
    let dNo = document.getElementById('designNumber').value;

    if(!dNo) {
        alert("Please select a Design Number!");
        return;
    }

    let rows = document.querySelectorAll('#issueLinesContainer .line-row');
    if(rows.length === 0) {
        alert("No items to save!");
        return;
    }

    let btn = document.getElementById('saveIssueBtnTxt');
    let origText = btn.innerText;
    btn.innerText = "⏳ Saving to Cloud...";

    let records = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    let savedCount = 0;

    rows.forEach(row => {
        let count = row.querySelector('.inp-count').value.trim();
        let color = row.querySelector('.inp-color').value.trim();
        let ordWt = parseFloat(row.querySelector('.inp-ordwt').value) || 0;
        let issWt = parseFloat(row.querySelector('.inp-isswt').value) || 0;
        let unit = row.querySelector('.inp-unit').value.trim();
        let type = row.querySelector('.inp-type').value.trim();

        if(issWt > 0 && unit) {
            records.push({
                id: Date.now() + Math.random(),
                date: dateVal,
                designNo: dNo,
                yarnType: type,
                count: count,
                color: color,
                orderWt: ordWt.toFixed(3),
                issueWt: issWt.toFixed(3),
                unit: unit,
                status: "Pending"
            });
            savedCount++;
        }
    });

    if(savedCount > 0) {
        localStorage.setItem('dyeing_issue_records', JSON.stringify(records));
        
        if (window.firebaseSave) {
            await window.firebaseSave('dyeing_issue_records', records);
        }

        alert("Dyeing Order Issues Saved to Cloud Successfully! ✅☁️");
        
        document.getElementById('issueLinesContainer').innerHTML = '';
        document.getElementById('designNumber').value = '';
        updateTotals();
        renderIssuedList();
    } else {
        alert("Please enter Issue Weight and Dyeing Unit for at least one item.");
    }
    btn.innerText = origText;
}

// 📌 EDIT RECORD FUNCTION
async function editIssuedRecord(id) {
    let records = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    let rec = records.find(r => r.id == id);
    if (!rec) return;

    closeModal('issuedListModal');

    document.getElementById('issueDate').value = rec.date || new Date().toISOString().split('T')[0];
    document.getElementById('designNumber').value = rec.designNo;
    loadDesignItems();

    setTimeout(() => {
        let rows = document.querySelectorAll('#issueLinesContainer .line-row');
        rows.forEach(row => {
            let c = row.querySelector('.inp-count').value.trim();
            let col = row.querySelector('.inp-color').value.trim();
            if (c.toLowerCase() === rec.count.toLowerCase() && col.toLowerCase() === rec.color.toLowerCase()) {
                row.querySelector('.inp-ordwt').value = rec.orderWt;
                row.querySelector('.inp-isswt').value = rec.issueWt;
                row.querySelector('.inp-unit').value = rec.unit;
                row.querySelector('.inp-type').value = rec.yarnType || 'Combined';
            }
        });
        updateTotals();
        
        // Remove old record so saving acts as an update
        records = records.filter(r => r.id != id);
        localStorage.setItem('dyeing_issue_records', JSON.stringify(records));
        if (window.firebaseSave) {
            window.firebaseSave('dyeing_issue_records', records);
        }
        renderIssuedList();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 150);
}

// 📌 FIREBASE SYNC: deleteIssuedRecord
async function deleteIssuedRecord(id) {
    if(!confirm("Are you sure you want to delete this record?")) return;
    
    let records = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    records = records.filter(r => r.id != id);
    
    localStorage.setItem('dyeing_issue_records', JSON.stringify(records));
    
    if (window.firebaseSave) {
        await window.firebaseSave('dyeing_issue_records', records);
    }
    
    renderIssuedList();
}

function renderIssuedList() {
    let records = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    let tbody = document.getElementById('issuedListBody');
    let tfoot = document.getElementById('issuedListFoot');
    tbody.innerHTML = '';
    tfoot.innerHTML = '';

    if(records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="padding:15px; color:#A0AFA0;">No Dyeing Orders Issued yet.</td></tr>`;
        return;
    }

    let grandOrdWt = 0;
    let grandIssWt = 0;

    records.slice().reverse().forEach(record => {
        let dObj = new Date(record.date);
        let dateStr = ("0" + dObj.getDate()).slice(-2) + "/" + ("0" + (dObj.getMonth() + 1)).slice(-2) + "/" + dObj.getFullYear();
        
        let oWt = parseFloat(record.orderWt) || 0;
        let iWt = parseFloat(record.issueWt) || 0;
        grandOrdWt += oWt;
        grandIssWt += iWt;

        tbody.innerHTML += `
            <tr>
                <td>${dateStr}</td>
                <td><b>${record.unit || '-'}</b></td>
                <td><b>${record.designNo}</b></td>
                <td>${record.yarnType || 'Combined'}</td>
                <td>${record.count}</td>
                <td>${record.color}</td>
                <td>${oWt.toFixed(3)}</td>
                <td style="color:#10B981; font-weight:bold;">${iWt.toFixed(3)}</td>
                <td style="white-space:nowrap;">
                    <button class="edit-action-btn" onclick="editIssuedRecord(${record.id})" title="Edit">✏️</button>
                    <button class="del-action-btn" onclick="deleteIssuedRecord(${record.id})" title="Delete">🗑️</button>
                </td>
            </tr>
        `;
    });

    tfoot.innerHTML = `
        <tr>
            <td colspan="6" style="text-align: right; padding: 12px;">Grand Total:</td>
            <td><b>${grandOrdWt.toFixed(3)}</b></td>
            <td><b style="color:#10B981;">${grandIssWt.toFixed(3)}</b></td>
            <td></td>
        </tr>
    `;
}
</script>

    window.firebaseLoad = async function(key) {
        try {
            const docSnap = await getDoc(doc(db, "texfriend_erp", key));
            if (docSnap.exists()) {
                return JSON.parse(docSnap.data().content);
            }
        } catch (e) {

        }
        return null;
    }

        let collections = ['dyeing_issue_records', 'design_masters_data', 'design_specs', 'pre_design_numbers'];
        
        for(let col of collections) {
            let data = await window.firebaseLoad(col);
            if (data) localStorage.setItem(col, JSON.stringify(data));
        }

        if(btn) btn.innerText = origText;
        
        loadDesignDropdowns();
        renderIssuedList();
    });
