<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Report - TEXFRIEND ERP</title>
<script src="translator.js"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    html, body { 
        width: 100%; 
        min-height: 100vh; 
        background: #EAF0EA; 
        color: #1E2B23; 
    }

    body { 
        padding: 12px; 
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .main-card {
        width: 100%;
        max-width: 1000px;
        margin: 0;
        background: #FFFFFF;
        border: 1px solid rgba(82, 110, 81, 0.15);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 35px rgba(30, 43, 35, 0.06);
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .top-nav { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 5px; 
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #FFFFFF;
        text-decoration: none;
        font-weight: 600;
        font-size: 11px;
        background: #1A2421; 
        padding: 8px 16px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        transition: all 0.3s ease;
    }
    .back-btn:hover { background: #2F4F38; transform: translateY(-2px); }

    .card-header {
        font-size: 18px;
        margin-bottom: 5px;
        font-weight: 800;
        color: #2F4F38;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 2px solid #EAF0EA;
        padding-bottom: 12px;
    }

    .form-section {
        background: #F8FAF8;
        border: 1px solid #E2E8E2;
        border-radius: 14px;
        padding: 20px 15px 15px 15px;
        position: relative;
    }
    
    .section-badge {
        position: absolute;
        top: -12px;
        left: 15px;
        background: #4A7C59;
        color: #FFF;
        font-size: 10px;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 12px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        box-shadow: 0 4px 8px rgba(74, 124, 89, 0.25);
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .form-group label {
        font-size: 11px;
        font-weight: 700;
        color: #4A554A;
    }

    select {
        width: 100%;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid #D1DED1;
        background: #FFFFFF;
        color: #1E2B23;
        font-size: 12px;
        font-weight: 700;
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 4px rgba(30, 43, 35, 0.02);
        outline: none;
        cursor: pointer;
    }

    select:focus {
        border-color: #4A7C59;
        box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.15);
    }

    .report-tabs {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 8px;
        margin-top: 5px;
    }

    .tab-btn {
        background: #F4F7F4;
        color: #4A554A;
        border: 1px solid #D1DED1;
        padding: 12px 6px;
        border-radius: 10px;
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
        text-transform: uppercase;
        transition: all 0.3s ease;
    }

    .tab-btn:hover { background: #E2E8E2; color: #2F4F38; }

    .tab-btn.active {
        background: linear-gradient(135deg, #4A7C59, #2F4F38);
        color: #FFFFFF;
        border-color: transparent;
        box-shadow: 0 6px 12px rgba(74, 124, 89, 0.3);
        transform: translateY(-2px);
    }

    .invoice-tab-btn {
        grid-column: 1 / -1;
        background: linear-gradient(135deg, #3B82F6, #1E3A8A);
        color: #FFFFFF;
        border: none;
        padding: 14px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
        text-transform: uppercase;
        box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25);
        transition: all 0.3s ease;
    }
    .invoice-tab-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(59, 130, 246, 0.35); }
    .invoice-tab-btn.active { border: 2px solid #FFFFFF; }

    .report-header-bar {
        background: #F8FAF8;
        padding: 12px 15px;
        border-radius: 12px 12px 0 0;
        border: 1px solid #E2E8E2;
        border-bottom: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
    }

    .report-header-bar span {
        font-size: 13px;
        font-weight: 800;
        color: #2F4F38;
        text-transform: uppercase;
    }

    .header-btns {
        display: flex;
        gap: 8px;
    }

    .action-btn { 
        color: white; border: none; padding: 8px 14px; border-radius: 8px; 
        font-size: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s;
        text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 8px rgba(30,43,35,0.1);
    }
    .action-btn:hover { transform: translateY(-2px); }
    
    .preview-btn { background: linear-gradient(135deg, #3B82F6, #1D4ED8); }
    .print-btn { background: linear-gradient(135deg, #10B981, #059669); }
    .excel-btn { background: linear-gradient(135deg, #F59E0B, #D97706); }

    .table-container {
        width: 100%; border-radius: 0 0 12px 12px; overflow-x: auto;
        box-shadow: 0 4px 10px rgba(30, 43, 35, 0.03); border: 1px solid #E2E8E2; background: #FFFFFF;
    }

    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; text-align: center; }
    th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #E2E8E2; color: #1E2B23; white-space: nowrap; }
    th { background: #EAF0EA; color: #2F4F38; font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; border-bottom: 2px solid #D1DED1; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #F8FAF8; }

    tfoot td {
        background: #F4F7F4;
        color: #2F4F38;
        font-weight: 800;
        border-top: 2px solid #D1DED1;
    }

    .no-data {
        padding: 30px;
        color: #64748B;
        font-size: 12px;
        text-align: center;
        font-weight: 600;
        background: #F8FAF8;
    }

    .bal-positive { color: #10B981; font-weight: 800; }
    .bal-negative { color: #DC2626; font-weight: 800; }
    .pending-txt { color: #F59E0B; font-weight: 800; font-size: 10px; background: rgba(245, 158, 11, 0.1); padding: 4px 8px; border-radius: 12px;}

    /* Modals */
    .overlay-modal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(18, 25, 20, 0.85); backdrop-filter: blur(4px);
        z-index: 99999; flex-direction: column; padding: 15px; opacity: 0; transition: opacity 0.3s ease;
    }
    .overlay-modal.show { opacity: 1; }
    
    .modal-content {
        background: #FFFFFF; width: 100%; height: 100%; border-radius: 16px;
        display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        overflow: hidden; transform: scale(0.95); transition: transform 0.3s ease;
    }
    .overlay-modal.show .modal-content { transform: scale(1); }

    .modal-header {
        padding: 15px 20px; background: #F4F7F4; display: flex;
        justify-content: space-between; align-items: center; border-bottom: 1px solid #E2E8E2; gap:10px;
    }
    .modal-header h3 { margin: 0; font-size: 15px; color: #2F4F38; font-weight: 800; text-transform: uppercase; }
    .close-btn {
        background: #FEE2E2; color: #DC2626; border: none; padding: 8px 14px;
        border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px;
        transition: all 0.2s ease;
    }
    .close-btn:hover { background: #FECACA; transform: scale(1.05); }

    .modal-body { padding: 20px; overflow-y: auto; flex: 1; background: #FAFCFA; color: #1E2B23; }
    
    @media print {
        body * { visibility: hidden; }
        .overlay-modal, .overlay-modal * { visibility: visible; }
        .overlay-modal { position: absolute; left: 0; top: 0; width: 100%; padding: 0; z-index: 99999; background: #FFFFFF; }
        .modal-content { box-shadow: none; border: none; border-radius: 0; }
        .no-print { display: none !important; }
        .modal-body { padding: 0; }
    }
</style>
</head>
<body>

<div class="main-card">
    <div class="top-nav">
        <!-- 📌 Links back to dashboard.html -->
        <a href="dashboard.html" class="back-btn">← Back to Menu</a>
    </div>

    <h2 class="card-header" id="pageMainHeader">Reports & Analytics</h2>

    <div class="form-section">
        <div class="section-badge">Filter Records</div>
        <div class="form-group">
            <label>🔍 Select Design Number:</label>
            <select id="designFilter" onchange="switchTab(currentTab)">
                <option value="All">All Designs (மொத்தம்)</option>
            </select>
        </div>
    </div>

    <div class="report-tabs">
        <button class="tab-btn active" id="tab-PartyOrders" onclick="switchTab('PartyOrders')">📦 Orders</button>
        <button class="tab-btn" id="tab-KoraStock" onclick="switchTab('KoraStock')">🧵 Yarn Stock</button>
        <button class="tab-btn" id="tab-Dyeing" onclick="switchTab('Dyeing')">🎨 Dyeing</button>
        <button class="tab-btn" id="tab-Warping" onclick="switchTab('Warping')">📐 Warping</button>
        <button class="tab-btn" id="tab-Weaving" onclick="switchTab('Weaving')">🏭 Weaving</button>
        <button class="tab-btn" id="tab-Washing" onclick="switchTab('Washing')">🌊 Washing</button>
        <button class="invoice-tab-btn" id="tab-Invoice" onclick="switchTab('Invoice')">📄 Invoice / Billing Report</button>
    </div>

    <!-- Standard Report Container -->
    <div id="standardReportContainer">
        <div class="report-header-bar">
            <span id="reportTitle">📊 Report Data</span>
            <div class="header-btns">
                <button class="action-btn preview-btn" onclick="previewReport()">👁️ Preview</button>
                <button class="action-btn print-btn" onclick="printReport()">🖨️ Print</button>
                <button class="action-btn excel-btn" onclick="exportToExcel()">📥 Excel</button>
            </div>
        </div>

        <div class="table-container">
            <table id="reportTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
                <tfoot id="tableFoot"></tfoot>
            </table>
        </div>
    </div>
</div>

<!-- Existing Preview Modal -->
<div id="previewModal" class="overlay-modal">
    <div class="modal-content">
        <div class="modal-header no-print">
            <button class="action-btn excel-btn" onclick="exportToExcel()">📥 Download Excel</button>
            <button class="action-btn print-btn" onclick="window.print()">🖨️ Print Report</button>
            <button class="close-btn" onclick="closePreviewModal()">Close ✕</button>
        </div>
        <div class="modal-body" id="previewContent"></div>
    </div>
</div>

<script>
var currentTab = 'PartyOrders';

function cleanDesignName(str) {
    return str ? str.toString().replace('#', '').trim().toLowerCase() : '';
}

function loadDesignFilter() {
    let allDesigns = new Set();
    
    let preDesigns = JSON.parse(localStorage.getItem('pre_design_numbers')) || [];
    preDesigns.forEach(d => allDesigns.add(d));

    let orders = JSON.parse(localStorage.getItem('party_orders_data')) || [];
    orders.forEach(o => { if(o.designNumber || o.designNo) allDesigns.add(o.designNumber || o.designNo); });

    let select = document.getElementById('designFilter');
    let html = '<option value="All">All Designs (மொத்தம்)</option>';
    
    [...allDesigns].forEach(function(d) {
        html += `<option value="${d}">${d}</option>`;
    });
    select.innerHTML = html;
}

window.addEventListener('DOMContentLoaded', () => {
    loadDesignFilter();
    
    const urlParams = new URLSearchParams(window.location.search);
    const tabParam = urlParams.get('tab');
    if(tabParam) {
        if(tabParam === 'order' || tabParam === 'PartyOrders') currentTab = 'PartyOrders';
        else if(tabParam === 'Weaving') currentTab = 'Weaving';
        else if(tabParam === 'Dyeing') currentTab = 'Dyeing';
        else if(tabParam === 'Warping') currentTab = 'Warping';
        else if(tabParam === 'Washing') currentTab = 'Washing';
        else if(tabParam === 'Despatch') currentTab = 'PartyOrders';
        else if(tabParam === 'Invoice') currentTab = 'Invoice';
    }
    
    switchTab(currentTab);
});

function switchTab(tabName) {
    currentTab = tabName;
    document.querySelectorAll('.tab-btn, .invoice-tab-btn').forEach(btn => btn.classList.remove('active'));
    
    let activeBtn = document.getElementById('tab-' + tabName);
    if(activeBtn) activeBtn.classList.add('active');

    let filterVal = document.getElementById('designFilter').value;
    let titleElem = document.getElementById('reportTitle');
    let head = document.getElementById('tableHead');
    let body = document.getElementById('tableBody');
    let foot = document.getElementById('tableFoot');

    head.innerHTML = '';
    body.innerHTML = '';
    foot.innerHTML = '';

    if (tabName === 'PartyOrders') {
        titleElem.innerText = "📦 PARTY ORDERS Report";
        head.innerHTML = `<tr><th>Date</th><th>Party Name</th><th>Design No</th><th>Meters</th><th>PO No</th></tr>`;
        
        let rawData = JSON.parse(localStorage.getItem('party_orders_data')) || [];
        let mappedData = rawData.map(item => ({
            date: item.date || '-',
            partyName: item.partyName || '-',
            designNo: item.designNumber || item.designNo || '-',
            meters: item.orderMtr || item.meters || '-',
            poles: item.poNo || '-'
        }));
        
        renderGenericTable(mappedData, filterVal, ['date', 'partyName', 'designNo', 'meters', 'poles']);
    } 
    else if (tabName === 'KoraStock') {
        titleElem.innerText = "🧵 KORA YARN STOCK Report";
        head.innerHTML = `<tr><th>Design No</th><th>Count</th><th>Total Inward (Kg)</th><th>Total Issued (Kg)</th><th>Balance (Kg)</th></tr>`;
        
        let inwards = JSON.parse(localStorage.getItem('kora_stock_records')) || [];
        let issues = JSON.parse(localStorage.getItem('kora_issue_records')) || [];

        let designStockMap = new Map();

        issues.forEach(item => {
            let dNo = item.designNo || 'Unknown';
            let cnt = item.count ? item.count.trim() : 'Unknown';
            let key = cleanDesignName(dNo) + "_" + cnt.toLowerCase();

            if(!designStockMap.has(key)) {
                designStockMap.set(key, {
                    designNo: dNo,
                    count: cnt,
                    issuedWt: 0
                });
            }
            designStockMap.get(key).issuedWt += parseFloat(item.issueWt) || 0;
        });

        let stockList = [];
        designStockMap.forEach((val) => {
            let inwardForCount = inwards.filter(i => (i.count || '').trim().toLowerCase() === val.count.toLowerCase()).reduce((s, x) => s + (parseFloat(x.weight) || 0), 0);
            let bal = inwardForCount - val.issuedWt;

            stockList.push({
                designNo: val.designNo,
                count: val.count,
                inwardWt: inwardForCount,
                issuedWt: val.issuedWt,
                balance: bal
            });
        });

        renderDesignStockTable(stockList, filterVal);
    } 
    else if (tabName === 'Dyeing') {
        titleElem.innerText = "🎨 DYEING Report";
        head.innerHTML = `<tr><th>Dyeing Unit</th><th>Design No</th><th>Kora Issue (Kg)</th><th>Dyeing Rcvd (Kg)</th><th>Bal / Ex (Kg)</th></tr>`;
        
        let koraIssues = JSON.parse(localStorage.getItem('kora_issue_records')) || [];
        let dyeingIssues = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
        
        let unitDesignMap = new Map();

        dyeingIssues.forEach(iss => {
            let unitName = (iss.unit || iss.dyeingName || 'Unknown').trim();
            let designNo = iss.designNo || '-';
            let key = unitName.toLowerCase() + "_" + cleanDesignName(designNo);

            if (!unitDesignMap.has(key)) {
                unitDesignMap.set(key, {
                    unit: unitName,
                    designNo: designNo,
                    koraWt: 0,
                    dyeingWt: 0
                });
            }
            unitDesignMap.get(key).dyeingWt += parseFloat(iss.issueWt) || 0;
        });

        koraIssues.forEach(k => {
            let unitName = (k.dyeingName || k.unit || 'Unknown').trim();
            let designNo = k.designNo || '-';
            let key = unitName.toLowerCase() + "_" + cleanDesignName(designNo);

            if (!unitDesignMap.has(key)) {
                unitDesignMap.set(key, {
                    unit: unitName,
                    designNo: designNo,
                    koraWt: 0,
                    dyeingWt: 0
                });
            }
            unitDesignMap.get(key).koraWt += parseFloat(k.issueWt) || 0;
        });

        let mergedList = [];
        unitDesignMap.forEach((val) => {
            let diff = val.koraWt - val.dyeingWt;
            mergedList.push({
                unit: val.unit,
                designNo: val.designNo,
                koraIssueWt: val.koraWt,
                dyeingIssueWt: val.dyeingWt,
                diffVal: diff
            });
        });

        renderDyeingReportTable(mergedList, filterVal);
    }
    else if (tabName === 'Warping') {
        titleElem.innerText = "📐 WARPING Report";
        head.innerHTML = `<tr><th>Date</th><th>Unit</th><th>Design No</th><th>Count</th><th>Colour</th><th>Issued Wt</th><th>Rcvd Wt</th><th>Excess</th></tr>`;
        
        let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
        let receives = JSON.parse(localStorage.getItem('warping_receive_records')) || [];
        
        let merged = issues.map(iss => {
            let rec = receives.find(r => r.issueId == iss.id) || {};
            return {
                date: iss.date || rec.botDate || '-',
                unit: iss.unit || '-',
                designNo: iss.designNo || '-',
                count: iss.count || '-',
                color: iss.color || '-',
                issuedWt: iss.issueWt || '-',
                receivedWt: rec.receivedWt || 'Pending',
                excessWt: rec.excessWt && rec.excessWt !== '-' ? rec.excessWt : '0.000'
            };
        });
        renderGenericTable(merged, filterVal, ['date', 'unit', 'designNo', 'count', 'color', 'issuedWt', 'receivedWt', 'excessWt']);
    } 
    else if (tabName === 'Weaving') {
        titleElem.innerText = "🏭 WEAVING PRODUCTION Report";
        head.innerHTML = `<tr><th>Date</th><th>Weaver</th><th>Design No</th><th>Order Mtrs</th><th>Items Count</th></tr>`;
        
        let rawData = JSON.parse(localStorage.getItem('weaving_master_data')) || [];
        let mappedData = rawData.map(item => {
            let totalItems = (item.warpRows ? item.warpRows.length : 0) + (item.weftRows ? item.weftRows.length : 0);
            return {
                date: item.date || '-',
                weaver: item.weaverName || '-',
                designNo: item.designNo || '-',
                mtrs: item.weavingMts || '-',
                items: totalItems + " Yarns"
            };
        });
        
        renderGenericTable(mappedData, filterVal, ['date', 'weaver', 'designNo', 'mtrs', 'items']);
    } 
    else if (tabName === 'Washing') {
        titleElem.innerText = "🌊 WASHING Report";
        head.innerHTML = `<tr><th>Date</th><th>Unit</th><th>Design No</th><th>Slip</th><th>Piece</th><th>Sent Mtr</th><th>Rcvd Mtr</th><th>Shrink %</th></tr>`;
        
        let issues = JSON.parse(localStorage.getItem('washing_issue_records')) || [];
        let receives = JSON.parse(localStorage.getItem('washing_receive_records')) || [];
        
        let merged = issues.map(iss => {
            let rec = receives.find(r => r.issueId == iss.id) || {};
            return {
                date: iss.date || rec.botDate || '-',
                unit: iss.unit || '-',
                designNo: iss.designNo || '-',
                slip: iss.slip || '-',
                piece: iss.piece || '-',
                sentMtr: iss.mtr || '-',
                rcvdMtr: rec.receivedMtr || 'Pending',
                shrink: rec.shrinkagePerc || '-'
            };
        });
        
        renderGenericTable(merged, filterVal, ['date', 'unit', 'designNo', 'slip', 'piece', 'sentMtr', 'rcvdMtr', 'shrink']);
    }
    else if (tabName === 'Invoice') {
        titleElem.innerText = "📄 INVOICE / BILLING Report";
        head.innerHTML = `<tr><th>Inv No</th><th>Date</th><th>Party Name</th><th>Design No</th><th>Total Qty</th><th>Grand Total (₹)</th></tr>`;
        
        let rawData = JSON.parse(localStorage.getItem('saved_invoices_data')) || [];
        let mappedData = rawData.map(item => ({
            invNo: item.invNo || '-',
            date: item.invDate || '-',
            partyName: item.partyAddress ? item.partyAddress.split('\n')[0] : '-',
            designNo: item.design || '-',
            meters: item.totalQty ? item.totalQty.toFixed(2) : '0.00',
            amount: item.grandTotal ? item.grandTotal.toFixed(2) : '0.00'
        }));

        renderGenericTable(mappedData, filterVal, ['invNo', 'date', 'partyName', 'designNo', 'meters', 'amount']);
    }
}

function renderDesignStockTable(stockList, filterVal) {
    let body = document.getElementById('tableBody');
    let foot = document.getElementById('tableFoot');
    body.innerHTML = ''; foot.innerHTML = '';
    if (!stockList || stockList.length === 0) {
        body.innerHTML = `<tr><td colspan="5" class="no-data">No Kora stock issue records found.</td></tr>`;
        return;
    }
    let filtered = stockList;
    if (filterVal !== 'All') filtered = stockList.filter(item => cleanDesignName(item.designNo) === cleanDesignName(filterVal));
    if (filtered.length === 0) {
        body.innerHTML = `<tr><td colspan="5" class="no-data">No records found for design: <b>${filterVal}</b></td></tr>`;
        return;
    }
    let grandInward = 0; let grandIssued = 0;
    filtered.forEach(item => {
        grandInward += item.inwardWt; grandIssued += item.issuedWt;
        let balDisplay = item.balance >= 0 ? `<span class="bal-positive">${item.balance.toFixed(3)}</span>` : `<span class="bal-negative">${item.balance.toFixed(3)}</span>`;
        body.innerHTML += `<tr><td><b>${item.designNo}</b></td><td>${item.count}</td><td>${item.inwardWt.toFixed(3)}</td><td>${item.issuedWt.toFixed(3)}</td><td>${balDisplay}</td></tr>`;
    });
    let grandBal = grandInward - grandIssued;
    let grandBalDisplay = grandBal >= 0 ? `<span class="bal-positive">${grandBal.toFixed(3)}</span>` : `<span class="bal-negative">${grandBal.toFixed(3)}</span>`;
    foot.innerHTML = `<tr><td colspan="2" style="text-align: right; padding: 12px;">Grand Total:</td><td><b>${grandInward.toFixed(3)}</b></td><td><b>${grandIssued.toFixed(3)}</b></td><td><b>${grandBalDisplay}</b></td></tr>`;
}

function renderDyeingReportTable(dataList, filterVal) {
    let body = document.getElementById('tableBody');
    let foot = document.getElementById('tableFoot');
    body.innerHTML = ''; foot.innerHTML = '';
    if (!dataList || dataList.length === 0) {
        body.innerHTML = `<tr><td colspan="5" class="no-data">No dyeing records found.</td></tr>`;
        return;
    }
    let filtered = dataList;
    if (filterVal !== 'All') filtered = dataList.filter(item => cleanDesignName(item.designNo) === cleanDesignName(filterVal));
    if (filtered.length === 0) {
        body.innerHTML = `<tr><td colspan="5" class="no-data">No records found for design: <b>${filterVal}</b></td></tr>`;
        return;
    }
    let grandKoraWt = 0; let grandDyeingWt = 0;
    filtered.forEach(item => {
        grandKoraWt += item.koraIssueWt; grandDyeingWt += item.dyeingIssueWt;
        let diff = item.koraIssueWt - item.dyeingIssueWt;
        let diffDisplay = diff > 0 ? `<span class="bal-positive">Bal: +${diff.toFixed(3)}</span>` : (diff < 0 ? `<span class="bal-negative">Ex: ${diff.toFixed(3)}</span>` : `<span style="color:#10B981; font-weight:800;">Settled</span>`);
        body.innerHTML += `<tr><td><b>${item.unit}</b></td><td>${item.designNo}</td><td>${item.koraIssueWt.toFixed(3)}</td><td>${item.dyeingIssueWt.toFixed(3)}</td><td>${diffDisplay}</td></tr>`;
    });
    let grandDiff = grandKoraWt - grandDyeingWt;
    let grandDiffDisplay = grandDiff > 0 ? `<span class="bal-positive">Bal: +${grandDiff.toFixed(3)}</span>` : (grandDiff < 0 ? `<span class="bal-negative">Ex: ${grandDiff.toFixed(3)}</span>` : `<span style="color:#10B981; font-weight:800;">Settled</span>`);
    foot.innerHTML = `<tr><td colspan="2" style="text-align: right; padding: 12px;">Grand Total:</td><td><b>${grandKoraWt.toFixed(3)}</b></td><td><b>${grandDyeingWt.toFixed(3)}</b></td><td><b>${grandDiffDisplay}</b></td></tr>`;
}

function renderGenericTable(dataList, filterVal, keys) {
    let body = document.getElementById('tableBody');
    body.innerHTML = '';
    if (!dataList || dataList.length === 0) {
        body.innerHTML = `<tr><td colspan="${keys.length}" class="no-data">No records found for this module.</td></tr>`;
        return;
    }
    let filtered = dataList;
    if (filterVal !== 'All') filtered = dataList.filter(item => cleanDesignName(item.designNo) === cleanDesignName(filterVal));
    if (filtered.length === 0) {
        body.innerHTML = `<tr><td colspan="${keys.length}" class="no-data">No records found for design: <b>${filterVal}</b></td></tr>`;
        return;
    }
    filtered.slice().reverse().forEach(item => {
        let rowHtml = '<tr>';
        keys.forEach(k => {
            let val = item[k] !== undefined && item[k] !== '' ? item[k] : '-';
            if (val === 'Pending') val = `<span class="pending-txt">Pending</span>`;
            if (k === 'designNo') val = `<b>${val}</b>`;
            if (k === 'amount') val = `<b>₹${val}</b>`;
            rowHtml += `<td>${val}</td>`;
        });
        rowHtml += '</tr>';
        body.innerHTML += rowHtml;
    });
}

function previewReport() {
    let title = document.getElementById('reportTitle').innerText;
    let filterVal = document.getElementById('designFilter').value;
    let tableHtml = document.getElementById('reportTable').outerHTML;
    
    let html = `<div style="text-align: center; margin-bottom: 25px; border-bottom: 2px solid #E2E8E2; padding-bottom: 15px;">`;
    html += `<h2 style='color: #2F4F38; font-family: sans-serif; margin-bottom: 5px; font-size:20px; font-weight:800; text-transform:uppercase;'>${title}</h2>`;
    html += `<p style='font-family: sans-serif; font-size: 13px; margin-top: 0; color:#4A554A;'><b>Filter Applied:</b> ${filterVal}</p>`;
    html += `</div>`;
    
    html += `<div id="printTableWrapper" style="color: #1E2B23;">${tableHtml}</div>`;
    
    document.getElementById('previewContent').innerHTML = html;
    
    let previewTable = document.getElementById('previewContent').querySelector('table');
    if(previewTable) {
        previewTable.style.width = '100%';
        previewTable.style.borderCollapse = 'collapse';
        previewTable.style.color = '#1E2B23';
        previewTable.style.fontFamily = 'sans-serif';
        previewTable.style.fontSize = '12px';
        
        let ths = previewTable.querySelectorAll('th');
        ths.forEach(th => {
            th.style.border = '1px solid #D1DED1';
            th.style.padding = '10px';
            th.style.background = '#EAF0EA';
            th.style.color = '#2F4F38';
            th.style.fontWeight = 'bold';
            th.style.textTransform = 'uppercase';
        });
        
        let tds = previewTable.querySelectorAll('td');
        tds.forEach(td => {
            td.style.border = '1px solid #E2E8E2';
            td.style.padding = '10px';
            td.style.color = '#1E2B23';
        });

        let tfoots = previewTable.querySelectorAll('tfoot td');
        tfoots.forEach(td => {
            td.style.background = '#F4F7F4';
            td.style.fontWeight = 'bold';
            td.style.borderTop = '2px solid #4A7C59';
        });
    }

    let modal = document.getElementById('previewModal');
    modal.style.display = 'flex';
    setTimeout(() => modal.classList.add('show'), 10);
}

function closePreviewModal() {
    let modal = document.getElementById('previewModal');
    modal.classList.remove('show');
    setTimeout(() => modal.style.display = 'none', 300);
}

function printReport() {
    if(document.getElementById('previewModal').style.display !== 'flex') {
        previewReport();
    }
    setTimeout(() => { window.print(); }, 300);
}

function exportToExcel() {
    let table = document.getElementById('reportTable');
    let html = table.outerHTML;
    let url = 'data:application/vnd.ms-excel,' + encodeURIComponent(html);
    let link = document.createElement('a');
    link.href = url;
    link.download = currentTab + '_Report.xls';
    link.click();
}
