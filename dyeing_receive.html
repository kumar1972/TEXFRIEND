<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dyeing Receive - TEXFRIEND</title>
<script src="translator.js"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    /* 📌 Smart Background - STRICTLY NO BLACK */
    html, body { 
        width: 100%; 
        min-height: 100vh; 
        background: #030712; 
        color: #1E2B23; 
    }

    body { 
        padding: 12px; 
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* 📌 Main Container */
    .main-card {
        width: 100%;
        max-width: 900px;
        margin: 0;
        background: #FFFFFF;
        border: 1px solid rgba(82, 110, 81, 0.15);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 35px rgba(30, 43, 35, 0.06);
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .top-nav { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 5px; 
    }

    /* 📌 Smart Back Button */
    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #FFFFFF;
        text-decoration: none;
        font-weight: 600;
        font-size: 11px;
        background: #1A2421; 
        padding: 8px 16px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        transition: all 0.3s ease;
    }
    .back-btn:hover { background: #000000; transform: translateY(-2px); }

    /* Checkbox Styling for Top Right */
    .completed-checkbox {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #D8DFD6;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid rgba(82, 110, 81, 0.4);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .completed-checkbox input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #526E51;
        margin: 0;
        padding: 0;
        border: none;
    }
    
    .completed-checkbox label {
        margin: 0;
        color: #3F5A3E;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
    }

    #bitmapDisplayContainer {
        text-align: right;
    }
    #bitmapDisplayContainer img {
        max-height: 40px;
        border-radius: 4px;
        border: 1px solid rgba(82, 110, 81, 0.4);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        cursor: zoom-in;
        transition: transform 0.2s;
    }
    #bitmapDisplayContainer img:hover { transform: scale(1.1); }

    .card-header {
        font-size: 16px;
        margin-bottom: 5px;
        font-weight: 700;
        color: #2F4F38;
        text-align: left;
        position: relative;
        padding-left: 12px;
    }
    .card-header::before {
        content: ''; position: absolute; left: 0; top: 10%; height: 80%; width: 4px;
        background: #4A7C59; border-radius: 4px;
    }

    /* 📌 Smart Sectioning */
    .form-section {
        background: #F8FAF8;
        border: 1px solid #E2E8E2;
        border-radius: 14px;
        padding: 20px 15px 15px 15px;
        margin-bottom: 5px;
        position: relative;
    }
    
    .section-badge {
        position: absolute;
        top: -12px;
        left: 15px;
        background: #4A7C59;
        color: #FFF;
        font-size: 10px;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 12px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        box-shadow: 0 4px 8px rgba(74, 124, 89, 0.25);
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 12px;
    }

    .form-group label {
        font-size: 10px;
        font-weight: 600;
        color: #4A554A;
        white-space: nowrap;
    }

    /* 📌 Smart 3D Inputs */
    input, select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #D1DED1;
        background: #FFFFFF;
        color: #1E2B23;
        font-size: 11px;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 4px rgba(30, 43, 35, 0.02);
    }

    input:focus, select:focus {
        border-color: #4A7C59;
        outline: none;
        background: #FFFFFF;
        box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.15);
    }

    input[readonly] { background: #F4F7F4; color: #4A7C59; border: 1px solid #D1DED1; }

    /* Custom Checkbox Container */
    .checkbox-container {
        background: #FFFFFF; padding: 12px 15px; border-radius: 10px; 
        margin-bottom: 15px; display: flex; align-items: center; 
        justify-content: space-between; border: 1px dashed #A0AFA0;
    }

    /* 📌 Single Container Grid */
    .receive-grid-header {
        display: grid;
        grid-template-columns: 0.8fr 1fr 1.3fr 0.9fr 1fr 0.9fr 0.8fr 0.9fr;
        gap: 6px;
        padding: 0 4px;
        margin-bottom: 8px;
    }
    .receive-grid-header div {
        font-size: 10px;
        font-weight: 700;
        color: #4A7C59;
        text-align: center;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .receive-line-row {
        display: grid;
        grid-template-columns: 0.8fr 1fr 1.3fr 0.9fr 1fr 0.9fr 0.8fr 0.9fr;
        gap: 6px;
        align-items: center;
        margin-bottom: 10px;
    }
    .receive-line-row input {
        padding: 10px 4px;
        font-size: 11px;
        text-align: center;
    }

    /* 📌 Smart Buttons */
    .btn-main {
        width: 100%;
        padding: 14px;
        margin: 10px 0 0 0;
        border: none;
        border-radius: 10px;
        color: white;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        background: linear-gradient(135deg, #4A7C59, #33593D);
        box-shadow: 0 6px 15px rgba(74, 124, 89, 0.25);
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(74, 124, 89, 0.35); }
    .btn-main:active { transform: translateY(1px); }

    .popup-trigger-btn {
        background: linear-gradient(135deg, #3B82F6, #1D4ED8);
        color: white; border: none; padding: 14px; border-radius: 10px;
        font-size: 13px; font-weight: bold; cursor: pointer; width: 100%;
        box-shadow: 0 6px 15px rgba(59, 130, 246, 0.25);
        transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 5px;
    }
    .popup-trigger-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35); }
    .popup-trigger-btn:active { transform: translateY(1px); }

    /* 📌 Advanced Pop-up Modal Styling */
    .overlay-modal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(18, 25, 20, 0.85); backdrop-filter: blur(4px);
        z-index: 99999; flex-direction: column; padding: 15px; opacity: 0; transition: opacity 0.3s ease;
    }
    .overlay-modal.show { opacity: 1; }
    
    .modal-content {
        background: #FFFFFF; width: 100%; height: 100%; border-radius: 16px;
        display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        overflow: hidden; transform: scale(0.95); transition: transform 0.3s ease;
    }
    .overlay-modal.show .modal-content { transform: scale(1); }

    .modal-header {
        padding: 15px 20px; background: #F4F7F4; display: flex;
        justify-content: space-between; align-items: center; border-bottom: 1px solid #E2E8E2;
    }
    .modal-header h3 { margin: 0; font-size: 15px; color: #1E2B23; font-weight: 700; }
    .close-btn {
        background: #FEE2E2; color: #DC2626; border: none; padding: 8px 14px;
        border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px;
        transition: all 0.2s ease;
    }
    .close-btn:hover { background: #FECACA; transform: scale(1.05); }

    .modal-body { padding: 15px; overflow-y: auto; flex: 1; background: #FAFCFA; }

    /* 📌 Fullscreen Image Popup Modal */
    .fullscreen-modal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.9); z-index: 999999; justify-content: center; align-items: center;
        padding: 20px; flex-direction: column;
    }
    .fullscreen-modal img {
        max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 10px;
        box-shadow: 0 10px 30px rgba(255,255,255,0.2);
    }
    .close-fullscreen {
        position: absolute; top: 20px; right: 20px; background: #EF4444; color: white;
        border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 14px;
        cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* 📌 Advanced Table Design */
    .table-container {
        width: 100%; border-radius: 10px; overflow-x: auto;
        box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid #E2E8E2; background: #FFFFFF;
        -webkit-overflow-scrolling: touch;
    }
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; text-align: center; white-space: nowrap; }
    th, td { padding: 10px 12px; text-align: center; border-bottom: 1px solid #E2E8E2; color: #1E2B23; }
    th { background: #EAF0EA; color: #2F4F38; font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; position: sticky; top: 0; z-index: 10; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #F8FAF8; }
    tfoot td { background: #F4F7F4; color: #2F4F38; font-weight: 700; border-top: 2px solid #D1DED1; position: sticky; bottom: 0; z-index: 10; }
    
    .action-btns { display: flex; gap: 6px; justify-content: center; }
    .edit-action-btn { background: #64748B; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 10px; transition: all 0.2s; }
    .edit-action-btn:hover { background: #475569; }
    .del-action-btn { background: #EF4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 10px; transition: all 0.2s ease; }
    .del-action-btn:hover { background: #DC2626; box-shadow: 0 2px 5px rgba(220, 38, 38, 0.3); }

    .excess-text { color: #DC2626; font-weight: 700; }

    /* Action buttons in modal */
    .action-complete { background: #526E51; color: white; border: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 9px; font-weight: bold; }
    .action-running { background: #D97706; color: white; border: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 9px; font-weight: bold; }
</style>
</head>
<body>

<div class="main-card">
    <div class="top-nav">
        <a href="dashboard.html" class="back-btn">← Back to Menu</a>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="completed-checkbox">
                <input type="checkbox" id="top_completed_status" onchange="quickCompleteToggle()">
                <label for="top_completed_status">Completed</label>
            </div>
            <div id="bitmapDisplayContainer"></div>
        </div>
    </div>

    <h2 class="card-header">Dyeing Colour Received</h2>

    <!-- 📌 Section: Receive Info -->
    <div class="form-section" style="margin-top: 10px;">
        <div class="section-badge">Receive Info</div>
        <div class="form-grid">
            <div class="form-group">
                <label>Received Date</label>
                <input type="date" id="receiveDate">
            </div>
            <div class="form-group">
                <label>Select Design Number</label>
                <select id="designNumber" onchange="loadPendingItems()">
                    <option value="">Select Design No</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 📌 Section: Yarn Details -->
    <div class="form-section" style="background: transparent; border: none; padding: 0;">
        <div class="section-badge" style="top: -15px; left: 0;">Receiving Items</div>
        
        <div class="checkbox-container" style="margin-top: 20px;">
            <label for="combineToggle" style="font-size: 11px; font-weight: 700; color: #4A7C59; cursor: pointer; margin:0;">🔗 Combine Same Count, Colour & Unit</label>
            <input type="checkbox" id="combineToggle" checked onchange="loadPendingItems()" style="width: 18px; height: 18px; accent-color: #4A7C59; cursor: pointer;">
        </div>

        <!-- 📌 Dynamic Grid Container -->
        <div id="receiveLinesContainer">
            <!-- Items dynamically added here -->
        </div>
    </div>

    <button class="btn-main" id="saveReceiveBtnTxt" onclick="saveReceiveEntry()">✅ Save Received Entry</button>

    <!-- 📌 Popup Trigger Button -->
    <button class="popup-trigger-btn" onclick="openModal('receivedListModal')">📊 View Received Records</button>
</div>

<!-- Full-Screen Pop-up Modal for Received Records List -->
<div id="receivedListModal" class="overlay-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📊 Received & Loss Records</h3>
            <button class="close-btn" onclick="closeModal('receivedListModal')">Close ✕</button>
        </div>
        <div class="modal-body">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Design</th>
                            <th>Count</th>
                            <th>Colour</th>
                            <th>Dyeing Unit</th>
                            <th>Issued Wt</th>
                            <th>Rcvd Wt</th>
                            <th>Loss Wt</th>
                            <th>Loss %</th>
                            <th>Excess Wt</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="receivedListBody">
                        <!-- Records go here -->
                    </tbody>
                    <tfoot id="receivedListFoot">
                        <!-- Grand Total goes here -->
                    </tfoot>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 📌 Fullscreen Image Popup Modal -->
<div id="fullscreenModal" class="fullscreen-modal" onclick="closeFullscreenImage()">
    <button class="close-fullscreen">Close ✕</button>
    <img id="fullscreenImg" src="" alt="Fullscreen Preview">
</div>

<script>
function checkUserPermission() {
    let userRole = localStorage.getItem('erp_logged_role') || localStorage.getItem('user_role');
    if (userRole !== 'Administrator' && userRole !== 'Admin') {
        let permissions = JSON.parse(localStorage.getItem('user_permissions') || '{}');
        if (permissions['dyeing_receive.html'] === false || permissions['dyeing_receive'] === false) return false;
    }
    return true;
}

document.addEventListener('DOMContentLoaded', function() {
    if (!checkUserPermission()) {
        alert("Access Denied! You do not have permission to access this page. ❌");
        window.location.href = "dashboard.html";
        return;
    }
    document.getElementById('receiveDate').valueAsDate = new Date();
    loadPendingDesigns();
});

function openModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.style.display = 'flex';
    setTimeout(() => modal.classList.add('show'), 10);
    if(modalId === 'receivedListModal') {
        renderReceivedList();
    }
}

function closeModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.classList.remove('show');
    setTimeout(() => modal.style.display = 'none', 300);
}

// 📌 Fullscreen Image Popup Controls
window.openFullscreenImage = function(src) {
    if(!src || src === '' || src === 'null') return;
    document.getElementById('fullscreenImg').src = src;
    document.getElementById('fullscreenModal').style.display = 'flex';
}
window.closeFullscreenImage = function() {
    document.getElementById('fullscreenModal').style.display = 'none';
}

function cleanDesignName(str) {
    return str ? str.toString().replace('#', '').trim().toLowerCase() : '';
}

function loadBitmapImage() {
    let activeDesign = document.getElementById('designNumber').value || localStorage.getItem('selected_design_number');
    let designSpecs = JSON.parse(localStorage.getItem('design_specs') || '{}');
    let bitmapContainer = document.getElementById('bitmapDisplayContainer');
    
    let clean = activeDesign ? activeDesign.toString().replace('#', '').trim().toLowerCase() : '';
    let specKey = Object.keys(designSpecs).find(k => (k ? k.toString().replace('#', '').trim().toLowerCase() : '') === clean) || activeDesign;

    if (activeDesign && designSpecs[specKey] && designSpecs[specKey].bitmap) {
        let b64 = designSpecs[specKey].bitmap;
        bitmapContainer.innerHTML = `<img src="${b64}" alt="Design Bitmap" onclick="openFullscreenImage('${b64}')" title="Click to view full screen">`;
    } else {
        bitmapContainer.innerHTML = '';
    }
}

function loadPendingDesigns() {
    loadBitmapImage();
    let preDesignList = JSON.parse(localStorage.getItem('pre_design_numbers')) || [];
    let designMasters = JSON.parse(localStorage.getItem('design_masters_data')) || [];
    let designSpecs = JSON.parse(localStorage.getItem('design_specs')) || {};
    let issueRecords = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];

    let allDesigns = new Set();
    
    preDesignList.forEach(d => allDesigns.add(d));
    designMasters.forEach(d => allDesigns.add(d.name));
    Object.keys(designSpecs).forEach(d => allDesigns.add(d));
    
    issueRecords.forEach(r => {
        let d = r.designNo || r.designNumber || r.design || r.name || "";
        if (d.trim() !== "") allDesigns.add(d.trim());
    });

    let select = document.getElementById('designNumber');
    let html = '<option value="">Select Design No</option>';
    
    [...allDesigns].forEach(function(d) {
        if(d) html += '<option value="' + d + '">' + d + '</option>';
    });
    select.innerHTML = html;

    let activeDesign = localStorage.getItem('selected_design_number');
    if(activeDesign && allDesigns.has(activeDesign)) {
        select.value = activeDesign;
        loadPendingItems();
    }
}

function loadPendingItems() {
    loadBitmapImage();
    renderReceivedList(); 
    let dNoInput = document.getElementById('designNumber').value;
    let container = document.getElementById('receiveLinesContainer');
    container.innerHTML = '';

    if(!dNoInput) return;

    let designSpecs = JSON.parse(localStorage.getItem('design_specs') || '{}');
    let cleanKey = dNoInput ? dNoInput.toString().replace('#', '').trim().toLowerCase() : '';
    let specKey = Object.keys(designSpecs).find(k => (k ? k.toString().replace('#', '').trim().toLowerCase() : '') === cleanKey) || dNoInput;

    let specStatus = (designSpecs[specKey] && designSpecs[specKey].status) ? designSpecs[specKey].status.toLowerCase() : '';
    let receives = JSON.parse(localStorage.getItem('dyeing_receive_records')) || [];
    let rec = receives.find(r => cleanDesignName(r.designNo || r.designNumber) === cleanKey);

    if(specStatus === 'completed' || (rec && rec.status && rec.status.toLowerCase() === 'completed')) {
        document.getElementById('top_completed_status').checked = true;
    } else {
        document.getElementById('top_completed_status').checked = false;
    }

    let issueRecords = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    
    let pendingItems = issueRecords.filter(r => {
        let stat = (r.status || "").toLowerCase().trim();
        let rDno = cleanDesignName(r.designNo || r.designNumber || r.design || r.name || "");
        return (stat !== 'received') && (rDno === cleanKey);
    });
    
    let isCombineChecked = document.getElementById('combineToggle').checked;

    if(pendingItems.length > 0) {
        let displayList = [];

        if (isCombineChecked) {
            let map = new Map();
            pendingItems.forEach(item => {
                let c = (item.count || item.yarnCount || '-').toString().toLowerCase().trim();
                let col = (item.color || item.colour || '-').toString().toLowerCase().trim();
                let u = (item.unit || item.dyeingName || '-').toString().toLowerCase().trim();
                
                let key = c + '_' + col + '_' + u;
                if (!map.has(key)) {
                    map.set(key, {
                        count: item.count || item.yarnCount || '-',
                        color: item.color || item.colour || '-',
                        unit: item.unit || item.dyeingName || '-',
                        issueWt: 0,
                        ids: []
                    });
                }
                let obj = map.get(key);
                obj.issueWt += parseFloat(item.issueWt || item.weight || item.wt) || 0;
                obj.ids.push(item.id);
            });
            displayList = Array.from(map.values());
        } else {
            displayList = pendingItems.map(item => ({
                count: item.count || item.yarnCount || '-',
                color: item.color || item.colour || '-',
                unit: item.unit || item.dyeingName || '-',
                issueWt: parseFloat(item.issueWt || item.weight || item.wt) || 0,
                ids: [item.id]
            }));
        }

        let gridHtml = `
            <div style="overflow-x: auto; background: #FFFFFF; padding: 15px; border-radius: 10px; border: 1px solid #D1DED1;">
                <div style="min-width: 650px;">
                    <div class="receive-grid-header">
                        <div>Count</div>
                        <div>Colour</div>
                        <div>Dyeing Unit</div>
                        <div>Iss Wt</div>
                        <div>Rcvd Wt</div>
                        <div>Loss Wt</div>
                        <div>Loss %</div>
                        <div>Excess</div>
                    </div>
        `;

        displayList.forEach(item => {
            gridHtml += `
                <div class="receive-line-row" data-ids="${item.ids.join(',')}" data-unit="${item.unit}">
                    <input type="text" class="inp-count" value="${item.count}" readonly>
                    <input type="text" class="inp-color" value="${item.color}" readonly>
                    <input type="text" class="inp-unit" value="${item.unit}" readonly>
                    <input type="text" class="inp-issued" value="${item.issueWt.toFixed(3)}" readonly>
                    <input type="number" class="inp-received" placeholder="Wt" oninput="calculateLoss(this)">
                    <input type="text" class="inp-loss-wt" placeholder="0.00" readonly style="color:#D97706; font-weight:bold;">
                    <input type="text" class="inp-loss-perc" placeholder="0%" readonly>
                    <input type="text" class="inp-excess-wt" placeholder="-" readonly style="color:#10B981; font-weight:bold;">
                </div>
            `;
        });

        gridHtml += `</div></div>`;
        container.innerHTML = gridHtml;

    } else {
        container.innerHTML = `
            <div style="font-size:12px; text-align:center; padding:15px; color:#4A7C59; background:#FFFFFF; border-radius:10px; border:1px solid #D1DED1;">
                <b>No pending issues found for this Design!</b><br>
                <span style="font-size: 10px; color: #DC2626;">(Note: Make sure you have Issued the Yarn in "Dyeing Issue" page first)</span>
            </div>`;
    }
}

function calculateLoss(inp) {
    let row = inp.closest('.receive-line-row');
    let issuedWt = parseFloat(row.querySelector('.inp-issued').value) || 0;
    let receivedWt = parseFloat(inp.value) || 0;

    let lossWtInp = row.querySelector('.inp-loss-wt');
    let lossPercInp = row.querySelector('.inp-loss-perc');
    let excessWtInp = row.querySelector('.inp-excess-wt');

    if(receivedWt > 0 && receivedWt <= issuedWt) {
        let lossWt = issuedWt - receivedWt;
        let lossPerc = (lossWt / issuedWt) * 100;
        
        lossWtInp.value = lossWt.toFixed(3);
        lossPercInp.value = lossPerc.toFixed(2) + '%';
        
        if(lossPerc > 5) {
            let allowedLossWt = issuedWt * 0.05; 
            let excessWt = lossWt - allowedLossWt;
            
            excessWtInp.value = excessWt.toFixed(3);
            excessWtInp.style.color = "#DC2626"; // Red for excess
            excessWtInp.style.fontWeight = "bold";
        } else {
            excessWtInp.value = "-";
            excessWtInp.style.color = "#10B981"; // Green for safe
            excessWtInp.style.fontWeight = "bold";
        }
    } else if (receivedWt > issuedWt) {
        lossWtInp.value = "0.000";
        lossPercInp.value = "0.00%";
        excessWtInp.value = "-";
    } else {
        lossWtInp.value = "";
        lossPercInp.value = "";
        excessWtInp.value = "";
        excessWtInp.style.color = "#10B981";
    }
}

async function quickCompleteToggle() {
    if (!checkUserPermission()) {
        alert("Access Denied! You do not have permission. ❌");
        document.getElementById('top_completed_status').checked = !document.getElementById('top_completed_status').checked;
        return;
    }

    let dNo = document.getElementById('designNumber').value;
    let isCompleted = document.getElementById('top_completed_status').checked;

    if(!dNo) {
        alert("Mudhala Design Number select pannunga bro");
        document.getElementById('top_completed_status').checked = false;
        return;
    }

    let statusText = isCompleted ? 'completed' : 'running';
    let cleanDNo = cleanDesignName(dNo);

    let receives = JSON.parse(localStorage.getItem('dyeing_receive_records')) || [];
    let updated = false;

    receives.forEach(r => {
        if(cleanDesignName(r.designNo || r.designNumber) === cleanDNo) {
            r.status = statusText;
            updated = true;
        }
    });

    if(!updated) {
        let dateVal = document.getElementById('receiveDate').value || new Date().toISOString().split('T')[0];
        let firstRow = document.querySelector('.receive-line-row');
        let count = firstRow ? firstRow.querySelector('.inp-count').value : '20/s';
        let color = firstRow ? firstRow.querySelector('.inp-color').value : 'General';
        let unitName = firstRow ? firstRow.querySelector('.inp-unit').value : 'Main Unit';
        let issuedTotalWt = firstRow ? parseFloat(firstRow.querySelector('.inp-issued').value) || 0 : 0;
        let rcvWt = firstRow ? parseFloat(firstRow.querySelector('.inp-received').value) || 0 : 0;

        receives.push({
            id: Date.now(),
            issueIds: [],
            issueId: null,
            date: dateVal,
            unit: unitName,
            designNo: dNo,
            count: count,
            color: color,
            issuedWt: issuedTotalWt.toFixed(3),
            receivedWt: rcvWt.toFixed(3),
            lossWt: "0.000",
            lossPerc: "0.00%",
            excessWt: "-",
            status: statusText
        });
    }

    localStorage.setItem('dyeing_receive_records', JSON.stringify(receives));

    let designSpecs = JSON.parse(localStorage.getItem('design_specs')) || {};
    let specKey = Object.keys(designSpecs).find(k => cleanDesignName(k) === cleanDNo) || dNo;

    if(!designSpecs[specKey]) {
        designSpecs[specKey] = {};
    }
    designSpecs[specKey].status = statusText;
    localStorage.setItem('design_specs', JSON.stringify(designSpecs));

    try {
        if (window.firebaseSave) {
            await window.firebaseSave('dyeing_receive_records', receives);
            await window.firebaseSave('design_specs', designSpecs);
        }
        if (window.firebaseSaveIndividual) {
            await window.firebaseSaveIndividual(specKey, designSpecs[specKey]);
        }
    } catch(e) {
        console.error("Firebase Sync Error: ", e);
    }

    renderReceivedList();
    alert(`Design ${dNo} status '${isCompleted ? 'COMPLETED' : 'RUNNING'}' ah update aagiduchu ✅`);
}

// 📌 FIREBASE SYNC: saveReceiveEntry
async function saveReceiveEntry() {
    if (!checkUserPermission()) { alert("Access Denied! You do not have permission. ❌"); return; }

    let dateVal = document.getElementById('receiveDate').value;
    let dNo = document.getElementById('designNumber').value;
    let isCompleted = document.getElementById('top_completed_status').checked;

    if(!dNo) {
        alert("Please select a Design Number!");
        return;
    }

    let receives = JSON.parse(localStorage.getItem('dyeing_receive_records')) || [];
    let cleanDNo = cleanDesignName(dNo);

    let rows = document.querySelectorAll('#receiveLinesContainer .receive-line-row');
    if(rows.length === 0) return;

    let btn = document.getElementById('saveReceiveBtnTxt');
    let origText = btn.innerText;
    btn.innerText = "⏳ Saving to Cloud...";

    let issues = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    let savedCount = 0;

    rows.forEach(row => {
        let rcvWt = parseFloat(row.querySelector('.inp-received').value);
        
        if(rcvWt > 0) {
            let recIdsStr = row.getAttribute('data-ids');
            let recIds = recIdsStr ? recIdsStr.split(',') : [];
            let unitName = row.getAttribute('data-unit') || '-';
            
            let issuedTotalWt = parseFloat(row.querySelector('.inp-issued').value) || 0;
            let lossWt = parseFloat(row.querySelector('.inp-loss-wt').value) || 0;
            let lossPerc = row.querySelector('.inp-loss-perc').value || '0%';
            let excessVal = row.querySelector('.inp-excess-wt').value;
            let finalExcess = (excessVal && excessVal !== "-") ? parseFloat(excessVal).toFixed(3) : "-";

            receives.push({
                id: Date.now() + Math.random(),
                issueIds: recIds,
                issueId: recIds[0], 
                date: dateVal,
                unit: unitName,
                designNo: dNo,
                count: row.querySelector('.inp-count').value,
                color: row.querySelector('.inp-color').value,
                issuedWt: issuedTotalWt.toFixed(3),
                receivedWt: rcvWt.toFixed(3),
                lossWt: lossWt.toFixed(3),
                lossPerc: lossPerc,
                excessWt: finalExcess,
                status: isCompleted ? "completed" : "running"
            });

            recIds.forEach(id => {
                let issueIndex = issues.findIndex(r => String(r.id) === String(id));
                if(issueIndex !== -1) {
                    issues[issueIndex].status = "Received";
                }
            });
            savedCount++;
        }
    });

    if(savedCount > 0) {
        let designSpecs = JSON.parse(localStorage.getItem('design_specs')) || {};
        let specKey = Object.keys(designSpecs).find(k => cleanDesignName(k) === cleanDNo) || dNo;

        if(!designSpecs[specKey]) designSpecs[specKey] = {};
        designSpecs[specKey].status = isCompleted ? 'completed' : 'running';
        localStorage.setItem('design_specs', JSON.stringify(designSpecs));

        localStorage.setItem('dyeing_issue_records', JSON.stringify(issues));
        localStorage.setItem('dyeing_receive_records', JSON.stringify(receives));
        
        if (window.firebaseSave) {
            await window.firebaseSave('dyeing_issue_records', issues);
            await window.firebaseSave('dyeing_receive_records', receives);
            await window.firebaseSave('design_specs', designSpecs);
        }
        if (window.firebaseSaveIndividual) {
            await window.firebaseSaveIndividual(specKey, designSpecs[specKey]);
        }

        alert("Received Entry Saved to Cloud Successfully! ✅☁️");
        
        document.getElementById('receiveLinesContainer').innerHTML = '';
        document.getElementById('top_completed_status').checked = false; 
        loadPendingDesigns(); 
        renderReceivedList();
    } else {
        alert("Please enter Received Weight for at least one item.");
    }
    btn.innerText = origText;
}

async function toggleStatus(id, newStatus) {
    if (!checkUserPermission()) { alert("Access Denied! You do not have permission. ❌"); return; }
    let msg = newStatus === 'completed' ? "Change this receive entry to Completed?" : "Change this receive entry to Running?";
    if(confirm(msg)) {
        let records = JSON.parse(localStorage.getItem('dyeing_receive_records')) || [];
        let recIndex = records.findIndex(r => r.id == id);
        if(recIndex > -1) {
            records[recIndex].status = newStatus;
            localStorage.setItem('dyeing_receive_records', JSON.stringify(records));
            
            let dNo = records[recIndex].designNo;
            if(dNo) {
                let cleanDNo = cleanDesignName(dNo);
                let designSpecs = JSON.parse(localStorage.getItem('design_specs')) || {};
                let specKey = Object.keys(designSpecs).find(k => cleanDesignName(k) === cleanDNo) || dNo;

                if(!designSpecs[specKey]) designSpecs[specKey] = {};
                designSpecs[specKey].status = newStatus;
                localStorage.setItem('design_specs', JSON.stringify(designSpecs));
                
                if(window.firebaseSave) {
                    await window.firebaseSave('design_specs', designSpecs);
                }
                if(window.firebaseSaveIndividual) {
                    await window.firebaseSaveIndividual(specKey, designSpecs[specKey]);
                }
            }

            if(window.firebaseSave) {
                await window.firebaseSave('dyeing_receive_records', records);
            }
            renderReceivedList();
        }
    }
}

async function editReceiveRecord(recId) {
    if (!checkUserPermission()) { alert("Access Denied! You do not have permission. ❌"); return; }
    closeModal('receivedListModal');
    let receives = JSON.parse(localStorage.getItem('dyeing_receive_records')) || [];
    let issues = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    
    let index = receives.findIndex(r => r.id == recId);
    if(index !== -1) {
        let selectedRec = receives[index];
        document.getElementById('top_completed_status').checked = (selectedRec.status === 'completed');

        let batchRecords = receives.filter(r => 
            r.designNo === selectedRec.designNo && 
            r.date === selectedRec.date && 
            r.unit === selectedRec.unit
        );

        batchRecords.forEach(rec => {
            let targetIds = rec.issueIds || [rec.issueId];
            targetIds.forEach(id => {
                let issueIndex = issues.findIndex(iss => String(iss.id) === String(id));
                if(issueIndex !== -1) {
                    issues[issueIndex].status = "Pending";
                }
            });
        });
        
        let batchIds = batchRecords.map(b => b.id);
        receives = receives.filter(r => !batchIds.includes(r.id));
        
        localStorage.setItem('dyeing_receive_records', JSON.stringify(receives));
        localStorage.setItem('dyeing_issue_records', JSON.stringify(issues));
        
        if (window.firebaseSave) {
            await window.firebaseSave('dyeing_receive_records', receives);
            await window.firebaseSave('dyeing_issue_records', issues);
        }
        
        document.getElementById('receiveDate').value = selectedRec.date;
        
        loadPendingDesigns();
        document.getElementById('designNumber').value = selectedRec.designNo;
        loadPendingItems();
        
        setTimeout(() => {
            let rows = document.querySelectorAll('#receiveLinesContainer .receive-line-row');
            rows.forEach(row => {
                let rowIdsStr = row.getAttribute('data-ids');
                if(rowIdsStr) {
                    let rowIds = rowIdsStr.split(',');
                    let matchedRec = batchRecords.find(br => {
                        let brIds = br.issueIds || [br.issueId];
                        return rowIds.some(id => brIds.includes(id) || brIds.includes(String(id)));
                    });

                    if(matchedRec) {
                        let rcvInp = row.querySelector('.inp-received');
                        rcvInp.value = matchedRec.receivedWt;
                        calculateLoss(rcvInp);
                    }
                }
            });
        }, 150);
        
        renderReceivedList();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

async function deleteReceiveRecord(recId) {
    if (!checkUserPermission()) { alert("Access Denied! You do not have permission. ❌"); return; }
    if(!confirm("Are you sure you want to delete this record (and related batch items)? They will revert to Pending status.")) return;
    
    let receives = JSON.parse(localStorage.getItem('dyeing_receive_records')) || [];
    let issues = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
    
    let index = receives.findIndex(r => r.id == recId);
    if(index !== -1) {
        let selectedRec = receives[index];

        let batchRecords = receives.filter(r => 
            r.designNo === selectedRec.designNo && 
            r.date === selectedRec.date && 
            r.unit === selectedRec.unit
        );

        batchRecords.forEach(rec => {
            let targetIds = rec.issueIds || [rec.issueId];
            targetIds.forEach(id => {
                let issueIndex = issues.findIndex(iss => String(iss.id) === String(id));
                if(issueIndex !== -1) {
                    issues[issueIndex].status = "Pending";
                }
            });
        });
        
        let batchIds = batchRecords.map(b => b.id);
        receives = receives.filter(r => !batchIds.includes(r.id));
        
        localStorage.setItem('dyeing_receive_records', JSON.stringify(receives));
        localStorage.setItem('dyeing_issue_records', JSON.stringify(issues));
        
        if (window.firebaseSave) {
            await window.firebaseSave('dyeing_receive_records', receives);
            await window.firebaseSave('dyeing_issue_records', issues);
        }
        
        loadPendingDesigns(); 
        renderReceivedList();
        
        document.getElementById('receiveLinesContainer').innerHTML = '';
        document.getElementById('designNumber').value = '';
    }
}

function renderReceivedList() {
    let receiveRecords = JSON.parse(localStorage.getItem('dyeing_receive_records')) || [];
    let selectedDesign = document.getElementById('designNumber').value.trim();

    if(selectedDesign) {
        receiveRecords = receiveRecords.filter(r => cleanDesignName(r.designNo || r.designNumber) === cleanDesignName(selectedDesign));
    }

    let tbody = document.getElementById('receivedListBody');
    let tfoot = document.getElementById('receivedListFoot');
    tbody.innerHTML = '';
    tfoot.innerHTML = '';

    if(receiveRecords.length === 0) {
        tbody.innerHTML = `<tr><td colspan="12" style="padding:15px;">No Dyeing Orders Received for this design yet.</td></tr>`;
        return;
    }

    let gIssued = 0;
    let gRcvd = 0;
    let gLoss = 0;
    let gExcess = 0;

    receiveRecords.slice().reverse().forEach(record => {
        let dObj = new Date(record.date);
        let dateStr = ("0" + dObj.getDate()).slice(-2) + "/" + ("0" + (dObj.getMonth() + 1)).slice(-2) + "/" + dObj.getFullYear();
        
        let iWt = parseFloat(record.issuedWt) || 0;
        let rWt = parseFloat(record.receivedWt) || 0;
        let lWt = parseFloat(record.lossWt) || 0;
        let eWt = (record.excessWt && record.excessWt !== "-") ? parseFloat(record.excessWt) || 0 : 0;

        gIssued += iWt;
        gRcvd += rWt;
        gLoss += lWt;
        gExcess += eWt;

        let excessDisplay = record.excessWt && record.excessWt !== "-" 
            ? `<span class="excess-text">${record.excessWt}</span>` 
            : "-";
            
        if(!record.status) record.status = "running";
        let statusColor = record.status === 'running' ? '#D97706' : '#526E51';
        let statusBtn = record.status === 'running' 
            ? `<button class="action-complete" onclick="toggleStatus('${record.id}', 'completed')">Complete</button>` 
            : `<button class="action-running" onclick="toggleStatus('${record.id}', 'running')">Running</button>`;

        tbody.innerHTML += `
            <tr>
                <td>${dateStr}</td>
                <td><b>${record.designNo}</b></td>
                <td>${record.count}</td>
                <td>${record.color}</td>
                <td><b>${record.unit || '-'}</b></td>
                <td>${iWt.toFixed(3)}</td>
                <td><b style="color:#10B981;">${rWt.toFixed(3)}</b></td>
                <td>${lWt.toFixed(3)}</td>
                <td>${record.lossPerc}</td>
                <td>${excessDisplay}</td>
                <td style="color:${statusColor}; font-weight:bold; text-transform:uppercase;">${record.status}</td>
                <td class="action-btns">
                    ${statusBtn}
                    <button class="edit-action-btn" onclick="editReceiveRecord('${record.id}')" title="Edit Full Batch">✏️</button>
                    <button class="del-action-btn" onclick="deleteReceiveRecord('${record.id}')" title="Delete Full Batch">🗑️</button>
                </td>
            </tr>
        `;
    });

    tfoot.innerHTML = `
        <tr>
            <td colspan="5" style="text-align: right; padding: 10px;">Grand Total:</td>
            <td><b>${gIssued.toFixed(3)}</b></td>
            <td><b style="color:#10B981;">${gRcvd.toFixed(3)}</b></td>
            <td><b>${gLoss.toFixed(3)}</b></td>
            <td>-</td>
            <td><b style="color:#DC2626;">${gExcess > 0 ? gExcess.toFixed(3) : '-'}</b></td>
            <td colspan="2"></td>
        </tr>
    `;
}
