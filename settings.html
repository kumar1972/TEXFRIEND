<script>

/* ============================================================
   TEMP DATA
============================================================ */

let tempLogoData = "";
let tempDesignBitmapData = "";


/* ============================================================
   IMAGE DATA CLEANER
   MAIN FIX
============================================================ */

function normalizeImageData(value){

    if(!value){
        return "";
    }

    let data = String(value).trim();

    /*
       Firebase / JSON sometimes stores
       the data URL with extra quotes.
    */

    if(
        (data.startsWith('"') && data.endsWith('"')) ||
        (data.startsWith("'") && data.endsWith("'"))
    ){

        data = data.substring(1,data.length-1);
    }

    data = data.trim();

    /*
       Sometimes escaped quotes/slashes exist.
    */

    data = data.replace(/\\"/g,'"');

    /*
       Valid browser image sources
    */

    if(
        data.startsWith("data:image/") ||
        data.startsWith("blob:") ||
        data.startsWith("https://") ||
        data.startsWith("http://")
    ){

        return data;
    }

    return "";
}


/* ============================================================
   CHECK IMAGE
============================================================ */

function isValidImageSource(src){

    src = normalizeImageData(src);

    if(!src){
        return false;
    }

    if(
        src.startsWith("data:image/") ||
        src.startsWith("blob:") ||
        src.startsWith("https://") ||
        src.startsWith("http://")
    ){

        return true;
    }

    return false;
}


/* ============================================================
   GET VALID COMPANY LOGO
============================================================ */

function getStoredCompanyLogo(){

    const keys = [
        "company_logo_base64",
        "company_logo",
        "logo"
    ];

    for(let i=0;i<keys.length;i++){

        const raw =
            localStorage.getItem(keys[i]);

        const cleaned =
            normalizeImageData(raw);

        if(cleaned){

            return cleaned;
        }
    }

    return "";
}


/* ============================================================
   SHOW COMPANY LOGO
============================================================ */

function showCompanyLogo(src){

    const cleaned =
        normalizeImageData(src);

    const img =
        document.getElementById("logoImgTag");

    const box =
        document.getElementById("logoPreviewBox");

    const status =
        document.getElementById("logoStatus");

    if(!img || !box){
        return;
    }

    if(!cleaned){

        img.removeAttribute("src");

        box.style.display="none";

        if(status){
            status.textContent="";
        }

        return;
    }

    /*
       Important:
       Clear old source before setting new source.
    */

    img.removeAttribute("src");

    setTimeout(function(){

        img.onload=function(){

            box.style.display="flex";

            if(status){
                status.textContent="✅ Company Logo Loaded";
                status.style.color="#4A7C59";
            }
        };

        img.onerror=function(){

            console.warn(
                "Invalid company logo source"
            );

            box.style.display="none";

            if(status){
                status.textContent=
                    "⚠️ Saved logo could not be displayed";
                status.style.color="#DC2626";
            }
        };

        img.src=cleaned;

    },20);
}


/* ============================================================
   IMAGE ERROR HANDLER
============================================================ */

function handleLogoImageError(img){

    console.warn(
        "Company Logo image failed:",
        img.src
    );

    img.removeAttribute("src");

    const box =
        document.getElementById("logoPreviewBox");

    if(box){
        box.style.display="none";
    }

    const status =
        document.getElementById("logoStatus");

    if(status){

        status.textContent=
            "⚠️ Logo image is invalid or unavailable";

        status.style.color="#DC2626";
    }
}


function handleDesignImageError(img){

    console.warn(
        "Design bitmap image failed:",
        img.src
    );

    img.removeAttribute("src");

    const box =
        document.getElementById(
            "designBitmapPreviewBox"
        );

    if(box){
        box.style.display="none";
    }
}


/* ============================================================
   USER PERMISSION CHECK
============================================================ */

function checkUserPermission(){

    let userRole =
        localStorage.getItem("erp_logged_role") ||
        localStorage.getItem("user_role");

    if(
        userRole !== "Administrator" &&
        userRole !== "Admin"
    ){

        let permissions =
            JSON.parse(
                localStorage.getItem(
                    "user_permissions"
                ) || "{}"
            );

        if(
            permissions["settings.html"] === false ||
            permissions["settings"] === false
        ){

            return false;
        }
    }

    return true;
}


/* ============================================================
   CLEAN INPUT
============================================================ */

function cleanInputText(val){

    if(!val){
        return "";
    }

    /*
       IMPORTANT:
       Do NOT remove newline characters.
    */

    return val
        .toString()
        .replace(/\\/g,"")
        .replace(/"/g,"")
        .trim();
}


/* ============================================================
   TOAST
============================================================ */

function showSuccessToast(message,callback){

    let existingToast =
        document.getElementById(
            "customToast"
        );

    if(existingToast){
        existingToast.remove();
    }

    let toast =
        document.createElement("div");

    toast.id="customToast";

    toast.style.position="fixed";
    toast.style.top="20px";
    toast.style.left="50%";
    toast.style.transform="translateX(-50%)";
    toast.style.backgroundColor="#10B981";
    toast.style.color="#FFFFFF";
    toast.style.padding="14px 24px";
    toast.style.borderRadius="10px";
    toast.style.boxShadow=
        "0 10px 25px rgba(0,0,0,.3)";
    toast.style.zIndex="999999";
    toast.style.fontWeight="700";
    toast.style.fontSize="14px";
    toast.style.textAlign="center";
    toast.style.minWidth="280px";

        if(callback){

        }

    },1500);
}


/* ============================================================
   IMAGE COMPRESSION
   FIXED VERSION
============================================================ */

function compressImage(
    file,
    maxWidth,
    maxHeight,
    quality,
    callback
){

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload=function(e){

        const img =
            new Image();

        img.onload=function(){

            let width=img.width;
            let height=img.height;

            if(
                width > maxWidth ||
                height > maxHeight
            ){

                const ratio =
                    Math.min(
                        maxWidth / width,
                        maxHeight / height
                    );

                width =
                    Math.round(width * ratio);

                height =
                    Math.round(height * ratio);
            }

            const canvas =
                document.createElement("canvas");

            canvas.width=width;
            canvas.height=height;

            const ctx =
                canvas.getContext("2d");

            ctx.imageSmoothingEnabled=true;
            ctx.imageSmoothingQuality="high";

            /*
               White background only for JPEG.
               PNG/WebP transparency is preserved.
            */

            let outputType =
                file.type || "image/jpeg";

            if(
                outputType !== "image/png" &&
                outputType !== "image/webp" &&
                outputType !== "image/jpeg"
            ){

                outputType="image/jpeg";
            }

            if(outputType === "image/jpeg"){

                ctx.fillStyle="#FFFFFF";

                ctx.fillRect(
                    0,
                    0,
                    width,
                    height
                );
            }

            ctx.drawImage(
                img,
                0,
                0,
                width,
                height
            );

            let result;

            try{

                result =
                    canvas.toDataURL(
                        outputType,
                        quality
                    );

            }catch(error){

                /*
                   Fallback to JPEG
                */

                result =
                    canvas.toDataURL(
                        "image/jpeg",
                        quality
                    );
            }

            callback(result);
        };

        img.onerror=function(){

            alert(
                "Logo image could not be read. Please select another image."
            );
        };

        img.src=e.target.result;
    };

    reader.onerror=function(){

        alert(
            "Unable to read selected image."
        );
    };

    reader.readAsDataURL(file);
}

/* ============================================================
   LOGO PREVIEW
============================================================ */

function previewLogo(input){

    if(
        !input ||
        !input.files ||
        !input.files[0]
    ){
        return;
    }

    const file =
        input.files[0];

    /*
       Make sure selected file is really an image.
    */

    if(!file.type.startsWith("image/")){

        alert(
            "Please select a valid image file."
        );

        input.value="";

        return;
    }

    compressImage(
        file,
        800,
        800,
        .90,
        function(base64){

            const cleaned =
                normalizeImageData(base64);

            if(!cleaned){

                alert(
                    "Logo processing failed."
                );

                return;
            }

            /*
               IMPORTANT:
               Update temporary value immediately.
            */

            tempLogoData=cleaned;

            showCompanyLogo(
                tempLogoData
            );
        }
    );
}

                        "index.html";
                }
            );

            return;
        }


        alert(
            "⚠️ Cloud Reset Function Not Found.\n\n"+
            "Your config.js does not currently expose:\n\n"+
            "firebaseFactoryReset()\n\n"+
            "or\n\n"+
            "factoryResetFirebase()\n\n"+
            "Therefore NO cloud data was deleted."
        );

    }catch(error){

        console.error(
            "Factory Reset Error:",
            error
        );

        alert(
            "❌ Factory Reset Failed\n\n"+
            error.message
        );
    }
}


/* ============================================================
   BACKUP ALL DATA
============================================================ */

function backupAllData(){

    let allData={};

    for(
        let i=0;
        i<localStorage.length;
        i++
    ){

        let key =
            localStorage.key(i);

        allData[key]=
            localStorage.getItem(key);
    }

    let dataStr =
        "data:text/json;charset=utf-8,"+
        encodeURIComponent(
            JSON.stringify(
                allData,
                null,
                2
            )
        );

    let dlAnchor =
        document.createElement("a");

    dlAnchor.setAttribute(
        "href",
        dataStr
    );

    dlAnchor.setAttribute(
        "download",
        "texfriend_erp_backup_"+
        new Date()
            .toISOString()
            .split("T")[0]+
        ".json"
    );

    document.body.appendChild(
        dlAnchor
    );

    dlAnchor.click();

    dlAnchor.remove();
}


/* ============================================================
   LOAD JSON EDITOR
============================================================ */

function loadStorageDataToEditor(){

    let allData={};

    for(
        let i=0;
        i<localStorage.length;
        i++
    ){

        let key =
            localStorage.key(i);

        allData[key]=
            localStorage.getItem(key);
    }

    let editor =
        document.getElementById(
            "advancedJsonEditor"
        );

    if(editor){

        editor.value =
            JSON.stringify(
                allData,
                null,
                2
            );
    }

    showSuccessToast(
        "Database Loaded into JSON Editor!"
    );
}


/* ============================================================
   SAVE JSON EDITOR
============================================================ */

function saveStorageDataFromEditor(){

    let editor =
        document.getElementById(
            "advancedJsonEditor"
        );

    if(!editor){
        return;
    }

    let raw =
        editor.value;

    try{

        let parsed =
            JSON.parse(raw);

        if(
            confirm(
                "⚠️ Are you sure you want to overwrite local database with these JSON changes?"
            )
        ){

            for(
                let key in parsed
            ){

                localStorage.setItem(
                    key,
                    parsed[key]
                );

                if(
                    typeof window.firebaseSaveIndividual ===
                    "function"
                ){

                    try{

                        let firebaseValue;

                        try{

                            firebaseValue =
                                JSON.parse(
                                    parsed[key]
                                );

                        }catch(e){

                            firebaseValue=
                                parsed[key];
                        }

                        window.firebaseSaveIndividual(
                            key,
                            firebaseValue
                        );

                    }catch(firebaseParseError){

                        console.warn(
                            "Firebase JSON parse skipped for:",
                            key
                        );
                    }
                }
            }

            showSuccessToast(
                "Database Updated Successfully!",
                function(){

                    location.reload();

                }
            );
        }

    }catch(e){

        alert(
            "Invalid JSON format! Please correct before saving. ❌\n\n"+
            "Error: "+
            e.message
        );
    }
}
