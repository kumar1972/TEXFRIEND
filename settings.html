<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
html,body{width:100%;min-height:100vh;background:#030712;color:#1E2B23}
body{padding:12px;display:flex;flex-direction:column;align-items:center}
.container{width:100%;max-width:900px;background:#fff;padding:20px;border-radius:20px;box-shadow:0 10px 35px rgba(30,43,35,.06);border:1px solid rgba(82,110,81,.15);display:flex;flex-direction:column;gap:16px}
.top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.back-btn{display:inline-flex;align-items:center;gap:5px;color:#fff;text-decoration:none;font-weight:600;font-size:11px;background:#1A2421;padding:8px 16px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.page-title{font-size:18px;margin-bottom:5px;font-weight:800;color:#2F4F38;text-align:center;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #EAF0EA;padding-bottom:12px}
.form-section{background:#F8FAF8;border:1px solid #E2E8E2;border-radius:14px;padding:22px 15px 15px;position:relative}
.section-badge{position:absolute;top:-12px;left:15px;background:#4A7C59;color:#fff;font-size:10px;font-weight:700;padding:4px 12px;border-radius:12px;letter-spacing:.5px;text-transform:uppercase}
.section-badge.blue{background:linear-gradient(135deg,#3B82F6,#1D4ED8)}
.section-badge.amber{background:linear-gradient(135deg,#F59E0B,#D97706)}
.section-badge.danger{background:linear-gradient(135deg,#EF4444,#DC2626)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.form-group label{font-size:11px;font-weight:700;color:#4A554A}
input,select,textarea{width:100%;padding:12px 14px;border-radius:8px;border:1px solid #D1DED1;background:#fff;color:#1E2B23;font-size:12px;font-weight:600;outline:none}
textarea{resize:vertical;height:80px}
input:focus,select:focus,textarea:focus{border-color:#4A7C59;box-shadow:0 0 0 3px rgba(74,124,89,.15)}
.checkbox-group-container{background:#fff;border:1px solid #D1DED1;border-radius:10px;padding:15px;display:flex;flex-direction:column;gap:10px;margin-top:5px}
.checkbox-item{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;color:#1E2B23;cursor:pointer}
.checkbox-item input[type=checkbox]{width:16px;height:16px;accent-color:#EF4444}

.users-table th,.users-table td{padding:10px;border-bottom:1px solid #E2E8E2;color:#1E2B23}
.users-table th{background:#EAF0EA;color:#2F4F38;font-weight:700;text-transform:uppercase}
input[type=file]{padding:8px;background:#F4F7F4;border:1px dashed #4A7C59;cursor:pointer}
input[type=file]::file-selector-button{background:#4A7C59;color:#fff;border:0;padding:6px 14px;border-radius:6px;font-weight:600;font-size:10px;cursor:pointer;margin-right:10px}
.preview-box{margin-top:10px;background:#fff;padding:14px;min-height:100px;border-radius:10px;border:1px solid #D1DED1;display:none;align-items:center;justify-content:center;overflow:hidden}
.preview-box img{display:block;max-width:100%;width:auto;height:auto;max-height:120px;object-fit:contain;border-radius:6px}
.logo-status{margin-top:7px;font-size:10px;font-weight:600;text-align:center;color:#4A7C59}
#advancedJsonEditor{background:#1A2421;color:#A7F3D0;font-family:'Courier New',monospace;font-size:11px;padding:15px;border-radius:10px;border:1px solid #064E3B;height:180px}
.btn-action{color:#fff;border:0;padding:12px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:11px;transition:.2s;box-shadow:0 4px 10px rgba(30,43,35,.1);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;text-align:center}
.btn-action:hover{transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,#4A7C59,#2F4F38);font-size:13px;padding:14px;width:100%}
.btn-success{background:linear-gradient(135deg,#10B981,#059669)}
.btn-info{background:linear-gradient(135deg,#3B82F6,#1D4ED8)}

.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:5px}

<script>
"use strict";

let tempLogoData="";
let tempDesignBitmapData="";
let settingsInitialized=false;

function $(id){return document.getElementById(id)}

function status(message,ok=true){
    const el=$("settingsStatus");
    if(el){el.textContent=message;el.style.color=ok?"#2563EB":"#DC2626"}
}

function safeLoad(key,fallback){
    try{
        if(typeof window.localLoad==="function") return window.localLoad(key,fallback);
        const raw=localStorage.getItem(key);
        if(raw===null)return fallback;
        try{return JSON.parse(raw)}catch(e){return raw}
    }catch(e){console.error("safeLoad",key,e);return fallback}
}

function safeSave(key,value){
    try{
        if(typeof window.localSave==="function") return window.localSave(key,value);
        localStorage.setItem(key,JSON.stringify(value));
        return true;
    }catch(e){console.error("safeSave",key,e);return false}
}

async function cloudSave(key,value){
    if(typeof window.firebaseSave==="function"){
        try{return await window.firebaseSave(key,value)}catch(e){console.error("Cloud save",key,e)}
    }
    return safeSave(key,value);
}

function cleanInputText(v){
    return v==null?"":String(v).replace(/\\/g,"").replace(/"/g,"").trim();
}

function normalizeImageData(value){
    if(!value)return "";
    let data=String(value).trim();
    if((data.startsWith('"')&&data.endsWith('"'))||(data.startsWith("'")&&data.endsWith("'")))data=data.slice(1,-1);
    data=data.replace(/\\"/g,'"').trim();
    return /^(data:image\/|blob:|https?:\/\/)/i.test(data)?data:"";
}

function toast(message,ok=true,callback){
    const old=$("customToast");if(old)old.remove();
    const t=document.createElement("div");
    t.id="customToast";
    t.textContent=(ok?"✅ ":"⚠️ ")+message;
    Object.assign(t.style,{position:"fixed",top:"20px",left:"50%",transform:"translateX(-50%)",background:ok?"#10B981":"#DC2626",color:"#fff",padding:"14px 24px",borderRadius:"10px",boxShadow:"0 10px 25px rgba(0,0,0,.3)",zIndex:"999999",fontWeight:"700",fontSize:"14px",textAlign:"center",minWidth:"280px"});
    document.body.appendChild(t);
    setTimeout(()=>{t.remove();if(callback)callback()},1500);
}

function getStoredCompanyLogo(){
    for(const key of ["company_logo_base64","company_logo","logo"]){
        const v=normalizeImageData(localStorage.getItem(key));
        if(v)return v;
    }
    return "";
}

function showCompanyLogo(src){
    const img=$("logoImgTag"),box=$("logoPreviewBox"),st=$("logoStatus");
    if(!img||!box)return;
    const clean=normalizeImageData(src);
    if(!clean){img.removeAttribute("src");box.style.display="none";if(st)st.textContent="";return}
    img.onload=()=>{box.style.display="flex";if(st){st.textContent="✅ Company Logo Loaded";st.style.color="#4A7C59"}};
    img.onerror=()=>{box.style.display="none";if(st){st.textContent="⚠️ Saved logo could not be displayed";st.style.color="#DC2626"}};
    img.src=clean;
}

function handleLogoImageError(img){
    img.removeAttribute("src");
    if($("logoPreviewBox"))$("logoPreviewBox").style.display="none";
}

function handleDesignImageError(img){
    img.removeAttribute("src");
    if($("designBitmapPreviewBox"))$("designBitmapPreviewBox").style.display="none";
}

function checkUserPermission(){
    const role=localStorage.getItem("erp_logged_role")||localStorage.getItem("user_role");
    if(role==="Administrator"||role==="Admin")return true;
    const p=safeLoad("user_permissions",{});
    return !(p&&((p.settings===false)||(p["settings.html"]===false)));
}

function compressImage(file,maxW,maxH,quality,callback){
    if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{
        const img=new Image();
        img.onload=()=>{
            let w=img.width,h=img.height;
            if(w>maxW||h>maxH){const r=Math.min(maxW/w,maxH/h);w=Math.round(w*r);h=Math.round(h*r)}
            const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
            const ctx=canvas.getContext("2d");
            if(file.type==="image/jpeg"){ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h)}
            ctx.drawImage(img,0,0,w,h);
            let type=["image/png","image/webp","image/jpeg"].includes(file.type)?file.type:"image/jpeg";
            let result;
            try{result=canvas.toDataURL(type,quality)}catch(e){result=canvas.toDataURL("image/jpeg",quality)}
            callback(result);
        };
        img.onerror=()=>alert("Image could not be read. Please select another image.");
        img.src=e.target.result;
    };
    reader.onerror=()=>alert("Unable to read selected image.");
    reader.readAsDataURL(file);
}

function loadDesignDropdownInSettings(){
    const pre=safeLoad("pre_design_numbers",[])||[];
    const masters=safeLoad("design_masters_data",[])||[];
    const specs=safeLoad("design_specs",{})||{};
    const orders=safeLoad("party_orders_data",[])||[];
    const all=new Set();
    (Array.isArray(pre)?pre:[]).forEach(d=>all.add(typeof d==="object"?(d.designNo||d.designNumber):d));
    (Array.isArray(masters)?masters:[]).forEach(d=>all.add(d&&(d.name||d.designNo||d.designNumber)));
    if(specs&&typeof specs==="object")Object.keys(specs).forEach(k=>all.add(k));
    (Array.isArray(orders)?orders:[]).forEach(o=>all.add(o&&(o.designNumber||o.designNo)));
    const select=$("settingDesignSelect");if(!select)return;
    select.innerHTML='<option value="">Select Design Number</option>';
    [...all].filter(Boolean).forEach(d=>{
        const opt=document.createElement("option");opt.value=String(d);opt.textContent=String(d);select.appendChild(opt)
    });
}

function loadDesignBitmap(designNo){
    const box=$("designBitmapPreviewBox"),img=$("designBitmapImgTag");
    if(!designNo){tempDesignBitmapData="";if(box)box.style.display="none";return}
    const specs=safeLoad("design_specs",{})||{};
    const clean=String(designNo).replace("#","").trim().toLowerCase();
    const key=Object.keys(specs).find(k=>String(k).replace("#","").trim().toLowerCase()===clean)||designNo;
    const bitmap=normalizeImageData(specs[key]&&specs[key].bitmap);
    tempDesignBitmapData=bitmap;
    if(img&&bitmap){img.src=bitmap;img.onload=()=>{if(box)box.style.display="flex"}}
    else if(box)box.style.display="none";
}

function previewLogo(input){
    const file=input&&input.files&&input.files[0];if(!file)return;
    if(!file.type.startsWith("image/")){alert("Please select a valid image file.");input.value="";return}
    compressImage(file,800,800,.9,b64=>{tempLogoData=normalizeImageData(b64);showCompanyLogo(tempLogoData)})
}

function previewDesignBitmap(input){
    const file=input&&input.files&&input.files[0];if(!file)return;
    if(!file.type.startsWith("image/")){alert("Please select a valid image file.");input.value="";return}
    compressImage(file,800,800,.9,b64=>{
        tempDesignBitmapData=normalizeImageData(b64);
        const img=$("designBitmapImgTag"),box=$("designBitmapPreviewBox");
        if(img&&tempDesignBitmapData){img.src=tempDesignBitmapData;if(box)box.style.display="flex"}
    })
}

function getPartyDatabase(){
    const db=safeLoad("party_master_db",{});
    return db&&typeof db==="object"&&!Array.isArray(db)?db:{};
}

function loadPartyDropdown(){
    const select=$("partyListSelect");if(!select)return;
    const db=getPartyDatabase();
    select.innerHTML='<option value="">Select Party to Edit/View</option>';
    Object.keys(db).sort().forEach(p=>{
        const o=document.createElement("option");o.value=p;o.textContent=p;select.appendChild(o)
    });
}

function selectPartyToEdit(name){
    if(!$("partyNameInput")||!$("partyAddressInput"))return;
    $("partyNameInput").value=name||"";
    $("partyAddressInput").value=name?String(getPartyDatabase()[name]||""):"";
}

async function savePartyMaster(){
    const name=$("partyNameInput").value.trim(),addr=$("partyAddressInput").value.trim();
    if(!name){toast("Please enter a Party Name!",false);return}
    const db=getPartyDatabase();db[name]=addr;
    await cloudSave("party_master_db",db);
    await cloudSave("party_master_list",Object.keys(db));
    loadPartyDropdown();$("partyListSelect").value=name;
    toast("Party Details Saved Successfully!")
}

async function deletePartyMaster(){
    const name=$("partyListSelect").value;
    if(!name){toast("Please select a Party to delete!",false);return}
    if(!confirm("Are you sure you want to delete party: "+name+"?"))return;
    const db=getPartyDatabase();delete db[name];
    await cloudSave("party_master_db",db);
    await cloudSave("party_master_list",Object.keys(db));
    $("partyNameInput").value="";$("partyAddressInput").value="";
    loadPartyDropdown();toast("Party deleted successfully!")
}

async function updateUserPermissions(){
    const keys=["dashboard","design_list","design_master","despatch","dyeing_issue","dyeing_receive","index","invoice","kora_yarn","party_orders","process_matrix","report","settings","warp_entry","warping","washing","weaving","weft_entry","yarn_calc"];
    const permissions={};
    keys.forEach(k=>{const el=$("perm_"+k);permissions[k]=!!(el&&el.checked)});
    await cloudSave("user_permissions",permissions);
    toast("All Pages User Permissions Updated!")
}

function loadUserPermissions(){
    const p=safeLoad("user_permissions",{})||{};
    Object.keys(p).forEach(k=>{const el=$("perm_"+k);if(el)el.checked=p[k]!==false})
}

function getUsers(){
    const users=safeLoad("erp_system_users",[]);
    return Array.isArray(users)?users:[];
}

function renderUsersTable(){
    const tbody=$("usersTableBody");if(!tbody)return;
    const users=getUsers();tbody.innerHTML="";
    users.forEach((u,i)=>{
        const tr=document.createElement("tr");
        [u.username,u.password,u.role].forEach(v=>{const td=document.createElement("td");td.textContent=v==null?"":String(v);tr.appendChild(td)});
        const td=document.createElement("td");
        const b=document.createElement("button");b.type="button";b.className="btn-action btn-danger";b.style.cssText="padding:4px 8px;font-size:9px";b.textContent="Del";b.onclick=()=>deleteUserAccount(i);
        td.appendChild(b);tr.appendChild(td);tbody.appendChild(tr)
    })
}

async function addNewUserAccount(){
    const name=$("newUsername").value.trim(),pass=$("newPassword").value.trim(),role=$("newUserRole").value;
    if(!name||!pass){toast("Please enter Username and Password!",false);return}
    const users=getUsers();
    if(users.some(u=>String(u.username).toLowerCase()===name.toLowerCase())){toast("Username already exists!",false);return}
    users.push({username:name,password:pass,role:role});
    await cloudSave("erp_system_users",users);
    $("newUsername").value="";$("newPassword").value="";
    renderUsersTable();toast("New User Account Created!")
}

async function deleteUserAccount(index){
    if(!confirm("Are you sure you want to delete this user?"))return;
    const users=getUsers();if(index<0||index>=users.length)return;
    users.splice(index,1);await cloudSave("erp_system_users",users);renderUsersTable();toast("User deleted successfully!")
}

async function executeSaveAll(){
    try{
        const heading=cleanInputText($("set_heading").value);
        const addr=$("set_comp_addr").value.trim();
        if(heading)await cloudSave("app_heading_name",heading);
        if(addr)await cloudSave("company_full_address",addr);

        const logo=normalizeImageData(tempLogoData)||getStoredCompanyLogo();
        if(logo){
            await cloudSave("company_logo_base64",logo);
            await cloudSave("company_logo",logo);
            await cloudSave("logo",logo);
        }

        const select=$("settingDesignSelect");
        if(select&&select.value&&tempDesignBitmapData){
            const specs=safeLoad("design_specs",{})||{};
            const clean=String(select.value).replace("#","").trim().toLowerCase();
            const key=Object.keys(specs).find(k=>String(k).replace("#","").trim().toLowerCase()===clean)||select.value;
            if(!specs[key]||typeof specs[key]!=="object")specs[key]={};
            specs[key].bitmap=normalizeImageData(tempDesignBitmapData);
            await cloudSave("design_specs",specs);
        }

        toast("All Settings Saved Successfully!",true,()=>location.href="dashboard.html");
    }catch(e){console.error(e);alert("Save Error: "+e.message)}
}

/*
 * IMPORTANT:
 * These wrappers deliberately call the functions exported by config.js.
 * They do NOT recreate/reset Firebase logic here.
 */
async function clearLocalCache(){
    if(typeof window.handleLocalReset==="function"){
        return await window.handleLocalReset();
    }
    if(typeof window.clearLocalCache==="function" && window.clearLocalCache!==clearLocalCache){
        return await window.clearLocalCache();
    }
    alert("❌ Clear Cache function is not available. Please check config.js.");
}

async function factoryResetCloud(){
    if(typeof window.handleCloudReset==="function"){
        return await window.handleCloudReset();
    }
    if(typeof window.factoryResetCloud==="function" && window.factoryResetCloud!==factoryResetCloud){
        return await window.factoryResetCloud();
    }
    alert("❌ Factory Reset function is not available. Please check config.js.");
}

function backupAllData(){
    try{
        const allData={};
        for(let i=0;i<localStorage.length;i++){
            const key=localStorage.key(i);
            allData[key]=localStorage.getItem(key);
        }
        const payload={
            app:"TEXFRIEND ERP",
            version:"Settings Backup",
            createdAt:new Date().toISOString(),
            data:allData
        };
        const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url;
        a.download="texfriend_erp_backup_"+new Date().toISOString().slice(0,10)+".json";
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
        toast("ERP Backup Download Started!")
    }catch(e){console.error(e);alert("Backup Error: "+e.message)}
}

function loadStorageDataToEditor(){
    const allData={};
    for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);allData[key]=localStorage.getItem(key)}
    const editor=$("advancedJsonEditor");if(editor)editor.value=JSON.stringify(allData,null,2);
    toast("Database Loaded into JSON Editor!")
}

async function saveStorageDataFromEditor(){
    const editor=$("advancedJsonEditor");if(!editor)return;
    let parsed;
    try{parsed=JSON.parse(editor.value)}catch(e){alert("Invalid JSON format! Error: "+e.message);return}
    if(!parsed||typeof parsed!=="object"||Array.isArray(parsed)){alert("JSON root must be an object.");return}
    if(!confirm("⚠️ Overwrite local database with these JSON changes?"))return;

    try{
        for(const key of Object.keys(parsed)){
            /*
             * Backup/editor values are strings because localStorage stores strings.
             * Save them exactly as strings to avoid [object Object] corruption.
             */
            localStorage.setItem(key,typeof parsed[key]==="string"?parsed[key]:JSON.stringify(parsed[key]));
        }

        /* Push known ERP objects to Firebase in their proper type. */
        if(window.firebaseSave){
            for(const key of (window.erpCloudKeys||[])){
                if(!(key in parsed))continue;
                let value=parsed[key];
                if(typeof value==="string"){
                    try{value=JSON.parse(value)}catch(e){}
                }
                await window.firebaseSave(key,value);
            }
        }

        toast("Database Updated Successfully!",true,()=>location.reload());
    }catch(e){console.error(e);alert("Database Save Error: "+e.message)}
}

function initialiseSettings(){
    if(settingsInitialized)return;
    settingsInitialized=true;

    if(!checkUserPermission()){
        alert("Access Denied! You do not have permission to access settings. ❌");
        location.href="dashboard.html";return;
    }

    $("set_heading").value=cleanInputText(safeLoad("app_heading_name","TEXFRIEND ERP"));
    $("set_comp_addr").value=String(safeLoad("company_full_address","TEXFRIEND ERP SOLUTIONS\nSalem, Tamil Nadu.")||"").replace(/\\n/g,"\n");

    tempLogoData=getStoredCompanyLogo();showCompanyLogo(tempLogoData);
    loadDesignDropdownInSettings();
    loadPartyDropdown();
    loadUserPermissions();
    renderUsersTable();
    status("☁️ Settings ready");
}

window.addEventListener("DOMContentLoaded",()=>{
    initialiseSettings();

    /*
     * config.js starts Firebase immediately and may finish after this page.
     * Re-render cloud-backed data after sync so User Management, Permissions,
     * Party Master and Design Assets show the cloud values.
     */
    window.addEventListener("texfriend-cloud-sync-complete",()=>{
        loadDesignDropdownInSettings();
        loadPartyDropdown();
        loadUserPermissions();
        renderUsersTable();
        const logo=getStoredCompanyLogo();
        if(logo){tempLogoData=logo;showCompanyLogo(logo)}
        status("☁️ Cloud data synchronized");
    });
});
</script>
