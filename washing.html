<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Washing - TEXFRIEND</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    html, body { 
        width: 100%;
        min-height: 100vh;
        background: #E4EBE4; 
        color: #1E2B23; 
    }

    body { 
        padding: 12px; 
        display: flex;
        flex-direction: column;
    }

    .main-card {
        width: 100%;
        max-width: 100%;
        margin: 0;
        background: #F0F4F0;
        border: 1px solid rgba(82, 110, 81, 0.2);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .top-nav { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 4px; 
    }

    .back-btn {
        display: inline-block;
        color: #3F5A3E;
        text-decoration: none;
        font-weight: 600;
        font-size: 10px;
        background: rgba(82, 110, 81, 0.15);
        padding: 6px 10px;
        border-radius: 5px;
        border: 1px solid rgba(82, 110, 81, 0.3);
    }

    .page-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid rgba(82, 110, 81, 0.2);
        padding-bottom: 8px;
        margin-bottom: 8px;
    }

    .page-title {
        font-size: 16px;
        color: #3F5A3E;
        font-weight: 700;
    }

    .excel-btn {
        background: #526E51;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    h3 {
        font-size: 13px;
        color: #3F5A3E;
        font-weight: 700;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .form-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 10px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .form-group label {
        font-size: 10px;
        font-weight: 700;
        color: #3F5A3E;
    }

    input, select {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid rgba(82, 110, 81, 0.3);
        background: #FFFFFF;
        color: #1E2B23;
        font-size: 12px;
        font-weight: 500;
    }

    input:focus, select:focus {
        border-color: #526E51;
        outline: none;
    }

    input[readonly] {
        background: #E8ECE7;
        color: #3F5A3E;
    }

    .grid-header {
        display: grid;
        grid-template-columns: 0.8fr 1fr 1fr 1.5fr 32px;
        gap: 6px;
        padding: 0 4px;
        margin-bottom: 6px;
    }

    .grid-header-bot {
        display: grid;
        grid-template-columns: 0.8fr 1fr 1fr 1.5fr 1.2fr;
        gap: 6px;
        padding: 0 4px;
        margin-bottom: 6px;
    }

    .grid-header div, .grid-header-bot div {
        font-size: 10px;
        font-weight: 700;
        color: #3F5A3E;
        text-align: center;
    }

    .line-row {
        display: grid;
        grid-template-columns: 0.8fr 1fr 1fr 1.5fr 32px;
        gap: 6px;
        align-items: center;
        margin-bottom: 6px;
    }

    .line-row-bot {
        display: grid;
        grid-template-columns: 0.8fr 1fr 1fr 1.5fr 1.2fr;
        gap: 6px;
        align-items: center;
        margin-bottom: 6px;
    }

    .line-row input, .line-row-bot input {
        text-align: center;
        padding: 8px 4px;
        font-size: 11px;
    }

    .add-btn { background: #4C724C; color: white; border: none; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
    .del-btn { background: #D97706; color: white; border: none; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }

    .save-btn {
        background: #4C724C; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(82, 110, 81, 0.2); margin-top: 10px;
    }
    .save-btn:hover { background: #3F5A3E; }

    .section-divider {
        border-bottom: 1px dashed rgba(82, 110, 81, 0.4);
        margin: 15px 0;
    }

    .table-container {
        margin-top: 10px;
        overflow-x: auto;
        border-radius: 8px;
        border: 1px solid rgba(82, 110, 81, 0.2);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
        text-align: center;
        background: #F4F9F4;
    }

    th {
        background: #D8DFD6;
        color: #3F5A3E;
        padding: 8px 4px;
        border-bottom: 1px solid rgba(82, 110, 81, 0.3);
        font-weight: 700;
    }

    td {
        padding: 8px 4px;
        border-bottom: 1px solid rgba(82, 110, 81, 0.15);
        color: #1E2B23;
        font-weight: 500;
    }

    .action-btns {
        display: flex;
        gap: 4px;
        justify-content: center;
    }

    .edit-action-btn { background: #3F5A3E; color: white; border: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 10px; }
    .del-action-btn { background: #D97706; color: white; border: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 10px; }
    .shrink-text { color: #D32F2F; font-weight: 700; }
    .status-pending { color: #D97706; font-weight: 700; font-size: 9px; }
</style>
</head>
<body>

<div class="main-card">
    <div class="top-nav">
        <a href="index.html" class="back-btn">← Back to Menu</a>
    </div>

    <div class="page-header-row">
        <div class="page-title">Washing Production Entry</div>
        <button class="excel-btn" onclick="exportToExcel()">📥 Excel</button>
    </div>

    <!-- 1. TOP SECTION (ORDER DETAILS) -->
    <div id="sectionTop">
        <h3>1. Washing Order Details (Top)</h3>
        
        <div class="form-row">
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="topDate">
            </div>
            <div class="form-group">
                <label>Washing Name</label>
                <input type="text" id="topUnit" placeholder="Enter Washing Unit Name">
            </div>
            <div class="form-group">
                <label>Design Number</label>
                <select id="topDesignNo">
                    <option value="">Select Design No</option>
                </select>
            </div>
        </div>

        <div>
            <div class="grid-header">
                <div>Slip</div>
                <div>Piece</div>
                <div>Mtr</div>
                <div>Process Type</div>
                <div></div>
            </div>
            <div id="topLinesContainer">
                <div class="line-row">
                    <input type="text" class="t-slip" placeholder="Slip">
                    <input type="number" class="t-piece" placeholder="0">
                    <input type="number" class="t-mtr" placeholder="0" step="0.01">
                    <input type="text" class="t-process" placeholder="Type">
                    <button class="add-btn" onclick="addNewTopRow(this)">+</button>
                </div>
            </div>
        </div>

        <button class="save-btn" onclick="saveTopOrder()">Save Top Order</button>
    </div>

    <div class="section-divider"></div>

    <!-- 2. BOTTOM SECTION (RECEIVED DETAILS) -->
    <div id="sectionBottom">
        <h3>2. Washing Received & Shrinkage (Bottom)</h3>
        
        <div class="form-row">
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="botDate">
            </div>
            <div class="form-group">
                <label>Design Number (Select)</label>
                <select id="botDesignNo" onchange="loadBottomData()">
                    <option value="">Select Pending Design</option>
                </select>
            </div>
        </div>

        <!-- RECEIVED GRID -->
        <div id="botGridWrapper" style="display: none; margin-top: 5px;">
            <div class="grid-header-bot">
                <div>Slip</div>
                <div>Piece</div>
                <div>Mtr</div>
                <div>Process Type</div>
                <div>Received Mtr</div>
            </div>
            <div id="botLinesContainer"></div>
        </div>

        <button class="save-btn" onclick="saveBottomEntry()">Save Bottom Entry</button>
    </div>

    <div class="section-divider"></div>

    <!-- 3. SAVED DATA TABLE -->
    <div>
        <h3>📊 Saved Washing Data</h3>
        <div class="table-container">
            <table id="washingTable">
                <thead>
                    <tr>
                        <th>Design</th>
                        <th>Slip</th>
                        <th>Piece</th>
                        <th>Mtr</th>
                        <th>Process</th>
                        <th>Bot Date</th>
                        <th>Received Mtr</th>
                        <th>Shrinkage %</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <!-- Data populates here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('topDate').valueAsDate = new Date();
    document.getElementById('botDate').valueAsDate = new Date();
    loadDesignDropdowns();
    renderTable();
});

function loadDesignDropdowns() {
    let preDesignList = JSON.parse(localStorage.getItem('pre_design_numbers')) || [];
    let topSelect = document.getElementById('topDesignNo');
    let topHtml = '<option value="">Select Design No</option>';
    preDesignList.forEach(d => { topHtml += `<option value="${d}">${d}</option>`; });
    topSelect.innerHTML = topHtml;

    updateBottomDropdown();
}

function updateBottomDropdown() {
    let issues = JSON.parse(localStorage.getItem('washing_issue_records')) || [];
    let pendingDesigns = [...new Set(issues.filter(r => r.status === 'Pending').map(r => r.designNo))];
    
    let botSelect = document.getElementById('botDesignNo');
    let botHtml = '<option value="">Select Pending Design</option>';
    pendingDesigns.forEach(d => { botHtml += `<option value="${d}">${d}</option>`; });
    botSelect.innerHTML = botHtml;
}

// TOP SECTION LOGIC
function addNewTopRow(btn) {
    let container = document.getElementById('topLinesContainer');
    let row = document.createElement('div');
    row.className = 'line-row';
    row.innerHTML = `
        <input type="text" class="t-slip" placeholder="Slip">
        <input type="number" class="t-piece" placeholder="0">
        <input type="number" class="t-mtr" placeholder="0" step="0.01">
        <input type="text" class="t-process" placeholder="Type">
        <button class="del-btn" onclick="this.parentElement.remove()">×</button>
    `;
    container.insertBefore(row, btn.parentElement.nextSibling);
}

function saveTopOrder() {
    let dateVal = document.getElementById('topDate').value;
    let unit = document.getElementById('topUnit').value;
    let dNo = document.getElementById('topDesignNo').value;

    if(!dNo || !unit) { alert("Please fill Date, Washing Name, and Design Number!"); return; }

    let rows = document.querySelectorAll('#topLinesContainer .line-row');
    if(rows.length === 0) return;

    let issues = JSON.parse(localStorage.getItem('washing_issue_records')) || [];
    let savedCount = 0;

    rows.forEach(row => {
        let slip = row.querySelector('.t-slip').value.trim();
        let piece = parseInt(row.querySelector('.t-piece').value) || 0;
        let mtr = parseFloat(row.querySelector('.t-mtr').value) || 0;
        let process = row.querySelector('.t-process').value.trim();

        if(slip && piece > 0 && mtr > 0) {
            issues.push({
                id: Date.now() + Math.random(),
                date: dateVal,
                unit: unit,
                designNo: dNo,
                slip: slip,
                piece: piece,
                mtr: mtr.toFixed(2),
                process: process,
                status: 'Pending'
            });
            savedCount++;
        }
    });

    if(savedCount > 0) {
        localStorage.setItem('washing_issue_records', JSON.stringify(issues));
        alert("Top Order Saved Successfully! ✅");
        
        // Reset fields
        document.getElementById('topLinesContainer').innerHTML = `
            <div class="line-row">
                <input type="text" class="t-slip" placeholder="Slip">
                <input type="number" class="t-piece" placeholder="0">
                <input type="number" class="t-mtr" placeholder="0" step="0.01">
                <input type="text" class="t-process" placeholder="Type">
                <button class="add-btn" onclick="addNewTopRow(this)">+</button>
            </div>
        `;
        document.getElementById('topDesignNo').value = '';
        document.getElementById('topUnit').value = '';
        
        updateBottomDropdown();
        renderTable();
    } else {
        alert("Please fill Slip, Piece, and Mtr correctly.");
    }
}

// BOTTOM SECTION LOGIC
function loadBottomData() {
    let dNo = document.getElementById('botDesignNo').value;
    let wrapper = document.getElementById('botGridWrapper');
    let container = document.getElementById('botLinesContainer');
    container.innerHTML = '';
    
    if(!dNo) {
        wrapper.style.display = 'none';
        return;
    }
    
    wrapper.style.display = 'block';

    let issues = JSON.parse(localStorage.getItem('washing_issue_records')) || [];
    let pendingItems = issues.filter(r => r.status === 'Pending' && r.designNo === dNo);

    pendingItems.forEach(item => {
        let row = document.createElement('div');
        row.className = 'line-row-bot';
        row.setAttribute('data-id', item.id);
        
        row.innerHTML = `
            <input type="text" class="b-slip" value="${item.slip}" readonly>
            <input type="text" class="b-piece" value="${item.piece}" readonly>
            <input type="text" class="b-mtr" value="${item.mtr}" readonly>
            <input type="text" class="b-process" value="${item.process}" readonly>
            <input type="number" class="b-received" placeholder="Rcvd Mtr" step="0.01">
        `;
        container.appendChild(row);
    });
}

function saveBottomEntry() {
    let dateVal = document.getElementById('botDate').value;
    let dNo = document.getElementById('botDesignNo').value;

    if(!dNo) { alert("Please select a Design Number!"); return; }

    let rows = document.querySelectorAll('#botLinesContainer .line-row-bot');
    if(rows.length === 0) return;

    let issues = JSON.parse(localStorage.getItem('washing_issue_records')) || [];
    let receives = JSON.parse(localStorage.getItem('washing_receive_records')) || [];
    let savedCount = 0;

    rows.forEach(row => {
        let rcvMtr = parseFloat(row.querySelector('.b-received').value);
        let recId = row.getAttribute('data-id');
        
        if(rcvMtr > 0) {
            let issueIndex = issues.findIndex(r => r.id == recId);
            if(issueIndex !== -1) {
                issues[issueIndex].status = "Received";
                let issMtr = parseFloat(issues[issueIndex].mtr);
                
                // Calculate Shrinkage % = ((Mtr - Rcvd Mtr) / Mtr) * 100
                let shrinkPerc = 0;
                if(issMtr > 0 && rcvMtr <= issMtr) {
                    shrinkPerc = ((issMtr - rcvMtr) / issMtr) * 100;
                }

                receives.push({
                    id: Date.now() + Math.random(),
                    issueId: recId,
                    botDate: dateVal,
                    designNo: dNo,
                    receivedMtr: rcvMtr.toFixed(2),
                    shrinkagePerc: shrinkPerc.toFixed(2) + "%"
                });
                savedCount++;
            }
        }
    });

    if(savedCount > 0) {
        localStorage.setItem('washing_issue_records', JSON.stringify(issues));
        localStorage.setItem('washing_receive_records', JSON.stringify(receives));
        alert("Bottom Entry Saved Successfully! ✅");
        
        document.getElementById('botDesignNo').value = '';
        document.getElementById('botGridWrapper').style.display = 'none';
        updateBottomDropdown();
        renderTable();
    } else {
        alert("Please enter Received Mtr for at least one item.");
    }
}

// ACTION BUTTONS (EDIT & DELETE)
function editWashingRecord(issueId, isReceived) {
    let issues = JSON.parse(localStorage.getItem('washing_issue_records')) || [];
    let receives = JSON.parse(localStorage.getItem('washing_receive_records')) || [];
    
    if (isReceived) {
        // Edit Received Data (Load into Bottom Form)
        let recIndex = receives.findIndex(r => r.issueId == issueId);
        if(recIndex !== -1) {
            let recRecord = receives[recIndex];
            
            // Revert status
            let issueIndex = issues.findIndex(iss => iss.id == issueId);
            if(issueIndex !== -1) issues[issueIndex].status = "Pending";
            
            receives.splice(recIndex, 1);
            localStorage.setItem('washing_receive_records', JSON.stringify(receives));
            localStorage.setItem('washing_issue_records', JSON.stringify(issues));
            
            document.getElementById('botDate').value = recRecord.botDate;
            updateBottomDropdown();
            document.getElementById('botDesignNo').value = recRecord.designNo;
            loadBottomData();
            
            // Auto fill received mtr
            setTimeout(() => {
                let rows = document.querySelectorAll('#botLinesContainer .line-row-bot');
                rows.forEach(row => {
                    if(row.getAttribute('data-id') == issueId) {
                        row.querySelector('.b-received').value = recRecord.receivedMtr;
                    }
                });
            }, 100);
            renderTable();
        }
    } else {
        // Edit Pending Data (Load into Top Form)
        let issueIndex = issues.findIndex(iss => iss.id == issueId);
        if(issueIndex !== -1) {
            let issRecord = issues[issueIndex];
            issues.splice(issueIndex, 1);
            localStorage.setItem('washing_issue_records', JSON.stringify(issues));
            
            document.getElementById('topDate').value = issRecord.date;
            document.getElementById('topUnit').value = issRecord.unit;
            document.getElementById('topDesignNo').value = issRecord.designNo;
            
            let container = document.getElementById('topLinesContainer');
            container.innerHTML = `
                <div class="line-row">
                    <input type="text" class="t-slip" value="${issRecord.slip}">
                    <input type="number" class="t-piece" value="${issRecord.piece}">
                    <input type="number" class="t-mtr" value="${issRecord.mtr}" step="0.01">
                    <input type="text" class="t-process" value="${issRecord.process}">
                    <button class="add-btn" onclick="addNewTopRow(this)">+</button>
                </div>
            `;
            updateBottomDropdown();
            renderTable();
        }
    }
}

function deleteWashingRecord(issueId, isReceived) {
    if(!confirm("Are you sure you want to delete this record?")) return;
    
    let issues = JSON.parse(localStorage.getItem('washing_issue_records')) || [];
    let receives = JSON.parse(localStorage.getItem('washing_receive_records')) || [];
    
    if (isReceived) {
        // Delete Receive Record -> Revert Issue to Pending
        let recIndex = receives.findIndex(r => r.issueId == issueId);
        if(recIndex !== -1) receives.splice(recIndex, 1);
        
        let issueIndex = issues.findIndex(iss => iss.id == issueId);
        if(issueIndex !== -1) issues[issueIndex].status = "Pending";
        
    } else {
        // Delete Issue Record entirely
        let issueIndex = issues.findIndex(iss => iss.id == issueId);
        if(issueIndex !== -1) issues.splice(issueIndex, 1);
    }
    
    localStorage.setItem('washing_receive_records', JSON.stringify(receives));
    localStorage.setItem('washing_issue_records', JSON.stringify(issues));
    
    updateBottomDropdown();
    renderTable();
    
    document.getElementById('botLinesContainer').innerHTML = '';
    document.getElementById('botGridWrapper').style.display = 'none';
}

// RENDER MERGED DATA TABLE
function renderTable() {
    let issues = JSON.parse(localStorage.getItem('washing_issue_records')) || [];
    let receives = JSON.parse(localStorage.getItem('washing_receive_records')) || [];

    let tbody = document.getElementById('dataTableBody');
    tbody.innerHTML = '';

    if(issues.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="padding:15px;">No Records Found.</td></tr>`;
        return;
    }

    issues.reverse().forEach(issue => {
        let matchingRec = receives.find(r => r.issueId == issue.id);
        let isReceived = !!matchingRec;
        
        let botDateStr = "-";
        if (matchingRec && matchingRec.botDate) {
            let dObj = new Date(matchingRec.botDate);
            botDateStr = ("0" + dObj.getDate()).slice(-2) + "/" + ("0" + (dObj.getMonth() + 1)).slice(-2) + "/" + dObj.getFullYear();
        }

        let rcvMtr = matchingRec ? matchingRec.receivedMtr : "-";
        let shrinkPerc = matchingRec ? matchingRec.shrinkagePerc : "-";
        let shrinkDisplay = (shrinkPerc !== "-") ? `<span class="shrink-text">${shrinkPerc}</span>` : "-";
        
        let actionBtns = `
            <div class="action-btns">
                <button class="edit-action-btn" onclick="editWashingRecord(${issue.id}, ${isReceived})">✏️</button>
                <button class="del-action-btn" onclick="deleteWashingRecord(${issue.id}, ${isReceived})">🗑️</button>
            </div>
        `;

        // If Pending, show status instead of empty Date/Mtr
        if(!isReceived) {
            rcvMtr = `<span class="status-pending">Pending</span>`;
        }

        tbody.innerHTML += `
            <tr>
                <td>${issue.designNo}</td>
                <td>${issue.slip}</td>
                <td>${issue.piece}</td>
                <td>${issue.mtr}</td>
                <td>${issue.process}</td>
                <td>${botDateStr}</td>
                <td>${rcvMtr}</td>
                <td>${shrinkDisplay}</td>
                <td>${actionBtns}</td>
            </tr>
        `;
    });
}

function exportToExcel() {
    let table = document.getElementById('washingTable');
    let html = table.outerHTML;
    let url = 'data:application/vnd.ms-excel,' + encodeURIComponent(html);
    let link = document.createElement('a');
    link.href = url;
    link.download = 'Washing_Report.xls';
    link.click();
}
window.firebaseLoad = async function(key) {
            try {
                const docSnap = await getDoc(doc(db, "texfriend_erp", key));
                if (docSnap.exists()) {
                    return JSON.parse(docSnap.data().content);
                }
            } catch (e) {
                console.error("Firebase Load Error: ", e);
            }
            return null;
        };
    </script>
</body>
</html>
