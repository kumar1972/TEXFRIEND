<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TEXFRIEND - Login</title>
<script src="translator.js"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { width: 100%; min-height: 100vh; background: #2D402C; display: flex; justify-content: center; align-items: center; padding: 16px; }
    .login-card { width: 100%; max-width: 400px; background: #F4F9F4; border-radius: 20px; padding: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); border: 1px solid rgba(82, 110, 81, 0.3); display: flex; flex-direction: column; gap: 18px; }
    .logo-area { text-align: center; }
    .logo-area h2 { font-size: 18px; color: #3F5A3E; font-weight: 700; margin-top: 6px; }
    .logo-area p { font-size: 11px; color: #64748b; font-weight: 500; }
    .role-tabs { display: grid; grid-template-columns: 1fr 1fr; background: #E2E8F0; border-radius: 10px; padding: 4px; gap: 4px; }
    .role-btn { background: transparent; border: none; padding: 10px; font-size: 12px; font-weight: 600; color: #64748b; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; }
    .role-btn.active { background: #3F5A3E; color: #FFFFFF; box-shadow: 0 4px 10px rgba(63, 90, 62, 0.2); }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 11px; font-weight: 700; color: #3F5A3E; }
    .input-box { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(82, 110, 81, 0.3); background: #FFFFFF; color: #1E2B23; font-size: 13px; font-weight: 600; outline: none; }
    .login-submit-btn { width: 100%; background: #3F5A3E; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(63, 90, 62, 0.3); margin-top: 6px; }
    .error-msg { color: #EF4444; font-size: 11px; text-align: center; font-weight: 600; display: none; }
</style>
</head>
<body>
<div class="login-card">
    <div class="logo-area">
        <span style="font-size: 32px;">🔐🔑</span>
        <h2>TEXFRIEND</h2>
        <p id="subtitleText">Admin Login & User Login</p>
    </div>
    <div class="role-tabs">
        <button type="button" class="role-btn active" id="adminTab" onclick="switchRole('admin')">👑 Admin Login</button>
        <button type="button" class="role-btn" id="userTab" onclick="switchRole('user')">👤 User Login</button>
    </div>
    <div class="form-group">
        <label id="usernameLabel">Admin User Name</label>
        <input type="text" id="loginUser" class="input-box" placeholder="Enter username">
    </div>
    <div class="form-group">
        <label>Password / கடவுச்சொல்</label>
        <input type="password" id="loginPass" class="input-box" placeholder="Enter password">
    </div>
    <div class="error-msg" id="errorMsg">⚠️ தவறான Username அல்லது Password!</div>
    <button type="button" class="login-submit-btn" onclick="validateLogin()">Login / உள்நுழை</button>
</div>
<script>
let currentRole = 'admin';
function switchRole(role) {
    currentRole = role;
    let adminBtn = document.getElementById('adminTab');
    let userBtn = document.getElementById('userTab');
    let userLabel = document.getElementById('usernameLabel');
    let subText = document.getElementById('subtitleText');
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    if(role === 'admin') {
        adminBtn.classList.add('active'); userBtn.classList.remove('active');
        userLabel.innerText = "Admin User Name"; subText.innerText = "Administrator Control Panel";
    } else {
        userBtn.classList.add('active'); adminBtn.classList.remove('active');
        userLabel.innerText = "Staff / User Name"; subText.innerText = "Standard User Portal";
    }
}
function validateLogin() {
    let u = document.getElementById('loginUser').value.trim();
    let p = document.getElementById('loginPass').value.trim();
    let err = document.getElementById('errorMsg');
    if(!u || !p) { err.innerText = "⚠️ அனைத்து விவரங்களையும் நிரப்பவும்!"; err.style.display = 'block'; return; }
    
    if(currentRole === 'admin') {
        if(u === 'admin' && p === '1234') {
            localStorage.setItem('erp_logged_role', 'Admin');
            localStorage.setItem('erp_logged_user', u);
            window.location.href = "dashboard.html"; // 👈 திருத்தப்பட்டுள்ளது
        } else { err.innerText = "⚠️ தவறான அட்மின் விவரங்கள்!"; err.style.display = 'block'; }
    } else {
        if(u !== '' && p !== '') { 
            localStorage.setItem('erp_logged_role', 'User');
            localStorage.setItem('erp_logged_user', u);
            window.location.href = "dashboard.html"; // 👈 திருத்தப்பட்டுள்ளது
        } else { err.innerText = "⚠️ தவறான யூசர் விவரங்கள்!"; err.style.display = 'block'; }
    }
}
</script>
</body>
</html>
