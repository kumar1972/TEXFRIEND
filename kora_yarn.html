<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kora Yarn - TEXFRIEND</title>
<script src="translator.js"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    /* 📌 Smart Background - STRICTLY NO BLACK */
    html, body { 
        width: 100%; 
        min-height: 100vh; 
        background: #EAF0EA; 
        color: #1E2B23; /* Deep Dark Green */
    }

    body { 
        padding: 12px; 
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* 📌 Main Container */
    .main-card {
        width: 100%;
        max-width: 900px;
        margin: 0;
        background: #FFFFFF;
        border: 1px solid rgba(82, 110, 81, 0.15);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 35px rgba(30, 43, 35, 0.06);
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .top-nav { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 5px; 
    }

    /* 📌 Smart Back Button */
    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #FFFFFF;
        text-decoration: none;
        font-weight: 600;
        font-size: 11px;
        background: #1A2421; 
        padding: 8px 16px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        transition: all 0.3s ease;
    }
    .back-btn:hover { background: #000000; transform: translateY(-2px); }

    /* Checkbox Styling */
    .completed-checkbox {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #D8DFD6;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid rgba(82, 110, 81, 0.4);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .completed-checkbox input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #526E51;
        margin: 0;
        padding: 0;
        border: none;
    }
    
    .completed-checkbox label {
        margin: 0;
        color: #3F5A3E;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
    }

    #bitmapDisplayContainer { text-align: right; display: flex; align-items: center; gap: 10px; }
    #bitmapDisplayContainer img {
        max-height: 40px;
        border-radius: 4px;
        border: 1px solid rgba(82, 110, 81, 0.4);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        cursor: zoom-in;
        transition: transform 0.2s;
    }
    #bitmapDisplayContainer img:hover { transform: scale(1.1); }

    .page-title {
        font-size: 16px;
        margin-bottom: 5px;
        font-weight: 700;
        color: #2F4F38;
        text-align: left;
        position: relative;
        padding-left: 12px;
    }
    .page-title::before {
        content: ''; position: absolute; left: 0; top: 10%; height: 80%; width: 4px;
        background: #4A7C59; border-radius: 4px;
    }

    /* 📌 Smart Sectioning */
    .form-section {
        background: #F8FAF8;
        border: 1px solid #E2E8E2;
        border-radius: 14px;
        padding: 20px 15px 15px 15px;
        margin-bottom: 5px;
        position: relative;
    }
    
    .section-badge {
        position: absolute;
        top: -12px;
        left: 15px;
        background: #4A7C59;
        color: #FFF;
        font-size: 10px;
        font-weight: 700;
        padding: 4px 12px;
        border-radius: 12px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        box-shadow: 0 4px 8px rgba(74, 124, 89, 0.25);
    }
    .section-badge.issue { background: linear-gradient(135deg, #D97706, #B45309); }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 12px;
    }
    
    .form-row.full { grid-template-columns: 1fr; }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 10px; font-weight: 600; color: #4A554A; }

    /* 📌 Smart 3D Inputs */
    input, select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #D1DED1;
        background: #FFFFFF;
        color: #1E2B23;
        font-size: 11px;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 4px rgba(30, 43, 35, 0.02);
    }

    input:focus, select:focus {
        border-color: #4A7C59;
        outline: none;
        box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.15);
    }
    
    input::placeholder { color: #A0AFA0; font-weight: 400; }

    /* 📌 Smart Buttons */
    .btn-main {
        width: 100%; padding: 14px; margin: 5px 0 0 0; border: none; border-radius: 10px;
        color: white; font-weight: 700; font-size: 13px; cursor: pointer;
        background: linear-gradient(135deg, #4A7C59, #33593D);
        box-shadow: 0 6px 15px rgba(74, 124, 89, 0.25);
        transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(74, 124, 89, 0.35); }
    .btn-main:active { transform: translateY(1px); }

    .btn-issue { background: linear-gradient(135deg, #F59E0B, #D97706); box-shadow: 0 6px 15px rgba(217, 119, 6, 0.25); }
    .btn-issue:hover { box-shadow: 0 8px 20px rgba(217, 119, 6, 0.35); }

    .popup-trigger-btn {
        background: linear-gradient(135deg, #3B82F6, #1D4ED8);
        color: white; border: none; padding: 14px; border-radius: 10px;
        font-size: 12px; font-weight: bold; cursor: pointer; width: 100%;
        box-shadow: 0 6px 15px rgba(59, 130, 246, 0.25);
        transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .popup-trigger-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35); }
    
    .popup-btn-secondary { background: linear-gradient(135deg, #10B981, #059669); box-shadow: 0 6px 15px rgba(16, 185, 129, 0.25); }
    .popup-btn-secondary:hover { box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35); }

    .history-btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }

    /* 📌 Advanced Pop-up Modal Styling */
    .overlay-modal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(18, 25, 20, 0.85); backdrop-filter: blur(4px);
        z-index: 99999; flex-direction: column; padding: 15px; opacity: 0; transition: opacity 0.3s ease;
    }
    .overlay-modal.show { opacity: 1; }
    
    .modal-content {
        background: #FFFFFF; width: 100%; height: 100%; border-radius: 16px;
        display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        overflow: hidden; transform: scale(0.95); transition: transform 0.3s ease;
    }
    .overlay-modal.show .modal-content { transform: scale(1); }

    .modal-header {
        padding: 15px 20px; background: #F4F7F4; display: flex;
        justify-content: space-between; align-items: center; border-bottom: 1px solid #E2E8E2;
    }
    .modal-header h3 { margin: 0; font-size: 15px; color: #1E2B23; font-weight: 700; }
    .close-btn {
        background: #FEE2E2; color: #DC2626; border: none; padding: 8px 14px;
        border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 11px;
        transition: all 0.2s ease;
    }
    .close-btn:hover { background: #FECACA; transform: scale(1.05); }

    .modal-body { padding: 15px; overflow-y: auto; flex: 1; background: #FAFCFA; }

    /* 📌 Fullscreen Image Popup Modal */
    .fullscreen-modal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.9); z-index: 999999; justify-content: center; align-items: center;
        padding: 20px; flex-direction: column;
    }
    .fullscreen-modal img {
        max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 10px;
        box-shadow: 0 10px 30px rgba(255,255,255,0.2);
    }
    .close-fullscreen {
        position: absolute; top: 20px; right: 20px; background: #EF4444; color: white;
        border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 14px;
        cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    /* 📌 Advanced Table Design */
    .table-container {
        width: 100%; border-radius: 10px; overflow-x: auto;
        box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid #E2E8E2; background: #FFFFFF;
        -webkit-overflow-scrolling: touch;
    }

    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; text-align: center; white-space: nowrap; }
    th, td { padding: 10px 12px; text-align: center; border-bottom: 1px solid #E2E8E2; color: #1E2B23; }
    th { background: #EAF0EA; color: #2F4F38; font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; position: sticky; top: 0; z-index: 10; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #F8FAF8; }

    .action-btns { display: flex; gap: 6px; justify-content: center; }
    .edit-action-btn { background: #64748B; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 10px; transition: all 0.2s; }
    .edit-action-btn:hover { background: #475569; }
    .del-action-btn { background: #EF4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 10px; transition: all 0.2s; }
    .del-action-btn:hover { background: #DC2626; box-shadow: 0 2px 5px rgba(220, 38, 38, 0.3); }

    .action-complete { background: #526E51; color: white; border: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 9px; font-weight: bold; }
    .action-running { background: #D97706; color: white; border: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 9px; font-weight: bold; }
</style>
</head>
<body>

<div class="main-card">
    <div class="top-nav">
        <a href="dashboard.html" class="back-btn">← Back to Menu</a>
        <div id="bitmapDisplayContainer">
            <div class="completed-checkbox">
                <input type="checkbox" id="top_completed_status" onchange="quickCompleteToggle()">
                <label for="top_completed_status">Completed</label>
            </div>
        </div>
    </div>

    <div class="page-title">🧵 Kora Yarn Management</div>

    <!-- 📌 1. KORA STOCK INWARD -->
    <div class="form-section" style="margin-top: 10px;">
        <div class="section-badge">📥 Inward Stock</div>
        
        <div class="form-row">
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="inwardDate">
            </div>
            <div class="form-group">
                <label id="supplierLabel">Source / Mill Name</label>
                <input type="text" id="supplierName" placeholder="Enter Source Mill Name">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Yarn Count</label>
                <input type="text" id="inwardCount" placeholder="Count">
            </div>
            <div class="form-group">
                <label>Weight (KG)</label>
                <input type="number" id="inwardWt" placeholder="0.000" step="0.001">
            </div>
        </div>
        <button class="btn-main" id="saveInwardBtn" onclick="saveInward()">✅ Save Kora Stock</button>
    </div>

    <!-- 📌 2. KORA ISSUE -->
    <div class="form-section">
        <div class="section-badge issue">📤 Outward Issue</div>
        
        <div class="form-row">
            <div class="form-group">
                <label>Issue Date</label>
                <input type="date" id="issueDate">
            </div>
            <div class="form-group">
                <label>Dyeing / Unit Name</label>
                <input type="text" id="dyeingName" placeholder="Unit Name">
            </div>
        </div>
        <div class="form-row full">
            <div class="form-group">
                <label>Mill Name (From where yarn is taken)</label>
                <input type="text" id="issueMillName" placeholder="Enter Mill Name">
            </div>
        </div>
        <div class="form-row full">
            <div class="form-group">
                <label>Design Number</label>
                <select id="designNo" onchange="onDesignSelect(this.value)">
                    <option value="">Select Design</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Yarn Count</label>
                <input type="text" id="issueCount" placeholder="Count">
            </div>
            <div class="form-group">
                <label>Issue Weight (KG)</label>
                <input type="number" id="issueWt" placeholder="0.000" step="0.001">
            </div>
        </div>
        <button class="btn-main btn-issue" id="saveIssueBtn" onclick="saveIssue()">➕ Add Kora Issue</button>
    </div>

    <!-- 📌 3. HISTORY POPUP BUTTONS -->
    <div class="history-btn-group">
        <button class="popup-trigger-btn" onclick="openModal('inwardModal')">📋 View Inward History (வரவு)</button>
        <button class="popup-trigger-btn popup-btn-secondary" onclick="openModal('issueModal')">📋 View Issue History (செலவு)</button>
    </div>

</div>

<!-- 📌 Full-Screen Pop-up Modal for Inward History -->
<div id="inwardModal" class="overlay-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📋 Inward History Registry (வரவு)</h3>
            <button class="close-btn" onclick="closeModal('inwardModal')">Close ✕</button>
        </div>
        <div class="modal-body">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Source / Mill Name</th>
                            <th>Count</th>
                            <th>Weight</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="inwardHistoryBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 📌 Full-Screen Pop-up Modal for Issue History -->
<div id="issueModal" class="overlay-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📋 Issue History Registry (செலவு)</h3>
            <button class="close-btn" onclick="closeModal('issueModal')">Close ✕</button>
        </div>
        <div class="modal-body">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Mill</th>
                            <th>Unit</th>
                            <th>Design</th>
                            <th>Count</th>
                            <th>Weight</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="issueHistoryBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- 📌 Fullscreen Image Popup Modal -->
<div id="fullscreenModal" class="fullscreen-modal" onclick="closeFullscreenImage()">
    <button class="close-fullscreen">Close ✕</button>
    <img id="fullscreenImg" src="" alt="Fullscreen Preview">
</div>

<script>
let editingInwardId = null;
let editingIssueId = null;

document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('inwardDate').valueAsDate = new Date();
    document.getElementById('issueDate').valueAsDate = new Date();
    loadDesignDropdown();
    refreshAllTables();
});

function openModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.style.display = 'flex';
    setTimeout(() => modal.classList.add('show'), 10);
}

function closeModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.classList.remove('show');
    setTimeout(() => modal.style.display = 'none', 300);
}

// 📌 Fullscreen Image Popup Controls
window.openFullscreenImage = function(src) {
    if(!src || src === '' || src === 'null') return;
    document.getElementById('fullscreenImg').src = src;
    document.getElementById('fullscreenModal').style.display = 'flex';
}
window.closeFullscreenImage = function() {
    document.getElementById('fullscreenModal').style.display = 'none';
}

function loadBitmapImage() {
    let activeDesign = document.getElementById('designNo').value || localStorage.getItem('selected_design_number');
    let designSpecs = JSON.parse(localStorage.getItem('design_specs') || '{}');
    let bitmapContainer = document.getElementById('bitmapDisplayContainer');
    
    let imgHtml = '';
    if (activeDesign && designSpecs[activeDesign] && designSpecs[activeDesign].bitmap) {
        let b64 = designSpecs[activeDesign].bitmap;
        imgHtml = `<img src="${b64}" alt="Design Bitmap" onclick="openFullscreenImage('${b64}')" title="Click to view full screen">`;
    }
    
    let checkboxHtml = `<div class="completed-checkbox"><input type="checkbox" id="top_completed_status" onchange="quickCompleteToggle()"><label for="top_completed_status">Completed</label></div>`;
    
    let wasChecked = false;
    let cb = document.getElementById('top_completed_status');
    if(cb) wasChecked = cb.checked;
    
    bitmapContainer.innerHTML = checkboxHtml + imgHtml;
    
    if(wasChecked) {
        document.getElementById('top_completed_status').checked = true;
    }
}

function loadDesignDropdown() {
    let preDesignList = JSON.parse(localStorage.getItem('pre_design_numbers')) || [];
    let select = document.getElementById('designNo');
    let html = '<option value="">Select Design No</option>';
    preDesignList.forEach(d => { html += `<option value="${d}">${d}</option>`; });
    select.innerHTML = html;

    let activeDesign = localStorage.getItem('selected_design_number');
    if(activeDesign && preDesignList.includes(activeDesign)) {
        select.value = activeDesign;
        onDesignSelect(activeDesign);
    } else {
        loadBitmapImage();
    }
}

function onDesignSelect(val) {
    loadBitmapImage();
    if(!val) return;
    localStorage.setItem('selected_design_number', val);
    
    let designSpecs = JSON.parse(localStorage.getItem('design_specs')) || {};
    let specStatus = (designSpecs[val] && designSpecs[val].status) ? designSpecs[val].status.toLowerCase() : '';
    let issues = JSON.parse(localStorage.getItem('kora_issue_records')) || [];
    let rec = issues.find(r => (r.designNo === val || r.designNumber === val));

    if(specStatus === 'completed' || (rec && rec.status && rec.status.toLowerCase() === 'completed')) {
        let cb = document.getElementById('top_completed_status');
        if(cb) cb.checked = true;
    } else {
        let cb = document.getElementById('top_completed_status');
        if(cb) cb.checked = false;
    }
}

// 📌 Completed Checkbox Quick Toggle
async function quickCompleteToggle() {
    let dNo = document.getElementById('designNo').value;
    let cb = document.getElementById('top_completed_status');
    let isCompleted = cb ? cb.checked : false;

    if(!dNo) {
        alert("Mudhala Design Number select pannunga bro");
        if(cb) cb.checked = false;
        return;
    }

    let statusText = isCompleted ? 'completed' : 'running';

    let issues = JSON.parse(localStorage.getItem('kora_issue_records')) || [];
    let updated = false;

    issues.forEach(r => {
        if(r.designNo === dNo || r.designNumber === dNo) {
            r.status = statusText;
            updated = true;
        }
    });

    if(!updated) {
        let dateVal = document.getElementById('issueDate').value || new Date().toISOString().split('T')[0];
        let dyeingName = document.getElementById('dyeingName').value.trim() || 'Direct Unit';
        let issueMillName = document.getElementById('issueMillName').value.trim() || 'Main Mill';
        let count = document.getElementById('issueCount').value.trim() || '20/s';
        let issueWt = parseFloat(document.getElementById('issueWt').value) || 0;

        issues.push({
            id: Date.now(),
            date: dateVal,
            dyeingName: dyeingName,
            millName: issueMillName,
            designNo: dNo,
            count: count,
            issueWt: issueWt.toFixed(3),
            status: statusText
        });
    }

    localStorage.setItem('kora_issue_records', JSON.stringify(issues));

    let designSpecs = JSON.parse(localStorage.getItem('design_specs')) || {};
    if(!designSpecs[dNo]) {
        designSpecs[dNo] = {};
    }
    designSpecs[dNo].status = statusText;
    localStorage.setItem('design_specs', JSON.stringify(designSpecs));

    try {
        if (window.firebaseSave) {
            await window.firebaseSave('kora_issue_records', issues);
            await window.firebaseSave('design_specs', designSpecs);
        }
    } catch(e) {
        console.error("Firebase Sync Error: ", e);
    }

    refreshAllTables();
    alert(`Design ${dNo} status '${isCompleted ? 'COMPLETED' : 'RUNNING'}' ah update aagiduchu ✅`);
}

// 1. SAVE INWARD STOCK with Re-entry Confirmation Popup & Double Entry Prevention
async function saveInward() {
    let dateVal = document.getElementById('inwardDate').value;
    let supplier = document.getElementById('supplierName').value.trim();
    let count = document.getElementById('inwardCount').value.trim();
    let weight = parseFloat(document.getElementById('inwardWt').value) || 0;
    
    let isCompleted = false;
    let cb = document.getElementById('top_completed_status');
    if(cb) isCompleted = cb.checked;

    if(!supplier || !count || weight <= 0) {
        alert("Please enter Source Name, Count, and valid Weight!");
        return;
    }

    let records = JSON.parse(localStorage.getItem('kora_stock_records')) || [];
    let cleanSupplier = supplier.replace('#', '').trim().toLowerCase();

    // 🔥 POP-UP ALERT CHECK FOR RE-ENTRY & DOUBLE ENTRY PREVENTION (Inward)
    if(editingInwardId === null && cleanSupplier) {
        let alreadyExists = records.some(r => {
            let rSup = r.supplier ? r.supplier.replace('#', '').trim().toLowerCase() : '';
            let rCount = r.count ? r.count.trim().toLowerCase() : '';
            return rSup === cleanSupplier && rCount === count.trim().toLowerCase();
        });

        if(alreadyExists) {
            let confirmReEntry = confirm("இந்த சப்ளையர் மற்றும் கவுண்டிற்கு ஏற்கனவே என்ட்ரி செய்யப்பட்டுள்ளது. மீண்டும் ரீ-என்ட்ரி செய்ய வேண்டுமா?");
            if(!confirmReEntry) {
                return; // Cancel save action if user clicks Cancel
            }
            // If confirmed, filter out old records to prevent duplicates
            records = records.filter(r => {
                let rSup = r.supplier ? r.supplier.replace('#', '').trim().toLowerCase() : '';
                let rCount = r.count ? r.count.trim().toLowerCase() : '';
                return !(rSup === cleanSupplier && rCount === count.trim().toLowerCase());
            });
        }
    }

    let btn = document.getElementById('saveInwardBtn');
    let origText = btn.innerText;
    btn.innerText = "⏳ Saving to Cloud...";

    if (editingInwardId) {
        let idx = records.findIndex(r => r.id == editingInwardId);
        if(idx !== -1) {
            records[idx].date = dateVal;
            records[idx].supplier = supplier;
            records[idx].count = count;

            records[idx].status = isCompleted ? 'completed' : 'running';
        }

    } else {
        records.push({
            id: Date.now() + Math.random(),

// 2. SAVE OUTWARD ISSUE with Re-entry Confirmation Popup & Double Entry Prevention
async function saveIssue() {
    let dateVal = document.getElementById('issueDate').value;
    let dyeingName = document.getElementById('dyeingName').value.trim();
    let issueMillName = document.getElementById('issueMillName').value.trim(); 
    let dNo = document.getElementById('designNo').value;
    let count = document.getElementById('issueCount').value.trim();
    let issueWt = parseFloat(document.getElementById('issueWt').value) || 0;
    
    let isCompleted = false;
    let cb = document.getElementById('top_completed_status');
    if(cb) isCompleted = cb.checked;

    if(!dyeingName || !dNo || !count || issueWt <= 0 || !issueMillName) {
        alert("Please fill all details to issue yarn (including Mill Name)!");
        return;
    }

    let issues = JSON.parse(localStorage.getItem('kora_issue_records')) || [];
    let cleanDNo = dNo.replace('#', '').trim().toLowerCase();

    // 🔥 POP-UP ALERT CHECK FOR RE-ENTRY & DOUBLE ENTRY PREVENTION (Issue)
    if(editingIssueId === null && cleanDNo) {
        let alreadyExists = issues.some(r => {
            let rDno = (r.designNo || r.designNumber || "").replace('#', '').trim().toLowerCase();
            let rCount = r.count ? r.count.trim().toLowerCase() : '';
            return rDno === cleanDNo && rCount === count.trim().toLowerCase();
        });

        if(alreadyExists) {
            let confirmReEntry = confirm("இந்த டிசைனுக்கு ஏற்கனவே Kora Issue என்ட்ரி செய்யப்பட்டுள்ளது. மீண்டும் ரீ-என்ட்ரி செய்ய வேண்டுமா?");
            if(!confirmReEntry) {
                return; // Cancel save action if user clicks Cancel
            }
            // If confirmed, filter out old records of this design & count to prevent duplicates
            issues = issues.filter(r => {
                let rDno = (r.designNo || r.designNumber || "").replace('#', '').trim().toLowerCase();
                let rCount = r.count ? r.count.trim().toLowerCase() : '';
                return !(rDno === cleanDNo && rCount === count.trim().toLowerCase());
            });
        }
    }

    let btn = document.getElementById('saveIssueBtn');
    let origText = btn.innerText;
    btn.innerText = "⏳ Saving to Cloud...";

    if (editingIssueId) {
        let idx = issues.findIndex(r => r.id == editingIssueId);
        if(idx !== -1) {
            issues[idx].date = dateVal;
            issues[idx].dyeingName = dyeingName;
            issues[idx].millName = issueMillName; 
            issues[idx].designNo = dNo;
            issues[idx].count = count;
            issues[idx].issueWt = issueWt.toFixed(3);
            issues[idx].status = isCompleted ? 'completed' : 'running';
        }
        editingIssueId = null;
        alert("Kora Issue Updated to Cloud Successfully! ✅☁️");
    } else {
        issues.push({
            id: Date.now() + Math.random(),
            date: dateVal,
            dyeingName: dyeingName,
            millName: issueMillName, 
            designNo: dNo,
            count: count,
            issueWt: issueWt.toFixed(3),
            status: isCompleted ? 'completed' : 'running'
        });
        alert("Kora Yarn Issued to Cloud Successfully! ✅☁️");
    }

    let designSpecs = JSON.parse(localStorage.getItem('design_specs')) || {};
    if(!designSpecs[dNo]) designSpecs[dNo] = {};
    designSpecs[dNo].status = isCompleted ? 'completed' : 'running';
    localStorage.setItem('design_specs', JSON.stringify(designSpecs));

    localStorage.setItem('kora_issue_records', JSON.stringify(issues));
    
    if (window.firebaseSave) {
        await window.firebaseSave('kora_issue_records', issues);
        await window.firebaseSave('design_specs', designSpecs);
    }

    document.getElementById('dyeingName').value = '';
    document.getElementById('issueMillName').value = ''; 
    document.getElementById('designNo').value = '';
    document.getElementById('issueCount').value = '';
    document.getElementById('issueWt').value = '';
    if(cb) cb.checked = false; 
    
    refreshAllTables();
    btn.innerText = "➕ Add Kora Issue";
}

// 📌 FIREBASE SYNC: toggleStatus for Inward
async function toggleInwardStatus(id, newStatus) {
    let msg = newStatus === 'completed' ? "Change this stock to Completed?" : "Change this stock to Running?";
    if(confirm(msg)) {
        let records = JSON.parse(localStorage.getItem('kora_stock_records')) || [];
        let index = records.findIndex(r => r.id == id);
        if(index > -1) {
            records[index].status = newStatus;
            localStorage.setItem('kora_stock_records', JSON.stringify(records));
            
            if(window.firebaseSave) {
                await window.firebaseSave('kora_stock_records', records);
            }
            refreshAllTables();
        }
    }
}

// 📌 FIREBASE SYNC: toggleStatus for Issue
async function toggleIssueStatus(id, newStatus) {
    let msg = newStatus === 'completed' ? "Change this issue to Completed?" : "Change this issue to Running?";
    if(confirm(msg)) {
        let records = JSON.parse(localStorage.getItem('kora_issue_records')) || [];
        let index = records.findIndex(r => r.id == id);
        if(index > -1) {
            records[index].status = newStatus;
            localStorage.setItem('kora_issue_records', JSON.stringify(records));
            
            let dNo = records[index].designNo;
            if(dNo) {
                let designSpecs = JSON.parse(localStorage.getItem('design_specs')) || {};
                if(!designSpecs[dNo]) designSpecs[dNo] = {};
                designSpecs[dNo].status = newStatus;
                localStorage.setItem('design_specs', JSON.stringify(designSpecs));
                if(window.firebaseSave) {
                    await window.firebaseSave('design_specs', designSpecs);
                }
            }

            if(window.firebaseSave) {
                await window.firebaseSave('kora_issue_records', records);
            }
            refreshAllTables();
        }
    }
}

// 3. REFRESH HISTORY TABLES ONLY
function refreshAllTables() {
    let inwards = JSON.parse(localStorage.getItem('kora_stock_records')) || [];
    let issues = JSON.parse(localStorage.getItem('kora_issue_records')) || [];

    let inBody = document.getElementById('inwardHistoryBody');
    inBody.innerHTML = '';
    if(inwards.length === 0) {
        inBody.innerHTML = `<tr><td colspan="6" style="padding:20px; color:#4A554A;">No inward records found.</td></tr>`;
    } else {
        [...inwards].reverse().forEach(item => {
            let dObj = new Date(item.date);
            let dStr = ("0"+dObj.getDate()).slice(-2)+"/"+("0"+(dObj.getMonth()+1)).slice(-2)+"/"+dObj.getFullYear();
            
            if(!item.status) item.status = "running";
            let statusColor = item.status === 'running' ? '#D97706' : '#526E51';
            let statusBtn = item.status === 'running' 
                ? `<button class="action-complete" onclick="toggleInwardStatus(${item.id}, 'completed')">Complete</button>` 
                : `<button class="action-running" onclick="toggleInwardStatus(${item.id}, 'running')">Running</button>`;

            inBody.innerHTML += `
                <tr>
                    <td>${dStr}</td>
                    <td style="text-align:left;"><b>${item.supplier}</b></td>
                    <td>${item.count}</td>
                    <td style="font-weight:bold; color:#10B981;">${item.weight}</td>
                    <td style="color:${statusColor}; font-weight:bold; text-transform:uppercase;">${item.status}</td>
                    <td class="action-btns">
                        ${statusBtn}
                        <button class="edit-action-btn" onclick="closeModal('inwardModal'); editInward(${item.id})">✏️</button>
                        <button class="del-action-btn" onclick="deleteInward(${item.id})">🗑️</button>
                    </td>
                </tr>
            `;
        });
    }

    let outBody = document.getElementById('issueHistoryBody');
    outBody.innerHTML = '';
    if(issues.length === 0) {
        outBody.innerHTML = `<tr><td colspan="8" style="padding:20px; color:#4A554A;">No issue records found.</td></tr>`;
    } else {
        [...issues].reverse().forEach(item => {
            let dObj = new Date(item.date);
            let dStr = ("0"+dObj.getDate()).slice(-2)+"/"+("0"+(dObj.getMonth()+1)).slice(-2)+"/"+dObj.getFullYear();
            
            if(!item.status) item.status = "running";
            let statusColor = item.status === 'running' ? '#D97706' : '#526E51';
            let statusBtn = item.status === 'running' 
                ? `<button class="action-complete" onclick="toggleIssueStatus(${item.id}, 'completed')">Complete</button>` 
                : `<button class="action-running" onclick="toggleIssueStatus(${item.id}, 'running')">Running</button>`;

            outBody.innerHTML += `
                <tr>
                    <td>${dStr}</td>
                    <td>${item.millName || '-'}</td>
                    <td><b>${item.dyeingName}</b></td>
                    <td><b style="color:#2F4F38;">${item.designNo}</b></td>
                    <td>${item.count}</td>
                    <td style="font-weight:bold; color:#D97706;">${item.issueWt}</td>
                    <td style="color:${statusColor}; font-weight:bold; text-transform:uppercase;">${item.status}</td>
                    <td class="action-btns">
                        ${statusBtn}
                        <button class="edit-action-btn" onclick="closeModal('issueModal'); editIssue(${item.id})">✏️</button>
                        <button class="del-action-btn" onclick="deleteIssue(${item.id})">🗑️</button>
                    </td>
                </tr>
            `;
        });
    }
}

// 4. EDIT & DELETE FUNCTIONS
function editInward(id) {
    let records = JSON.parse(localStorage.getItem('kora_stock_records')) || [];
    let rec = records.find(r => r.id == id);
    if(rec) {
        editingInwardId = id;
        document.getElementById('inwardDate').value = rec.date;
        document.getElementById('supplierName').value = rec.supplier;
        document.getElementById('inwardCount').value = rec.count;
        document.getElementById('inwardWt').value = rec.weight;
        
        let cb = document.getElementById('top_completed_status');
        if(cb) cb.checked = (rec.status === 'completed');
        
        document.getElementById('saveInwardBtn').innerText = "🔄 Update Kora Stock";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

async function deleteInward(id) {
    if(!confirm("Are you sure you want to delete this Inward record?")) return;
    let records = JSON.parse(localStorage.getItem('kora_stock_records')) || [];
    records = records.filter(r => r.id != id);
    localStorage.setItem('kora_stock_records', JSON.stringify(records));
    
    if (window.firebaseSave) {
        await window.firebaseSave('kora_stock_records', records);
    }
    
    refreshAllTables();
}

function editIssue(id) {
    let records = JSON.parse(localStorage.getItem('kora_issue_records')) || [];
    let rec = records.find(r => r.id == id);
    if(rec) {
        editingIssueId = id;
        document.getElementById('issueDate').value = rec.date;
        document.getElementById('dyeingName').value = rec.dyeingName;
        document.getElementById('issueMillName').value = rec.millName || ''; 
        document.getElementById('designNo').value = rec.designNo;
        document.getElementById('issueCount').value = rec.count;
        document.getElementById('issueWt').value = rec.issueWt;
        
        let cb = document.getElementById('top_completed_status');
        if(cb) cb.checked = (rec.status === 'completed');
        
        onDesignSelect(rec.designNo);

        document.getElementById('saveIssueBtn').innerText = "🔄 Update Issue";
        document.getElementById('dyeingName').scrollIntoView({behavior: 'smooth'});
    }
}

async function deleteIssue(id) {
    if(!confirm("Are you sure you want to delete this Issue record?")) return;
    let records = JSON.parse(localStorage.getItem('kora_issue_records')) || [];
    records = records.filter(r => r.id != id);
    localStorage.setItem('kora_issue_records', JSON.stringify(records));
    
    if (window.firebaseSave) {
        await window.firebaseSave('kora_issue_records', records);
    }

    refreshAllTables();
}
</script>
