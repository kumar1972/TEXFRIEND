<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Warping - TEXFRIEND ERP</title>
<script src="translator.js"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    /* 📌 Smart Background - STRICTLY NO BLACK */
    html, body { 
        width: 100%; 
        min-height: 100vh; 
        background: #030712; 
        color: #1E2B23; /* Deep Dark Green */
    }

    body { 
        padding: 12px; 
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* 📌 Main Container */
    .main-card {
        width: 100%;
        max-width: 900px;
        margin: 0;
        background: #FFFFFF;
        border: 1px solid rgba(82, 110, 81, 0.15);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 35px rgba(30, 43, 35, 0.06);
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .top-nav { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 5px; 
    }

    /* 📌 Smart Back Button */
    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #FFFFFF;
        text-decoration: none;
        font-weight: 600;
        font-size: 11px;
        background: #1A2421; 
        padding: 8px 16px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        transition: all 0.3s ease;
    }
    .back-btn:hover { background: #000000; transform: translateY(-2px); }

    #bitmapDisplayContainer { text-align: right; display: flex; align-items: center; gap: 10px; }
    #bitmapDisplayContainer img {
        max-height: 45px;
        border-radius: 6px;
        border: 1px solid rgba(82, 110, 81, 0.2);
        box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        cursor: zoom-in;
        transition: transform 0.3s;
    }
    #bitmapDisplayContainer img:hover { transform: scale(1.1); }

    /* Checkbox Styling */
    .completed-checkbox {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #D8DFD6;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid rgba(82, 110, 81, 0.4);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .completed-checkbox input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #526E51;
        margin: 0;
        padding: 0;
        border: none;
    }
    
    .completed-checkbox label {
        margin: 0;
        color: #3F5A3E;

        font-size: 12px;

    .page-title {

        margin-bottom: 5px;

        color: #2F4F38;

        position: relative;

    }
    .page-title::before {
        content: ''; position: absolute; left: 0; top: 10%; height: 80%; width: 4px;

    /* 📌 Smart Sectioning */
    .form-section {
        background: #F8FAF8;
        border: 1px solid #E2E8E2;
        border-radius: 14px;
        padding: 22px 15px 15px 15px;

    }
    
    .section-badge {

        font-weight: 700;

        letter-spacing: 0.5px;
        text-transform: uppercase;

    }
    .section-badge.blue { background: linear-gradient(135deg, #3B82F6, #1D4ED8); box-shadow: 0 4px 8px rgba(59, 130, 246, 0.25); }

    /* 📌 Clean Multi-Row Grid Layout */
    .form-grid-2 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 12px;
    }

    .form-grid-3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 12px;
    }
    
    .form-grid-4 {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
        margin-bottom: 12px;
    }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 10px; font-weight: 600; color: #4A554A; }

    /* 📌 Smart 3D Inputs */
    input, select {
        width: 100%; padding: 10px 12px; border-radius: 8px;
        border: 1px solid #D1DED1; background: #FFFFFF; color: #1E2B23;
        font-size: 11px; font-weight: 600; transition: all 0.3s ease;

    input:focus, select:focus {

    }
    input::placeholder { color: #A0AFA0; font-weight: 400; }
    input[readonly] { background: #EAF0EA; color: #4A7C59; border: 1px dashed #A0AFA0; cursor: not-allowed; }

    /* 📌 Input Group for Master Add/Del */
    .input-group-btn { display: flex; gap: 6px; width: 100%; }
    .input-group-btn select { flex: 1; }
    .btn-add-inline {
        background: #10B981; color: white; border: none; padding: 6px 10px; border-radius: 8px;
        font-weight: 700; font-size: 10px; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 5px rgba(16, 185, 129, 0.2); white-space: nowrap;
    }
    .btn-add-inline:hover { background: #059669; }
    .btn-del-inline {
        background: #FEE2E2; color: #DC2626; border: none; padding: 6px 10px;
        border-radius: 8px; font-size: 12px; cursor: pointer; transition: all 0.2s;

    }
    .btn-del-inline:hover { background: #FECACA; }

    /* 📌 Advanced Grids */

        grid-template-columns: 1.2fr 1.2fr 1fr 1fr 45px;
        gap: 6px; padding: 0 4px; margin-bottom: 8px; margin-top: 10px;
    }
    .grid-header-bot {
        display: grid;
        grid-template-columns: 1.2fr 1.2fr 1fr 1fr 1fr 70px;

    .grid-header div, .grid-header-bot div {

    }

    .line-row {
        display: grid;
        grid-template-columns: 1.2fr 1.2fr 1fr 1fr 45px;

    }
    .line-row-bot {

    .line-row input, .line-row-bot input { padding: 10px 4px; font-size: 11px; text-align: center; }

    .del-btn {
        color: white; border: none; width: 35px; height: 35px; border-radius: 8px;
        cursor: pointer; font-size: 16px; font-weight: bold; display: flex;
        align-items: center; justify-content: center; transition: all 0.2s ease;

    .del-btn:hover { background: #FECACA; transform: scale(1.05); }

    .btn-split-row {

    /* 📌 Smart Buttons */

    }
    .modal-header h3 { margin: 0; font-size: 15px; color: #1E2B23; font-weight: 700; }

    }
    .warp-sub-table th {
        background: #EAF0EA; color: #2F4F38; font-weight: 700; font-size: 10px; text-transform: uppercase;
    }
    .warp-sub-table td { color: #1E2B23; }

    .action-row {
        display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; border-top: 1px solid #F4F7F4; padding-top: 8px;

        padding: 6px 12px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; border: none;
    }

    .btn-card-del { background: #EF4444; color: white; }
    .btn-card-complete { background: #526E51; color: white; }
    .btn-card-running { background: #D97706; color: white; }

    .status-pending { color: #D97706; font-weight: 800; font-size: 9px; background: rgba(245, 158, 11, 0.1); padding: 4px 8px; border-radius: 12px; text-transform: uppercase;}

    /* 📌 Fullscreen Image Popup Modal */
    .fullscreen-modal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.9); z-index: 999999; justify-content: center; align-items: center;
        padding: 20px; flex-direction: column;
    }
    .fullscreen-modal img {
        max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 10px;
        box-shadow: 0 10px 30px rgba(255,255,255,0.2);
    }
    .close-fullscreen {
        position: absolute; top: 20px; right: 20px; background: #EF4444; color: white;
        border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 14px;
        cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
</style>

<body>

<div class="main-card">
    <div class="top-nav">
        <a href="dashboard.html" class="back-btn">← Back to Menu</a>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="completed-checkbox">
                <input type="checkbox" id="top_completed_status" onchange="quickCompleteToggle()">
                <label for="top_completed_status">Completed</label>
            </div>
            <div id="bitmapDisplayContainer"></div>
        </div>
    </div>

    <div class="page-title" style="font-size: 18px; font-weight: 800;">Warping Entry System</div>

    <!-- 📌 1. TOP SECTION (ORDER DETAILS) -->
    <div class="form-section" id="sectionTop">
        <div class="section-badge">1. Warping Order Details (Top)</div>
        
        <div class="form-grid-3">
            <div class="form-group">
                <label>Date</label>
                <input type="date" id="topDate">
            </div>
            <div class="form-group">
                <label>Warping Name (Unit)</label>
                <div class="input-group-btn">
                    <select id="topUnit"><option value="">Select Unit</option></select>
                    <button type="button" class="btn-add-inline" onclick="addWarpingUnit()">+ Add</button>
                    <button type="button" class="btn-del-inline" onclick="deleteWarpingUnit()" title="Delete Unit">🗑️</button>
                </div>
            </div>
            <div class="form-group">
                <label>Design No</label>
                <select id="topDesignNo" onchange="loadTopDesignSpecs(this.value)">

                </select>
            </div>
        </div>

        <div class="form-grid-4" style="margin-top: 10px;">
            <div class="form-group">
                <label>Reed</label>
                <input type="text" id="topReed" placeholder="0" readonly>
            </div>
            <div class="form-group">
                <label>Count</label>

            </div>
            <div class="form-group">

            </div>
            <div class="form-group">

        <div class="form-group" style="margin-top: 10px;">
            <label>Weaver To</label>

                <select id="topWeaverTo"><option value="">Select Weaver / Party</option></select>

        <div style="overflow-x: auto; margin-top: 10px;">
            <div style="min-width: 500px;">
                <div class="grid-header">
                    <div>Count</div>
                    <div>Colour</div>
                    <div>Order Wt</div>
                    <div>Issued Wt</div>
                    <div></div>
                </div>
                <div id="topLinesContainer">
                    <!-- Dynamic rows here -->
                </div>
            </div>
        </div>

        <button class="btn-main btn-save" id="saveTopBtnTxt" onclick="saveTopOrder()">Save Top Order</button>
    </div>

    <!-- 📌 2. BOTTOM SECTION (RECEIVED DETAILS) -->
    <div class="form-section" id="sectionBottom">
        <div class="section-badge blue">2. Warping Received & Loss (Bottom)</div>
        
        <div class="form-grid-2">
            <div class="form-group">
                <label>Date</label>

        <div id="botGridWrapper" style="display: none; margin-top: 10px; overflow-x: auto;">

<!-- 📌 Saved List Modal -->
<div id="savedListModal" class="overlay-modal">
    <div class="modal-content">

            <button class="close-btn" onclick="closeModal('savedListModal')">Close ✕</button>

            <!-- Cards populate here -->
        </div>

</div>

<!-- 📌 Fullscreen Image Popup Modal -->
<div id="fullscreenModal" class="fullscreen-modal" onclick="closeFullscreenImage()">
    <button class="close-fullscreen">Close ✕</button>
    <img id="fullscreenImg" src="" alt="Fullscreen Preview">

<script>
let editingWarpId = null;

function checkUserPermission() {
    let userRole = localStorage.getItem('erp_logged_role') || localStorage.getItem('user_role');
    if (userRole !== 'Administrator' && userRole !== 'Admin') {
        let permissions = JSON.parse(localStorage.getItem('user_permissions') || '{}');
        if (permissions['warping.html'] === false || permissions['warping'] === false) {
            return false;
        }
    }
    return true;
}

document.addEventListener('DOMContentLoaded', function() {
    if (!checkUserPermission()) {
        alert("Access Denied! You do not have permission to access this page. ❌");
        window.location.href = "dashboard.html";
        return;
    }

    document.getElementById('topDate').valueAsDate = new Date();
    document.getElementById('botDate').valueAsDate = new Date();
    loadWarpingUnitSuggestions();
    loadWeaverSuggestions();
    loadTopDesignDropdown();
    loadBottomOrderDropdown();
});

function openModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.style.display = 'flex';
    setTimeout(() => modal.classList.add('show'), 10);
    if(modalId === 'savedListModal') {
        renderCards(); 
    }
}

function closeModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.classList.remove('show');
    setTimeout(() => modal.style.display = 'none', 300);
}

window.openFullscreenImage = function(src) {
    if(!src || src === '' || src === 'null') return;
    document.getElementById('fullscreenImg').src = src;
    document.getElementById('fullscreenModal').style.display = 'flex';
}
window.closeFullscreenImage = function() {
    document.getElementById('fullscreenModal').style.display = 'none';
}

function loadBitmapImage() {
    let activeDesign = document.getElementById('topDesignNo').value || localStorage.getItem('selected_design_number');
    let designSpecs = JSON.parse(localStorage.getItem('design_specs') || '{}');
    let bitmapContainer = document.getElementById('bitmapDisplayContainer');
    
    let clean = activeDesign ? activeDesign.toString().replace('#', '').trim().toLowerCase() : '';
    let specKey = Object.keys(designSpecs).find(k => (k ? k.toString().replace('#', '').trim().toLowerCase() : '') === clean) || activeDesign;

    let imgHtml = '';
    if (activeDesign && designSpecs[specKey] && designSpecs[specKey].bitmap) {
        let b64 = designSpecs[specKey].bitmap;
        imgHtml = `<img src="${b64}" alt="Design Bitmap" onclick="openFullscreenImage('${b64}')" title="Click to view full screen">`;
    }
    
    bitmapContainer.innerHTML = imgHtml;
}

function cleanDesignName(str) {
    return str ? str.toString().replace('#', '').trim().toLowerCase() : '';
}

function parseYarnCount(countStr) {
    if (!countStr) return 0;
    let str = String(countStr).trim().toLowerCase().replace(/s/g, ''); 
    if (str.includes('/')) {
        let parts = str.split('/');
        if (parts.length === 2) {
            let ply = parseFloat(parts[0]) || 1;
            let singleCount = parseFloat(parts[1]) || 1;
            return singleCount / ply; 
        }
    }
    return parseFloat(str) || 0;
}

function resolvePattern(lines, ranges, type, defaultCount) {
    if(!lines || lines.length === 0) return [];
    let covered = new Array(lines.length).fill(false);
    let orderedPattern = [];

    if(ranges && ranges.length > 0) {
        ranges.forEach(r => {
            for(let s=0; s<r.set; s++) {
                for(let j = r.start; j <= r.end; j++) {
                    if(lines[j-1]) orderedPattern.push({...lines[j-1]});
                }
            }
            for(let j = r.start; j <= r.end; j++) covered[j-1] = true;
        });
    }
    lines.forEach((l, idx) => {
        if(!covered[idx]) orderedPattern.push({...l});
    });

    let exactSequence = [];
    orderedPattern.forEach(item => {
        let val = parseFloat(type === 'warp' ? item.ends : item.picks) || 0;
        let cDisplay = (item.count !== undefined && item.count !== '') ? String(item.count).trim() : String(defaultCount);
        let clr = item.color ? String(item.color).trim() : '-';
        for(let k=0; k<val; k++) exactSequence.push({ count: cDisplay, color: clr });
    });

    let summaryMap = new Map();
    let order = [];
    exactSequence.forEach(item => {
        let key = item.count.toLowerCase() + "||" + item.color.toLowerCase().trim();
        if(!summaryMap.has(key)) {
            summaryMap.set(key, { count: item.count, color: item.color.trim(), patternVal: 0 });
            order.push(key);
        }
        summaryMap.get(key).patternVal++;
    });

    return order.map(k => summaryMap.get(k));
}

function loadTopDesignSpecs(dNo) {
    loadBitmapImage();
    if(!dNo) {
        document.getElementById('topLinesContainer').innerHTML = '';
        document.getElementById('topDesignNo').value = '';
        document.getElementById('topUnit').value = '';
        document.getElementById('topWeaverTo').value = '';
        document.getElementById('topReed').value = '';
        document.getElementById('topCount').value = '';
        document.getElementById('topOrderMtrs').value = '';
        document.getElementById('topWarpingMts').value = '';
        return;
    }
    
    localStorage.setItem('selected_design_number', dNo);
    
    let cleanDNo = cleanDesignName(dNo);
    let designMastersList = JSON.parse(localStorage.getItem('design_masters_data')) || [];
    let found = designMastersList.find(d => cleanDesignName(d.name) === cleanDNo) || {};
    let specs = JSON.parse(localStorage.getItem('design_specs')) || {};
    let specKey = Object.keys(specs).find(k => cleanDesignName(k) === cleanDNo);
    let sp = specKey ? specs[specKey] : {};

    let specStatus = (sp && sp.status) ? sp.status.toLowerCase() : '';
    let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
    let rec = issues.find(r => (r.designNo === dNo || r.designNumber === dNo));

    let cb = document.getElementById('top_completed_status');
    if(specStatus === 'completed' || (rec && rec.status.toLowerCase() === 'completed')) {
        if(cb) cb.checked = true;
    } else {
        if(cb) cb.checked = false;
    }

    let reed = found.reed || sp.reed || sp.baseReed || 52;
    let count1 = found.count1 || sp.warp || '20';
    
    // 🌟 1. GET MASTER ORDER MTRS (e.g. 450) FROM YARN CALC
    let masterOrderMtr = parseFloat(sp.yarnOrderMtr || sp.orderMtr || found.orderMtr) || 0;
    
    // 🌟 2. SET EXACT ORDER MTRS (WITHOUT DEDUCTION)
    document.getElementById('topOrderMtrs').value = masterOrderMtr > 0 ? masterOrderMtr.toFixed(2) : '';

    // 🌟 3. CALCULATE WARPING MTRS EXACTLY 5% LESS FROM THE ORIGINAL MTR
    let warpingMtrsCalc = masterOrderMtr > 0 ? (masterOrderMtr * 0.95) : 0;

    let existingIssues = issues.filter(i => cleanDesignName(i.designNo) === cleanDNo);
    if (existingIssues.length > 0) {
        if(existingIssues[0].unit) document.getElementById('topUnit').value = existingIssues[0].unit;
        if(existingIssues[0].weaverTo && document.getElementById('topWeaverTo')) {
            document.getElementById('topWeaverTo').value = existingIssues[0].weaverTo;
            loadWeaverSuggestions();
            document.getElementById('topWeaverTo').value = existingIssues[0].weaverTo;
        }
        if(existingIssues[0].warpingMts && document.getElementById('topWarpingMts')) {
            document.getElementById('topWarpingMts').value = existingIssues[0].warpingMts;
        }
    } else {
        document.getElementById('topWarpingMts').value = warpingMtrsCalc > 0 ? warpingMtrsCalc.toFixed(3) : '';
        document.getElementById('topUnit').value = '';
        if(document.getElementById('topWeaverTo')) document.getElementById('topWeaverTo').value = '';
    }

    document.getElementById('topReed').value = reed;
    document.getElementById('topCount').value = count1;

    loadTopYarnLines();
}

function loadTopYarnLines() {
    let dNo = document.getElementById('topDesignNo').value;
    let container = document.getElementById('topLinesContainer');
    container.innerHTML = '';

    if(!dNo) return;

    let cleanDNo = cleanDesignName(dNo);
    let designMastersList = JSON.parse(localStorage.getItem('design_masters_data')) || [];
    let found = designMastersList.find(d => cleanDesignName(d.name) === cleanDNo) || {};
    let specs = JSON.parse(localStorage.getItem('design_specs')) || {};
    let specKey = Object.keys(specs).find(k => cleanDesignName(k) === cleanDNo);
    let sp = specKey ? specs[specKey] : {};

    let reed = parseFloat(document.getElementById('topReed').value) || parseFloat(found.reed || sp.reed || sp.baseReed) || 52;
    let baseWidth = parseFloat(found.width || sp.width || sp.baseWidth) || 66.92;
    let totalWarpEnds = Math.round(reed * baseWidth);
    
    // Using the editable Warping Mtrs for Weight calculation
    let warpingMts = parseFloat(document.getElementById('topWarpingMts').value) || 0;
    let defaultWarpCount = found.count1 || sp.warp || '20';

    let warpList = resolvePattern(found.warpLines || [], found.warpRanges || [], 'warp', defaultWarpCount);

    let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
    let existingIssues = issues.filter(i => cleanDesignName(i.designNo) === cleanDNo);
    let dyeingReceives = JSON.parse(localStorage.getItem('dyeing_receive_records')) || [];

    if(warpList.length > 0) {
        let totalPatternVal = warpList.reduce((a, b) => a + b.patternVal, 0) || 1;
        warpList.forEach(item => {
            let calcCount = parseYarnCount(item.count) || parseYarnCount(defaultWarpCount) || 20;
            let totalEndsForColor = item.patternVal * Math.floor(totalWarpEnds / totalPatternVal);
            let weightKg = (totalEndsForColor * warpingMts) / (1693.33 * calcCount);

            let matchedExisting = existingIssues.find(i => 
                i.count && item.count && i.count.trim().toLowerCase() === item.count.trim().toLowerCase() &&
                i.color && item.color && i.color.trim().toLowerCase() === item.color.trim().toLowerCase()
            );

            let matchedDyeRec = dyeingReceives.find(r => 
                cleanDesignName(r.designNo) === cleanDNo && 
                r.color && item.color && 
                r.color.trim().toLowerCase() === item.color.trim().toLowerCase()
            );

            if (!matchedDyeRec) {
                matchedDyeRec = dyeingReceives.find(r => cleanDesignName(r.designNo) === cleanDNo);
            }

            let initialWt = matchedExisting ? parseFloat(matchedExisting.issueWt) : 
                           (matchedDyeRec ? parseFloat(matchedDyeRec.receivedWt || matchedDyeRec.netWt) : weightKg);

            let row = document.createElement('div');
            row.className = 'line-row';
            row.innerHTML = `
                <input type="text" class="t-count" value="${item.count}" readonly>
                <input type="text" class="t-color" value="${item.color}" readonly>
                <input type="number" class="t-orderwt" value="${weightKg.toFixed(3)}" step="0.001" readonly>
                <input type="number" class="t-isswt" value="${initialWt.toFixed(3)}" step="0.001">
                <button class="del-btn" onclick="this.parentElement.remove()">×</button>
            `;
            container.appendChild(row);
        });
    }
}

    if(confirm(msg)) {
        let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];

        if(index > -1) {
            issues[index].status = newStatus;

            }

    }
}

async function editWarpingRecord(issueId, isReceived) {
    if (!checkUserPermission()) { alert("Access Denied! You do not have permission. ❌"); return; }

    let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
    let receives = JSON.parse(localStorage.getItem('warping_receive_records')) || [];
    
    if (isReceived) {
        let recIndex = receives.findIndex(r => r.issueId == issueId);
        if(recIndex !== -1) {
            let recRecord = receives[recIndex];
            receives.splice(recIndex, 1);
            localStorage.setItem('warping_receive_records', JSON.stringify(receives));
            if (window.firebaseSave) window.firebaseSave('warping_receive_records', receives);
            
            document.getElementById('botDate').value = recRecord.botDate;
            document.getElementById('botActiveOrderSelect').value = `${recRecord.designNo}_${recRecord.unit}`;
            document.getElementById('botDesignNo').value = recRecord.designNo;
            document.getElementById('botUnitName').value = recRecord.unit;
            closeModal('savedListModal');
            loadBottomRows();
            
            setTimeout(() => {
                let rows = document.querySelectorAll('#botLinesContainer .line-row-bot');
                rows.forEach(row => {
                    if(row.getAttribute('data-id') == issueId) {
                        row.querySelector('.b-received').value = recRecord.receivedWt;
                    }
                });
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
            renderCards();
        }
    } else {
        let issueIndex = issues.findIndex(iss => iss.id == issueId);
        if(issueIndex !== -1) {
            let issRecord = issues[issueIndex];
            issues.splice(issueIndex, 1);
            localStorage.setItem('warping_issue_records', JSON.stringify(issues));
            if (window.firebaseSave) window.firebaseSave('warping_issue_records', issues);
            
            document.getElementById('topDate').value = issRecord.date;
            document.getElementById('topUnit').value = issRecord.unit;
            document.getElementById('topDesignNo').value = issRecord.designNo;
            if(issRecord.weaverTo && document.getElementById('topWeaverTo')) document.getElementById('topWeaverTo').value = issRecord.weaverTo;
            if(issRecord.warpingMts && document.getElementById('topWarpingMts')) document.getElementById('topWarpingMts').value = issRecord.warpingMts;
            
            let cb = document.getElementById('top_completed_status');
            if(cb) cb.checked = (issRecord.status === 'completed');
            
            loadTopDesignSpecs(issRecord.designNo);
            
            setTimeout(() => {
                let rows = document.querySelectorAll('#topLinesContainer .line-row');
                rows.forEach(row => {
                    if(row.querySelector('.t-count').value === issRecord.count && row.querySelector('.t-color').value === issRecord.color) {
                        row.querySelector('.t-isswt').value = issRecord.issueWt;
                    }
                });
            }, 100);

            closeModal('savedListModal');
            renderCards();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }
}

async function deleteWarpingRecord(issueId, isReceived) {
    if (!checkUserPermission()) { alert("Access Denied! You do not have permission. ❌"); return; }
    if(!confirm("Are you sure you want to delete this record?")) return;
    
    let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
    let receives = JSON.parse(localStorage.getItem('warping_receive_records')) || [];
    
    if (isReceived) {
        let recIndex = receives.findIndex(r => r.issueId == issueId);
        if(recIndex !== -1) receives.splice(recIndex, 1);
    } else {
        let issueIndex = issues.findIndex(iss => iss.id == issueId);
        if(issueIndex !== -1) issues.splice(issueIndex, 1);
    }
    
    localStorage.setItem('warping_receive_records', JSON.stringify(receives));
    localStorage.setItem('warping_issue_records', JSON.stringify(issues));
    
    if (window.firebaseSave) {
        await window.firebaseSave('warping_receive_records', receives);
        await window.firebaseSave('warping_issue_records', issues);
    }
    
    loadBottomOrderDropdown();
    renderCards();
    document.getElementById('botLinesContainer').innerHTML = '';
    document.getElementById('botGridWrapper').style.display = 'none';
    document.getElementById('botActiveOrderSelect').value = '';
}

function renderCards() {
    let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
    let receives = JSON.parse(localStorage.getItem('warping_receive_records')) || [];
    let activeDesign = document.getElementById('topDesignNo').value;
    let designSpecs = JSON.parse(localStorage.getItem('design_specs') || '{}');

    let container = document.getElementById('savedCardsContainer');
    if(!container) return;
    container.innerHTML = '';

    let filteredIssues = issues;
    if(activeDesign) {
        filteredIssues = issues.filter(i => cleanDesignName(i.designNo) === cleanDesignName(activeDesign));
    }

    if(filteredIssues.length === 0) {
        container.innerHTML = `<div style="padding:20px; text-align:center; color:#A0AFA0; font-weight:600;">No Saved Warping Data found for this Design.</div>`;
        return;
    }

    let groupMap = new Map();
    filteredIssues.forEach(issue => {
        let groupKey = `${cleanDesignName(issue.designNo)}_${issue.unit}`;
        if(!groupMap.has(groupKey)) {
            groupMap.set(groupKey, {
                date: issue.date,
                unit: issue.unit,
                designNo: issue.designNo,
                weaverTo: issue.weaverTo,
                warpingMts: issue.warpingMts,
                status: issue.status || 'running',
                items: []
            });
        }
        groupMap.get(groupKey).items.push(issue);
    });

    groupMap.forEach((group) => {
        let dateObj = new Date(group.date);
        let dateStr = ("0" + dateObj.getDate()).slice(-2) + "/" + ("0" + (dateObj.getMonth() + 1)).slice(-2) + "/" + dateObj.getFullYear();

        let cleanDNo = cleanDesignName(group.designNo);
        let bitmapUrl = '';
        let specKey = Object.keys(designSpecs).find(k => cleanDesignName(k) === cleanDNo);
        if(specKey && designSpecs[specKey].bitmap) {
            bitmapUrl = designSpecs[specKey].bitmap;
        }

        let imgTag = bitmapUrl ? `<img src="${bitmapUrl}" class="warp-card-img" onclick="openFullscreenImage('${bitmapUrl}')" title="Click to zoom">` : `<div style="width:45px; height:45px; background:#EAF0EA; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:9px; color:#4A7C59; font-weight:bold;">No Img</div>`;

        let subTableRows = '';
        group.items.forEach((item, index) => {
            let matchingRecs = receives.filter(r => r.issueId == item.id);
            let rcvdTotal = matchingRecs.reduce((sum, r) => sum + parseFloat(r.receivedWt||0), 0);
            
            let rcvWtStr = rcvdTotal > 0 ? `<b style="color:#10B981;">${rcvdTotal.toFixed(3)}</b>` : `<span class="status-pending">Pending</span>`;
            let issWtNum = parseFloat(item.issueWt) || 0;
            
            let excessStr = "-";
            if(rcvdTotal > 0) {
                let diff = issWtNum - rcvdTotal;
                if(Math.abs(diff) > 0.001) {
                    excessStr = `<span class="excess-text">${diff.toFixed(3)}</span>`;
                } else {
                    excessStr = `<span style="color:#10B981; font-weight:bold;">0.000</span>`;
                }
            }

            subTableRows += `
                <tr>
                    <td style="width: 45px;">${index + 1}</td>
                    <td style="width: 70px;"><b>${item.count}</b></td>
                    <td>${item.color}</td>
                    <td style="width: 80px;">${item.orderWt}</td>
                    <td style="width: 85px;"><b>${item.issueWt}</b></td>
                    <td style="width: 85px;">${rcvWtStr}</td>
                    <td style="width: 75px;">${excessStr}</td>
                </tr>
            `;
        });

        let statusBtnClass = group.status === 'running' ? 'btn-card-complete' : 'btn-card-running';
        let statusBtnText = group.status === 'running' ? 'Complete' : 'Running';
        let nextStatus = group.status === 'running' ? 'completed' : 'running';

        let card = document.createElement('div');
        card.className = 'saved-warp-card';
        card.innerHTML = `
            <div class="saved-warp-top">
                <div style="display:flex; align-items:center; gap:10px;">
                    ${imgTag}
                    <div>
                        <div style="font-size:12px; font-weight:800; color:#2F4F38;">${group.designNo}</div>
                        <div style="font-size:10px; color:#64748B;">Date: ${dateStr}</div>
                    </div>
                </div>
                <div style="text-align:right;">
                    <span style="font-size:10px; font-weight:700; text-transform:uppercase; background:${group.status === 'completed' ? '#ECFDF5' : '#FFFBEB'}; color:${group.status === 'completed' ? '#059669' : '#D97706'}; padding:4px 8px; border-radius:6px; border:1px solid currentColor;">${group.status}</span>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 11px; color: #1E2B23; background:#F8FAF8; padding:8px; border-radius:8px;">
                <div><span>Warping Name:</span> <b>${group.unit || '-'}</b></div>
                <div><span>Weaver To:</span> <b>${group.weaverTo || '-'}</b></div>
                <div><span>Warping Mtr:</span> <b>${group.warpingMts || '-'} Mts</b></div>
            </div>

            <div class="table-container">
                <table class="warp-sub-table">
                    <thead>
                        <tr>
                            <th style="width: 45px;">S.No</th>
                            <th style="width: 70px;">Count</th>
                            <th>Colour</th>
                            <th style="width: 80px;">Order Wt</th>
                            <th style="width: 85px;">Issued Wt</th>
                            <th style="width: 85px;">Rcvd Wt</th>
                            <th style="width: 75px;">Excess</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${subTableRows}
                    </tbody>
                </table>
            </div>

            <div class="action-row">
                <button class="${statusBtnClass}" onclick="toggleStatusForGroup('${group.designNo}', '${group.unit}', '${nextStatus}')">${statusBtnText}</button>
                <button class="btn-card-edit" onclick="editWarpingGroup('${group.designNo}', '${group.unit}')">Edit</button>
                <button class="btn-card-del" onclick="deleteWarpingGroup('${group.designNo}', '${group.unit}')">Delete</button>
            </div>
        `;
        container.appendChild(card);
    });
}

async function toggleStatusForGroup(dNo, unitName, newStatus) {
    if (!checkUserPermission()) { alert("Access Denied! You do not have permission. ❌"); return; }

    let msg = newStatus === 'completed' ? "Change this design order to Completed?" : "Change this design order to Running?";
    if(confirm(msg)) {
        let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
        issues.forEach(r => {
            if(cleanDesignName(r.designNo) === cleanDesignName(dNo) && r.unit === unitName) {
                r.status = newStatus;
            }
        });

        localStorage.setItem('warping_issue_records', JSON.stringify(issues));
        
        let designSpecs = JSON.parse(localStorage.getItem('design_specs')) || {};
        let cleanKey = dNo ? dNo.toString().replace('#', '').trim().toLowerCase() : '';
        let specKey = Object.keys(designSpecs).find(k => (k ? k.toString().replace('#', '').trim().toLowerCase() : '') === cleanKey) || dNo;

        if(!designSpecs[specKey]) designSpecs[specKey] = {};
        designSpecs[specKey].status = newStatus;
        localStorage.setItem('design_specs', JSON.stringify(designSpecs));

        if(window.firebaseSave) {
            await window.firebaseSave('warping_issue_records', issues);
            await window.firebaseSave('design_specs', designSpecs);
        }
        if (window.firebaseSaveIndividual) {
            await window.firebaseSaveIndividual(specKey, designSpecs[specKey]);
        }
        renderCards();
    }
}

async function editWarpingGroup(dNo, unitName) {
    if (!checkUserPermission()) { alert("Access Denied! You do not have permission. ❌"); return; }

    let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
    let targetIssue = issues.find(i => cleanDesignName(i.designNo) === cleanDesignName(dNo) && i.unit === unitName);
    
    if(targetIssue) {
        document.getElementById('topDate').value = targetIssue.date;
        document.getElementById('topUnit').value = targetIssue.unit;
        document.getElementById('topDesignNo').value = targetIssue.designNo;
        if(targetIssue.weaverTo && document.getElementById('topWeaverTo')) document.getElementById('topWeaverTo').value = targetIssue.weaverTo;
        if(targetIssue.warpingMts && document.getElementById('topWarpingMts')) document.getElementById('topWarpingMts').value = targetIssue.warpingMts;
        
        let cb = document.getElementById('top_completed_status');
        if(cb) cb.checked = (targetIssue.status === 'completed');
        
        loadTopDesignSpecs(targetIssue.designNo);
        closeModal('savedListModal');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

async function deleteWarpingGroup(dNo, unitName) {
    if (!checkUserPermission()) { alert("Access Denied! You do not have permission. ❌"); return; }
    if(!confirm("Are you sure you want to delete this entire warping entry?")) return;
    
    let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
    let receives = JSON.parse(localStorage.getItem('warping_receive_records')) || [];
    
    let targetIds = issues.filter(i => cleanDesignName(i.designNo) === cleanDesignName(dNo) && i.unit === unitName).map(i => i.id);
    
    issues = issues.filter(i => !(cleanDesignName(i.designNo) === cleanDesignName(dNo) && i.unit === unitName));
    receives = receives.filter(r => !targetIds.includes(parseFloat(r.issueId)));
    
    localStorage.setItem('warping_receive_records', JSON.stringify(receives));
    localStorage.setItem('warping_issue_records', JSON.stringify(issues));
    
    if (window.firebaseSave) {
        await window.firebaseSave('warping_receive_records', receives);
        await window.firebaseSave('warping_issue_records', issues);
    }
    
    loadBottomOrderDropdown();
    renderCards();
}
