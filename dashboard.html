<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - TEXFRIEND ERP Pro</title>
    <script src="translator.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        html, body { width: 100%; min-height: 100vh; background: #030712; color: #F8FAFC; overflow-x: hidden; transition: background 0.3s, color 0.3s; }
        body { padding: 12px; display: flex; flex-direction: column; align-items: center; }
        
        .top-header-container { 
            width: 100%; max-width: 1100px; display: flex; justify-content: space-between; 
            align-items: center; 
            padding: 20px 25px; 
            min-height: 110px;  
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px);
            border-radius: 20px; margin-bottom: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.15); 
            border: 2px solid rgba(56, 189, 248, 0.4);
            position: relative; z-index: 50;
            transition: all 0.3s;
        }

        .top-header-container h3 { 
            flex: 1; 
            display: flex; align-items: center; justify-content: flex-start; 
            font-size: 30px; 
            font-weight: 900; 
            letter-spacing: 1.2px; 
            margin: 0; 
            line-height: 1.2;
            background: linear-gradient(135deg, #38BDF8, #818CF8, #C084FC); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-transform: uppercase; 
        }
        
        #companyLogoContainer { 
            flex: 0 0 auto; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; 
        }
        #companyLogoContainer img {
            height: 70px; width: 70px;  
            border-radius: 12px; border: 2px solid #38BDF8;
            object-fit: cover; box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); transition: transform 0.3s;
        }
        #companyLogoContainer img:hover { transform: scale(1.1) rotate(5deg); }
        .logo-placeholder { 
            height: 70px; width: 70px;  
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; background: rgba(56, 189, 248, 0.08); border-radius: 12px; 
            border: 2px dashed #38BDF8; color: #38BDF8; font-weight: 800; text-align: center; 
        }

        .header-right-actions { 
            flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 10px; 
        }
        .live-clock-box { text-align: right; background: rgba(56,189,248,0.08); padding: 6px 12px; border-radius: 12px; border: 1px solid rgba(56,189,248,0.3); }
        .live-clock { font-size: 11.5px; font-weight: 800; color: #38BDF8; letter-spacing: 0.5px; }
        .live-date { font-size: 9px; font-weight: 600; color: #94A3B8; }

        .profile-dropdown-wrapper { position: relative; display: inline-block; }

        .dropdown-btn { 
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(129, 140, 248, 0.2)); 
            border: 1.5px solid #38BDF8; 
            color: white; font-size: 16px; padding: 8px 14px; border-radius: 12px; 
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            display: flex; align-items: center; justify-content: center;
        }
        .dropdown-btn:hover { transform: scale(1.1); }

        .dropdown-menu { 
            position: absolute; right: 0; top: calc(100% + 10px); background: #0F172A; color: #F8FAFC; 
            border-radius: 16px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95); 
            width: 240px; z-index: 999999; overflow: hidden; border: 2px solid #38BDF8; 
            display: none;
        }
        .dropdown-menu a { 
            display: block; padding: 13px 18px; text-decoration: none; color: #CBD5E1; 
            font-size: 12px; font-weight: 600; border-bottom: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.2s ease; 
        }
        .dropdown-menu a:hover { background: rgba(56, 189, 248, 0.2); color: #38BDF8; padding-left: 24px; }
        .dropdown-menu a:last-child { border-bottom: none; color: #F87171; }
        .dropdown-menu a:last-child:hover { background: rgba(248, 113, 113, 0.2); color: #EF4444; }
        .user-info-box { padding: 14px 18px; background: #030712; border-bottom: 1px solid rgba(255, 255, 255, 0.08); font-size: 11px; font-weight: 600; color: #94A3B8; line-height: 1.6; }

        .container { 
            width: 100%; max-width: 1100px; margin: 0; background: rgba(11, 17, 32, 0.9); 
            backdrop-filter: blur(20px);
            padding: 22px; border-radius: 28px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9); 
            border: 2px solid rgba(56, 189, 248, 0.35); 
            flex: 1; display: flex; flex-direction: column; gap: 18px; position: relative; z-index: 10;
            transition: all 0.3s;
        }

        .search-bar-wrapper { position: relative; width: 100%; }
        .search-bar-box {
            display: flex; gap: 10px; background: #0F172A; padding: 10px 14px; border-radius: 16px;
            border: 2px solid #38BDF8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); align-items: center;
        }
        .search-bar-box input {
            flex: 1; background: transparent; border: none; color: #FFF; font-size: 12.5px; outline: none; font-weight: 600;
        }
        .search-bar-box input::placeholder { color: #64748B; }
        .search-bar-box button {
            background: linear-gradient(135deg, #38BDF8, #0284C7); color: #0F172A; border: none; padding: 8px 18px; border-radius: 12px;
            font-weight: 900; font-size: 11.5px; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 15px rgba(56,189,248,0.4);
        }
        .search-bar-box button:hover { transform: translateY(-2px); }

        .search-suggestions-dropdown {
            position: absolute; top: 100%; left: 0; width: 100%; background: #0F172A;
            border: 2px solid #38BDF8; border-radius: 14px; margin-top: 6px;
            max-height: 180px; overflow-y: auto; z-index: 999; display: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
        }
        .search-suggestion-item {
            padding: 11px 16px; font-size: 11.5px; color: #CBD5E1; cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s;
        }
        .search-suggestion-item:hover { background: rgba(56, 189, 248, 0.25); color: #38BDF8; padding-left: 20px; }

        .stats-banner {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; background: #0F172A;
            padding: 14px; border-radius: 18px; border: 2px solid rgba(255,255,255,0.08); text-align: center;
        }
        .stat-box {
            background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
            padding: 12px; border-radius: 14px; border: 1.5px solid rgba(56,189,248,0.25);
            position: relative; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .stat-box:hover { transform: translateY(-3px); border-color: #38BDF8; }
        .stat-box::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #38BDF8, #EC4899);
        }
        .stat-box span { display: block; }
        .stat-title { font-size: 10px; color: #94A3B8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }
        .stat-value { font-size: 16px; color: #38BDF8; font-weight: 900; margin-top: 4px; text-shadow: 0 0 10px rgba(56,189,248,0.4); }
        
        .master-setup-btn {
            background: linear-gradient(135deg, #3B82F6, #8B5CF6, #EC4899);
            color: white; padding: 18px; border-radius: 20px;
            text-decoration: none; font-weight: 900; font-size: 13.5px;
            display: flex; justify-content: center; align-items: center; gap: 14px;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.4);
            transition: all 0.3s ease; border: 2px solid rgba(255, 255, 255, 0.4); width: 100%;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
        }
        .master-setup-btn:hover { transform: translateY(-3px); filter: brightness(1.15); }

        .menu-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 2px; }
        
        /* 🌟 FULL GLASSMORPHISM + EMBOSS + INNER BORDER EFFECT FOR MENU BUTTONS */
        .menu-btn { 
            color: #FFFFFF; 
            padding: 22px 12px; 
            border-radius: 20px; 
            text-decoration: none; 
            font-weight: 900; 
            text-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            font-size: 12px; 
            position: relative; 
            overflow: hidden; 
            cursor: pointer;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.35); 
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.5), 
                        inset 0 2px 4px rgba(255, 255, 255, 0.4), 
                        inset 0 -3px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 🌟 THIN INNER BORDER LINE (உள் பக்க மெல்லிய பார்டர் கோடு) */
        .menu-btn::before {
            content: '';
            position: absolute;
            top: 4px; 
            left: 4px; 
            right: 4px; 
            bottom: 4px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            pointer-events: none;
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.15);
        }

        /* 🌟 HOVER & EMBOSS CLICK EFFECT (கிளிக் செய்யும் போது உள்நோக்கி அமுங்கும் எஃபெக்ட்) */
        .menu-btn:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.7), 
                        0 0 20px rgba(255, 255, 255, 0.3),
                        inset 0 3px 6px rgba(255, 255, 255, 0.6); 
            border-color: rgba(255, 255, 255, 0.8); 
        }

        .menu-btn:active {
            transform: translateY(2px) scale(0.97); /* Embossed Pressed Down Effect */
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.6), 
                        inset 0 -1px 2px rgba(255, 255, 255, 0.3),
                        0 4px 10px rgba(0, 0, 0, 0.4);
            filter: brightness(0.9);
        }

        .menu-btn .tab-icon { font-size: 30px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8)); transition: transform 0.3s; }
        .menu-btn:hover .tab-icon { transform: scale(1.12) rotate(4deg); }

        /* 🎨 GLASS GRADIENT COLOR PALETTE FOR 12 BOXES */
        .btn-theme-1 { background: linear-gradient(135deg, rgba(29, 78, 216, 0.75), rgba(59, 130, 246, 0.6)); border-color: rgba(147, 197, 253, 0.6); } 
        .btn-theme-2 { background: linear-gradient(135deg, rgba(4, 120, 87, 0.75), rgba(16, 185, 129, 0.6)); border-color: rgba(110, 231, 183, 0.6); } 
        .btn-theme-3 { background: linear-gradient(135deg, rgba(109, 40, 217, 0.75), rgba(139, 92, 246, 0.6)); border-color: rgba(196, 181, 253, 0.6); } 
        .btn-theme-4 { background: linear-gradient(135deg, rgba(194, 65, 12, 0.75), rgba(249, 115, 22, 0.6)); border-color: rgba(253, 186, 116, 0.6); } 
        .btn-theme-5 { background: linear-gradient(135deg, rgba(190, 24, 93, 0.75), rgba(236, 72, 153, 0.6)); border-color: rgba(244, 114, 182, 0.6); } 
        .btn-theme-6 { background: linear-gradient(135deg, rgba(15, 118, 110, 0.75), rgba(20, 184, 166, 0.6)); border-color: rgba(94, 234, 212, 0.6); } 
        .btn-theme-7 { background: linear-gradient(135deg, rgba(67, 56, 202, 0.75), rgba(99, 102, 241, 0.6)); border-color: rgba(165, 180, 252, 0.6); } 
        .btn-theme-8 { background: linear-gradient(135deg, rgba(180, 83, 9, 0.75), rgba(245, 158, 11, 0.6)); border-color: rgba(252, 211, 77, 0.6); } 
        .btn-theme-9 { background: linear-gradient(135deg, rgba(159, 18, 57, 0.75), rgba(225, 29, 72, 0.6)); border-color: rgba(253, 164, 175, 0.6); } 
        .btn-theme-10 { background: linear-gradient(135deg, rgba(21, 128, 61, 0.75), rgba(34, 197, 94, 0.6)); border-color: rgba(134, 239, 172, 0.6); } 
        .btn-theme-11 { background: linear-gradient(135deg, rgba(88, 28, 135, 0.75), rgba(147, 51, 234, 0.6)); border-color: rgba(216, 180, 254, 0.6); } 
        .btn-theme-12 { background: linear-gradient(135deg, rgba(3, 105, 161, 0.75), rgba(14, 165, 233, 0.6)); border-color: rgba(125, 211, 252, 0.6); } 

        .menu-grid .full-span { grid-column: span 3; flex-direction: row; justify-content: center; gap: 16px; padding: 18px; font-size: 13.5px; background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.8)); border: 2px solid #38BDF8; box-shadow: 0 10px 25px rgba(56,189,248,0.3); }
        .menu-grid .full-span .tab-icon { font-size: 24px; }
        
        .menu-grid .btn-m-all { 
            background: linear-gradient(135deg, rgba(194, 65, 12, 0.85), rgba(217, 119, 6, 0.85), rgba(236, 72, 153, 0.85), rgba(139, 92, 246, 0.85));
            background-size: 300% 300%;
            animation: totalSavedGlow 4s ease infinite;
            grid-column: span 3; text-align: center; justify-content: center; flex-direction: row; gap: 16px; 
            padding: 18px; font-size: 13.5px; border-radius: 20px; 
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.5); 
            border: 2px solid #FCD34D; 
        }
        @keyframes totalSavedGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .menu-grid .btn-m-all .tab-icon { font-size: 24px; }
        
        .menu-grid .btn-matrix { 
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.8)); 
            grid-column: span 3; text-align: center; justify-content: center; flex-direction: row; gap: 16px; 
            padding: 18px; font-size: 13.5px; border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3); 
            border: 2px solid #38BDF8; 
            margin-bottom: 2px;
        }
        .menu-grid .btn-matrix .tab-icon { font-size: 24px; }

        .delayed-orders-section {
            margin-top: 12px;
            background: linear-gradient(135deg, rgba(153, 27, 27, 0.25), rgba(69, 10, 10, 0.4));
            border: 2px solid #EF4444;
            outline: 2px dashed rgba(239, 68, 68, 0.6);
            outline-offset: 4px;
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 20px 45px rgba(239, 68, 68, 0.3);
        }
        .delayed-orders-section h3 {
            color: #F87171;
            font-size: 13px;
            font-weight: 900;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .delayed-table-container {
            width: 100%;
            border-radius: 14px;
            overflow-x: auto;
            border: 1.5px solid rgba(239, 68, 68, 0.5);
            background: #030712;
        }
        .delayed-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11.5px;
            text-align: center;
            white-space: nowrap;
        }
        .delayed-table th, .delayed-table td {
            padding: 11px 14px;
            border-bottom: 1px solid rgba(239, 68, 68, 0.2);
            color: #FCA5A5;
        }
        .delayed-table th {
            background: rgba(239, 68, 68, 0.3);
            color: #F87171;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 10.5px;
        }
        .delayed-table tr:last-child td { border-bottom: none; }
        .red-alert-text { color: #F87171; font-weight: 900; }

        @media (max-width: 768px) {
            .top-header-container { flex-wrap: wrap; justify-content: center; gap: 15px; padding: 18px; }
            .top-header-container h3 { flex: 1 1 100%; text-align: center; margin-bottom: 5px; justify-content: center; }
            #companyLogoContainer { flex: 1 1 100%; justify-content: center; margin-bottom: 5px; }
            .header-right-actions { flex: 1 1 100%; justify-content: center; }
            
            .menu-grid { grid-template-columns: repeat(2, 1fr); }
            .menu-grid .full-span, .menu-grid .btn-m-all, .menu-grid .btn-matrix { grid-column: span 2; }
            .stats-banner { grid-template-columns: repeat(1, 1fr); }
        }
    </style>
</head>
<body>

    <div class="top-header-container">
        <h3 id="appHeaderTitle">TEXFRIEND PRO</h3>
        
        <div id="companyLogoContainer" onclick="navigateToPage('settings.html')" title="Click to open settings"></div>

        <div class="header-right-actions">
            <div class="live-clock-box">
                <div id="liveClock" class="live-clock">12:00:00 AM</div>
                <div id="liveDate" class="live-date">01 Jan 2026</div>
            </div>
            
            <!-- 🌟 THEME DROPDOWN -->
            <div class="profile-dropdown-wrapper">
                <button onclick="toggleThemeMenu(event)" class="dropdown-btn" style="margin-right: 5px;" title="Change Theme">🎨</button>
                <div id="themeDropdownMenu" class="dropdown-menu">
                    <div class="user-info-box" style="color: #FFF;">🎨 Select Theme</div>
                    <a href="#" onclick="setTheme('dark')"><span style="color:#38BDF8; font-size:16px;">●</span> Dark Neon</a>
                    <a href="#" onclick="setTheme('softgreen')"><span style="color:#4A7C59; font-size:16px;">●</span> Soft Green</a>
                    <a href="#" onclick="setTheme('darkgreen')"><span style="color:#059669; font-size:16px;">●</span> Dark Green</a>
                    <a href="#" onclick="setTheme('sunset')"><span style="color:#F59E0B; font-size:16px;">●</span> Sunset Gold</a>
                </div>
            </div>

            <!-- PROFILE DROPDOWN -->
            <div class="profile-dropdown-wrapper">
                <button onclick="toggleMenu(event)" class="dropdown-btn">👨‍💼</button>
                <div id="dropdownMenu" class="dropdown-menu">
                    <div id="userInfoBox" class="user-info-box"></div>
                    <a href="#" onclick="navigateToPage('settings.html')">⚙️ Settings</a>
                    <a href="#" onclick="clearCacheData()">🔄 Clear Cache</a>
                    <a href="#" onclick="logoutUser()">🚪 Log Out</a>
                </div>
            </div>
        </div>
    </div>

    <div class="container" id="mainContainer">
        <div class="search-bar-wrapper">
            <div class="search-bar-box">
                <span style="font-size: 15px;">🔍</span>
                <input type="text" id="quickSearchInput" placeholder="Quick Search Design No / Party Name..." oninput="handleSearchInput(this.value)">
                <button onclick="quickSearchDesign()">Go Print</button>
            </div>
            <div id="searchSuggestions" class="search-suggestions-dropdown"></div>
        </div>

        <div class="stats-banner">
            <div class="stat-box">
                <span class="stat-title">Saved Designs</span>
                <span class="stat-value" id="statDesignsCount">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-title">Active Orders</span>
                <span class="stat-value" id="statOrdersCount">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-title">Delayed Alerts</span>
                <span class="stat-value" id="statDelayedCount" style="color: #F87171;">0</span>
            </div>
        </div>

        <button onclick="navigateToPage('design_master.html')" class="master-setup-btn">
            <span style="font-size: 24px;">🎨</span> Create / Edit Design Master Setup
        </button>

        <div class="menu-grid">
            <button onclick="navigateToPage('Party_Orders.html')" class="menu-btn btn-theme-1"><span class="tab-icon">📦</span> 1. Party Orders</button>
            <button onclick="navigateToPage('warp_entry.html')" class="menu-btn btn-theme-2"><span class="tab-icon">📐</span> 2. Warp Entry</button>
            <button onclick="navigateToPage('weft_entry.html')" class="menu-btn btn-theme-3"><span class="tab-icon">🧶</span> 2.1 Weft Entry</button>
            <button onclick="navigateToPage('kora_yarn.html')" class="menu-btn btn-theme-4"><span class="tab-icon">🧵</span> 3. Kora</button>
            <button onclick="navigateToPage('dyeing_issue.html')" class="menu-btn btn-theme-5"><span class="tab-icon">🧶</span> 4. Dyeing Issue</button>
            <button onclick="navigateToPage('dyeing_receive.html')" class="menu-btn btn-theme-6"><span class="tab-icon">📥</span> 4.1 Dyeing Receive</button>
            <button onclick="navigateToPage('warping.html')" class="menu-btn btn-theme-7"><span class="tab-icon">📏</span> 5. Warping</button>
            <button onclick="navigateToPage('weaving.html')" class="menu-btn btn-theme-8"><span class="tab-icon">🏭</span> 6. Weaving</button>
            <button onclick="navigateToPage('weaving_receive.html')" class="menu-btn btn-theme-6"><span class="tab-icon">📥</span> 6.1 Weaving Receive</button>
            <button onclick="navigateToPage('washing.html')" class="menu-btn btn-theme-9"><span class="tab-icon">🌊</span> 7. Washing</button>
            <button onclick="navigateToPage('Despatch.html')" class="menu-btn btn-theme-10"><span class="tab-icon">📦</span> 8. Despatch</button>
            <button onclick="navigateToPage('report.html')" class="menu-btn btn-theme-11"><span class="tab-icon">📊</span> 9. Report</button>
            <button onclick="navigateToPage('invoice.html')" class="menu-btn btn-theme-12"><span class="tab-icon">📄</span> Invoice / Bill</button>
            
            <button onclick="navigateToPage('yarn_calc.html')" class="menu-btn btn-theme-8 full-span"><span class="tab-icon">🧵</span> Yarn Calculation</button>
            <button onclick="navigateToPage('design_sheet_print.html')" class="menu-btn btn-theme-2 full-span"><span class="tab-icon">📋</span> Design Sheet Print</button>

            <button onclick="navigateToPage('design_list.html?type=all&status=all')" class="menu-btn btn-m-all">
                <span class="tab-icon">✨</span> Total Saved Designs List ✨
            </button>
                
            <button onclick="navigateToPage('process_matrix.html')" class="menu-btn btn-matrix">
                <span class="tab-icon">📊</span> Live Multi-Design Process Status Matrix
            </button>
        </div>

        <!-- 📌 Delayed Party Orders Section -->
        <div id="delayedOrdersSection" class="delayed-orders-section" style="display: none;">
            <h3>⚠️ Delayed Party Orders (Delivery Date Passed)</h3>
            <div class="delayed-table-container">
                <table class="delayed-table">
                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>Design No</th>
                            <th>Party Name</th>
                            <th>Order Mtr</th>
                            <th>Delivery Date</th>
                        </tr>
                    </thead>
                    <tbody id="delayedOrdersBody"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
// 🌟 DYNAMIC THEME SWITCHER & INSTANT REFRESH
function setTheme(themeName) {
    localStorage.setItem('erp_theme_mode', themeName);
    if(window.applySystemTheme) {
        window.applySystemTheme(); // Instant theme reload without page refresh
    } else {
        location.reload();
    }
}

function navigateToPage(pageUrl) {
    let cleanPage = pageUrl.split('?')[0];
    let userRole = localStorage.getItem('erp_logged_role') || localStorage.getItem('user_role') || 'Standard User';

    if (userRole === 'Administrator' || userRole === 'Admin') {
        window.location.href = pageUrl;
        return;
    }

    let savedPermissions = localStorage.getItem('user_permissions');
    if (savedPermissions) {
        try {
            let p = JSON.parse(savedPermissions);
            let pageKey = cleanPage.replace('.html', '').toLowerCase();
            if (p[cleanPage] === false || p[pageKey] === false) {
                alert("Access Denied! You do not have permission to access this page. 🔒");
                return;
            }
        } catch(e) {}
    }

    window.location.href = pageUrl;
}

// SINGLE CLEAN DOM CONTENT LOADED EVENT
window.addEventListener('DOMContentLoaded', () => {
    let savedMode = localStorage.getItem('erp_theme_mode') || 'dark';
    if(window.applySystemTheme) window.applySystemTheme();

    let role = localStorage.getItem('erp_logged_role') || localStorage.getItem('user_role') || 'Guest';
    let username = localStorage.getItem('erp_logged_user') || localStorage.getItem('username') || 'Unknown';
    
    let box = document.getElementById('userInfoBox');
    if(box) {
        box.innerHTML = `🟢 Role: <span style="color:#38BDF8;">${role}</span><br>👤 Name: <span style="color:#34D399;">${username}</span>`;
    }

    let customHeading = localStorage.getItem('app_heading_name');
    if (customHeading) {
        let titleEl = document.getElementById('appHeaderTitle');
        if (titleEl) titleEl.innerText = customHeading;
    }

    let localLogo = localStorage.getItem('company_logo_base64') || localStorage.getItem('company_logo') || localStorage.getItem('logo') || '';
    let logoContainer = document.getElementById('companyLogoContainer');
    if (logoContainer) {
        if (localLogo) {
            logoContainer.innerHTML = `<img src="${localLogo}" alt="Logo">`;
        } else {
            logoContainer.innerHTML = `<div class="logo-placeholder">+ Logo</div>`;
        }
    }

    loadDashboardStats();

    setInterval(() => {
        let now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();
        let ampm = hours >= 12 ? 'PM' : 'AM';
        
        hours = hours % 12;
        hours = hours ? hours : 12; 
        minutes = minutes < 10 ? '0' + minutes : minutes;
        seconds = seconds < 10 ? '0' + seconds : seconds;
        
        let timeString = `${hours}:${minutes}:${seconds} ${ampm}`;
        let clockEl = document.getElementById('liveClock');
        if(clockEl) clockEl.innerText = timeString;

        let options = { day: '2-digit', month: 'short', year: 'numeric' };
        let dateString = now.toLocaleDateString('en-GB', options);
        let dateEl = document.getElementById('liveDate');
        if(dateEl) dateEl.innerText = dateString;
    }, 1000);
});

function loadDashboardStats() {
    let designSpecs = JSON.parse(localStorage.getItem('design_specs')) || {};
    let preDesigns = JSON.parse(localStorage.getItem('pre_design_numbers')) || [];
    let totalDesignsCount = Math.max(Object.keys(designSpecs).length, preDesigns.length);
    let designsEl = document.getElementById('statDesignsCount');
    if(designsEl) designsEl.innerText = totalDesignsCount;

    let partyOrders = JSON.parse(localStorage.getItem('party_orders_data')) || [];
    let activeOrdersCount = 0;
    let delayedCount = 0;
    let todayStr = new Date().toISOString().split('T')[0];
    let delayedList = [];

    partyOrders.forEach(order => {
        let status = order.status ? order.status.toLowerCase() : 'running';
        if(status !== 'completed') {
            activeOrdersCount++;
            let deliveryDate = order.deliveryDate || '';
            if(deliveryDate && deliveryDate < todayStr) {
                delayedCount++;
                delayedList.push(order);
            }
        }
    });

    let ordersEl = document.getElementById('statOrdersCount');
    if(ordersEl) ordersEl.innerText = activeOrdersCount;
    let delayedEl = document.getElementById('statDelayedCount');
    if(delayedEl) delayedEl.innerText = delayedCount;

    let section = document.getElementById('delayedOrdersSection');
    let tbody = document.getElementById('delayedOrdersBody');
    if(tbody) tbody.innerHTML = '';

    if(delayedList.length > 0 && section && tbody) {
        section.style.display = 'block';
        delayedList.forEach((item, index) => {
            tbody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td><b>${item.designNumber || item.designNo || '-'}</b></td>
                    <td>${item.partyName || '-'}</td>
                    <td>${item.orderMtr || '0'}</td>
                    <td class="red-alert-text">${item.deliveryDate}</td>
                </tr>
            `;
        });
    } else if(section) {
        section.style.display = 'none';
    }
}

function handleSearchInput(val) {
    let suggBox = document.getElementById('searchSuggestions');
    if(!val || val.trim() === '') {
        if(suggBox) suggBox.style.display = 'none';
        return;
    }
    let term = val.trim().toLowerCase();
    let preDesigns = JSON.parse(localStorage.getItem('pre_design_numbers')) || [];
    let matches = preDesigns.filter(d => d.toString().toLowerCase().includes(term)).slice(0, 5);

    if(matches.length > 0 && suggBox) {
        suggBox.innerHTML = '';
        matches.forEach(m => {
            suggBox.innerHTML += `<div class="search-suggestion-item" onclick="selectSearchSuggestion('${m}')">${m}</div>`;
        });
        suggBox.style.display = 'block';
    } else if(suggBox) {
        suggBox.style.display = 'none';
    }
}

function selectSearchSuggestion(val) {
    let searchInp = document.getElementById('quickSearchInput');
    let suggBox = document.getElementById('searchSuggestions');
    if(searchInp) searchInp.value = val;
    if(suggBox) suggBox.style.display = 'none';
    quickSearchDesign();
}

function toggleThemeMenu(event) {
    event.stopPropagation();
    let themeMenu = document.getElementById('themeDropdownMenu');
    let profileMenu = document.getElementById('dropdownMenu');
    if(profileMenu) profileMenu.style.display = 'none';
    if(themeMenu) themeMenu.style.display = (themeMenu.style.display === 'block') ? 'none' : 'block';
}

function toggleMenu(event) {
    event.stopPropagation();
    let menu = document.getElementById('dropdownMenu');
    let themeMenu = document.getElementById('themeDropdownMenu');
    if(themeMenu) themeMenu.style.display = 'none';
    if(menu) menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
}

function quickSearchDesign() {
    let query = document.getElementById('quickSearchInput').value.trim();
    if(!query) {
        alert("Please enter a design number or party name to search!");
        return;
    }
    localStorage.setItem('selected_design_number', query);
    navigateToPage("design_sheet_print.html");
}

function logoutUser() {
    if(confirm("Are you sure you want to log out?")) {
        localStorage.removeItem('erp_logged_role');
        localStorage.removeItem('erp_logged_user');
        window.location.href = "index.html";
    }
}

function clearCacheData() {
    if(confirm("Clear local cache? (Your login session and settings will remain safe)")) {
        let savedRole = localStorage.getItem('erp_logged_role');
        let savedUser = localStorage.getItem('erp_logged_user');
        let savedUsersList = localStorage.getItem('erp_system_users');
        let savedPermissions = localStorage.getItem('user_permissions');
        let savedHeading = localStorage.getItem('app_heading_name');
        let savedLogo = localStorage.getItem('company_logo_base64') || localStorage.getItem('company_logo');

        localStorage.clear();

        if(savedRole) localStorage.setItem('erp_logged_role', savedRole);
        if(savedUser) localStorage.setItem('erp_logged_user', savedUser);
        if(savedUsersList) localStorage.setItem('erp_system_users', savedUsersList);
        if(savedPermissions) localStorage.setItem('user_permissions', savedPermissions);
        if(savedHeading) localStorage.setItem('app_heading_name', savedHeading);
        if(savedLogo) localStorage.setItem('company_logo_base64', savedLogo);

        alert("Cache cleared successfully! ✅");
        location.reload();
    }
}

window.onclick = function(event) {
    if (!event.target.closest('.profile-dropdown-wrapper')) {
        let dropdown = document.getElementById('dropdownMenu');
        let themeMenu = document.getElementById('themeDropdownMenu');
        if (dropdown) dropdown.style.display = 'none';
        if (themeMenu) themeMenu.style.display = 'none';
    }
    if (!event.target.closest('.search-bar-wrapper')) {
        let suggBox = document.getElementById('searchSuggestions');
        if (suggBox) suggBox.style.display = 'none';
    }
}
</script>
<script src="config.js"></script>
</body>
</html>
