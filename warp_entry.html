<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Warp Entry - TEXFRIEND ERP</title>
<script src="translator.js"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    /* 📌 Smart Background */
    html, body { 
        width: 100%; 
        min-height: 100vh; 
        background: #030712; 
        color: #1E2B23; 
    }

    body { 
        padding: 12px; 
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* 📌 Main Container */
    .main-card {
        width: 100%;
        max-width: 900px;
        margin: 0;
        background: #FFFFFF;
        border: 1px solid rgba(82, 110, 81, 0.15);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 35px rgba(30, 43, 35, 0.06);
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }

    .back-btn {
        display: inline-flex; align-items: center; gap: 5px; color: #FFFFFF;
        text-decoration: none; font-weight: 600; font-size: 11px; background: #1A2421; 
        padding: 8px 16px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        transition: all 0.3s ease;
    }
    .back-btn:hover { background: #0F1713; transform: translateY(-2px); }

    #bitmapDisplayContainer { text-align: right; display: flex; align-items: center; gap: 10px; }
    #bitmapDisplayContainer img {
        max-height: 45px; border-radius: 6px; border: 1px solid rgba(82, 110, 81, 0.2);
        box-shadow: 0 4px 8px rgba(0,0,0,0.08); cursor: zoom-in; transition: transform 0.3s;
    }
    #bitmapDisplayContainer img:hover { transform: scale(1.1); }

    .completed-checkbox {
        display: flex; align-items: center; gap: 6px; background: #D8DFD6;
        padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(82, 110, 81, 0.4);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .completed-checkbox input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #526E51; margin: 0; }
    .completed-checkbox label { margin: 0; color: #3F5A3E; cursor: pointer; font-size: 12px; font-weight: 700; }

    .page-title {
        font-size: 16px; font-weight: 700; color: #2F4F38; text-align: left;
        position: relative; padding-left: 12px; margin-bottom: 5px;
    }
    .page-title::before {
        content: ''; position: absolute; left: 0; top: 10%; height: 80%; width: 4px;
        background: #4A7C59; border-radius: 4px;
    }

    .form-section {
        background: #F8FAF8; border: 1px solid #E2E8E2; border-radius: 14px;
        padding: 22px 15px 15px 15px; margin-bottom: 5px; position: relative;
    }
    
    .section-badge {
        position: absolute; top: -12px; left: 15px; background: #4A7C59; color: #FFF;
        font-size: 10px; font-weight: 700; padding: 4px 12px; border-radius: 12px;
        letter-spacing: 0.5px; text-transform: uppercase; box-shadow: 0 4px 8px rgba(74, 124, 89, 0.25);
    }
    .section-badge.blue { background: linear-gradient(135deg, #3B82F6, #1D4ED8); box-shadow: 0 4px 8px rgba(59, 130, 246, 0.25); }
    .section-badge.amber { background: linear-gradient(135deg, #F59E0B, #D97706); box-shadow: 0 4px 8px rgba(217, 119, 6, 0.25); }

    /* 📌 Bulk Color Changer Styling */
    .bulk-color-box {
        background: #EAF0EA; border: 1px dashed #4A7C59; border-radius: 10px;
        padding: 10px 15px; display: flex; align-items: center; gap: 10px; margin-bottom: 15px;
        flex-wrap: wrap;
    }
    .bulk-color-box label { font-size: 11px; font-weight: 700; color: #2F4F38; white-space: nowrap; }
    .bulk-color-box select, .bulk-color-box input { flex: 1; min-width: 100px; padding: 8px 10px; font-size: 11px; }
    .btn-bulk-change {
        background: linear-gradient(135deg, #3B82F6, #1D4ED8); color: white; border: none;
        padding: 8px 14px; border-radius: 8px; font-weight: bold; font-size: 11px; cursor: pointer;
        box-shadow: 0 4px 8px rgba(59, 130, 246, 0.25); white-space: nowrap; transition: all 0.2s;
    }
    .btn-bulk-change:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(59, 130, 246, 0.35); }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 10px; font-weight: 600; color: #4A554A; }

    input, select {
        width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #D1DED1;
        background: #FFFFFF; color: #1E2B23; font-size: 11px; font-weight: 600; transition: all 0.3s ease;
    }
    input:focus, select:focus { border-color: #4A7C59; outline: none; box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.15); }

    .input-group-btn { display: flex; gap: 10px; width: 100%; }
    .input-group-btn select { flex: 1; }
    .btn-copy-design {
        background: linear-gradient(135deg, #8B5CF6, #6D28D9); color: white; border: none;
        padding: 10px 15px; border-radius: 8px; font-weight: bold; font-size: 11px; cursor: pointer;
        box-shadow: 0 4px 8px rgba(139, 92, 246, 0.25); white-space: nowrap; transition: all 0.2s;
    }
    .btn-copy-design:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(139, 92, 246, 0.35); }

    .header-grid { display: grid; grid-template-columns: 25px 1fr 1fr 0.9fr 1fr 65px; gap: 4px; padding: 5px 0; font-size: 9px; font-weight: 700; color: #2F4F38; text-align: center; text-transform: uppercase; }
    .row-grid { display: grid; grid-template-columns: 25px 1fr 1fr 0.9fr 1fr 65px; gap: 4px; margin-bottom: 8px; align-items: center; }
    .header-grid-range { display: grid; grid-template-columns: 1fr 1fr 1fr 35px; gap: 6px; padding: 5px 0; font-size: 10px; font-weight: 700; color: #2F4F38; text-align: center; text-transform: uppercase; }
    .row-grid-range { display: grid; grid-template-columns: 1fr 1fr 1fr 35px; gap: 6px; margin-bottom: 8px; align-items: center; }
    .row-grid input, .row-grid select, .row-grid-range input { text-align: center; padding: 8px 2px; font-size: 11px; }

    .line-no { font-size: 10px; font-weight: 800; color: #4A7C59; text-align: center; background: #EAF0EA; padding: 8px 0; border-radius: 6px; border: 1px solid #D1DED1; }

    .btn-add-small { background: linear-gradient(135deg, #10B981, #059669); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer; }
    
    .action-cell-row { display: flex; gap: 4px; width: 100%; }
    .btn-insert-small { background: #D1FAE5; color: #059669; border: none; width: 100%; height: 32px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: all 0.2s ease; display:flex; align-items:center; justify-content:center; }
    .btn-insert-small:hover { background: #A7F3D0; transform: scale(1.05); }
    .btn-del-small { background: #FEE2E2; color: #DC2626; border: none; width: 100%; height: 32px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: all 0.2s ease; display:flex; align-items:center; justify-content:center; }
    .btn-del-small:hover { background: #FECACA; transform: scale(1.05); }

    .action-btns-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
    .btn-main { width: 100%; padding: 14px; border: none; border-radius: 10px; color: white; font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-main:hover { transform: translateY(-2px); }
    .btn-preview { background: linear-gradient(135deg, #3B82F6, #1D4ED8); box-shadow: 0 6px 15px rgba(59, 130, 246, 0.25); }
    .btn-save { background: linear-gradient(135deg, #4A7C59, #33593D); box-shadow: 0 6px 15px rgba(74, 124, 89, 0.25); }
    .btn-list { background: linear-gradient(135deg, #F59E0B, #D97706); box-shadow: 0 6px 15px rgba(245, 158, 11, 0.25); }

    .overlay-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18, 25, 20, 0.95); backdrop-filter: blur(6px); z-index: 99999; flex-direction: column; padding: 0; opacity: 0; transition: opacity 0.3s ease; }
    .overlay-modal.show { opacity: 1; }
    .modal-content { background: #FFFFFF; width: 100vw; height: 100vh; margin: 0; border-radius: 0; display: flex; flex-direction: column; overflow: hidden; transform: scale(1); }
    .modal-header { padding: 15px 20px; background: #F4F7F4; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #E2E8E2; flex-shrink: 0; }
    .modal-header h3 { margin: 0; font-size: 16px; color: #1E2B23; font-weight: 800; }
    .modal-actions { display: flex; gap: 8px; }
    .close-btn { background: #FEE2E2; color: #DC2626; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
    .print-btn { background: linear-gradient(135deg, #10B981, #059669); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
    .modal-body { padding: 20px; overflow-y: auto; flex: 1; background: #FAFCFA; width: 100%; max-width: 1000px; margin: 0 auto; }

    .fullscreen-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 999999; justify-content: center; align-items: center; padding: 20px; flex-direction: column; }
    .fullscreen-modal img { max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 10px; }
    .close-fullscreen { position: absolute; top: 20px; right: 20px; background: #EF4444; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .table-container { width: 100%; border-radius: 10px; overflow-x: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid #E2E8E2; background: #FFFFFF; }
    table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; white-space: nowrap; }
    th, td { padding: 10px 12px; text-align: center; color: #1E2B23; }
    
    .action-cell { display: flex; gap: 4px; justify-content: center; }
    .edit-action-btn { background: #64748B; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 10px; }
    .del-action-btn { background: #EF4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 10px; }
    .action-complete { background: #526E51; color: white; border: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 9px; font-weight: bold; }
    .action-running { background: #D97706; color: white; border: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 9px; font-weight: bold; }

    @media print {
        @page { size: A4 portrait; margin: 8mm; }
        body * { visibility: hidden; }
        .overlay-modal, .overlay-modal * { visibility: visible; }
        .overlay-modal { position: absolute; left: 0; top: 0; width: 100%; height: auto; padding: 0; z-index: 99999; background: #FFFFFF; }
        .modal-content { max-height: none !important; height: auto !important; overflow: visible !important; box-shadow: none; border: none; border-radius: 0; width: 100% !important; }
        .no-print { display: none !important; }
        .modal-body { padding: 0 !important; background: #FFFFFF; width: 100% !important; }
        
        table { font-size: 11px !important; width: 100%; border-collapse: collapse; }
        th, td { padding: 4px 6px !important; line-height: 1.2; border-left: none !important; border-right: none !important; }
        .print-flex-row { display: flex !important; flex-wrap: nowrap !important; gap: 20px !important; align-items: flex-start !important; justify-content: space-between !important; }
        .print-col-box { flex: 1; min-width: 0; background: #FFF; width: 48%; }
    }
</style>
</head>
<body>

<div class="main-card">
    <div class="top-nav">
        <a href="dashboard.html" class="back-btn">← Back to Menu</a>
        <div id="bitmapDisplayContainer">
            <div class="completed-checkbox">
                <input type="checkbox" id="top_completed_status" onchange="quickCompleteToggle()">
                <label for="top_completed_status">Completed</label>
            </div>
        </div>
    </div>

    <h2 class="page-title">📐 Warp Pattern Entry</h2>

    <div class="form-section" style="margin-top: 5px;">
        <div class="section-badge">General Specs</div>
        
        <div class="form-group" style="margin-bottom: 15px;">
            <label>Design Number</label>
            <!-- 📌 1. NEW COPY DESIGN BUTTON -->
            <div class="input-group-btn">
                <select id="designNo" onchange="loadDesignData()"><option value="">Select Design No</option></select>
                <button class="btn-copy-design" onclick="copyToNewDesign()" title="Copy current pattern to a new design">📋 Copy Design</button>
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group"><label>Order Mtrs</label><input type="number" id="infoOrderMtr" placeholder="Mtrs" step="0.01" oninput="calculateTopBeam()"></div>
            <div class="form-group"><label>Top Beam Mtrs</label><input type="text" id="infoTopBeam" placeholder="e.g. 130 or +30%" onblur="calculateTopBeam()" onchange="calculateTopBeam()"></div>
            <div class="form-group"><label>Fabric Type</label><select id="infoType"><option value="Plain">Plain</option><option value="Twill">Twill</option><option value="Dobby">Dobby</option><option value="Seersucker">Seersucker</option></select></div>
        </div>
        <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); background: #FFFFFF; padding: 12px; border-radius: 10px; border: 1px dashed #D1DED1; margin-top: 5px;">
            <div class="form-group"><label>Count 1</label><input type="text" id="infoCount1" placeholder="C1"></div>
            <div class="form-group"><label>Count 2</label><input type="text" id="infoCount2" placeholder="C2"></div>
            <div class="form-group"><label>O.Reed</label><input type="text" id="infoReed" placeholder="Reed" oninput="calculateOnloomWidth()"></div>
            <div class="form-group"><label>O.Pick</label><input type="text" id="infoPick" placeholder="Pick"></div>
            <div class="form-group"><label>O.Width</label><input type="text" id="infoWidth" placeholder="Width"></div>
        </div>
    </div>

    <div class="form-section">
        <div class="section-badge blue">Warp Thread Pattern</div>

        <!-- 📌 2. BULK COLOR CHANGER SECTION -->
        <div class="bulk-color-box">
            <label>🎨 Bulk Color Changer:</label>
            <select id="bulkOldColor">
                <option value="">Select Old Color</option>
            </select>
            <label>To ➔</label>
            <input type="text" id="bulkNewColor" placeholder="Type New Color">
            <button class="btn-bulk-change" onclick="applyBulkColorChange()">Change Color</button>
        </div>

        <div style="font-size: 9px; color: #10B981; font-weight: 600; text-align: right; margin-bottom: 5px;">(Press Enter in Ends to add new line below)</div>
        <div style="overflow-x: auto;">
            <div style="min-width: 480px;">
                <div class="header-grid"><div>#</div><div>Count</div><div>Colour</div><div>Beam</div><div>Ends</div><div>Action</div></div>
                <div id="warpLinesContainer"></div>
            </div>
        </div>
    </div>

    <div class="form-section">
        <div class="section-badge amber">Pattern Repeats (Groups)</div>
        <div style="text-align: right; margin-bottom: 5px;"><button class="btn-add-small" onclick="addWarpRange()">➕ Add Range</button></div>
        <div style="overflow-x: auto;">
            <div style="min-width: 350px;">
                <div class="header-grid-range"><div>Start Line</div><div>End Line</div><div>X (Times)</div><div></div></div>
                <div id="warpRangesContainer"></div>
            </div>
        </div>
    </div>

    <div class="action-btns-row">
        <button class="btn-main btn-preview" onclick="previewPattern()">👁️ Preview</button>
        <button class="btn-main btn-save" onclick="saveWarpDesign()" id="saveBtnTxt">💾 Save</button>
        <button class="btn-main btn-list" onclick="openSavedModal()">📂 Saved List</button>
    </div>
</div>

<!-- Modals -->
<div id="previewModal" class="overlay-modal">
    <div class="modal-content">
        <div class="modal-header no-print">
            <h3>👁️ Warp Pattern Full Screen Preview</h3>
            <div class="modal-actions">
                <button class="print-btn" onclick="window.print()">🖨️ Print</button>
                <button class="close-btn" onclick="closeModal('previewModal')">Close ✕</button>
            </div>
        </div>
        <div class="modal-body" id="previewContent"></div>
    </div>
</div>

<div id="savedListModal" class="overlay-modal">
    <div class="modal-content" style="max-width:600px; height:90vh; margin:auto; border-radius:16px;">
        <div class="modal-header"><h3>📋 Saved Warp Patterns</h3><button class="close-btn" onclick="closeModal('savedListModal')">Close ✕</button></div>
        <div class="modal-body"><div class="table-container"><table><thead><tr><th>Design No</th><th>Total Lines</th><th>Status</th><th>Action</th></tr></thead><tbody id="savedPatternsBody"></tbody></table></div></div>
    </div>
</div>

<div id="fullscreenModal" class="fullscreen-modal" onclick="closeFullscreenImage()"><button class="close-fullscreen">Close ✕</button><img id="fullscreenImg" src="" alt="Fullscreen Preview"></div>

<script>
let currentBaseSpecs = {};

function checkUserPermission() {
    let userRole = localStorage.getItem('erp_logged_role') || localStorage.getItem('user_role');
    if (userRole !== 'Administrator' && userRole !== 'Admin') {
        let permissions = JSON.parse(localStorage.getItem('user_permissions') || '{}');
        if (permissions['warp_entry.html'] === false || permissions['warp_entry'] === false) {
            return false;
        }
    }
    return true;
}

function openModal(modalId) { let modal = document.getElementById(modalId); modal.style.display = 'flex'; setTimeout(() => modal.classList.add('show'), 10); }
function closeModal(modalId) { let modal = document.getElementById(modalId); modal.classList.remove('show'); setTimeout(() => modal.style.display = 'none', 300); }
window.openFullscreenImage = function(src) { if(!src || src === '' || src === 'null') return; document.getElementById('fullscreenImg').src = src; document.getElementById('fullscreenModal').style.display = 'flex'; }
window.closeFullscreenImage = function() { document.getElementById('fullscreenModal').style.display = 'none'; }

function cleanDesignName(str) { return str ? str.toString().replace('#', '').trim().toLowerCase() : ''; }

function loadBitmapImage() {
    let activeDesign = document.getElementById('designNo').value || localStorage.getItem('selected_design_number');
    let designSpecs = JSON.parse(localStorage.getItem('design_specs') || '{}');
    let bitmapContainer = document.getElementById('bitmapDisplayContainer');
    
    let clean = activeDesign ? activeDesign.toString().replace('#', '').trim().toLowerCase() : '';
    let specKey = Object.keys(designSpecs).find(k => (k ? k.toString().replace('#', '').trim().toLowerCase() : '') === clean) || activeDesign;

    let imgHtml = '';
    if (activeDesign && designSpecs[specKey] && designSpecs[specKey].bitmap) {
        let b64 = designSpecs[specKey].bitmap;
        imgHtml = `<img src="${b64}" alt="Design Bitmap" onclick="openFullscreenImage('${b64}')" title="Click to view full screen">`;
    }
    
    let checkboxHtml = `<div class="completed-checkbox"><input type="checkbox" id="top_completed_status" onchange="quickCompleteToggle()"><label for="top_completed_status">Completed</label></div>`;
    let cb = document.getElementById('top_completed_status'); 
    let wasChecked = cb ? cb.checked : false;
    
    bitmapContainer.innerHTML = checkboxHtml + imgHtml;
    if(wasChecked) document.getElementById('top_completed_status').checked = true;
}

function loadDesignDropdown() {
    let preDesignList = JSON.parse(localStorage.getItem('pre_design_numbers')) || [];
    let select = document.getElementById('designNo');
    let html = '<option value="">Select Design No</option>';
    preDesignList.forEach(d => { html += '<option value="' + d + '">' + d + '</option>'; });
    select.innerHTML = html;
    let activeDesign = localStorage.getItem('selected_design_number');
    if(activeDesign && preDesignList.includes(activeDesign)) { select.value = activeDesign; loadDesignData(); } else { loadBitmapImage(); }
}

function calculateOnloomWidth() {
    let baseReed = parseFloat(currentBaseSpecs.reed || currentBaseSpecs.baseReed) || 0;
    let baseWidth = parseFloat(currentBaseSpecs.width || currentBaseSpecs.baseWidth) || 0;
    let onloomReed = parseFloat(document.getElementById('infoReed').value) || 0;
    if (baseWidth > 0 && baseReed > 0 && onloomReed > 0) { document.getElementById('infoWidth').value = ((baseReed * baseWidth) / onloomReed).toFixed(2); } 
    else if (baseWidth > 0) { document.getElementById('infoWidth').value = baseWidth.toFixed(2); }
}

function loadDesignData() {
    let dNo = document.getElementById('designNo').value;
    loadBitmapImage();
    if(dNo) localStorage.setItem('selected_design_number', dNo);

    document.getElementById('warpLinesContainer').innerHTML = '';
    document.getElementById('warpRangesContainer').innerHTML = '';
    let saveBtn = document.getElementById('saveBtnTxt');
    
    document.getElementById('infoCount1').value = ''; document.getElementById('infoCount2').value = '';
    document.getElementById('infoOrderMtr').value = ''; document.getElementById('infoTopBeam').value = '';
    document.getElementById('infoType').value = 'Plain'; document.getElementById('infoReed').value = '';
    document.getElementById('infoPick').value = ''; document.getElementById('infoWidth').value = '';
    if(document.getElementById('top_completed_status')) document.getElementById('top_completed_status').checked = false;

    if(!dNo) { saveBtn.innerText = "💾 Save"; loadDefaultRow(); refreshBulkColorDropdown(); return; }

    let cleanDNo = cleanDesignName(dNo);
    let specs = JSON.parse(localStorage.getItem('design_specs')) || {};
    let specKey = Object.keys(specs).find(k => cleanDesignName(k) === cleanDNo) || dNo;
    currentBaseSpecs = specs[specKey] || {};

    let baseReed = parseFloat(currentBaseSpecs.reed || currentBaseSpecs.baseReed) || 0;
    let basePick = parseFloat(currentBaseSpecs.pick || currentBaseSpecs.basePick) || 0;
    let autoReed = baseReed > 0 ? (baseReed - 8) : ''; let autoPick = basePick > 0 ? (basePick - 4) : '';

    let orders = JSON.parse(localStorage.getItem('party_orders_data')) || [];
    let matchedOrder = orders.find(o => {
        let orderDesign = o.designNumber || o.designNo || o.designName || '';
        return cleanDesignName(orderDesign) === cleanDNo;
    });

    let matchedProdMtr = 0;
    if (matchedOrder) {
        matchedProdMtr = parseFloat(matchedOrder.productionMeter || matchedOrder.prodMtr || matchedOrder.productionMeters || 0);
    }

    let masters = JSON.parse(localStorage.getItem('design_masters_data')) || [];
    let found = masters.find(m => cleanDesignName(m.name) === cleanDNo);
    let specStatus = (currentBaseSpecs && currentBaseSpecs.status) ? currentBaseSpecs.status.toLowerCase() : '';

    if(specStatus === 'completed' || (found && found.status && found.status.toLowerCase() === 'completed')) { document.getElementById('top_completed_status').checked = true; }

    if (found) {
        saveBtn.innerText = "✏️ Update"; 
        document.getElementById('infoCount1').value = found.count1 || currentBaseSpecs.warp || currentBaseSpecs.count1 || '';
        document.getElementById('infoCount2').value = found.count2 || currentBaseSpecs.warp2 || currentBaseSpecs.count2 || '';
        
        let finalMtrToFill = matchedProdMtr > 0 ? matchedProdMtr : (found.orderMtr || '');
        document.getElementById('infoOrderMtr').value = finalMtrToFill;
        
        document.getElementById('infoTopBeam').value = found.topBeam || '';
        document.getElementById('infoType').value = found.type || 'Plain';
        document.getElementById('infoReed').value = found.reed || autoReed;
        document.getElementById('infoPick').value = found.pick || autoPick;

        if(found.warpLines && found.warpLines.length > 0) { found.warpLines.forEach(l => addWarpLine(l.count, l.color, l.beam || 'Ground', l.ends)); } 
        else { loadDefaultRow(); }
        if(found.warpRanges) { found.warpRanges.forEach(r => addWarpRange(r.start, r.end, r.set)); }
    } else {
        saveBtn.innerText = "💾 Save";
        document.getElementById('infoCount1').value = currentBaseSpecs.warp || currentBaseSpecs.count1 || '';
        document.getElementById('infoCount2').value = currentBaseSpecs.warp2 || currentBaseSpecs.count2 || '';
        
        if (matchedProdMtr > 0) {
            document.getElementById('infoOrderMtr').value = matchedProdMtr;
        }
        
        document.getElementById('infoReed').value = autoReed; document.getElementById('infoPick').value = autoPick;
        loadDefaultRow();
    }
    calculateOnloomWidth(); updateLineNumbers(); refreshBulkColorDropdown();
}

function loadDefaultRow() { document.getElementById('warpLinesContainer').innerHTML = ''; addWarpLine(); refreshBulkColorDropdown(); }

function calculateTopBeam() {
    let orderMtr = parseFloat(document.getElementById('infoOrderMtr').value) || 0;
    let topBeamInput = document.getElementById('infoTopBeam'); let topBeamStr = topBeamInput.value.trim();
    if (orderMtr > 0 && topBeamStr) {
        let val = parseFloat(topBeamStr.replace('+', '').replace('%', '').trim()) || 0;
        if (topBeamStr.includes('%') || (val > 0 && val < 50 && !topBeamStr.includes('.'))) {
            topBeamInput.value = (orderMtr + (orderMtr * val / 100)).toFixed(2);
        }
    }
}

// 📌 4. BULK COLOR CHANGER LOGIC
function refreshBulkColorDropdown() {
    let colorsSet = new Set();
    document.querySelectorAll('.inp-color').forEach(inp => {
        let val = inp.value.trim();
        if(val) colorsSet.add(val);
    });
    
    let select = document.getElementById('bulkOldColor');
    select.innerHTML = '<option value="">Select Old Color</option>';
    colorsSet.forEach(c => {
        select.innerHTML += `<option value="${c}">${c}</option>`;
    });
}

function applyBulkColorChange() {
    let oldColor = document.getElementById('bulkOldColor').value;
    let newColor = document.getElementById('bulkNewColor').value.trim();

    if(!oldColor || !newColor) {
        alert("Please select the Old Color and type the New Color!");
        return;
    }

    if(confirm(`Are you sure you want to change all '${oldColor}' to '${newColor}'?`)) {
        let changedCount = 0;
        document.querySelectorAll('.inp-color').forEach(inp => {
            if(inp.value.trim() === oldColor) {
                inp.value = newColor;
                changedCount++;
            }
        });
        
        document.getElementById('bulkOldColor').value = '';
        document.getElementById('bulkNewColor').value = '';
        refreshBulkColorDropdown();
        alert(`${changedCount} rows updated successfully! ✅`);
    }
}

function addWarpLine(count = '', color = '', beam = 'Ground', ends = '', insertAfterElem = null) {
    let container = document.getElementById('warpLinesContainer');
    let row = document.createElement('div'); row.className = 'row-grid line-item';
    row.innerHTML = `
        <div class="line-no"></div>
        <input type="text" class="inp-count" placeholder="Count" value="${count}">
        <input type="text" class="inp-color" placeholder="Colour" value="${color}" onblur="refreshBulkColorDropdown()">
        <select class="inp-beam">
            <option value="Ground" ${beam === 'Ground' ? 'selected' : ''}>Ground</option>
            <option value="Top Beam" ${beam === 'Top Beam' ? 'selected' : ''}>Top Beam</option>
        </select>
        <input type="number" class="inp-ends" placeholder="Ends" value="${ends}" 
               onkeydown="if(event.key==='Enter'){ event.preventDefault(); addWarpLine('', '', 'Ground', '', this.parentElement); setTimeout(()=>{let ins=this.parentElement.nextElementSibling.querySelector('.inp-count'); if(ins) ins.focus();},50); }">
        <div class="action-cell-row">
            <button class="btn-insert-small" onclick="addWarpLine('', '', 'Ground', '', this.parentElement.parentElement);" title="Insert row below">+</button>
            <button class="btn-del-small" onclick="this.parentElement.parentElement.remove(); updateLineNumbers(); refreshBulkColorDropdown();" title="Delete row">×</button>
        </div>
    `;
    
    if (insertAfterElem && insertAfterElem.nextSibling) {
        container.insertBefore(row, insertAfterElem.nextSibling);
    } else {
        container.appendChild(row); 
    }
    updateLineNumbers(); refreshBulkColorDropdown();
}

function addWarpRange(start = '', end = '', set = '') {
    let container = document.getElementById('warpRangesContainer');
    let row = document.createElement('div'); row.className = 'row-grid-range range-item';
    row.innerHTML = `
        <input type="number" class="inp-start" placeholder="Start" value="${start}">
        <input type="number" class="inp-end" placeholder="End" value="${end}">
        <input type="number" class="inp-set" placeholder="Times" value="${set}"
               onkeydown="if(event.key==='Enter'){ event.preventDefault(); addWarpRange(); setTimeout(()=>{let ins=document.querySelectorAll('.inp-start'); if(ins.length>0) ins[ins.length-1].focus();},50); }">
        <button class="btn-del-small" onclick="this.parentElement.remove()">×</button>
    `;
    container.appendChild(row);
}

function previewPattern() {
    calculateTopBeam(); calculateOnloomWidth();
    let dNo = document.getElementById('designNo').value;
    let warpLines = [];
    document.querySelectorAll('.line-item').forEach(row => {
        let count = row.querySelector('.inp-count').value.trim();
        let color = row.querySelector('.inp-color').value.trim();
        let beam = row.querySelector('.inp-beam').value;
        let ends = parseFloat(row.querySelector('.inp-ends').value) || 0;
        if(count || color || ends) warpLines.push({ count: count, color: color, beam: beam, ends: ends });
    });

    let ranges = [];
    document.querySelectorAll('.range-item').forEach(row => {
        let start = parseInt(row.querySelector('.inp-start').value) || 0;
        let end = parseInt(row.querySelector('.inp-end').value) || 0;
        let set = parseInt(row.querySelector('.inp-set').value) || 0;
        if(start && end && set) ranges.push({ start, end, set });
    });

    if(warpLines.length === 0) { alert("No pattern to preview! Please add lines."); return; }

    let sp = Object.keys(JSON.parse(localStorage.getItem('design_specs')) || {}).find(k => cleanDesignName(k) === cleanDesignName(dNo)) ? JSON.parse(localStorage.getItem('design_specs'))[Object.keys(JSON.parse(localStorage.getItem('design_specs')) || {}).find(k => cleanDesignName(k) === cleanDesignName(dNo))] : {};
    let baseReed = parseFloat(sp.reed || sp.baseReed) || 0;
    let baseWidth = parseFloat(sp.width || sp.baseWidth) || 0;
    let baseTotalEnds = Math.round(baseReed * baseWidth);

    let headerHtml = `
        <div style="display:flex; justify-content:space-between; flex-wrap:wrap; background:#F4F7F4; border:1px solid #4A7C59; padding:8px 12px; border-radius:6px; margin-bottom:8px; font-size:11px; font-weight:700; color:#1E2B23;">
            <span style="margin-right:8px;">Design: <span style="color:#4A7C59;">${dNo || '-'}</span></span>
            <span style="margin-right:8px;">Counts: ${document.getElementById('infoCount1').value || '-'}, ${document.getElementById('infoCount2').value || '-'}</span>
            <span style="margin-right:8px;">Order Mtr: ${document.getElementById('infoOrderMtr').value || '-'}</span>
            <span style="margin-right:8px;">Top Beam: ${document.getElementById('infoTopBeam').value || '-'}</span>
            <span style="margin-right:8px;">Type: ${document.getElementById('infoType').value || 'Plain'}</span>
            <span style="margin-right:8px;">Reed: ${document.getElementById('infoReed').value || '-'}</span>
            <span style="margin-right:8px;">Pick: ${document.getElementById('infoPick').value || '-'}</span>
            <span>Width: ${document.getElementById('infoWidth').value || '-'}</span>
        </div>
    `;

    let col1Html = ''; 
    let col2Html = ''; 
    let currentLinesInCol1 = 0;
    const MAX_LINES_COL1 = 35;
    
    let groundTotal = 0; let topTotal = 0; let flatPattern = []; 

    let i = 0;
    let tdStyle = "padding:4px 6px; text-align:center; color:#1E2B23; font-size:11px; border-bottom: 1px dashed #A0AFA0;";
    let tdStyleColor = "padding:4px 6px; text-align:left; color:#1E2B23; font-size:11px; white-space:nowrap; border-bottom: 1px dashed #A0AFA0;";
    let tdStyleLast = "padding:4px 6px; vertical-align:middle; color:#1E2B23; text-align:left; padding-left:10px; font-size:11px; border-bottom: 1px dashed #A0AFA0;";

    while (i < warpLines.length) {
        let start = i + 1;
        let range = ranges.find(r => r.start === start);
        let blockHtml = ''; let blockLineCount = 0;
        
        if (range && range.end >= range.start) {
            let end = range.end;
            let set = range.set;
            let blockLines = []; let blockGroundEnds = 0; let blockTopEnds = 0;
            
            for (let j = start - 1; j < end; j++) {
                if (warpLines[j]) {
                    let lineItem = Object.assign({}, warpLines[j]); lineItem.lineNo = j + 1; blockLines.push(lineItem);
                    if(warpLines[j].beam === 'Top Beam') blockTopEnds += parseInt(warpLines[j]?.ends) || 0; else blockGroundEnds += parseInt(warpLines[j]?.ends) || 0;
                    for(let rep=0; rep < set; rep++){ flatPattern.push({ lineNo: j + 1, count: lineItem.count || '-', color: lineItem.color || '-', ends: parseFloat(lineItem.ends) || 0, beam: lineItem.beam }); }
                }
            }
            
            let total = 0;
            for(let j = start - 1; j < end; j++){
                total += parseInt(warpLines[j]?.ends) || 0
            }
            total = total * set;

            groundTotal += blockGroundEnds * set; topTotal += blockTopEnds * set;

            blockLines.forEach((item, index) => {
                let endsDisplay = item.beam === 'Top Beam' ? `<span style="display:inline-block; padding-left: 15px; color: #D97706;" title="Top Beam">${item.ends}</span>` : `<span style="display:inline-block; padding-right: 15px; color: #2F4F38;">${item.ends}</span>`;
                let colorTamil = typeof translateColorToTamil === 'function' ? translateColorToTamil(item.color) : item.color;
                
                blockHtml += `<tr>
                    <td style="${tdStyle} font-weight:700; color:#4A554A;">${item.lineNo}</td>
                    <td style="${tdStyle}">${item.count || '-'}</td>
                    <td style="${tdStyleColor}">${colorTamil}</td>
                    <td style="${tdStyle} font-weight:bold;">${endsDisplay}</td>`;
                
                if (index === 0) { 
                    blockHtml += `<td rowspan="${blockLines.length}" style="${tdStyleLast}">
                      <div style="display:flex; align-items:center; justify-content:flex-start; gap:4px; font-weight:700; font-size:16px;">
                         <span style="font-size: ${blockLines.length * 18}px; font-weight: 300; line-height: 0.5; display: inline-block;">}</span>

                         <span>X ${set} = <span style="color:#D97706">${total}</span></span>
                      </div>
                    </td>`; 
                }
                blockHtml += `</tr>`;
            });
            i = end; blockLineCount = blockLines.length;
        } else {
            let item = Object.assign({}, warpLines[i]); item.lineNo = i + 1;
            if(item.beam === 'Top Beam') topTotal += item.ends; else groundTotal += item.ends;
            flatPattern.push({ lineNo: item.lineNo, count: item.count || '-', color: item.color || '-', ends: parseFloat(item.ends) || 0, beam: item.beam });
            
            let endsDisplay = item.beam === 'Top Beam' ? `<span style="display:inline-block; padding-left: 15px; color: #D97706;" title="Top Beam">${item.ends}</span>` : `<span style="display:inline-block; padding-right: 15px; color: #2F4F38;">${item.ends}</span>`;
            let colorTamil = typeof translateColorToTamil === 'function' ? translateColorToTamil(item.color) : item.color;
            
            blockHtml += `<tr>
                <td style="${tdStyle} font-weight:700; color:#4A554A;">${item.lineNo}</td>
                <td style="${tdStyle}">${item.count || '-'}</td>
                <td style="${tdStyleColor}">${colorTamil}</td>
                <td style="${tdStyle} font-weight:bold;">${endsDisplay}</td>
                <td style="${tdStyleLast}"></td>
            </tr>`;
            i++; blockLineCount = 1;
        }

        if (currentLinesInCol1 < MAX_LINES_COL1) {
            col1Html += blockHtml;
            currentLinesInCol1 += blockLineCount;
        } else {
            col2Html += blockHtml;
        }
    }

    let finalTotalDisplay = topTotal > 0 ? `<span style="color:#3F5A3E;">${groundTotal} <span style="font-size:9px;">(Grnd)</span></span> + <span style="color:#D97706;">${topTotal} <span style="font-size:9px;">(Top)</span></span> = ${groundTotal + topTotal}` : `${groundTotal + topTotal}`;

    let html = headerHtml;

    let tableHeader = `
        <tr style="background:#EAF0EA;">
            <th style="padding:6px; text-align:center; color:#2F4F38; text-transform:uppercase; font-size:10px; border-bottom:2px solid #4A7C59; width:10%;">No</th>
            <th style="padding:6px; text-align:center; color:#2F4F38; text-transform:uppercase; font-size:10px; border-bottom:2px solid #4A7C59; width:15%;">Count</th>
            <th style="padding:6px; text-align:left; color:#2F4F38; text-transform:uppercase; font-size:10px; border-bottom:2px solid #4A7C59; width:25%;">Colour</th>
            <th style="padding:6px; text-align:center; color:#2F4F38; text-transform:uppercase; font-size:10px; border-bottom:2px solid #4A7C59; line-height:1.2; width:15%;">Ends<br><span style="font-size:7px; color:#4A554A;">Grnd|Top</span></th>
            <th style="padding:6px; text-align:left; padding-left:10px; color:#2F4F38; text-transform:uppercase; font-size:10px; border-bottom:2px solid #4A7C59; width:35%;">Set</th>
        </tr>
    `;

    html += '<div class="print-flex-row" style="display: flex; gap: 20px; align-items: flex-start; justify-content: space-between; width: 100%;">';
    
    html += `<div class="print-col-box" style="flex: 1; width: 48%; background:#FFF;">
        <table style="width:100%; border-collapse:collapse; font-size:11px;">
            ${tableHeader}
            ${col1Html}
        </table>
    </div>`;

    html += `<div class="print-col-box" style="flex: 1; width: 48%; background:#FFF;">`;
    if (col2Html !== '') {
        html += `<table style="width:100%; border-collapse:collapse; font-size:11px;">
            ${tableHeader}
            ${col2Html}
        </table>`;
    }
    html += `</div>`;
    html += `</div>`;

    html += `<div style="margin-top: 15px; border-top: 2px solid #4A7C59; padding-top: 5px; page-break-inside: avoid;">
        <table style="width:100%; border-collapse:collapse; font-size:11px; background:#FFF;">
            <tr style="font-weight:bold; font-size:12px; background:#F8FAF8; border-bottom: 1px dashed #A0AFA0;">
                <td style="padding:8px; text-align:right; color:#2F4F38; width:60%;">Total Pattern Ends:</td>
                <td style="padding:8px; font-weight:bold; text-align:left; padding-left:15px; white-space:nowrap; color:#1E2B23;">${finalTotalDisplay}</td>
            </tr>`;

    let grandTotalPattern = groundTotal + topTotal;
    if (baseReed > 0 && baseWidth > 0 && grandTotalPattern > 0) {
        let repeats = Math.floor(baseTotalEnds / grandTotalPattern);
        let remEnds = baseTotalEnds % grandTotalPattern;

        let countTotals = {};
        flatPattern.forEach(item => { countTotals[item.count] = (countTotals[item.count] || 0) + (item.ends * repeats); });

        let endsToDistribute = remEnds;
        for (let item of flatPattern) {
            if (endsToDistribute <= 0) break;
            let take = Math.min(item.ends, endsToDistribute);
            countTotals[item.count] = (countTotals[item.count] || 0) + take;
            endsToDistribute -= take;
        }

        html += `<tr style="font-weight:700; font-size:12px; background:#FFFFFF; color:#2F4F38; border-bottom: 1px dashed #A0AFA0;">
            <td colspan="2" style="padding:10px; text-align:center;">
                ${repeats} Set + ${remEnds} Ends = <span style="font-size:13px; color:#1E2B23;">${baseTotalEnds}</span> Total Ends
            </td>
        </tr>`;

        let breakdownHtml = Object.keys(countTotals).map(c => `<span style="color:#1E2B23;"><b>${c}</b>: ${countTotals[c]} Ends</span>`).join(' &nbsp;&nbsp;|&nbsp;&nbsp; ');
        html += `<tr style="font-size:11px; background:#EAF0EA;">
            <td colspan="2" style="padding:10px; text-align:center;">
                <span style="color:#4A7C59; font-weight:800; margin-right:8px; text-transform:uppercase;s">Count Wise Total:</span> ${breakdownHtml}
            </td>
        </tr>`;
    }

    html += '</table></div>';
    document.getElementById('previewContent').innerHTML = html;
    openModal('previewModal');
}
</script>
<script src="config.js"></script>
</body>
</html>
