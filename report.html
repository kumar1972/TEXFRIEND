<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Comprehensive ERP Report - TEXFRIEND</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    html, body { 
        width: 100%;
        min-height: 100vh;
        background: #081E12; /* Dark Green ERP Theme */
        color: #E8ECE7; 
    }

    body { 
        padding: 12px; 
        display: flex;
        flex-direction: column;
    }

    .main-card {
        width: 100%;
        max-width: 100%;
        margin: 0;
        background: #0C2B1B;
        border: 1px solid #1A5A3D;
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .top-nav { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 4px; 
    }

    .back-btn {
        display: inline-block;
        color: #4CAF50;
        text-decoration: none;
        font-weight: 600;
        font-size: 11px;
        background: rgba(76, 175, 80, 0.1);
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid rgba(76, 175, 80, 0.3);
    }

    #bitmapDisplayContainer { text-align: right; }
    #bitmapDisplayContainer img {
        max-height: 45px;
        border-radius: 6px;
        border: 1px solid #1A5A3D;
    }

    h2 {
        font-size: 16px;
        color: #FFFFFF;
        font-weight: 700;
        text-align: center;
        margin-bottom: 8px;
    }

    .filter-box {
        background: #103626;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #1A5A3D;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .filter-box label {
        font-size: 11px;
        font-weight: 700;
        color: #4CAF50;
        white-space: nowrap;
    }

    select {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #1A5A3D;
        background: #081E12;
        color: #FFFFFF;
        font-size: 12px;
        font-weight: 600;
    }

    .report-tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 6px;
    }

    .tab-btn {
        background: #103626;
        color: #A7C9B8;
        border: 1px solid #1A5A3D;
        padding: 10px 4px;
        border-radius: 8px;
        font-size: 10px;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
    }

    .tab-btn.active {
        background: #10B981;
        color: #FFFFFF;
        border-color: #10B981;
    }

    .invoice-tab-btn {
        grid-column: span 3;
        background: #2563EB;
        color: #FFFFFF;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
    }

    .report-header-bar {
        background: #103626;
        padding: 8px 12px;
        border-radius: 8px 8px 0 0;
        border: 1px solid #1A5A3D;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
    }

    .report-header-bar span {
        font-size: 12px;
        font-weight: 700;
        color: #FFFFFF;
    }

    .header-btns {
        display: flex;
        gap: 6px;
    }

    .preview-btn { background: #3B82F6; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
    .print-btn { background: #10B981; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
    .excel-btn { background: #D97706; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }

    .table-container {
        background: #081E12;
        border: 1px solid #1A5A3D;
        border-top: none;
        border-radius: 0 0 8px 8px;
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
        text-align: center;
    }

    th {
        background: #103626;
        color: #4CAF50;
        padding: 8px 4px;
        border-bottom: 1px solid #1A5A3D;
        font-weight: 600;
        white-space: nowrap;
    }

    td {
        padding: 8px 4px;
        border-bottom: 1px solid rgba(26, 90, 61, 0.4);
        color: #E8ECE7;
        white-space: nowrap;
    }

    .no-data {
        padding: 20px;
        color: #A7C9B8;
        font-size: 11px;
        text-align: center;
    }

    /* Modal for Print Preview */
    #previewModal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #FFFFFF; color: #000000; z-index: 99999; overflow-y: auto; padding: 20px;
    }
    
    @media print {
        body * { visibility: hidden; }
        #previewModal, #previewModal * { visibility: visible; }
        #previewModal { position: absolute; left: 0; top: 0; width: 100%; padding: 0; z-index: 99999; background: #FFFFFF; }
        .no-print { display: none !important; }
    }
</style>
</head>
<body>

<div class="main-card">
    <div class="top-nav">
        <a href="index.html" class="back-btn">← Back to Menu</a>
        <div id="bitmapDisplayContainer"></div>
    </div>

    <h2>Comprehensive ERP Reports</h2>

    <div class="filter-box">
        <label>🔍 Design Filter:</label>
        <select id="designFilter" onchange="switchTab(currentTab)">
            <option value="All">All Designs</option>
        </select>
    </div>

    <!-- Navigation Tabs -->
    <div class="report-tabs">
        <button class="tab-btn active" id="tab-PartyOrders" onclick="switchTab('PartyOrders')">📦 Party Orders</button>
        <button class="tab-btn" id="tab-KoraStock" onclick="switchTab('KoraStock')">🧵 Kora Stock</button>
        <button class="tab-btn" id="tab-Warping" onclick="switchTab('Warping')">📐 Warping</button>
        <button class="tab-btn" id="tab-Dyeing" onclick="switchTab('Dyeing')">🎨 Dyeing</button>
        <button class="tab-btn" id="tab-WeaveWarp" onclick="switchTab('WeaveWarp')">📊 Weave Warp</button>
        <button class="tab-btn" id="tab-WeaveWeft" onclick="switchTab('WeaveWeft')">📊 Weave Weft</button>
        <button class="invoice-tab-btn" id="tab-Invoice" onclick="switchTab('Invoice')">📄 Invoice Report</button>
    </div>

    <div class="report-header-bar">
        <span id="reportTitle">📊 Report Data</span>
        <div class="header-btns">
            <button class="preview-btn" onclick="previewReport()">👁️ Preview</button>
            <button class="print-btn" onclick="printReport()">🖨️ Print</button>
            <button class="excel-btn" onclick="exportToExcel()">📥 Excel</button>
        </div>
    </div>

    <div class="table-container">
        <table id="reportTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<!-- Print Preview Modal -->
<div id="previewModal">
    <div class="no-print" style="margin-bottom: 20px;">
        <button onclick="document.getElementById('previewModal').style.display='none'" style="float:right; background:#EF4444; color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;">Close ❌</button>
        <button onclick="window.print()" style="float:right; background:#10B981; color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer; margin-right:10px;">Print 🖨️</button>
        <button onclick="exportToExcel()" style="float:right; background:#D97706; color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer; margin-right:10px;">Excel 📥</button>
        <div style="clear:both;"></div>
    </div>
    <div id="previewContent" style="color: #000;"></div>
</div>

<script>
var currentTab = 'PartyOrders';

document.addEventListener('DOMContentLoaded', function() {
    loadDesignFilter();
    switchTab('PartyOrders');
});

function loadDesignFilter() {
    var preDesignList = JSON.parse(localStorage.getItem('pre_design_numbers')) || [];
    var select = document.getElementById('designFilter');
    var html = '<option value="All">All Designs</option>';
    preDesignList.forEach(function(d) {
        html += '<option value="' + d + '">' + d + '</option>';
    });
    select.innerHTML = html;
}

function switchTab(tabName) {
    currentTab = tabName;
    document.querySelectorAll('.tab-btn, .invoice-tab-btn').forEach(btn => btn.classList.remove('active'));
    
    let activeBtn = document.getElementById('tab-' + tabName);
    if(activeBtn) activeBtn.classList.add('active');

    let filterVal = document.getElementById('designFilter').value;
    let titleElem = document.getElementById('reportTitle');
    let head = document.getElementById('tableHead');
    let body = document.getElementById('tableBody');

    // Show Design Bitmap if applicable
    let bitmapContainer = document.getElementById('bitmapDisplayContainer');
    let designSpecsMap = JSON.parse(localStorage.getItem('design_specs')) || {};
    if (filterVal !== 'All' && designSpecsMap[filterVal] && designSpecsMap[filterVal].bitmap) {
        bitmapContainer.innerHTML = `<img src="${designSpecsMap[filterVal].bitmap}" alt="Bitmap">`;
    } else {
        bitmapContainer.innerHTML = '';
    }

    head.innerHTML = '';
    body.innerHTML = '';

    if (tabName === 'PartyOrders') {
        titleElem.innerText = "📦 PARTY ORDERS Data";
        head.innerHTML = `<tr><th>Date</th><th>Party Name</th><th>Design</th><th>Meters</th><th>Poles</th></tr>`;
        
        let rawData = JSON.parse(localStorage.getItem('party_orders_data')) || 
                      JSON.parse(localStorage.getItem('party_orders')) || 
                      JSON.parse(localStorage.getItem('party_order_records')) || [];
                      
        let mappedData = rawData.map(item => ({
            date: item.date || item.orderDate || '-',
            partyName: item.partyName || item.party || item.name || '-',
            designNo: item.designNo || item.design || item.designNumber || item.design_no || '-',
            meters: item.meters || item.mtr || item.meter || '-',
            poles: item.poles || item.pole || '-'
        }));
        
        renderGenericTable(mappedData, filterVal, ['date', 'partyName', 'designNo', 'meters', 'poles']);
    } 
    else if (tabName === 'KoraStock') {
        titleElem.innerText = "🧵 KORA STOCK Data";
        head.innerHTML = `<tr><th>Date</th><th>Supplier mill</th><th>Count</th><th>Weight (Kg)</th></tr>`;
        
        let rawData = JSON.parse(localStorage.getItem('kora_stock_records')) || 
                      JSON.parse(localStorage.getItem('kora_stock_data')) || 
                      JSON.parse(localStorage.getItem('kora_stock')) || 
                      JSON.parse(localStorage.getItem('yarn_stock_records')) || 
                      JSON.parse(localStorage.getItem('yarn_inward_records')) || [];
                      
        let mappedData = rawData.map(item => ({
            date: item.date || item.stockDate || item.entryDate || '-',
            supplier: item.supplier || item.supplierName || item.partyName || item.name || '-',
            count: item.count || item.yarnCount || '-',
            weight: item.weight || item.wt || item.kg || item.qty || '-'
        }));

        renderGenericTable(mappedData, 'All', ['date', 'supplier', 'count', 'weight']);
    } 
    else if (tabName === 'Warping') {
        titleElem.innerText = "📐 WARPING Data";
        head.innerHTML = `<tr><th>Date</th><th>Design</th><th>Count</th><th>Colour</th><th>Order Wt</th><th>Issued Wt</th><th>Rcvd Wt</th><th>Excess</th></tr>`;
        let issues = JSON.parse(localStorage.getItem('warping_issue_records')) || [];
        let receives = JSON.parse(localStorage.getItem('warping_receive_records')) || [];
        
        let merged = issues.map(iss => {
            let rec = receives.find(r => r.issueId == iss.id) || {};
            return {
                date: iss.date || rec.botDate || '-',
                designNo: iss.designNo,
                count: iss.count,
                color: iss.color,
                orderWt: iss.orderWt,
                issuedWt: iss.issueWt,
                receivedWt: rec.receivedWt || '-',
                excessWt: rec.excessWt || '0.000'
            };
        });
        renderGenericTable(merged, filterVal, ['date', 'designNo', 'count', 'color', 'orderWt', 'issuedWt', 'receivedWt', 'excessWt']);
    } 
    else if (tabName === 'Dyeing') {
        titleElem.innerText = "🎨 DYEING Data";
        head.innerHTML = `<tr><th>Date</th><th>Dyeing Unit</th><th>Design</th><th>Count</th><th>Colour</th><th>Issued Wt</th><th>Rcvd Wt</th><th>Loss Wt</th><th>Excess (>5%)</th></tr>`;
        let issues = JSON.parse(localStorage.getItem('dyeing_issue_records')) || [];
        let receives = JSON.parse(localStorage.getItem('dyeing_receive_records')) || [];
        
        let merged = issues.map(iss => {
            let rec = receives.find(r => r.issueId == iss.id) || {};
            return {
                date: iss.date || rec.date || '-',
                unit: iss.unit || rec.unit || '-',
                designNo: iss.designNo,
                count: iss.count,
                color: iss.color,
                issuedWt: iss.issueWt,
                receivedWt: rec.receivedWt || '-',
                lossWt: rec.lossWt || '-',
                excessWt: rec.excessWt || '-'
            };
        });
        renderGenericTable(merged, filterVal, ['date', 'unit', 'designNo', 'count', 'color', 'issuedWt', 'receivedWt', 'lossWt', 'excessWt']);
    } 
    else if (tabName === 'WeaveWarp' || tabName === 'WeaveWeft') {
        titleElem.innerText = tabName === 'WeaveWarp' ? "📊 WEAVE WARP Data" : "📊 WEAVE WEFT Data";
        head.innerHTML = `<tr><th>Date</th><th>Design</th><th>Count</th><th>Colour</th><th>Pattern Val</th><th>Total Val</th><th>Weight (Kg)</th></tr>`;
        
        let masters = JSON.parse(localStorage.getItem('design_masters_data')) || [];
        let rows = [];
        
        masters.forEach(m => {
            let lines = tabName === 'WeaveWarp' ? (m.warpLines || []) : (m.weftLines || []);
            lines.forEach(l => {
                rows.push({
                    date: 'Master Spec',
                    designNo: m.name || m.designNo,
                    count: l.count || '-',
                    color: l.color || '-',
                    patternVal: tabName === 'WeaveWarp' ? (l.ends || '-') : (l.picks || '-'),
                    totalVal: '-',
                    weight: '-'
                });
            });
        });
        renderGenericTable(rows, filterVal, ['date', 'designNo', 'count', 'color', 'patternVal', 'totalVal', 'weight']);
    } 
    else if (tabName === 'Invoice') {
        titleElem.innerText = "📄 INVOICE REPORT Data";
        head.innerHTML = `<tr><th>Invoice No</th><th>Date</th><th>Party Name</th><th>Design</th><th>Meters</th><th>Amount</th></tr>`;
        
        let rawData = JSON.parse(localStorage.getItem('invoice_records')) || [];
        let mappedData = rawData.map(item => ({
            invNo: item.invNo || item.invoiceNo || '-',
            date: item.date || item.invoiceDate || '-',
            partyName: item.partyName || item.party || '-',
            designNo: item.designNo || item.design || '-',
            meters: item.meters || item.mtr || '-',
            amount: item.amount || item.total || '-'
        }));

        renderGenericTable(mappedData, filterVal, ['invNo', 'date', 'partyName', 'designNo', 'meters', 'amount']);
    }
}

function renderGenericTable(dataList, filterVal, keys) {
    let body = document.getElementById('tableBody');
    body.innerHTML = '';

    if (!dataList || dataList.length === 0) {
        body.innerHTML = `<tr><td colspan="${keys.length}" class="no-data">No records found.</td></tr>`;
        return;
    }

    let filtered = dataList;
    if (filterVal !== 'All') {
        filtered = dataList.filter(item => (item.designNo === filterVal || item.design === filterVal));
    }

    if (filtered.length === 0) {
        body.innerHTML = `<tr><td colspan="${keys.length}" class="no-data">No records found for filter: ${filterVal}</td></tr>`;
        return;
    }

    filtered.forEach(item => {
        let rowHtml = '<tr>';
        keys.forEach(k => {
            let val = item[k] !== undefined && item[k] !== '' ? item[k] : '-';
            rowHtml += `<td>${val}</td>`;
        });
        rowHtml += '</tr>';
        body.innerHTML += rowHtml;
    });
}

function previewReport() {
    let title = document.getElementById('reportTitle').innerText;
    let filterVal = document.getElementById('designFilter').value;
    let tableHtml = document.getElementById('reportTable').outerHTML;
    
    // Create Printer-Friendly HTML Structure
    let html = `<div style="text-align: center; margin-bottom: 20px;">`;
    html += `<h2 style='color: #000; font-family: sans-serif; margin-bottom: 5px;'>${title}</h2>`;
    html += `<p style='font-family: sans-serif; font-size: 14px; margin-top: 0;'><b>Design Filter:</b> ${filterVal}</p>`;
    html += `</div>`;
    
    // Inject Table and Apply Light Theme Styling inline for print preview
    html += `<div id="printTableWrapper" style="color: #000;">${tableHtml}</div>`;
    
    document.getElementById('previewContent').innerHTML = html;
    
    // Apply styling specific to the cloned table inside the modal
    let previewTable = document.getElementById('previewContent').querySelector('table');
    if(previewTable) {
        previewTable.style.width = '100%';
        previewTable.style.borderCollapse = 'collapse';
        previewTable.style.color = '#000';
        previewTable.style.fontFamily = 'sans-serif';
        
        let ths = previewTable.querySelectorAll('th');
        ths.forEach(th => {
            th.style.border = '1px solid #000';
            th.style.padding = '8px';
            th.style.background = '#f2f2f2';
            th.style.color = '#000';
            th.style.fontWeight = 'bold';
        });
        
        let tds = previewTable.querySelectorAll('td');
        tds.forEach(td => {
            td.style.border = '1px solid #000';
            td.style.padding = '8px';
            td.style.color = '#000';
        });
    }

    document.getElementById('previewModal').style.display = 'block';
}

function printReport() {
    if(document.getElementById('previewModal').style.display !== 'block') {
        previewReport();
    }
    setTimeout(() => {
        window.print();
    }, 300);
}

function exportToExcel() {
    let table = document.getElementById('reportTable');
    let html = table.outerHTML;
    let url = 'data:application/vnd.ms-excel,' + encodeURIComponent(html);
    let link = document.createElement('a');
    link.href = url;
    link.download = currentTab + '_Report.xls';
    link.click();
}
</script>
</body>
</html>
