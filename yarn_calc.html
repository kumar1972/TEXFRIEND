<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yarn Calculation - TEXFRIEND</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    /* 📌 Smart Premium Background */
    html, body { 
        width: 100%;
        min-height: 100vh;
        background: #EAF0EA; 
        color: #1E2B23; 
    }

    body { 
        padding: 12px; 
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* 📌 Main Premium Container */
    .main-card {
        width: 100%;
        max-width: 900px;
        margin: 0;
        background: #FFFFFF;
        border: 1px solid rgba(82, 110, 81, 0.15);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 35px rgba(30, 43, 35, 0.06);
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .top-nav { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 5px; 
    }

    /* 📌 Smart Back Button */
    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #FFFFFF;
        text-decoration: none;
        font-weight: 600;
        font-size: 11px;
        background: #1A2421; 
        padding: 8px 16px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        transition: all 0.3s ease;
    }
    .back-btn:hover { background: #000000; transform: translateY(-2px); }

    #bitmapDisplayContainer { text-align: right; display: flex; align-items: center; gap: 10px; }
    #bitmapDisplayContainer img {
        max-height: 45px;
        border-radius: 6px;
        border: 1px solid rgba(82, 110, 81, 0.2);
        box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        cursor: zoom-in;
        transition: transform 0.3s;
    }
    #bitmapDisplayContainer img:hover { transform: scale(1.1); }

    /* Checkbox Styling */
    .completed-checkbox {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #D8DFD6;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid rgba(82, 110, 81, 0.4);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .completed-checkbox input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #526E51;
        margin: 0;
        padding: 0;
        border: none;
    }
    
    .completed-checkbox label {
        margin: 0;

    .header-bar {
        display: flex;
        justify-content: space-between;

    }

    .header-bar h3 {
        font-size: 16px;
        color: #2F4F38;
        font-weight: 700;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .header-btns {
        display: flex;
        gap: 8px;
    }

    /* 📌 Premium Action Buttons */
    .preview-btn { 
        background: linear-gradient(135deg, #3B82F6, #1D4ED8); 
        color: white; border: none; padding: 8px 14px; border-radius: 8px; 
        font-size: 11px; font-weight: 700; cursor: pointer; 
        box-shadow: 0 4px 10px rgba(59, 130, 246, 0.25); transition: all 0.3s ease; 
    }
    .print-btn { 
        background: linear-gradient(135deg, #10B981, #059669); 
        color: white; border: none; padding: 8px 14px; border-radius: 8px; 
        font-size: 11px; font-weight: 700; cursor: pointer; 
        box-shadow: 0 4px 10px rgba(16, 185, 129, 0.25); transition: all 0.3s ease; 
    }
    .preview-btn:hover, .print-btn:hover { transform: translateY(-2px); }

    /* 📌 Smart Form Sections */
    .top-form-row, .top-form-row-2 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        background: #F8FAF8;
        border: 1px solid #E2E8E2;
        border-radius: 12px;
        padding: 15px;
    }
    .top-form-row { margin-bottom: 2px; }
    .top-form-row-2 { margin-bottom: 10px; }

    .form-group label {
        display: block;
        font-size: 10px;
        font-weight: 600;
        color: #4A554A;
        margin-bottom: 6px;
        white-space: nowrap;
    }

    /* 📌 Smart 3D Inputs */
    input, select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #D1DED1;
        background: #FFFFFF;
        color: #1E2B23;
        font-size: 11px;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 4px rgba(30, 43, 35, 0.02);
    }

    input:focus, select:focus {
        border-color: #4A7C59;
        outline: none;
        background: #FFFFFF;
        box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.15);
    }

    input::placeholder { color: #A0AFA0; font-weight: 400; }

    /* 📌 Section Titles */
    h3.section-title {
        font-size: 11px;
        color: #FFFFFF;
        background: #4A7C59;
        padding: 6px 14px;
        border-radius: 12px;
        display: inline-block;
        margin-bottom: 5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 8px rgba(74, 124, 89, 0.25);
        border: none;
        width: max-content;
    }

    /* 📌 Advanced Table Design */
    .table-container {
        width: 100%;
        border-radius: 10px;
        overflow-x: auto;
        box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        border: 1px solid #E2E8E2;
        background: #FFFFFF;
        -webkit-overflow-scrolling: touch;
        margin-bottom: 10px;
    }

    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 11px;
        text-align: center;
        white-space: nowrap;
    }

    th, td {
        padding: 10px 12px;
        text-align: center;
        border-bottom: 1px solid #E2E8E2;
        color: #1E2B23;
    }

    th {
        background: #EAF0EA;
        color: #2F4F38;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 10px;
        letter-spacing: 0.5px;
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 2px solid #D1DED1;
    }

    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #F8FAF8; }

    .total-row td {
        background: #F4F7F4;
        color: #2F4F38;
        font-weight: 700;
        border-top: 2px solid #D1DED1;
    }

    /* Modal for Print Preview */
    #previewModal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(18, 25, 20, 0.85); backdrop-filter: blur(4px); z-index: 99999; overflow-y: auto; padding: 20px;
    }
    
    #previewModal > div:last-child {
        background: #FFFFFF; max-width: 800px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* 📌 Fullscreen Image Popup Modal */
    .fullscreen-modal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.9); z-index: 999999; justify-content: center; align-items: center;
        padding: 20px; flex-direction: column;
    }
    .fullscreen-modal img {
        max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 10px;
        box-shadow: 0 10px 30px rgba(255,255,255,0.2);
    }
    .close-fullscreen {
        position: absolute; top: 20px; right: 20px; background: #EF4444; color: white;
        border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 14px;
        cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    @media print {
        body * { visibility: hidden; }
        #previewModal, #previewModal * { visibility: visible; }
        #previewModal { position: absolute; left: 0; top: 0; width: 100%; padding: 0; z-index: 99999; background: #FFFFFF; }
        #previewModal > div:last-child { box-shadow: none; border-radius: 0; padding: 0; }
        .no-print { display: none !important; }
    }
</style>
</head>
<body>

<div class="main-card">
    <div class="top-nav">
        <a href="dashboard.html" class="back-btn">← Back to Menu</a>
        <div id="bitmapDisplayContainer">
            <div class="completed-checkbox">
                <input type="checkbox" id="top_completed_status" onchange="quickCompleteToggle()">

    <div class="header-bar">
        <h3 id="pageHeaderTitle">🧵 Yarn Calculation</h3>
        <div class="header-btns">
            <button class="preview-btn" onclick="previewReport()">👁️ Preview</button>

        </div>

    <div class="top-form-row">

            </select>
        </div>
        <div class="form-group">

        </div>
        <div class="form-group">
            <label>Pick</label>
            <input type="number" id="calcPick" oninput="loadYarnData()" placeholder="Pick">
        </div>
    </div>

    <div class="top-form-row-2">
        <div class="form-group">
            <label>Base Counts</label>
            <input type="text" id="baseCounts" placeholder="e.g., 2/60, 2/40" oninput="loadYarnData()">
        </div>
        <div class="form-group">
            <label>Warp Dyeing Order (Mtrs)</label>
            <input type="number" id="lengthMeters" value="100" oninput="calculateWeftMtrs(); loadYarnData();">
        </div>
        <div class="form-group">
            <label>Top Beam Mtrs</label>

        </div>
    </div>

    <!-- GROUND BEAM SECTION -->
    <h3 class="section-title" style="margin-top: 10px;">🧵 WARP YARN - GROUND BEAM</h3>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Count</th>
                    <th>Colour</th>
                    <th>Ends</th>
                    <th>Total</th>
                    <th>Weight (Kg)</th>
                </tr>
            </thead>
            <tbody id="warpGroundTableBody">
                <!-- Ground Warp Data -->
            </tbody>
        </table>
    </div>

    <!-- TOP BEAM SECTION -->
    <div id="topBeamWrapper" style="display: none;">
        <h3 class="section-title" style="margin-top: 10px;">🧵 WARP YARN - TOP BEAM</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Count</th>
                        <th>Colour</th>
                        <th>Ends</th>
                        <th>Total</th>

            </table>

    <!-- WEFT SEPARATE SECTION -->

        <div class="form-group">
            <label>Crimp %</label>
            <input type="number" id="crimpPercentage" value="6" placeholder="%" oninput="calculateWeftMtrs(); loadYarnData();">
        </div>
        <div class="form-group">
            <label>Weft Mtrs</label>
            <input type="number" id="weftLengthMeters" value="100" readonly style="background:#F4F7F4; color:#4A7C59; border-color:#D1DED1; cursor:not-allowed;">

    <div class="table-container">
        <table>

                <tr>
                    <th>Count</th>
                    <th>Colour</th>
                    <th>Picks</th>

            <tbody id="weftTableBody">
                <!-- Weft Data -->
            </tbody>

</div>

<!-- Print Preview Modal -->
<div id="previewModal">
    <div class="no-print" style="margin-bottom: 20px; max-width: 800px; margin: 0 auto 15px auto;">
        <button onclick="document.getElementById('previewModal').style.display='none'" style="float:right; background:#EF4444; color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer;">Close ❌</button>
        <button onclick="window.print()" style="float:right; background:#10B981; color:white; border:none; padding:8px 15px; border-radius:5px; font-weight:bold; cursor:pointer; margin-right:10px;">Print 🖨️</button>
        <div style="clear:both;"></div>
    </div>
    <div id="previewContent" style="color: #000;"></div>
</div>

<!-- 📌 Fullscreen Image Popup Modal -->
<div id="fullscreenModal" class="fullscreen-modal" onclick="closeFullscreenImage()">
    <button class="close-fullscreen">Close ✕</button>
    <img id="fullscreenImg" src="" alt="Fullscreen Preview">
</div>

<script>
function cleanDesignName(str) {
    return str ? str.toString().replace('#', '').trim().toLowerCase() : '';
}

// 📌 Fullscreen Image Popup Controls
window.openFullscreenImage = function(src) {
    if(!src || src === '' || src === 'null') return;
    document.getElementById('fullscreenImg').src = src;
    document.getElementById('fullscreenModal').style.display = 'flex';
}
window.closeFullscreenImage = function() {
    document.getElementById('fullscreenModal').style.display = 'none';
}

function loadBitmapImage() {
    let activeDesign = document.getElementById('designNumber').value || localStorage.getItem('selected_design_number');
    let designSpecs = JSON.parse(localStorage.getItem('design_specs') || '{}');
    let bitmapContainer = document.getElementById('bitmapDisplayContainer');
    
    let imgHtml = '';
    if (activeDesign && designSpecs[activeDesign] && designSpecs[activeDesign].bitmap) {
        let b64 = designSpecs[activeDesign].bitmap;
        imgHtml = `<img src="${b64}" alt="Design Bitmap" onclick="openFullscreenImage('${b64}')" title="Click to view full screen">`;
    }
    
    let checkboxHtml = `<div class="completed-checkbox"><input type="checkbox" id="top_completed_status" onchange="quickCompleteToggle()"><label for="top_completed_status">Completed</label></div>`;
    
    let wasChecked = false;
    let cb = document.getElementById('top_completed_status');
    if(cb) wasChecked = cb.checked;
    
    bitmapContainer.innerHTML = checkboxHtml + imgHtml;
    
    if(wasChecked) {
        document.getElementById('top_completed_status').checked = true;
    }
}

function translateColorToTamil(colorName) {
    if (!colorName) return '-';
    var c = colorName.trim().toLowerCase();
    var map = {
        'white': 'வெள்ளை', 'black': 'கருப்பு', 'blue': 'ப்ளூ', 'yellow': 'மஞ்சள்',
        'red': 'சிகப்பு', 'green': 'பச்சை', 'brown': 'பிரவுன்', 'khaki': 'காக்கி',
        'rose': 'ரோஸ்', 'orange': 'ஆரஞ்சு', 'violet': 'வயோலெட்', 'grey': 'சாம்பல்',
        'gold': 'தங்கம்', 'pink': 'பிங்க்', 'navy': 'நேவி', 'maroon': 'மெரூன்'
    };
    return map[c] || colorName; 
}

window.calculatedYarnData = {
    ground: [], top: [], weft: [],
    groundTotals: { p: 0, t: 0, w: 0 },
    topTotals: { p: 0, t: 0, w: 0 },
    weftTotals: { p: 0, t: 0, w: 0 }
};

document.addEventListener('DOMContentLoaded', function() {
    initDropdown();
});

function initDropdown() {
    var preDesignList = JSON.parse(localStorage.getItem('pre_design_numbers')) || [];
    var select = document.getElementById('designNumber');
    var html = '<option value="">Select</option>';
    
    preDesignList.forEach(function(d) {
        html += '<option value="' + d + '">' + d + '</option>';
    });
    select.innerHTML = html;

    var activeDesign = localStorage.getItem('selected_design_number');
    if(activeDesign && preDesignList.includes(activeDesign)) {
        select.value = activeDesign;
        loadInitialData();
    } else {
        loadBitmapImage();
    }
}

function calculateWeftMtrs() {
    let warpOrder = parseFloat(document.getElementById('lengthMeters').value) || 0;
    let crimp = parseFloat(document.getElementById('crimpPercentage').value) || 0;
    
    let weftMtrs = warpOrder - (warpOrder * (crimp / 100));
    document.getElementById('weftLengthMeters').value = weftMtrs > 0 ? weftMtrs.toFixed(2) : '';
}

function loadInitialData() {
    let dName = document.getElementById('designNumber').value;
    loadBitmapImage();
    if(dName) localStorage.setItem('selected_design_number', dName);

    if(!dName) {
        document.getElementById('warpGroundTableBody').innerHTML = '';
        document.getElementById('warpTopTableBody').innerHTML = '';
        document.getElementById('weftTableBody').innerHTML = '';
        document.getElementById('topBeamWrapper').style.display = 'none';
        document.getElementById('baseCounts').value = '';
        document.getElementById('topLengthMeters').value = '';
        let cb = document.getElementById('top_completed_status');
        if(cb) cb.checked = false;
        return;
    }

    let cleanDNo = cleanDesignName(dName);
    let designMastersList = JSON.parse(localStorage.getItem('design_masters_data')) || [];
    let foundMaster = designMastersList.find(d => cleanDesignName(d.name) === cleanDNo) || {};
    let specs = JSON.parse(localStorage.getItem('design_specs')) || {};
    let specKey = Object.keys(specs).find(k => cleanDesignName(k) === cleanDNo);
    let sp = specKey ? specs[specKey] : {};

    let specStatus = (sp && sp.status) ? sp.status.toLowerCase() : '';

    if(specStatus === 'completed' || (foundMaster.status && foundMaster.status.toLowerCase() === 'completed')) {
        let cb = document.getElementById('top_completed_status');
        if(cb) cb.checked = true;
    } else {
        let cb = document.getElementById('top_completed_status');
        if(cb) cb.checked = false;
    }

    let uiReed = foundMaster.reed || sp.reed || sp.baseReed || 52;
    let uiPick = foundMaster.pick || sp.pick || sp.basePick || 56;

    document.getElementById('calcReed').value = uiReed;
    document.getElementById('calcPick').value = uiPick;

    let c1 = foundMaster.count1 || sp.warp || '';
    let c2 = foundMaster.count2 || sp.warp2 || '';
    let countsArr = [];
    if (c1) countsArr.push(c1);
    if (c2) countsArr.push(c2);
    let uniqueCounts = [...new Set(countsArr)].join(', ');
    document.getElementById('baseCounts').value = uniqueCounts || '20';
    
    let defaultMtr = 100;
    if (foundMaster.orderMtr) {
        document.getElementById('lengthMeters').value = foundMaster.orderMtr;
        defaultMtr = parseFloat(foundMaster.orderMtr) || 100;
    }

    let hasTopBeamLines = foundMaster.warpLines && foundMaster.warpLines.some(l => l.beam === 'Top Beam');
    if (hasTopBeamLines) {
        if (foundMaster.topBeam) {
            let rawTop = String(foundMaster.topBeam);
            if (rawTop.includes('%')) {
                let pct = parseFloat(rawTop.replace('%', '').replace('+', '')) || 0;
                document.getElementById('topLengthMeters').value = (defaultMtr + (defaultMtr * pct / 100)).toFixed(2);
            } else {
                document.getElementById('topLengthMeters').value = parseFloat(rawTop) || defaultMtr;
            }
        } else {
            document.getElementById('topLengthMeters').value = defaultMtr;
        }
    } else {
        document.getElementById('topLengthMeters').value = ''; 
    }

    calculateWeftMtrs();
    loadYarnData();
}

// 📌 FIXED: Completed Checkbox Quick Toggle with Alert Pop-up & Design List Sync
async function quickCompleteToggle() {
    let dName = document.getElementById('designNumber').value;
    let cb = document.getElementById('top_completed_status');
    let isCompleted = cb ? cb.checked : false;

    if(!dName) {
        alert("Mudhala Design Number select pannunga bro");
        if(cb) cb.checked = false;
        return;
    }

    let statusText = isCompleted ? 'completed' : 'running';
    let cleanDNo = cleanDesignName(dName);

    // 1. LocalStorage-il Design Masters Update
    let designMastersList = JSON.parse(localStorage.getItem('design_masters_data')) || [];
    let idx = designMastersList.findIndex(d => cleanDesignName(d.name) === cleanDNo);

    if(idx > -1) {
        designMastersList[idx].status = statusText;
    } else {
        designMastersList.push({
            name: dName,
            status: statusText
        });
    }
    localStorage.setItem('design_masters_data', JSON.stringify(designMastersList));

    // 2. Design List Page Sync (design_specs Update)
    let designSpecs = JSON.parse(localStorage.getItem('design_specs')) || {};
    if(!designSpecs[dName]) {
        designSpecs[dName] = {};
    }
    designSpecs[dName].status = statusText;
    localStorage.setItem('design_specs', JSON.stringify(designSpecs));

    // 3. Save to Firebase Cloud Instant Sync
    try {
        if (window.firebaseSave) {
            await window.firebaseSave('design_masters_data', designMastersList);
            await window.firebaseSave('design_specs', designSpecs);
        }
    } catch(e) {
        console.error("Firebase Sync Error: ", e);
    }

    alert(`Design ${dName} status '${isCompleted ? 'COMPLETED' : 'RUNNING'}' ah update aagiduchu ✅`);
}

function getResultantCount(countStr) {
    if (!countStr) return 0;
    let str = String(countStr).trim().toLowerCase().replace(/s/g, ''); 
    if (str.includes('/')) {
        let parts = str.split('/');
        if (parts.length === 2) {
            let ply = parseFloat(parts[0]) || 1;
            let singleCount = parseFloat(parts[1]) || 1;
            return singleCount / ply; 
        }
    }
    return parseFloat(str) || 0;
}

function resolvePattern(lines, ranges, type, defaultCount) {
    if(!lines || lines.length === 0) return { sequence: [], summary: [], totalPatternVal: 0 };

    let covered = new Array(lines.length).fill(false);
    let orderedPattern = [];

    if(ranges && ranges.length > 0) {
        ranges.forEach(r => {
            for(let s=0; s<r.set; s++) {
                for(let j = r.start; j <= r.end; j++) {
                    if(lines[j-1]) orderedPattern.push({...lines[j-1]});
                }
            }
            for(let j = r.start; j <= r.end; j++) covered[j-1] = true;
        });
    }
    lines.forEach((l, idx) => {
        if(!covered[idx]) orderedPattern.push({...l});
    });

    let exactSequence = [];
    orderedPattern.forEach(item => {
        let val = parseFloat(type === 'warp' ? item.ends : item.picks) || 0;
        let cDisplay = (item.count !== undefined && item.count !== '') ? String(item.count).trim() : String(defaultCount);
        let clr = item.color ? String(item.color).trim() : '-';
        let bm = item.beam || 'Ground'; 
        
        for(let k=0; k<val; k++) {
            exactSequence.push({ count: cDisplay, color: clr, beam: bm });
        }
    });

    let summaryMap = new Map();
    let order = [];

    exactSequence.forEach(item => {
        let key = item.count + "||" + item.color + "||" + item.beam; 
        if(!summaryMap.has(key)) {
            summaryMap.set(key, { count: item.count, color: item.color, beam: item.beam, patternVal: 0, totalVal: 0 });
            order.push(key);
        }
        summaryMap.get(key).patternVal++;
    });

    return {
        sequence: exactSequence,
        summary: order.map(k => summaryMap.get(k)),
        totalPatternVal: exactSequence.length
    };
}

function loadYarnData() {
    let dName = document.getElementById('designNumber').value;
    if(!dName) return;

    let cleanDNo = cleanDesignName(dName);
    let designMastersList = JSON.parse(localStorage.getItem('design_masters_data')) || [];
    let foundMaster = designMastersList.find(d => cleanDesignName(d.name) === cleanDNo) || {};
    let specs = JSON.parse(localStorage.getItem('design_specs')) || {};
    let specKey = Object.keys(specs).find(k => cleanDesignName(k) === cleanDNo);
    let sp = specKey ? specs[specKey] : {};

    let uiReed = parseFloat(document.getElementById('calcReed').value) || 0;
    let uiPick = parseFloat(document.getElementById('calcPick').value) || 0;
    
    let baseCountsInput = document.getElementById('baseCounts').value || '20';
    let defaultCountText = baseCountsInput.split(',')[0].trim();
    let defaultCountNum = getResultantCount(defaultCountText) || 20;

    let lengthM = parseFloat(document.getElementById('lengthMeters').value) || 0; 
    let topLengthM = parseFloat(document.getElementById('topLengthMeters').value) || lengthM;
    let weftLengthM = parseFloat(document.getElementById('weftLengthMeters').value) || lengthM;

    window.calculatedYarnData = {
        ground: [], top: [], weft: [],
        groundTotals: { p: 0, t: 0, w: 0 },
        topTotals: { p: 0, t: 0, w: 0 },
        weftTotals: { p: 0, t: 0, w: 0 }
    };

    // --- WARP ---
    let baseWidth = parseFloat(foundMaster.width || sp.width || sp.baseWidth) || 66.92;
    let totalWarpEnds = Math.round(uiReed * baseWidth);
    let warpData = resolvePattern(foundMaster.warpLines || [], foundMaster.warpRanges || [], 'warp', defaultCountText);

    if (warpData.totalPatternVal > 0) {
        let repeats = Math.floor(totalWarpEnds / warpData.totalPatternVal);
        let rem = totalWarpEnds % warpData.totalPatternVal;

        warpData.summary.forEach(obj => obj.totalVal = obj.patternVal * repeats);
        for(let i=0; i<rem; i++) {
            let item = warpData.sequence[i];
            let obj = warpData.summary.find(o => o.count === item.count && o.color === item.color && o.beam === item.beam);
            if(obj) obj.totalVal++;
        }
    }

    warpData.summary.forEach(obj => {
        let calcCount = getResultantCount(obj.count);
        if (calcCount <= 0) calcCount = defaultCountNum;
        
        let currentLength = (obj.beam === 'Top Beam') ? topLengthM : lengthM;
        let wgt = (obj.totalVal * currentLength) / (1693.33 * calcCount);
        
        let rowObj = { count: obj.count, color: obj.color, patternVal: obj.patternVal, totalVal: obj.totalVal, weight: wgt };

        if (obj.beam === 'Top Beam') {
            window.calculatedYarnData.top.push(rowObj);
            window.calculatedYarnData.topTotals.p += obj.patternVal;
            window.calculatedYarnData.topTotals.t += obj.totalVal;
            window.calculatedYarnData.topTotals.w += wgt;
        } else {
            window.calculatedYarnData.ground.push(rowObj);
            window.calculatedYarnData.groundTotals.p += obj.patternVal;
            window.calculatedYarnData.groundTotals.t += obj.totalVal;
            window.calculatedYarnData.groundTotals.w += wgt;
        }
    });

    let gHtml = '';
    let gd = window.calculatedYarnData.ground;
    let gt = window.calculatedYarnData.groundTotals;
    if (gd.length > 0) {
        gd.forEach(r => {
            gHtml += `<tr><td>${r.count}</td><td>${r.color}</td><td>${r.patternVal}</td><td>${r.totalVal}</td><td>${r.weight.toFixed(3)} kg</td></tr>`;
        });
        gHtml += `<tr class="total-row"><td colspan="2" style="text-align:right; padding-right:15px;">Total:</td><td>${gt.p}</td><td>${gt.t}</td><td>${gt.w.toFixed(3)} kg</td></tr>`;
    } else {
        gHtml = `<tr><td colspan="5">No Ground Beam Data Found</td></tr>`;
    }
    document.getElementById('warpGroundTableBody').innerHTML = gHtml;

    let tHtml = '';
    let td = window.calculatedYarnData.top;
    let tt = window.calculatedYarnData.topTotals;
    if (td.length > 0) {
        document.getElementById('topBeamWrapper').style.display = 'block';
        td.forEach(r => {
            tHtml += `<tr><td>${r.count}</td><td>${r.color}</td><td>${r.patternVal}</td><td>${r.totalVal}</td><td>${r.weight.toFixed(3)} kg</td></tr>`;
        });
        tHtml += `<tr class="total-row"><td colspan="2" style="text-align:right; padding-right:15px;">Total:</td><td>${tt.p}</td><td>${tt.t}</td><td>${tt.w.toFixed(3)} kg</td></tr>`;
        document.getElementById('warpTopTableBody').innerHTML = tHtml;
    } else {
        document.getElementById('topBeamWrapper').style.display = 'none';
    }

    // --- WEFT ---
    let weftWidth = parseFloat(foundMaster.weftWidth || sp.weftWidth) || (baseWidth + 3);
    let totalFabricPick = weftWidth * uiPick;
    
    let weftCountFallbackText = foundMaster.weftCount || sp.weft || '40';
    let weftCountNumFallback = getResultantCount(weftCountFallbackText) || defaultCountNum;
    
    let weftData = resolvePattern(foundMaster.weftLines || [], foundMaster.weftRanges || [], 'weft', weftCountFallbackText);

    if (weftData.totalPatternVal > 0) {
        weftData.summary.forEach(obj => {
            let calcCount = getResultantCount(obj.count);
            if (calcCount <= 0) calcCount = weftCountNumFallback;
            let tPick = (obj.patternVal / weftData.totalPatternVal) * totalFabricPick;
            let wgt = (tPick * weftLengthM) / (1693.33 * calcCount);

            window.calculatedYarnData.weft.push({ count: obj.count, color: obj.color, patternVal: obj.patternVal, totalVal: tPick, weight: wgt });
            window.calculatedYarnData.weftTotals.p += obj.patternVal;
            window.calculatedYarnData.weftTotals.t += tPick;
            window.calculatedYarnData.weftTotals.w += wgt;
        });
    }

    let wfHtml = '';
    let wfd = window.calculatedYarnData.weft;
    let wft = window.calculatedYarnData.weftTotals;
    if (wfd.length > 0) {
        wfd.forEach(r => {
            wfHtml += `<tr><td>${r.count}</td><td>${r.color}</td><td>${r.patternVal}</td><td>${r.totalVal.toFixed(2)}</td><td>${r.weight.toFixed(3)} kg</td></tr>`;
        });
        wfHtml += `<tr class="total-row"><td colspan="2" style="text-align:right; padding-right:15px;">Total:</td><td>${wft.p}</td><td>${wft.t.toFixed(2)}</td><td>${wft.w.toFixed(3)} kg</td></tr>`;
    } else {
        wfHtml = `<tr><td colspan="5">No Weft Data Found</td></tr>`;
    }
    document.getElementById('weftTableBody').innerHTML = wfHtml;
}

function generatePrintTableHtml(dataArray, totals, isWeft) {
    if (dataArray.length === 0) return '<tr><td colspan="5" style="text-align:center;">No Data</td></tr>';
    
    let html = '';
    dataArray.forEach(r => {
        let colorDisplay = translateColorToTamil(r.color);
        let tVal = isWeft ? r.totalVal.toFixed(2) : r.totalVal;
        html += `<tr><td>${r.count}</td><td>${colorDisplay}</td><td>${r.patternVal}</td><td>${tVal}</td><td>${r.weight.toFixed(3)} kg</td></tr>`;
    });
    
    let tTot = isWeft ? totals.t.toFixed(2) : totals.t;
    html += `<tr class="total-row"><td colspan="2" style="text-align:right; padding-right:15px;">Total:</td><td>${totals.p}</td><td>${tTot}</td><td>${totals.w.toFixed(3)} kg</td></tr>`;
    
    return html;
}
