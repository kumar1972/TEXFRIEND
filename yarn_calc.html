<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yarn Calculation - TEXFRIEND</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    /* 📌 Smart Premium Background */
    html, body { 
        width: 100%;
        min-height: 100vh;
        background: #EAF0EA; 
        color: #1E2B23; 
    }

    body { 
        padding: 12px; 
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* 📌 Main Premium Container */
    .main-card {
        width: 100%;
        max-width: 900px;
        margin: 0;
        background: #FFFFFF;
        border: 1px solid rgba(82, 110, 81, 0.15);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 10px 35px rgba(30, 43, 35, 0.06);
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .top-nav { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 5px; 
    }

    /* 📌 Smart Back Button */
    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #FFFFFF;
        text-decoration: none;
        font-weight: 600;
        font-size: 11px;
        background: #1A2421; 
        padding: 8px 16px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        transition: all 0.3s ease;
    }
    .back-btn:hover { background: #000000; transform: translateY(-2px); }

    #bitmapDisplayContainer { text-align: right; display: flex; align-items: center; gap: 10px; }
    #bitmapDisplayContainer img {
        max-height: 45px;
        border-radius: 6px;
        border: 1px solid rgba(82, 110, 81, 0.2);
        box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        cursor: zoom-in;
        transition: transform 0.3s;
    }
    #bitmapDisplayContainer img:hover { transform: scale(1.1); }

    /* Checkbox Styling */
    .completed-checkbox {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #D8DFD6;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid rgba(82, 110, 81, 0.4);
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .completed-checkbox input[type="checkbox"] {
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #526E51;
        margin: 0;
        padding: 0;
        border: none;
    }
    
    .completed-checkbox label {
        margin: 0;
        color: #3F5A3E;
        cursor: pointer;
        font-size: 12px;
        font-weight: 700;
    }

    .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #EAF0EA;
        padding-bottom: 12px;
        margin-bottom: 5px;
    }

    .header-bar h3 {
        font-size: 16px;
        color: #2F4F38;
        font-weight: 700;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    /* 📌 மேலே Print நீக்கப்பட்டு GSM மற்றும் Preview மட்டும் இருக்கும்படி அமைப்பு */
    .header-btns {
        display: flex;
        gap: 6px;
    }
    .top-action-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        border: none;
        color: white;
        box-shadow: 0 3px 8px rgba(0,0,0,0.12);
        transition: all 0.2s ease;
    }
    .top-action-badge.gsm-badge { background: linear-gradient(135deg, #F59E0B, #D97706); cursor: default; }
    .top-action-badge.preview-badge { background: linear-gradient(135deg, #3B82F6, #1D4ED8); }
    .top-action-badge:hover:not(.gsm-badge) { transform: translateY(-2px); }

    /* 📌 கீழே கொடுக்கப்பட்டுள்ள Save Button Styling */
    .bottom-save-container {
        display: flex;
        justify-content: center;
        margin-top: 15px;
        margin-bottom: 5px;
    }
    .bottom-save-btn {
        background: linear-gradient(135deg, #4A7C59, #2F4F38);
        color: white;
        border: none;
        padding: 14px 35px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(74, 124, 89, 0.3);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        letter-spacing: 0.5px;
    }
    .bottom-save-btn:hover {
        background: linear-gradient(135deg, #3F5A3E, #1E2B23);
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(74, 124, 89, 0.4);
    }

    /* 📌 Smart Form Sections */
    .top-form-row-single {
        background: #F8FAF8;
        border: 1px solid #E2E8E2;
        border-radius: 12px;
        padding: 12px 15px;
        margin-bottom: 8px;
    }

    .top-form-row, .top-form-row-2, .top-form-row-3 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        background: #F8FAF8;
        border: 1px solid #E2E8E2;
        border-radius: 12px;
        padding: 15px;
    }
    .top-form-row { margin-bottom: 8px; }
    .top-form-row-2 { margin-bottom: 10px; grid-template-columns: repeat(3, 1fr); }
    .top-form-row-3 { margin-bottom: 10px; grid-template-columns: repeat(3, 1fr); }

    .form-group label {
        display: block;
        font-size: 10px;
        font-weight: 600;
        color: #4A554A;
        margin-bottom: 6px;
        white-space: nowrap;
    }

    /* 📌 Smart 3D Inputs */
    input, select {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #D1DED1;
        background: #FFFFFF;
        color: #1E2B23;
        font-size: 11px;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: inset 0 2px 4px rgba(30, 43, 35, 0.02);
    }

    input:focus, select:focus {
        border-color: #4A7C59;
        outline: none;
        background: #FFFFFF;
        box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.15);
    }

    input::placeholder { color: #A0AFA0; font-weight: 400; }

    /* 📌 Section Titles */
    h3.section-title {
        font-size: 11px;
        color: #FFFFFF;
        background: #4A7C59;
        padding: 6px 14px;
        border-radius: 12px;
        display: inline-block;
        margin-bottom: 5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 8px rgba(74, 124, 89, 0.25);
        border: none;
        width: max-content;
    }

    /* 📌 Advanced Table Design */
    .table-container {
        width: 100%;
        border-radius: 10px;
        overflow-x: auto;
        box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        border: 1px solid #E2E8E2;
        background: #FFFFFF;
        -webkit-overflow-scrolling: touch;
        margin-bottom: 10px;
    }

    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        font-size: 11px;
        text-align: center;
        white-space: nowrap;
    }

    th, td {
        padding: 10px 12px;
        text-align: center;
        border-bottom: 1px solid #E2E8E2;
        color: #1E2B23;
    }

    th {
        background: #EAF0EA;
        color: #2F4F38;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 10px;
        letter-spacing: 0.5px;
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 2px solid #D1DED1;
    }

    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #F8FAF8; }

    .total-row td {
        background: #F4F7F4;
        color: #2F4F38;
        font-weight: 700;
        border-top: 2px solid #D1DED1;
    }

    /* 📌 FULL SCREEN PREVIEW MODAL STYLING */
    .overlay-modal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(18, 25, 20, 0.95); backdrop-filter: blur(6px);
        z-index: 99999; flex-direction: column; padding: 0; opacity: 0; transition: opacity 0.3s ease;
    }
    .overlay-modal.show { opacity: 1; }
    
    .modal-content {
        background: #FFFFFF; width: 100vw; height: 100vh; margin: 0; border-radius: 0;
        display: flex; flex-direction: column; box-shadow: none;
        overflow: hidden; transform: scale(1);
    }

    .modal-header {
        padding: 15px 20px; background: #F4F7F4; display: flex;
        justify-content: space-between; align-items: center; border-bottom: 1px solid #E2E8E2;
        flex-shrink: 0;
    }
    .modal-header h3 { margin: 0; font-size: 16px; color: #1E2B23; font-weight: 800; border:none; padding:0; }
    .modal-actions { display: flex; gap: 8px; }
    
    .print-btn-modal { background: linear-gradient(135deg, #10B981, #059669); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
    .close-btn {
        background: #FEE2E2; color: #DC2626; border: none; padding: 8px 16px;
        border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px;
        transition: all 0.2s ease;
    }
    .close-btn:hover { background: #FECACA; transform: scale(1.05); }

    .modal-body { padding: 20px; overflow-y: auto; flex: 1; background: #FAFCFA; width: 100%; max-width: 1000px; margin: 0 auto; }

    /* 📌 Fullscreen Image Popup Modal */
    .fullscreen-modal {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.9); z-index: 999999; justify-content: center; align-items: center;
        padding: 20px; flex-direction: column;
    }
    .fullscreen-modal img {
        max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 10px;
        box-shadow: 0 10px 30px rgba(255,255,255,0.2);
    }
    .close-fullscreen {
        position: absolute; top: 20px; right: 20px; background: #EF4444; color: white;
        border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; font-size: 14px;
        cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    @media print {
        body * { visibility: hidden; }
        .overlay-modal, .overlay-modal * { visibility: visible; }
        .overlay-modal { position: absolute; left: 0; top: 0; width: 100%; padding: 0; z-index: 99999; background: #FFFFFF; }
        .modal-content { max-height: none !important; height: auto !important; overflow: visible !important; box-shadow: none; border: none; border-radius: 0; }
        .no-print { display: none !important; }
        .modal-body { padding: 0; background: #FFFFFF; }
    }
</style>
</head>
<body>

<div class="main-card">
    <div class="top-nav">
        <a href="dashboard.html" class="back-btn">← Back to Menu</a>
        <div id="bitmapDisplayContainer">
            <div class="completed-checkbox">
                <input type="checkbox" id="top_completed_status" onchange="quickCompleteToggle()">
                <label for="top_completed_status">Completed</label>
            </div>
        </div>
    </div>

    <!-- 📌 மேலே Print நீக்கப்பட்டு GSM மற்றும் Preview மட்டும் வைக்கப்பட்டுள்ளது -->
    <div class="header-bar">
        <h3 id="pageHeaderTitle">🧵 Yarn Calculation</h3>
        <div class="header-btns">
            <div class="top-action-badge gsm-badge" id="displayGsmBadge">GSM: 0</div>
            <button class="top-action-badge preview-badge" onclick="previewReport()">👁️ Preview</button>
        </div>
    </div>

    <!-- 📌 Design Number தனியாக ஒரு ரோ (Row) -->
    <div class="top-form-row-single">
        <div class="form-group">
            <label>Design Number</label>
            <select id="designNumber" onchange="loadInitialData()">
                <option value="">Select</option>
            </select>
        </div>
    </div>

    <!-- 📌 Finish Reed மற்றும் Finish Pick -->
    <div class="top-form-row">
        <div class="form-group">
            <label>finish Reed</label>
            <input type="number" id="calcReed" oninput="loadYarnData()" placeholder="Reed">
        </div>
        <div class="form-group">
            <label>finish Pick</label>
            <input type="number" id="calcPick" oninput="loadYarnData()" placeholder="Pick">
        </div>
    </div>

    <div class="top-form-row-2">
        <div class="form-group">
            <label>Base Counts</label>
            <input type="text" id="baseCounts" placeholder="e.g., 2/60, 2/40" oninput="loadYarnData()">
        </div>
        <div class="form-group">
            <label>Warp Dyeing Order (Mtrs)</label>
            <input type="number" id="lengthMeters" value="100" oninput="calculateWeftMtrs(); loadYarnData();">
        </div>
        <div class="form-group">
            <label>Top Beam Mtrs</label>
            <input type="number" id="topLengthMeters" placeholder="Top Beam Mtrs" oninput="loadYarnData()">
        </div>
    </div>

    <!-- GROUND BEAM SECTION -->
    <h3 class="section-title" style="margin-top: 10px;">🧵 WARP YARN - GROUND BEAM</h3>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Count</th>
                    <th>Colour</th>
                    <th>Ends</th>
                    <th>Total</th>
                    <th>Weight (Kg)</th>
                </tr>
            </thead>
            <tbody id="warpGroundTableBody">
                <!-- Ground Warp Data -->
            </tbody>
        </table>
    </div>

    <!-- TOP BEAM SECTION -->
    <div id="topBeamWrapper" style="display: none;">
        <h3 class="section-title" style="margin-top: 10px;">🧵 WARP YARN - TOP BEAM</h3>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Count</th>
                        <th>Colour</th>
                        <th>Ends</th>
                        <th>Total</th>
                        <th>Weight (Kg)</th>
                    </tr>
                </thead>
                <tbody id="warpTopTableBody">
                    <!-- Top Warp Data -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- WEFT SEPARATE SECTION -->
    <h3 class="section-title" style="margin-top: 10px;">🧶 WEFT YARN CALCULATION</h3>
    
    <div class="top-form-row-3">
        <div class="form-group">
            <label>Crimp %</label>
            <input type="number" id="crimpPercentage" value="" placeholder="%" oninput="calculateWeftMtrs(); loadYarnData();">
        </div>
        <div class="form-group">
            <label>Weft Mtrs</label>
            <input type="number" id="weftLengthMeters" value="100" readonly style="background:#F4F7F4; color:#4A7C59; border-color:#D1DED1; cursor:not-allowed;">
        </div>
        <div class="form-group">
            <label>Onloom Pick Less</label>
            <input type="number" id="onloomPickLess" value="" placeholder="Enter Less Picks" oninput="loadYarnData()">
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Count</th>
                    <th>Colour</th>
                    <th>Picks</th>
                    <th>Total</th>
                    <th>Weight (Kg)</th>
                </tr>
            </thead>
            <tbody id="weftTableBody">
                <!-- Weft Data -->
            </tbody>
        </table>
    </div>

    <!-- 📌 கீழே கொடுக்கப்பட்டுள்ள Save Button -->
    <div class="bottom-save-container">
        <button class="bottom-save-btn" onclick="saveCalculationData()">💾 Save Calculation</button>
    </div>
</div>

<!-- 📌 Full Screen Print Preview Modal (Inside Preview, Print Option Available) -->
<div id="previewModal" class="overlay-modal">
    <div class="modal-content">
        <div class="modal-header no-print">
            <h3>👁️ Yarn Calculation Full Screen Preview</h3>
            <div class="modal-actions">
                <button class="print-btn-modal" onclick="window.print()">🖨️ Print</button>
                <button class="close-btn" onclick="closeModal('previewModal')">Close ✕</button>
            </div>
        </div>
        <div class="modal-body" id="previewContent">
            <!-- Content here -->
        </div>
    </div>
</div>

<!-- 📌 Fullscreen Image Popup Modal -->
<div id="fullscreenModal" class="fullscreen-modal" onclick="closeFullscreenImage()">
    <button class="close-fullscreen">Close ✕</button>
    <img id="fullscreenImg" src="" alt="Fullscreen Preview">
</div>

<script>
// 🔒 Universal Permission Checker Function for Yarn Calculation Page
function checkUserPermission() {
    let userRole = localStorage.getItem('user_role');
    if (userRole !== 'Administrator' && userRole !== 'Admin') {
        let permissions = JSON.parse(localStorage.getItem('user_permissions') || '{}');
        if (permissions['yarn_calculation.html'] === false || permissions['yarn_calculation'] === false || permissions['calculation'] === false) {
            return false;
        }
    }
    return true;
}

document.addEventListener('DOMContentLoaded', function() {
    // 🔒 Page Access Check on Load
    if (!checkUserPermission()) {
        alert("Access Denied! You do not have permission to access this page. ❌");
        window.location.href = "dashboard.html";
        return;
    }
});

function openModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.style.display = 'flex';
    setTimeout(() => modal.classList.add('show'), 10);
}

function closeModal(modalId) {
    let modal = document.getElementById(modalId);
    modal.classList.remove('show');
    setTimeout(() => modal.style.display = 'none', 300);
}

function cleanDesignName(str) {
    return str ? str.toString().replace('#', '').trim().toLowerCase() : '';
}

function getSharedVal(o1, o2, keys) {
    for(let k of keys) {
        let lk = String(k).toLowerCase().trim();
        if(o2) { let mk = Object.keys(o2).find(x => String(x).toLowerCase().trim()===lk); if(mk && o2[mk] !== '') return o2[mk]; }
    }
    for(let k of keys) {
        let lk = String(k).toLowerCase().trim();
        if(o1) { let mk = Object.keys(o1).find(x => String(x).toLowerCase().trim()===lk); if(mk && o1[mk] !== '') return o1[mk]; }
    }
    return '';
}

// 📌 Fullscreen Image Popup Controls
window.openFullscreenImage = function(src) {
    if(!src || src === '' || src === 'null') return;
    document.getElementById('fullscreenImg').src = src;
    document.getElementById('fullscreenModal').style.display = 'flex';
}
window.closeFullscreenImage = function() {
    document.getElementById('fullscreenModal').style.display = 'none';
}

function loadBitmapImage() {
    let activeDesign = document.getElementById('designNumber').value || localStorage.getItem('selected_design_number');
    let designSpecs = JSON.parse(localStorage.getItem('design_specs') || '{}');
    let bitmapContainer = document.getElementById('bitmapDisplayContainer');
    
    let imgHtml = '';
    if (activeDesign && designSpecs[activeDesign] && designSpecs[activeDesign].bitmap) {
        let b64 = designSpecs[activeDesign].bitmap;
        imgHtml = `<img src="${b64}" alt="Design Bitmap" onclick="openFullscreenImage('${b64}')" title="Click to view full screen">`;
    }
    
    let checkboxHtml = `<div class="completed-checkbox"><input type="checkbox" id="top_completed_status" onchange="quickCompleteToggle()"><label for="top_completed_status">Completed</label></div>`;
    
    let wasChecked = false;
    let cb = document.getElementById('top_completed_status');
    if(cb) wasChecked = cb.checked;
    
    bitmapContainer.innerHTML = checkboxHtml + imgHtml;
    
    if(wasChecked) {
        document.getElementById('top_completed_status').checked = true;
    }
}

function translateColorToTamil(colorName) {
    if (!colorName) return '-';
    var c = colorName.trim().toLowerCase();
    var map = {
        'white': 'வெள்ளை', 'black': 'கருப்பு', 'blue': 'ப்ளூ', 'yellow': 'மஞ்சள்',
        'red': 'சிகப்பு', 'green': 'பச்சை', 'brown': 'பிரவுன்', 'khaki': 'காக்கி',
        'rose': 'ரோஸ்', 'orange': 'ஆரஞ்சு', 'violet': 'வயோலெட்', 'grey': 'சாம்பல்',
        'gold': 'தங்கம்', 'pink': 'பிங்க்', 'navy': 'நேவி', 'maroon': 'மெரூன்'
    };
    return map[c] || colorName; 
}

window.calculatedYarnData = {
    ground: [], top: [], weft: [],
    groundTotals: { p: 0, t: 0, w: 0 },
    topTotals: { p: 0, t: 0, w: 0 },
    weftTotals: { p: 0, t: 0, w: 0 }
};

function initDropdown() {
    var preDesignList = JSON.parse(localStorage.getItem('pre_design_numbers')) || [];
    var select = document.getElementById('designNumber');
    var html = '<option value="">Select</option>';
    
    preDesignList.forEach(function(d) {
        html += '<option value="' + d + '">' + d + '</option>';
    });
    select.innerHTML = html;

    var activeDesign = localStorage.getItem('selected_design_number');
    if(activeDesign && preDesignList.includes(activeDesign)) {
        select.value = activeDesign;
        loadInitialData();
    } else {
        loadBitmapImage();
    }
}

function calculateWeftMtrs() {
    let warpOrder = parseFloat(document.getElementById('lengthMeters').value) || 0;
    let crimpVal = document.getElementById('crimpPercentage').value.trim();
    let crimp = crimpVal === '' ? 0 : parseFloat(crimpVal) || 0;
    
    let weftMtrs = warpOrder - (warpOrder * (crimp / 100));
    document.getElementById('weftLengthMeters').value = weftMtrs > 0 ? weftMtrs.toFixed(2) : '';
}

function loadInitialData() {
    let dName = document.getElementById('designNumber').value;
    loadBitmapImage();
    if(dName) localStorage.setItem('selected_design_number', dName);

    if(!dName) {
        document.getElementById('calcReed').value = '';
        document.getElementById('calcPick').value = '';
        document.getElementById('warpGroundTableBody').innerHTML = '';
        document.getElementById('warpTopTableBody').innerHTML = '';
        document.getElementById('weftTableBody').innerHTML = '';
        document.getElementById('topBeamWrapper').style.display = 'none';
        document.getElementById('baseCounts').value = '';
        document.getElementById('topLengthMeters').value = '';
        document.getElementById('onloomPickLess').value = '';
        document.getElementById('crimpPercentage').value = '';
        let cb = document.getElementById('top_completed_status');
        if(cb) cb.checked = false;

function getResultantCount(countStr) {
    if (!countStr) return 0;
    let str = String(countStr).trim().toLowerCase().replace(/s/g, ''); 
    if (str.includes('/')) {
        let parts = str.split('/');
        if (parts.length === 2) {
            let ply = parseFloat(parts[0]) || 1;
            let singleCount = parseFloat(parts[1]) || 1;
            return singleCount / ply; 
        }
    }
    return parseFloat(str) || 0;
}

function resolvePattern(lines, ranges, type, defaultCount) {
    if(!lines || lines.length === 0) return { sequence: [], summary: [], totalPatternVal: 0 };

    let covered = new Array(lines.length).fill(false);
    let orderedPattern = [];

    if(ranges && ranges.length > 0) {
        ranges.forEach(r => {
            for(let s=0; s<r.set; s++) {
                for(let j = r.start; j <= r.end; j++) {
                    if(lines[j-1]) orderedPattern.push({...lines[j-1]});
                }
            }
            for(let j = r.start; j <= r.end; j++) covered[j-1] = true;
        });
    }
    lines.forEach((l, idx) => {
        if(!covered[idx]) orderedPattern.push({...l});
    });

    let exactSequence = [];
    orderedPattern.forEach(item => {
        let val = parseFloat(type === 'warp' ? item.ends : item.picks) || 0;
        let cDisplay = (item.count !== undefined && item.count !== '') ? String(item.count).trim() : String(defaultCount);
        let clr = item.color ? String(item.color).trim() : '-';
        let bm = item.beam || 'Ground'; 
        
        for(let k=0; k<val; k++) {
            exactSequence.push({ count: cDisplay, color: clr, beam: bm });
        }
    });

    let summaryMap = new Map();
    let order = [];

    exactSequence.forEach(item => {
        let key = item.count + "||" + item.color + "||" + item.beam; 
        if(!summaryMap.has(key)) {
            summaryMap.set(key, { count: item.count, color: item.color, beam: item.beam, patternVal: 0, totalVal: 0 });
            order.push(key);
        }
        summaryMap.get(key).patternVal++;
    });

    return {
        sequence: exactSequence,
        summary: order.map(k => summaryMap.get(k)),
        totalPatternVal: exactSequence.length
    };
}

function loadYarnData() {
    let dName = document.getElementById('designNumber').value;
    if(!dName) return;

    let cleanDNo = cleanDesignName(dName);
    let designMastersList = JSON.parse(localStorage.getItem('design_masters_data')) || [];
    let foundMaster = designMastersList.find(d => cleanDesignName(d.name) === cleanDNo) || {};
    let specs = JSON.parse(localStorage.getItem('design_specs')) || {};
    let specKey = Object.keys(specs).find(k => cleanDesignName(k) === cleanDNo);
    let sp = specKey ? specs[specKey] : {};

    let uiReed = parseFloat(document.getElementById('calcReed').value) || 0;
    let uiPick = parseFloat(document.getElementById('calcPick').value) || 0;
    
    let baseCountsInput = document.getElementById('baseCounts').value || '20';
    let defaultCountText = baseCountsInput.split(',')[0].trim();
    let defaultCountNum = getResultantCount(defaultCountText) || 20;

    let lengthM = parseFloat(document.getElementById('lengthMeters').value) || 0; 
    let topLengthM = parseFloat(document.getElementById('topLengthMeters').value) || lengthM;
    let weftLengthM = parseFloat(document.getElementById('weftLengthMeters').value) || lengthM;

    window.calculatedYarnData = {
        ground: [], top: [], weft: [],
        groundTotals: { p: 0, t: 0, w: 0 },
        topTotals: { p: 0, t: 0, w: 0 },
        weftTotals: { p: 0, t: 0, w: 0 }
    };

    let baseWidthRaw = getSharedVal(foundMaster, sp, ['width', 'basewidth', 'width (inch)', 'width inch']);
    let baseWidth = parseFloat(baseWidthRaw) || 66.92;
    let totalWarpEnds = Math.round(uiReed * baseWidth);
    
    let warpLinesData = foundMaster.warpLines || sp.warpLines || [];
    let warpRangesData = foundMaster.warpRanges || sp.warpRanges || [];
    let warpData = resolvePattern(warpLinesData, warpRangesData, 'warp', defaultCountText);

    if (warpData.totalPatternVal > 0) {
        let repeats = Math.floor(totalWarpEnds / warpData.totalPatternVal);
        let rem = totalWarpEnds % warpData.totalPatternVal;

        warpData.summary.forEach(obj => obj.totalVal = obj.patternVal * repeats);
        for(let i=0; i<rem; i++) {
            let item = warpData.sequence[i];
            let obj = warpData.summary.find(o => o.count === item.count && o.color === item.color && o.beam === item.beam);
            if(obj) obj.totalVal++;
        }
    }

    warpData.summary.forEach(obj => {
        let calcCount = getResultantCount(obj.count);
        if (calcCount <= 0) calcCount = defaultCountNum;
        
        let currentLength = (obj.beam === 'Top Beam') ? topLengthM : lengthM;
        let wgt = (obj.totalVal * currentLength) / (1693.33 * calcCount);
        
        let rowObj = { count: obj.count, color: obj.color, patternVal: obj.patternVal, totalVal: obj.totalVal, weight: wgt };

        if (obj.beam === 'Top Beam') {
            window.calculatedYarnData.top.push(rowObj);
            window.calculatedYarnData.topTotals.p += obj.patternVal;
            window.calculatedYarnData.topTotals.t += obj.totalVal;
            window.calculatedYarnData.topTotals.w += wgt;
        } else {
            window.calculatedYarnData.ground.push(rowObj);
            window.calculatedYarnData.groundTotals.p += obj.patternVal;
            window.calculatedYarnData.groundTotals.t += obj.totalVal;
            window.calculatedYarnData.groundTotals.w += wgt;
        }
    });

    let gHtml = '';
    let gd = window.calculatedYarnData.ground;
    let gt = window.calculatedYarnData.groundTotals;
    if (gd.length > 0) {
        gd.forEach(r => {
            gHtml += `<tr><td>${r.count}</td><td>${r.color}</td><td>${r.patternVal}</td><td>${r.totalVal}</td><td>${r.weight.toFixed(3)} kg</td></tr>`;
        });
        gHtml += `<tr class="total-row"><td colspan="2" style="text-align:right; padding-right:15px;">Total:</td><td>${gt.p}</td><td>${gt.t}</td><td>${gt.w.toFixed(3)} kg</td></tr>`;
    } else {
        gHtml = `<tr><td colspan="5">No Ground Beam Data Found</td></tr>`;
    }
    document.getElementById('warpGroundTableBody').innerHTML = gHtml;

    let tHtml = '';
    let td = window.calculatedYarnData.top;
    let tt = window.calculatedYarnData.topTotals;
    if (td.length > 0) {
        document.getElementById('topBeamWrapper').style.display = 'block';
        td.forEach(r => {
            tHtml += `<tr><td>${r.count}</td><td>${r.color}</td><td>${r.patternVal}</td><td>${r.totalVal}</td><td>${r.weight.toFixed(3)} kg</td></tr>`;
        });
        tHtml += `<tr class="total-row"><td colspan="2" style="text-align:right; padding-right:15px;">Total:</td><td>${tt.p}</td><td>${tt.t}</td><td>${tt.w.toFixed(3)} kg</td></tr>`;
        document.getElementById('warpTopTableBody').innerHTML = tHtml;
    } else {
        document.getElementById('topBeamWrapper').style.display = 'none';
    }

    let baseReed = parseFloat(uiReed) || 64;
    
    let autoWeftWidth = '';
    if (baseReed > 8 && baseWidth > 0) {
        let calculatedWidth = ((baseReed * baseWidth) / (baseReed - 8)) + 3;
        autoWeftWidth = calculatedWidth.toFixed(2);
    } else if (baseWidth > 0) {
        autoWeftWidth = (baseWidth + 3).toFixed(2);
    }

    let weftWidthRaw = getSharedVal(foundMaster, sp, ['weftwidth', 'weft width']);
    let weftWidth = parseFloat(autoWeftWidth) || parseFloat(weftWidthRaw) || (baseWidth + 3);
    
    let pickLessVal = document.getElementById('onloomPickLess').value.trim();
    let pickLess = pickLessVal === '' ? 0 : parseFloat(pickLessVal) || 0;
    let netPick = uiPick - pickLess;
    if (netPick < 0) netPick = 0;

    let totalFabricPick = weftWidth * netPick;
    
    let weftCountFallbackText = getSharedVal(foundMaster, sp, ['weftcount', 'weft count', 'weft', 'count3']) || '40';
    let weftCountNumFallback = getResultantCount(weftCountFallbackText) || defaultCountNum;
    
    let weftLinesData = foundMaster.warpLines || sp.warpLines || [];
    let weftRangesData = foundMaster.warpRanges || sp.warpRanges || [];
    let weftData = resolvePattern(foundMaster.weftLines || sp.weftLines || [], foundMaster.weftRanges || sp.weftRanges || [], 'weft', weftCountFallbackText);

    if (weftData.totalPatternVal > 0) {
        weftData.summary.forEach(obj => {
            let calcCount = getResultantCount(obj.count);
            if (calcCount <= 0) calcCount = weftCountNumFallback;
            let tPick = (obj.patternVal / weftData.totalPatternVal) * totalFabricPick;
            let wgt = (tPick * weftLengthM) / (1693.33 * calcCount);

            window.calculatedYarnData.weft.push({ count: obj.count, color: obj.color, patternVal: obj.patternVal, totalVal: tPick, weight: wgt });
            window.calculatedYarnData.weftTotals.p += obj.patternVal;
            window.calculatedYarnData.weftTotals.t += tPick;
            window.calculatedYarnData.weftTotals.w += wgt;
        });
    }

    let wfHtml = '';
    let wfd = window.calculatedYarnData.weft;
    let wft = window.calculatedYarnData.weftTotals;
    if (wfd.length > 0) {
        wfd.forEach(r => {
            wfHtml += `<tr><td>${r.count}</td><td>${r.color}</td><td>${r.patternVal}</td><td>${r.totalVal.toFixed(2)}</td><td>${r.weight.toFixed(3)} kg</td></tr>`;
        });
        wfHtml += `<tr class="total-row"><td colspan="2" style="text-align:right; padding-right:15px;">Total:</td><td>${wft.p}</td><td>${wft.t.toFixed(2)}</td><td>${wft.w.toFixed(3)} kg</td></tr>`;
    } else {
        wfHtml = `<tr><td colspan="5">No Weft Data Found</td></tr>`;
    }
    document.getElementById('weftTableBody').innerHTML = wfHtml;

    // 🔥 தனித்தனி நூல்களின் எடைகளைக் கூட்டி துல்லியமான மொத்த எடையைப் பெற்று ஸ்டாண்டர்ட் ஃபார்முலா மூலம் GSM கணக்கிடுதல்
    let totalWeightKg = (gt ? gt.w : 0) + (tt ? tt.w : 0) + (wft ? wft.w : 0);
    
    let fabricWidthInches = baseWidth; 
    let gsmValue = 0;
    if (lengthM > 0 && fabricWidthInches > 0 && totalWeightKg > 0) {
        gsmValue = Math.round((((totalWeightKg * 1000) / (lengthM * (fabricWidthInches * 0.0254))) * 1.06));

    }
    
    let gsmBadge = document.getElementById('displayGsmBadge');
    if (gsmBadge) gsmBadge.innerText = "GSM: " + gsmValue;
    
    window.calculatedYarnData.gsm = gsmValue; 
}

function generatePrintTableHtml(dataArray, totals, isWeft) {
    if (dataArray.length === 0) return '<tr><td colspan="5" style="text-align:center;">No Data</td></tr>';
    
    let html = '';
    dataArray.forEach(r => {
        let colorDisplay = translateColorToTamil(r.color);
        let tVal = isWeft ? r.totalVal.toFixed(2) : r.totalVal;
        html += `<tr><td>${r.count}</td><td>${colorDisplay}</td><td>${r.patternVal}</td><td>${tVal}</td><td>${r.weight.toFixed(3)} kg</td></tr>`;
    });
    
    let tTot = isWeft ? totals.t.toFixed(2) : totals.t;
    html += `<tr class="total-row"><td colspan="2" style="text-align:right; padding-right:15px;">Total:</td><td>${totals.p}</td><td>${tTot}</td><td>${totals.w.toFixed(3)} kg</td></tr>`;
    
    return html;
}

        // 🔒 Page Access Check on Load
        if (!checkUserPermission()) {
            alert("Access Denied! You do not have permission to access this page. ❌");
            window.location.href = "dashboard.html";
            return;
        }

        let headerTxt = document.getElementById('pageHeaderTitle');
        let origText = headerTxt.innerHTML;
        headerTxt.innerHTML = "Syncing ☁️...";

        let collections = ['pre_design_numbers', 'design_masters_data', 'design_specs'];
        
        for(let col of collections) {
            let data = await window.firebaseLoad(col);
            if (data) localStorage.setItem(col, JSON.stringify(data));
        }

        headerTxt.innerHTML = origText;
        initDropdown(); 
        loadBitmapImage();
    });
</script>
</body>
</html>
